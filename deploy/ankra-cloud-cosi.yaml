---
# Source: ankra-cloud-cosi/templates/rbac.yaml
# What the objectstorage provisioner sidecar reads and writes: Buckets and BucketAccesses with their status, the
# BucketClaims it marks ready, the classes it reads parameters from, the credential Secrets it creates in the
# BucketAccess's namespace, and events.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ankra-cloud-cosi
  labels:
    app.kubernetes.io/name: ankra-cloud-cosi
    app.kubernetes.io/instance: ankra-cloud-cosi
    app.kubernetes.io/version: "v0.1.0"
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: ankra-cloud-cosi-0.1.0
rules:
  - apiGroups: ["objectstorage.k8s.io"]
    resources: ["buckets", "bucketaccesses", "bucketclaims"]
    verbs: ["get", "list", "watch", "update", "patch"]
  - apiGroups: ["objectstorage.k8s.io"]
    resources: ["buckets/status", "bucketaccesses/status", "bucketclaims/status"]
    verbs: ["get", "update", "patch"]
  - apiGroups: ["objectstorage.k8s.io"]
    resources: ["bucketclasses", "bucketaccessclasses"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]

