# Source: ankra-cloud-csi/templates/node.yaml
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: ankra-cloud-csi-node
  namespace: kube-system
  labels:
    app.kubernetes.io/name: ankra-cloud-csi
    app.kubernetes.io/instance: ankra-cloud-csi
    app.kubernetes.io/version: "v0.3.0"
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: ankra-cloud-csi-0.3.0
    app.kubernetes.io/component: node
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: ankra-cloud-csi
      app.kubernetes.io/instance: ankra-cloud-csi
      app.kubernetes.io/component: node
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 10%
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ankra-cloud-csi
        app.kubernetes.io/instance: ankra-cloud-csi
        app.kubernetes.io/version: "v0.3.0"
        app.kubernetes.io/managed-by: Helm
        helm.sh/chart: ankra-cloud-csi-0.3.0
        app.kubernetes.io/component: node
    spec:
      serviceAccountName: ankra-cloud-csi-node
      priorityClassName: system-node-critical
      # The host network reaches the metadata service (fd00:ec2::254, 169.254.169.254) from the server's own
      # address, which is how the service tells which server is asking.
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      tolerations:
        - operator: Exists
      containers:
        - name: ankra-cloud-csi
          image: share.ankra.cloud/library/ankra-cloud-csi:v0.3.0
          imagePullPolicy: IfNotPresent
          args:
            - --mode=node
            - --endpoint=unix:///csi/csi.sock
            - --max-volumes-per-node=15
          env:
            - name: ANKRA_CLOUD_API_URL
              value: "https://cloud.ankra.app"
            - name: ANKRA_CLOUD_TOKEN
              valueFrom:
                secretKeyRef:
                  name: ankra-cloud-csi-api
                  key: token
          securityContext:
            privileged: true
          ports:
            - name: healthz
              containerPort: 9809
          livenessProbe:
            httpGet:
              path: /healthz
              port: healthz
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 5
          volumeMounts:
            - name: plugin-dir
              mountPath: /csi
            - name: kubelet-dir
              mountPath: /var/lib/kubelet
              mountPropagation: Bidirectional
            - name: device-dir
              mountPath: /dev
            - name: udev-dir
              mountPath: /run/udev
              readOnly: true
          resources:
            limits:
              memory: 128Mi
            requests:
              cpu: 10m
              memory: 32Mi
        - name: node-driver-registrar
          image: registry.k8s.io/sig-storage/csi-node-driver-registrar:v2.13.0
          args:
            - --csi-address=/csi/csi.sock
            - --kubelet-registration-path=/var/lib/kubelet/plugins/csi.ankra.cloud/csi.sock
          livenessProbe:
            exec:
              command:
                - /csi-node-driver-registrar
                - --kubelet-registration-path=/var/lib/kubelet/plugins/csi.ankra.cloud/csi.sock
                - --mode=kubelet-registration-probe
            initialDelaySeconds: 30
            timeoutSeconds: 15
          volumeMounts:
            - name: plugin-dir
              mountPath: /csi
            - name: registration-dir
              mountPath: /registration
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
        - name: liveness-probe
          image: registry.k8s.io/sig-storage/livenessprobe:v2.15.0
          args:
            - --csi-address=/csi/csi.sock
            - --http-endpoint=:9809
          volumeMounts:
            - name: plugin-dir
              mountPath: /csi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: plugin-dir
          hostPath:
            path: /var/lib/kubelet/plugins/csi.ankra.cloud
            type: DirectoryOrCreate
        - name: registration-dir
          hostPath:
            path: /var/lib/kubelet/plugins_registry
            type: Directory
        - name: kubelet-dir
          hostPath:
            path: /var/lib/kubelet
            type: Directory
        - name: device-dir
          hostPath:
            path: /dev
            type: Directory
        - name: udev-dir
          hostPath:
            path: /run/udev
            type: DirectoryOrCreate
