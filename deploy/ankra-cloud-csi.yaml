# Source: ankra-cloud-csi/templates/controller.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ankra-cloud-csi-controller
  namespace: kube-system
  labels:
    app.kubernetes.io/name: ankra-cloud-csi
    app.kubernetes.io/instance: ankra-cloud-csi
    app.kubernetes.io/version: "v0.3.0"
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: ankra-cloud-csi-0.3.0
    app.kubernetes.io/component: controller
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ankra-cloud-csi
      app.kubernetes.io/instance: ankra-cloud-csi
      app.kubernetes.io/component: controller
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ankra-cloud-csi
        app.kubernetes.io/instance: ankra-cloud-csi
        app.kubernetes.io/version: "v0.3.0"
        app.kubernetes.io/managed-by: Helm
        helm.sh/chart: ankra-cloud-csi-0.3.0
        app.kubernetes.io/component: controller
    spec:
      serviceAccountName: ankra-cloud-csi-controller
      priorityClassName: system-cluster-critical
      tolerations:
        - effect: NoSchedule
          key: node-role.kubernetes.io/control-plane
          operator: Exists
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: ankra-cloud-csi
          image: share.ankra.cloud/library/ankra-cloud-csi:v0.3.0
          imagePullPolicy: IfNotPresent
          args:
            - --mode=controller
            - --endpoint=unix:///csi/csi.sock
            - --operation-timeout=5m
            - --capacity-cache-ttl=10s
          env:
            - name: ANKRA_CLOUD_API_URL
              value: "https://cloud.ankra.app"
            - name: ANKRA_CLOUD_TOKEN
              valueFrom:
                secretKeyRef:
                  name: ankra-cloud-csi-api
                  key: token
          volumeMounts:
            - name: socket-dir
              mountPath: /csi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - name: healthz
              containerPort: 9808
          livenessProbe:
            httpGet:
              path: /healthz
              port: healthz
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 5
          resources:
            limits:
              memory: 128Mi
            requests:
              cpu: 10m
              memory: 32Mi
        - name: csi-provisioner
          image: registry.k8s.io/sig-storage/csi-provisioner:v5.2.0
          args:
            - --csi-address=/csi/csi.sock
            - --feature-gates=Topology=true
            - --default-fstype=ext4
            - --extra-create-metadata
            - --leader-election
            - --leader-election-namespace=kube-system
            - --timeout=6m
            - --retry-interval-max=5m
            # Publish each node's room as CSIStorageCapacity objects in this namespace, owned by the Deployment
            # (pod -> ReplicaSet -> Deployment), so they outlive a rollout and go away with the release.
            - --enable-capacity
            - --capacity-ownerref-level=2
            - --capacity-poll-interval=30s
          env:
            - name: NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          volumeMounts:
            - name: socket-dir
              mountPath: /csi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
        - name: csi-attacher
          image: registry.k8s.io/sig-storage/csi-attacher:v4.8.1
          args:
            - --csi-address=/csi/csi.sock
            - --leader-election
            - --leader-election-namespace=kube-system
            - --timeout=6m
          volumeMounts:
            - name: socket-dir
              mountPath: /csi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
        - name: csi-resizer
          image: registry.k8s.io/sig-storage/csi-resizer:v1.13.2
          args:
            - --csi-address=/csi/csi.sock
            - --leader-election
            - --leader-election-namespace=kube-system
            - --timeout=6m
            - --handle-volume-inuse-error=false
          volumeMounts:
            - name: socket-dir
              mountPath: /csi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
        - name: csi-snapshotter
          image: registry.k8s.io/sig-storage/csi-snapshotter:v8.2.1
          args:
            - --csi-address=/csi/csi.sock
            - --leader-election
            - --leader-election-namespace=kube-system
            - --timeout=6m
            - --extra-create-metadata
          volumeMounts:
            - name: socket-dir
              mountPath: /csi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
        - name: liveness-probe
          image: registry.k8s.io/sig-storage/livenessprobe:v2.15.0
          args:
            - --csi-address=/csi/csi.sock
            - --http-endpoint=:9808
          volumeMounts:
            - name: socket-dir
              mountPath: /csi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: socket-dir
          emptyDir: {}
