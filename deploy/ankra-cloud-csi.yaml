# Source: ankra-cloud-csi/templates/csidriver.yaml
apiVersion: storage.k8s.io/v1
kind: CSIDriver
metadata:
  name: csi.ankra.cloud
  labels:
    app.kubernetes.io/name: ankra-cloud-csi
    app.kubernetes.io/instance: ankra-cloud-csi
    app.kubernetes.io/version: "v0.3.0"
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: ankra-cloud-csi-0.3.0
spec:
  attachRequired: true
  podInfoOnMount: false
  fsGroupPolicy: File
  # The scheduler binds a WaitForFirstConsumer claim only to a node whose CSIStorageCapacity fits it; the controller's
  # external-provisioner publishes one per node and StorageClass from the driver's GetCapacity.
  storageCapacity: true
  volumeLifecycleModes:
    - Persistent
