# ankra-cloud-csi on Ankra Pipelines.
#
# Every push and pull request: go vet, the unit tests, the csi-sanity suite, golangci-lint, govulncheck and the chart
# gates. A pull request also builds the multi-arch image and throws it away. A push to main publishes the image as
# sha-<7>; a v* tag publishes it as v<semver> and pushes the chart to oci://share.ankra.cloud/charts. Images are
# built without a daemon: apko assembles the base, ko cross-compiles the driver onto it for linux/amd64 and
# linux/arm64 and attaches an SPDX SBOM (hack/image.sh).
#
# share_login is the Docker config for share.ankra.cloud, from the organisation's connected registry
# share-ankra-cloud. It is a protected section: the image and chart stages publish only once an administrator has
# approved this definition.
apiVersion: ankra.io/v1
kind: Pipeline
metadata:
  name: "ankra-cloud-csi"
on:
  push:
    branches:
      - "main"
  pull_request:
    branches:
      - "main"
    fork_policy: "read_only"
  tag:
    patterns:
      - "v*"
  manual: {}
concurrency:
  group: "ankra-cloud-csi-${{ ankra.ref }}"
  cancel_in_progress: true
workspace:
  size: "10Gi"
  access: "rwo"
defaults:
  image: "golang:1.26@sha256:6c2a5538f964f1c82f97ad14988bf05de100d922d159d0e398b54c7b0ca0c6c9"
  timeout: "30m"
  network: "egress-https"
  # Steps run unprivileged with a read-only root file system, so every cache and scratch directory is in the
  # shared workspace. TMPDIR and XDG_CACHE_HOME are names Ankra reserves, so a run that declared one here is refused
  # before checkout; the image stages, where apko needs a user cache directory, export them in the script instead.
  env:
    GOTOOLCHAIN: "local"
    GOMAXPROCS: "2"
    GOPATH: "/workspace/.ci-cache/go"
    GOCACHE: "/workspace/.ci-cache/go-build"
    GOTMPDIR: "/workspace/.ci-tmp"
    GOLANGCI_LINT_CACHE: "/workspace/.ci-cache/golangci-lint"
    XDG_CONFIG_HOME: "/workspace/.ci-tmp/config"
    HELM_CACHE_HOME: "/workspace/.ci-cache/helm"
    HELM_CONFIG_HOME: "/workspace/.ci-tmp/helm-config"
    HELM_DATA_HOME: "/workspace/.ci-cache/helm-data"
permissions:
  contents: "read"
secrets:
  - name: "share_login"
    from: "registry"
    key: "share-ankra-cloud"
stages:
  - name: "checkout"
    kind: "checkout"

  - name: "test"
    kind: "run"
    needs:
      - "checkout"
    run: |-
      set -eu
      mkdir -p "${GOTMPDIR}"
      test -z "$(gofmt -l cmd internal tools)"
      make vet
      make test
    cache:
      - key: "go-${{ hashFiles('go.sum') }}"
        paths:
          - "/workspace/.ci-cache/go"
          - "/workspace/.ci-cache/go-build"

  # The CSI specification's own conformance suite (github.com/kubernetes-csi/csi-test), in-process against a fake
  # API and a fake mounter. `make test` runs it too; this stage names it on the run.
    resources:
      cpu: "2"
      memory: "4Gi"

  - name: "sanity"
    kind: "run"
    needs:
      - "checkout"
    run: |-
      mkdir -p "${GOTMPDIR}"
      make sanity
    cache:
      - key: "go-${{ hashFiles('go.sum') }}"
        paths:
          - "/workspace/.ci-cache/go"
          - "/workspace/.ci-cache/go-build"
    resources:
      cpu: "2"
      memory: "4Gi"

  - name: "lint"
    kind: "run"
    image: "golangci/golangci-lint:v2.13.2@sha256:ba07dffad130794ae79ebaa0056809d18c0168f3f846480ffd3eb6c04578b83d"
    needs:
      - "checkout"
    run: |-
      mkdir -p "${GOTMPDIR}"
      make lint
    cache:
      - key: "go-lint-${{ hashFiles('go.sum') }}"
        paths:
          - "/workspace/.ci-cache/go"
          - "/workspace/.ci-cache/go-build"
          - "/workspace/.ci-cache/golangci-lint"

  # Reported, not blocking: a finding with no released fix upstream would otherwise stop every release.
    resources:
      cpu: "2"
      memory: "4Gi"

  - name: "vulnerabilities"
    kind: "run"
    needs:
      - "checkout"
    allow_failure: true
    run: |-
      mkdir -p "${GOTMPDIR}"
      go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...
    cache:
      - key: "go-${{ hashFiles('go.sum') }}"
        paths:
          - "/workspace/.ci-cache/go"
          - "/workspace/.ci-cache/go-build"
    resources:
      cpu: "2"
      memory: "4Gi"

  - name: "helm"
    kind: "run"
    needs:
      - "checkout"
    run: |-
      set -eu
      mkdir -p "${GOTMPDIR}" "${HELM_CONFIG_HOME}"
      PATH="$(./hack/ci-helm.sh):${PATH}"
      export PATH
      make helm-lint

  - name: "image-check"
    kind: "run"
    needs:
      - "test"
      - "sanity"
      - "lint"
      - "helm"
    when:
      events:
        - "pull_request"
    run: |-
      set -eu
      mkdir -p "${GOTMPDIR}"
      TMPDIR="${GOTMPDIR}"
      XDG_CACHE_HOME="${GOTMPDIR}/cache"
      export TMPDIR XDG_CACHE_HOME
      go install github.com/google/ko@v0.19.1
      PATH="$(./hack/ci-apko.sh):${GOPATH}/bin:${PATH}"
      export PATH
      IMAGE=share.ankra.cloud/library/ankra-cloud-csi BASE_IMAGE=share.ankra.cloud/base/ankra-cloud-csi-base \
        TAGS="sha-$(printf '%s' "${ANKRA_HEAD_SHA}" | cut -c1-7)" PUSH=false ./hack/image.sh
    cache:
      - key: "go-image-${{ hashFiles('go.sum') }}"
        paths:
          - "/workspace/.ci-cache/go"
          - "/workspace/.ci-cache/go-build"
    resources:
      cpu: "2"
      memory: "4Gi"

  - name: "image"
    kind: "run"
    needs:
      - "test"
      - "sanity"
      - "lint"
      - "helm"
    when:
      events:
        - "push"
        - "tag"
    secrets:
      - "share_login"
    run: |-
      set -eu
      mkdir -p "${GOTMPDIR}"
      TMPDIR="${GOTMPDIR}"
      XDG_CACHE_HOME="${GOTMPDIR}/cache"
      export TMPDIR XDG_CACHE_HOME
      go install github.com/google/ko@v0.19.1
      go install github.com/google/go-containerregistry/cmd/crane@v0.22.1
      PATH="$(./hack/ci-apko.sh):${GOPATH}/bin:${PATH}"
      export PATH
      DOCKER_CONFIG="$(mktemp -d)"
      export DOCKER_CONFIG
      cp /run/agent-secrets/share_login "${DOCKER_CONFIG}/config.json"
      case "${ANKRA_REF}" in
        refs/tags/v*|v*) tags="${ANKRA_REF#refs/tags/}" ;;
        refs/heads/main|main) tags="sha-$(printf '%s' "${ANKRA_HEAD_SHA}" | cut -c1-7)" ;;
        *) echo "image: nothing to publish for ${ANKRA_REF}"; exit 0 ;;
      esac
      IMAGE=share.ankra.cloud/library/ankra-cloud-csi BASE_IMAGE=share.ankra.cloud/base/ankra-cloud-csi-base \
        TAGS="${tags}" PUSH=true ./hack/image.sh
    cache:
      - key: "go-image-${{ hashFiles('go.sum') }}"
        paths:
          - "/workspace/.ci-cache/go"
          - "/workspace/.ci-cache/go-build"
    resources:
      cpu: "2"
      memory: "4Gi"

  # A release tag also publishes the chart as an OCI artifact. The chart's appVersion has to be the tag, so the
  # chart installs the image this run just pushed. The helm repository (https://ankraio.github.io/ankra-charts) is
  # updated by a pull request to github.com/ankraio/ankra-charts.
  - name: "chart"
    kind: "run"
    needs:
      - "image"
    when:
      events:
        - "tag"
    secrets:
      - "share_login"
    run: |-
      set -eu
      mkdir -p "${GOTMPDIR}" "${HELM_CONFIG_HOME}"
      PATH="$(./hack/ci-helm.sh):${PATH}"
      export PATH
      tag="${ANKRA_REF#refs/tags/}"
      app_version="$(sed -n 's/^appVersion: *"\{0,1\}\([^"]*\)"\{0,1\}$/\1/p' charts/ankra-cloud-csi/Chart.yaml)"
      if [ "${app_version}" != "${tag}" ]; then
        echo "chart: charts/ankra-cloud-csi/Chart.yaml has appVersion ${app_version}, the tag is ${tag}" >&2
        exit 1
      fi
      package_directory="$(mktemp -d "${GOTMPDIR}/chart.XXXXXX")"
      helm package charts/ankra-cloud-csi --destination "${package_directory}"
      helm push "${package_directory}"/ankra-cloud-csi-*.tgz oci://share.ankra.cloud/charts \
        --registry-config /run/agent-secrets/share_login
