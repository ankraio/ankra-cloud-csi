      operationId: cancel_agent_rollout
      tags: [agent_rollout]
      summary: Stop a rollout before its next node (admin staff)
      description: >-
        The rollout becomes `cancelled` at once, whether it runs or awaits promotion, and takes no further node; `error` names who cancelled it and why. A node
        in the middle of its upgrade finishes: it stays `upgrading` until its operation ends and is then recorded as
        `succeeded` or `failed`. Cancelling a cancelled rollout answers it as it is; 409 for one that already succeeded or
        failed. Recorded in the platform audit chain (`agent_rollout.cancel`).
      x-ankra-staff-role: admin
      security:
        - staffSession: []
          staffCsrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StaffNodeActionRequest' }
      responses:
        '200':
          description: The cancelled rollout.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AgentRolloutEnvelope' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422':
          description: The reason is missing, shorter than 10 or longer than 500 characters, or spans lines.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        default: { $ref: '#/components/responses/Error' }

