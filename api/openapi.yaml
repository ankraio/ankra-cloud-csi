                zone: { type: string }
      responses:
        '201':
          description: The zone's object storage and its S3 key.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ObjectStorageWithCredentials' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/PaymentRequired' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/IdempotencyKeyReused' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
        default: { $ref: '#/components/responses/Error' }
  /v1/object-storage/{zone}/credentials:
    parameters:
      - $ref: '#/components/parameters/ZonePath'
    get:
      operationId: get_object_storage_credentials
      tags: [object_storage]
      x-ankra-credential-read: true
      summary: Show the zone's S3 key (audited)
      x-ankra-permission: operate
      security: [{ apiToken: [] }, { sessionCookie: [] }]
      responses:
        '200':
          description: The S3 key.
          content:
            application/json:
              schema:
                type: object
                required: [credentials]
                properties:
                  credentials: { $ref: '#/components/schemas/ObjectStorageCredentials' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
        default: { $ref: '#/components/responses/Error' }
  /v1/object-storage/{zone}/migrate:
    parameters:
      - $ref: '#/components/parameters/ZonePath'
    post:
      operationId: migrate_object_storage
      tags: [object_storage]
      summary: Move the zone's buckets from the single-node S3 server to replicated object storage
      description: |
        A zone without Ankra Storage serves S3 from a single-node server, where every bucket of the account starts
        with its `bucket_prefix`. Once the zone has Ankra Storage, new accounts go to its replicated object storage
        (backend `rgw`); this moves an existing account there: a user with the same key, a copy of every bucket (objects
        the replicated store already holds with the same size are skipped, so the operation resumes), then the switch.
        The endpoint and the key stay the same.
      x-ankra-permission: operate
      security:
        - apiToken: []
        - sessionCookie: []
          csrfHeader: []
      responses:
        '202':
          description: The buckets are being moved.
          content:
            application/json:
              schema:
                type: object
                required: [object_storage, operation]
                properties:
                  object_storage: { $ref: '#/components/schemas/ObjectStorage' }
                  operation: { $ref: '#/components/schemas/Operation' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
        default: { $ref: '#/components/responses/Error' }

  /v1/object-storage/{zone}/rotate-keys:
    parameters:
      - $ref: '#/components/parameters/ZonePath'
    post:
      operationId: rotate_object_storage_keys
      tags: [object_storage]
      summary: Replace the zone's S3 key; the old one stops working at once
      x-ankra-permission: operate
      security:
        - apiToken: []
        - sessionCookie: []
          csrfHeader: []
      responses:
        '200':
          description: The zone's object storage and its new S3 key.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ObjectStorageWithCredentials' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
        default: { $ref: '#/components/responses/Error' }

  /v1/databases/plans:
