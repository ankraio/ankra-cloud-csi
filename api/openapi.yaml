        fenced or not online, and for a node that already runs the build's commit (nothing is started); 422 for a version
        the artefact store does not hold. Recorded in the platform audit chain (`node.agent_upgrade`, resource
        `<zone>/<node>`). Follow the operation with `get_fleet_node_operation`.
      x-ankra-staff-role: admin
      security:
        - staffSession: []
          staffCsrfHeader: []
