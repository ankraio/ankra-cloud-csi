                  maximum_storage_gibibytes: { type: integer }
                  default_storage_gibibytes: { type: integer }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        default: { $ref: '#/components/responses/Error' }
  /v1/databases:
    get:
      operationId: list_databases
      tags: [database]
      summary: List managed databases
      description: >-
        Keyset-paginated, newest first: `limit` is 1 to 100 (default 50) and `next_cursor` is null on the last page; pass it back as `cursor` for the next one. A malformed `cursor` or a `limit` out of range is a 400.
      x-ankra-permission: read
      security: [{ apiToken: [] }, { sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: A page of databases, newest first.
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/Database' } }
                  next_cursor: { $ref: '#/components/schemas/NextCursor' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        default: { $ref: '#/components/responses/Error' }
    post:
      operationId: create_database
      tags: [database]
      summary: Create a managed PostgreSQL 17 database on a private network
      description: One VM with its data on an Ankra Storage volume, serving TLS only and archiving its WAL and a daily full backup to the zone's object storage for point-in-time recovery; the owner's password is generated and returned in `credentials`. An account may hold 5.
      x-ankra-permission: operate
      x-ankra-billable-create: true
      x-ankra-idempotent: true
      x-ankra-verified-email: true
      security:
        - apiToken: []
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [zone, name, network_id, database_name]
              properties:
                zone: { type: string }
                name: { type: string, maxLength: 64 }
                network_id: { type: string }
                plan: { type: string, enum: [db-1c-2g, db-2c-4g, db-4c-8g] }
                storage_gibibytes: { type: integer, minimum: 10, maximum: 1024 }
                database_name: { type: string, pattern: '^[a-z][a-z0-9_]{0,62}$' }
                owner_name: { type: string, pattern: '^[a-z][a-z0-9_]{0,62}$' }
                zone_redundant:
                  type: boolean
                  default: false
                  description: >-
                    Primary and replica in different zones of the zone's region. Validated against the region (400 in a
                    region with one zone), then answered 501 until zone-redundant placement lands.
      responses:
        '202':
          description: The database, its `database.create` operation and the owner's credentials.
          content:
            application/json:
              schema:
                type: object
                required: [database, operation, credentials]
                properties:
                  database: { $ref: '#/components/schemas/Database' }
                  operation: { $ref: '#/components/schemas/Operation' }
                  credentials: { $ref: '#/components/schemas/DatabaseCredentials' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/PaymentRequired' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/QuotaExceeded' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '501': { $ref: '#/components/responses/NotImplemented' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
        default: { $ref: '#/components/responses/Error' }
  /v1/databases/{id}:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    get:
      operationId: get_database
      tags: [database]
      summary: Get a database with its health
      x-ankra-permission: read
      security: [{ apiToken: [] }, { sessionCookie: [] }]
      responses:
        '200':
          description: The database.
          content:
            application/json:
              schema:
                type: object
                required: [database]
                properties:
                  database: { $ref: '#/components/schemas/Database' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        default: { $ref: '#/components/responses/Error' }
    delete:
      operationId: delete_database
      tags: [database]
      summary: Delete a database with its VM and data disk
      description: The VM takes a last full backup first. The backups in object storage are kept for the database's retention window, restorable with `POST /v1/databases/{id}/restore` by the deleted database's id, and purged afterwards.
      x-ankra-permission: operate
      security:
        - apiToken: []
        - sessionCookie: []
          csrfHeader: []
      responses:
        '202': { $ref: '#/components/responses/OperationAccepted' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        default: { $ref: '#/components/responses/Error' }
  /v1/databases/{id}/credentials:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    get:
      operationId: get_database_credentials
      tags: [database]
      x-ankra-credential-read: true
      summary: Show the owner's password and connection URI (audited)
      x-ankra-permission: operate
      security: [{ apiToken: [] }, { sessionCookie: [] }]
      responses:
        '200':
          description: The credentials.
          content:
            application/json:
              schema:
                type: object
                required: [credentials]
                properties:
                  credentials: { $ref: '#/components/schemas/DatabaseCredentials' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
        default: { $ref: '#/components/responses/Error' }
  /v1/databases/{id}/reset-password:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    post:
      operationId: reset_database_password
      tags: [database]
      summary: Give the owner a new password
      description: The VM applies it within seconds (`is_configuration_applied` turns true); until then the old one works.
      x-ankra-permission: operate
      security:
        - apiToken: []
        - sessionCookie: []
          csrfHeader: []
      responses:
        '200':
          description: The database and the new credentials.
          content:
            application/json:
              schema:
                type: object
                required: [database, credentials]
                properties:
                  database: { $ref: '#/components/schemas/Database' }
                  credentials: { $ref: '#/components/schemas/DatabaseCredentials' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
        default: { $ref: '#/components/responses/Error' }
  /v1/databases/{id}/plan:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    post:
      operationId: change_database_plan
      tags: [database]
      summary: Scale a running database up or down to another plan
      description: |
        Operation `database.change_plan`. The database's VM stops, takes the new plan's cores and memory (on its node
        when the node has room, otherwise moved cold to another node of the zone) and starts again, so the database
        is unavailable for a few minutes. Its data disk, address, password, certificate and backups stay, and so does
        the recovery window it was created with. The new plan is billed from the hour it is applied. A change that
        fails starts the VM again on the size it still has (operation `database.start`). 409 unless the database is
        running, while another operation holds it, or when it already has the plan.
      x-ankra-permission: operate
      x-ankra-billable-create: true
      x-ankra-idempotent: true
      x-ankra-verified-email: true
      security:
        - apiToken: []
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [plan]
              properties:
                plan: { type: string, description: 'A database plan from `GET /v1/databases/plans`, such as `db-2c-4g`.' }
      responses:
        '202': { $ref: '#/components/responses/OperationAccepted' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/PaymentRequired' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/QuotaExceeded' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        default: { $ref: '#/components/responses/Error' }
  /v1/databases/{id}/resize:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    post:
      operationId: resize_database
      tags: [database]
      summary: Grow a database's storage online
      description: |
        Operation `database.resize`, grow only. The data disk's volume grows, the running hypervisor presents the new
        size to the VM (step `await_storage_resized`), the VM's guest agent grows the ext4 file system under the
        running PostgreSQL, and the operation finishes once the guest reports a file system of the new size (step
        `await_database_filesystem_grown`), usually well within a minute: no restart, clients keep their connections.
        `storage_gibibytes` shows the new size, and the database is billed at it, only from then on; a growth the guest
        finishes after the operation gave up is recorded as soon as it reports it. Managed databases' storage does not
        count against the account's storage quota.

        400 for a size that is not larger than the current one, past the maximum, or smaller than the data disk
        already is after an attempt that did not finish (ask for at least that size to finish it). 409 unless the
        database is running, while another operation holds it, and while the platform does not know the size of the
        database's file system, without which the growth could not be confirmed. The 409 says which of three it is,
        and `GET /v1/databases/{id}` says the same up front (`storage_growth_available`,
        `storage_growth_unavailable_reason`): the database's host cannot report it yet (the platform has to update the
        host first, and a restart would not help until then); the database started before online storage growth
        (restart it once, or change its plan, which restarts it); or it has not measured its file system yet (try
        again in a minute).

        An operation that runs out of time waiting for the file system fails with an error that says so: the disk
        has its new size, and storage shows and is billed at the new size once the database finishes growing it,
        without another request (audit action `database.storage_grown`).
      x-ankra-permission: operate
      x-ankra-billable-create: true
      x-ankra-idempotent: true
      x-ankra-verified-email: true
      security:
        - apiToken: []
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [storage_gibibytes]
              properties:
                storage_gibibytes: { type: integer, minimum: 11, maximum: 1024, description: Larger than the current size. }
      responses:
        '202': { $ref: '#/components/responses/OperationAccepted' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/PaymentRequired' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/IdempotencyKeyReused' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        default: { $ref: '#/components/responses/Error' }
  /v1/databases/{id}/backups:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    get:
      operationId: list_database_backups
      tags: [database]
      summary: The recovery window and base backups of a database, newest first
      description: Also answers for a deleted database whose backups are still kept (`retained_until`). The window is as the VM last reported it (every 5 minutes).
      x-ankra-permission: read
      security: [{ apiToken: [] }, { sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: The window and one page of base backups.
          content:
            application/json:
              schema:
                type: object
                required: [database_id, state, backups, retained_until, items, next_cursor]
                properties:
                  database_id: { type: string }
                  state: { type: string, enum: [creating, running, error, deleting, deleted] }
                  backups: { $ref: '#/components/schemas/DatabaseBackupSummary' }
                  retained_until: { type: [string, 'null'], format: date-time, description: When a deleted database's backups are purged. }
                  items: { type: array, items: { $ref: '#/components/schemas/DatabaseBaseBackup' } }
                  next_cursor: { type: [string, 'null'] }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        default: { $ref: '#/components/responses/Error' }
  /v1/databases/{id}/metrics:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    get:
      operationId: get_database_metrics
      tags: [database]
      summary: CPU, memory, disk and query time of a database
      description: >-
        What the database's VM used, as its guest agent reports it on every health check (every 5 seconds), in
        five-minute buckets kept for 35 days. Query time is the mean execution time of the statements the
        database's own roles finished in the step, from pg_stat_statements; a database created before query
        statistics existed collects them from PostgreSQL's next start (`collects_query_statistics`).
      x-ankra-permission: read
      security: [{ apiToken: [] }, { sessionCookie: [] }]
      parameters:
        - name: period
          in: query
          schema: { type: string, enum: ['1h', '24h', '7d', '30d'], default: '24h' }
      responses:
        '200':
          description: One point per step, oldest first; a reading is null in a step without samples, and the last step is in progress.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DatabaseMetricsSeries' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        default: { $ref: '#/components/responses/Error' }
  /v1/databases/{id}/restore:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    post:
      operationId: restore_database
      tags: [database]
      summary: Restore a database's backups into a new database
      description: Creates a new database from this one's backups, recovered to `target_time` (within the recovery window) or, without it, to everything it archived. The source may have been deleted within its retention window. The new database has the source's database and owner names, a new password and backups of its own; its `database.restore` operation finishes once the data is recovered. `plan` and `storage_gibibytes` size the new database; to resize this one in place use `POST /v1/databases/{id}/plan` and `POST /v1/databases/{id}/resize`.
      x-ankra-permission: operate
      security:
        - apiToken: []
        - sessionCookie: []
          csrfHeader: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                name: { type: string, maxLength: 64, description: Defaults to the source's name with " (restored)". }
                network_id: { type: string, description: Defaults to the source's network. }
                plan: { type: string, enum: [db-1c-2g, db-2c-4g, db-4c-8g], description: Defaults to the source's plan. }
                storage_gibibytes: { type: integer, minimum: 10, maximum: 1024, description: At least the source's; defaults to it. }
                target_time: { type: string, format: date-time }
      responses:
        '202':
          description: The new database, its `database.restore` operation and the owner's credentials.
          content:
            application/json:
              schema:
                type: object
                required: [database, operation, credentials]
                properties:
                  database: { $ref: '#/components/schemas/Database' }
                  operation: { $ref: '#/components/schemas/Operation' }
                  credentials: { $ref: '#/components/schemas/DatabaseCredentials' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/QuotaExceeded' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
        default: { $ref: '#/components/responses/Error' }

  /v1/account/identities:
    get:
      operationId: list_account_identities
      tags: [identity]
      summary: List the identity provider identities you sign in with
      description: >-
        The signed-in user's linked identities (Google, Microsoft, GitHub or the provider's own accounts), oldest
        first; the same list `GET /v1/auth/me` carries in `identities`. Empty when no identity provider was ever used.
      x-ankra-permission: self
      security:
        - apiToken: []
        - sessionCookie: []
      responses:
        '200':
          description: The linked identities.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LinkedIdentityList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        default: { $ref: '#/components/responses/Error' }

  /v1/account/identities/{id}:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    delete:
      operationId: unlink_account_identity
      tags: [identity]
      summary: Unlink one of your sign-in identities
      description: >-
        The provider account can no longer sign in as you. Your last way to sign in is never removed: a user without
        a password keeps their only identity (409). Session-only; a support session is refused (403). The unlink
        and its audit event (`auth.identity_unlink`) are stored together.
      x-ankra-permission: self
      security:
        - sessionCookie: []
          csrfHeader: []
      responses:
        '200':
          description: The identity was unlinked.
          content:
            application/json:
              schema:
                type: object
                required: [identity]
                properties:
                  identity: { $ref: '#/components/schemas/LinkedIdentity' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        default: { $ref: '#/components/responses/Error' }

  /v1/auth/login/mfa:
    post:
      operationId: verify_login_second_factor
      tags: [mfa]
      summary: Finish a sign-in with a code from the authenticator app or a recovery code
      description: >-
        Takes the `challenge` from the password step (or from the identity provider sign-in, which lands on the
        portal's `/login/mfa` page with it in the URL fragment) and exactly one of `code` (six digits, each accepted
        once) and `recovery_code` (single use). Sets the session cookies like `POST /v1/auth/login` and applies its
        `end_other_sessions`. Limited to 10 attempts per client address per minute; repeated wrong codes lock the
        user's second factor out. Audited as `auth.login` (and `auth.mfa_recovery_code_used`), wrong codes as
        `auth.mfa_failed`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SecondFactorLoginRequest' }
      responses:
        '200':
          description: Signed in.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SecondFactorSession' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
        default: { $ref: '#/components/responses/Error' }

  /v1/auth/login/mfa/enroll:
    post:
      operationId: start_login_second_factor_setup
      tags: [mfa]
      summary: Start setting up the authenticator app the account requires, before the first session
      description: >-
        With an `enroll` challenge: a new TOTP secret for the user, returned once as `secret` and as the `otpauth_uri`
        the portal renders as a QR code. It is not active until `.../enroll/confirm` receives its first code.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SecondFactorChallengeRequest' }
      responses:
        '200':
          description: The secret, shown once.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthenticatorSetup' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
        default: { $ref: '#/components/responses/Error' }

  /v1/auth/login/mfa/enroll/confirm:
    post:
      operationId: finish_login_second_factor_setup
      tags: [mfa]
      summary: Activate the new authenticator with its first code and sign in
      description: >-
        The first code activates the authenticator; the ten recovery codes are returned once, and the session cookies
        are set. Audited as `account.mfa_enabled` and `auth.login`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SecondFactorLoginRequest' }
      responses:
        '200':
          description: Signed in; keep the recovery codes.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SecondFactorSession' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
        default: { $ref: '#/components/responses/Error' }

  /v1/account/mfa:
    get:
      operationId: get_account_mfa
      tags: [mfa]
      summary: Your second factor and whether the account requires one
      description: Session-only; API tokens never see how anyone signs in.
      x-ankra-permission: self
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          description: Your second factor.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SecondFactorStatus' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        default: { $ref: '#/components/responses/Error' }

  /v1/account/mfa/totp:
    post:
      operationId: start_account_totp_setup
      tags: [mfa]
      summary: Start setting up an authenticator app
      description: >-
        A new TOTP secret (RFC 6238: SHA-1, six digits, 30 seconds), returned once as `secret` and as the
        `otpauth_uri` to render as a QR code; it replaces an earlier unconfirmed one and is not active until
        `POST /v1/account/mfa/totp/confirm`. 409 while an authenticator is set up. Session-only; refused to support
        sessions. Audited as `account.mfa_setup_started`.
      x-ankra-permission: self
      security:
        - sessionCookie: []
          csrfHeader: []
      responses:
        '200':
          description: The secret, shown once.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthenticatorSetup' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
        default: { $ref: '#/components/responses/Error' }
    delete:
      operationId: disable_account_totp
      tags: [mfa]
      summary: Turn the authenticator app off
      description: >-
        Needs a current `code` or a `recovery_code`. Refused (409) while the account requires a second factor.
        Session-only; refused to support sessions. Audited as `account.mfa_disabled`, wrong codes as `auth.mfa_failed`.
      x-ankra-permission: self
      security:
        - sessionCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SecondFactorProof' }
      responses:
        '204': { description: The authenticator and every recovery code are gone. }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        default: { $ref: '#/components/responses/Error' }

  /v1/account/mfa/totp/confirm:
    post:
      operationId: finish_account_totp_setup
      tags: [mfa]
      summary: Activate the authenticator app with its first code
      description: >-
        Returns the ten single-use recovery codes, once; they are stored hashed. Session-only; refused to support
        sessions. Audited as `account.mfa_enabled`.
      x-ankra-permission: self
      security:
        - sessionCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AuthenticatorCodeRequest' }
      responses:
        '200':
          description: Active; keep the recovery codes.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RecoveryCodes' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        default: { $ref: '#/components/responses/Error' }

  /v1/account/mfa/recovery-codes:
    post:
      operationId: replace_account_recovery_codes
      tags: [mfa]
      summary: Replace your recovery codes
      description: >-
        Needs a current `code` or a `recovery_code`. Every earlier recovery code stops working; ten new ones are
        returned once. Session-only; refused to support sessions. Audited as `account.mfa_recovery_codes_regenerated`.
      x-ankra-permission: self
      security:
        - sessionCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SecondFactorProof' }
      responses:
        '200':
          description: The new recovery codes.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RecoveryCodes' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        default: { $ref: '#/components/responses/Error' }

  /v1/accounts:
    get:
      operationId: list_accounts
      tags: [organisation]
      summary: The accounts you can act in
      description: >-
        Your own account first, then the accounts of the Ankra platform organisations you belong to (as the platform
        listed them at your last sign-in with your Ankra account) and any account whose owner seat you hold, by name.
        `active_account_id` is the account your sessions act for now; `organisations` are the organisations the platform
        listed, each with the `account_id` you reach it as, or without one when opening it (`POST /v1/accounts/active`
        with `organisation_id`) creates its account or needs a fresh sign-in. Session-only.
      x-ankra-permission: self
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          description: The accounts and organisations.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccountSwitcher' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        default: { $ref: '#/components/responses/Error' }

  /v1/accounts/active:
    post:
      operationId: switch_account
      tags: [organisation]
      summary: Act in another of your accounts, or open an Ankra organisation
      description: >-
        Every session of yours acts for this account from the next request on, with the role you hold there. Name it
        with `account_id` (your own account, or an organisation's account the platform lists you for; 404 for anything
        else), or name an Ankra platform organisation with `organisation_id` to open it: any organisation the platform
        listed for you at your last sign-in with your Ankra account, whose Cloud account is created when it has none
        (ADR 0011). An owner or admin of the organisation confirmed within the last hour takes the new account's owner
        seat; otherwise the first administrator of the organisation who signs in takes it. 403 with reason
        `sign_in_with_ankra_required` when your statement is stale or older than the account's link, 409 for an
        organisation the Cloud workspace sync created for another account or one whose account was created at the same
        moment (try again). A support session stays in its account (403). Session-only. Audited as `account.switched` in
        the account switched to, and `organisation.account_opened` when opening created it.
      x-ankra-permission: self
      security:
        - sessionCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              minProperties: 1
              maxProperties: 1
              properties:
                account_id: { type: string, format: uuid }
                organisation_id: { type: string, format: uuid, description: The Ankra platform organisation to open. }
      responses:
        '200':
          description: The account your sessions act for now.
          content:
            application/json:
              schema:
                type: object
                required: [account]
                properties:
                  account: { $ref: '#/components/schemas/SwitchableAccount' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
        default: { $ref: '#/components/responses/Error' }

  /v1/account/organisation:
    get:
      operationId: get_account_organisation
      tags: [organisation]
      summary: The Ankra organisation this account belongs to
      description: >-
        `link` names the Ankra platform organisation the account is linked to (null when it is not) and `members` its
        members as the platform last confirmed them, with the owner seat marked. For the owner of an unlinked account of
        their own, `candidates` are the organisations they administer, confirmed by a sign-in with their Ankra account
        within the last hour, that have no Cloud account yet; for an account the Cloud workspace sync mirrors, that
        includes the organisation the sync made for it.
      x-ankra-permission: read
      security:
        - apiToken: []
        - sessionCookie: []
      responses:
        '200':
          description: The account's organisation.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccountOrganisation' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        default: { $ref: '#/components/responses/Error' }
    post:
      operationId: link_account_organisation
      tags: [organisation]
      summary: Link your account to an Ankra organisation (owner only)
      description: >-
        Links your own existing account to an Ankra platform organisation. You must be the account's owner, have signed
        in with your Ankra account within the last hour (403 with reason `sign_in_with_ankra_required` otherwise) and be
        an owner or admin of the organisation as the platform listed it; the organisation must have no Cloud account yet
        (409). The account keeps its owner, members, resources and billing; the organisation's members reach it from
        their next sign-in, and pending invitations are revoked because members now come from the organisation.
        Session-only. Audited as `organisation.linked`.
      x-ankra-permission: members.manage
      security:
        - sessionCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [organisation_id]
              properties:
                organisation_id: { type: string, format: uuid }
      responses:
        '200':
          description: The new link.
          content:
            application/json:
              schema:
                type: object
                required: [link]
                properties:
                  link: { $ref: '#/components/schemas/OrganisationLink' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
        default: { $ref: '#/components/responses/Error' }

  /v1/account/mfa/policy:
    put:
      operationId: set_account_mfa_policy
      tags: [mfa]
      summary: Require a second factor of every member (owner only)
      description: >-
        `required: true` makes every member without a second factor set one up at their next sign-in; sessions
        already open keep running until they end. Only the owner may change it, and only with a second factor of
        their own (409 otherwise). Session-only. Audited as `account.mfa_policy_changed`.
      x-ankra-permission: members.manage
      security:
        - sessionCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [required]
              properties:
                required: { type: boolean }
      responses:
        '200':
          description: The owner's second factor with the new requirement.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SecondFactorStatus' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        default: { $ref: '#/components/responses/Error' }

  /v1/zones/{zone}/servers/{id}/force-release:
    parameters:
      - $ref: '#/components/parameters/ZonePath'
      - $ref: '#/components/parameters/IdPath'
    post:
      operationId: force_release_zone_server
      tags: [maintenance]
      summary: Remove a server whose node is gone for good (operator only)
      description: |
        Cancels whatever the server is doing and enqueues operation `server.force_release`: the node's spec drops the
        VM without waiting for the node to confirm, the server's storages are detached and kept, and its addresses,
        private interfaces and floating IPs are freed. Use it only when the node cannot come back; a node that does
        return is told by its spec to remove the VM. Written to the customer's audit log by `operator:<token name>`
        with the reason; when it cannot be written the request fails. Needs the `maintenance` scope.
      x-ankra-operator-scope: maintenance
      security:
        - operatorToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [reason]
              properties:
                reason: { type: string, minLength: 1, examples: ['node fsn1-comp-3 lost both disks'] }
      responses:
        '202':
          description: The force release is enqueued.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ForceRelease' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Error' }

  /healthz:
    get:
      operationId: check_liveness
      tags: [health]
      summary: Liveness probe
      description: Answers 200 while the process serves HTTP. It checks nothing else.
      security: []
      responses:
        '200':
          description: Alive.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HealthStatus' }
        default: { $ref: '#/components/responses/Error' }

  /readyz:
    get:
      operationId: check_readiness
      tags: [health]
      summary: Readiness probe
      description: >-
        Answers 200 when the database answers a ping and the node bus (NATS) is connected, 503 otherwise. The status is
        `parked` instead of `ready` while the control plane is parked (ANKRA_CLOUD_PARKED=true), when every listener
        serves reads only and answers every other method with 503. A replica that was told to stop answers 503 with
        the detail `draining` from that moment on, while it still serves every other route until its listeners close.
        A 200 on the main listener also names `revision`, the commit the deployment says the binary was built from
        (ANKRA_CLOUD_SOURCE_REVISION), when it was given one; the node listener never names it.
      security: []
      responses:
        '200':
          description: Ready.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HealthStatus' }
        '503':
          description: Not ready (the database or the node bus does not answer; `detail` says which on the main listener), or `draining`.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        default: { $ref: '#/components/responses/Error' }

  /metrics:
    get:
      operationId: get_control_plane_metrics
      tags: [telemetry]
      summary: The control plane's own Prometheus metrics (operator only)
      description: >-
        The Prometheus text exposition format, for a scrape that carries an operator token with the `read` scope.
        503 when metrics are not configured.
      x-ankra-operator-scope: read
      security:
        - operatorToken: []
      responses:
        '200':
          description: The metrics.
          content:
            text/plain:
              schema: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
        default: { $ref: '#/components/responses/Error' }

  /v1/kubernetes-clusters/versions:
    get:
      operationId: list_kubernetes_versions
      tags: [kubernetes_cluster]
      summary: The Kubernetes versions a cluster can run, with their pinned add-ons, the control-plane tiers and the prices
      description: >-
        The three latest Kubernetes minors the pinned vCluster release supports. Each minor pins its patch release
        and the add-on versions every cluster of that minor runs. A cluster upgrades one minor at a time.
        `control_planes` are the tiers a cluster's control plane can be created as, with their monthly prices:
        `development` (one replica, no fee; the nodes are the whole bill) and `production` (three replicas with
        embedded etcd quorum, the monthly fee). `control_plane_price_monthly_cents` is the default tier's price.
      x-ankra-permission: read
      security: [{ apiToken: [] }, { sessionCookie: [] }]
      responses:
        '200':
          description: The versions.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/KubernetesVersionList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        default: { $ref: '#/components/responses/Error' }
  /v1/kubernetes-clusters:
    get:
      operationId: list_kubernetes_clusters
      tags: [kubernetes_cluster]
      summary: List Kubernetes clusters
      description: Newest first, without node pools; get one for those.
      x-ankra-permission: read
      security: [{ apiToken: [] }, { sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: One page of clusters.
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/KubernetesCluster' } }
                  next_cursor: { type: [string, 'null'] }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        default: { $ref: '#/components/responses/Error' }
    post:
      operationId: create_kubernetes_cluster
      tags: [kubernetes_cluster]
      summary: Create a managed Kubernetes cluster
      description: >-
        The control plane is a vCluster that Ankra runs on the region's host cluster, in the tier `control_plane`
        names: `production` (the default) runs three API server replicas with embedded etcd spread across host nodes
        and zones and is billed per hour at its monthly price; `development` runs one replica, has no fee and is for
        development, test and preview clusters, where an upgrade or a host node failure interrupts the API. Both keep
        etcd on `ankra-standard` volumes, snapshotted to object storage every six hours, and the tier does not change
        in place. The cluster's worker nodes are servers in your account, created by its node pools (`node_pools` here
        creates them with the cluster) and billed as servers whatever the tier. The API endpoint is always served on
        IPv6; `public_ipv4` adds an IPv4 address (a paid add-on). `private_endpoint` is not available yet and answers
        400. The tiers and their prices are `control_planes` of `list_kubernetes_versions`. An account may hold 5
        clusters.
      x-ankra-permission: operate
      x-ankra-billable-create: true
      x-ankra-idempotent: true
      x-ankra-verified-email: true
      security:
        - apiToken: []
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [zone, name, network_id]
              properties:
                zone: { type: string, description: 'The zone the node pools default to; its region hosts the control plane.' }
                name: { type: string, pattern: '^[a-z][a-z0-9-]{0,38}[a-z0-9]$', description: 'DNS label, 2 to 40 characters.' }
                network_id: { type: string, description: The private network every node joins. }
                version: { type: string, examples: ['1.36'], description: 'A minor from list_kubernetes_versions; defaults to the newest.' }
                control_plane:
                  $ref: '#/components/schemas/KubernetesControlPlaneTier'
                  description: 'The control-plane tier, from `control_planes` of list_kubernetes_versions; defaults to `production`. It does not change in place.'
                public_ipv4: { type: boolean, description: 'Serve the API on IPv4 too (paid add-on). Default false: IPv6 only.' }
                private_endpoint: { type: boolean, description: 'Not available yet; true answers 400.' }
                labels: { $ref: '#/components/schemas/Labels' }
                node_pools:
                  type: array
                  maxItems: 8
                  items: { $ref: '#/components/schemas/KubernetesNodePoolRequest' }
      responses:
        '202':
          description: The cluster, its `kubernetes_cluster.create` operation and the node pools created with it.
          content:
            application/json:
              schema:
                type: object
                required: [kubernetes_cluster, operation]
                properties:
                  kubernetes_cluster: { $ref: '#/components/schemas/KubernetesCluster' }
                  operation: { $ref: '#/components/schemas/Operation' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/PaymentRequired' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/QuotaExceeded' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
        default: { $ref: '#/components/responses/Error' }
  /v1/kubernetes-clusters/{id}:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    get:
      operationId: get_kubernetes_cluster
      tags: [kubernetes_cluster]
      summary: Get a Kubernetes cluster with its node pools and health
      x-ankra-permission: read
      security: [{ apiToken: [] }, { sessionCookie: [] }]
      responses:
        '200':
          description: The cluster.
          content:
            application/json:
              schema:
                type: object
                required: [kubernetes_cluster]
                properties:
                  kubernetes_cluster: { $ref: '#/components/schemas/KubernetesCluster' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        default: { $ref: '#/components/responses/Error' }
    delete:
      operationId: delete_kubernetes_cluster
      tags: [kubernetes_cluster]
      summary: Delete a Kubernetes cluster with its nodes, volumes, load balancers and etcd snapshots
      description: >-
        Deletes the cluster's Services of type LoadBalancer and PersistentVolumeClaims first, so the cloud controller
        and the CSI driver remove the load balancers and storages they made, then the nodes, then the control plane
        and its etcd snapshots. Nothing the cluster created is left behind.
      x-ankra-permission: operate
      security:
        - apiToken: []
        - sessionCookie: []
          csrfHeader: []
      responses:
        '202': { $ref: '#/components/responses/OperationAccepted' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        default: { $ref: '#/components/responses/Error' }
  /v1/kubernetes-clusters/{id}/upgrade:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    post:
      operationId: upgrade_kubernetes_cluster
      tags: [kubernetes_cluster]
      summary: Upgrade a Kubernetes cluster to the next minor
      description: >-
        `version` must be the minor after the cluster's (one minor at a time). The control plane is upgraded first,
        then the add-ons, then every node pool is rolled: each node is replaced by a new one at the new version,
        after the old one is cordoned and drained.
      x-ankra-permission: operate
      security:
        - apiToken: []
        - sessionCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [version]
              properties:
                version: { type: string, examples: ['1.36'] }
      responses:
        '202':
          description: The cluster and its `kubernetes_cluster.upgrade` operation.
          content:
            application/json:
              schema:
                type: object
                required: [kubernetes_cluster, operation]
                properties:
                  kubernetes_cluster: { $ref: '#/components/schemas/KubernetesCluster' }
                  operation: { $ref: '#/components/schemas/Operation' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        default: { $ref: '#/components/responses/Error' }
  /v1/kubernetes-clusters/{id}/platform/register:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    post:
      operationId: register_kubernetes_cluster_in_platform
      tags: [platform_cluster]
      summary: Register a Kubernetes cluster in the Ankra platform now
      description: >-
        Starts a `kubernetes_cluster.platform_register` operation whatever the registration's state: a pending,
        unlinked, failed or removed registration starts over, and a registered cluster declares its stacks again. The
        cluster is imported into the account's Ankra platform organisation under its own name, the platform agent is
        installed with the cluster's add-ons, and the Ankra cloud controller and CSI driver become platform stacks. The
        cluster must be running. Its registration never changes the cluster's own state.
      x-ankra-permission: operate
      security:
        - apiToken: []
        - sessionCookie: []
          csrfHeader: []
      responses:
        '202': { $ref: '#/components/responses/OperationAccepted' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
        default: { $ref: '#/components/responses/Error' }
  /v1/kubernetes-clusters/{id}/platform:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    delete:
      operationId: remove_kubernetes_cluster_from_platform
      tags: [platform_cluster]
      summary: Take a Kubernetes cluster out of the Ankra platform
      description: >-
        Starts a `kubernetes_cluster.platform_deregister` operation: the cloud controller and CSI driver go back under
        the cluster's own add-on releases, the cluster is removed from the platform organisation, and the platform
        agent is uninstalled. The cluster keeps running and is not registered again until someone asks.
      x-ankra-permission: operate
      security:
        - apiToken: []
        - sessionCookie: []
          csrfHeader: []
      responses:
        '202': { $ref: '#/components/responses/OperationAccepted' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
        default: { $ref: '#/components/responses/Error' }
  /platform/v1/organisations/{organisation_id}/credential:
    post:
      operationId: create_platform_credential
      tags: [platform_credential]
      summary: Issue the Ankra platform an API token for its organisation's Cloud account
      description: >-
        Called by the Ankra platform as a service, with the private `X-Ankra-Platform-Token` header; sessions, API
        tokens and operator tokens are not accepted. Finds the account linked to the organisation (or the account the
        Cloud workspace sync made the organisation for); without one it creates an account linked and confirmed to the
        organisation, named `organisation_name`, whose members are the organisation's members as they sign in with
        their Ankra account. It then issues a new `read_write` token named `Ankra platform`, valid 365 days, acting as
        the account's non-login service user (an admin), and records it in the account's audit log. Idempotent per
        organisation apart from the new token; earlier platform tokens are never revoked here. Answers 503 when no
        platform service token is configured.
      parameters:
        - name: organisation_id
          in: path
          required: true
          description: The platform organisation's UUID.
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [organisation_name]
              properties:
                organisation_name: { type: string, minLength: 1, maxLength: 128, description: "The organisation's display name, the new account's name." }
      responses:
        '200':
          description: The account and the new token, shown once. Never cached.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [account_id, account_created, api_token, api_token_id, expires_at]
                properties:
                  account_id: { type: string, format: uuid }
                  account_created: { type: boolean, description: True when this request created the account. }
                  api_token: { type: string, description: 'The `act_…` token. Store it; it is never shown again.' }
                  api_token_id: { type: string, format: uuid }
                  expires_at: { type: string, format: date-time }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
        default: { $ref: '#/components/responses/Error' }
      security: [{ platformServiceToken: [] }]

  /platform/v1/organisations/{organisation_id}/account:
    get:
      operationId: get_platform_account
      tags: [platform_credential]
      summary: Whether the organisation's Cloud account may create billable resources
      description: >-
        Called by the Ankra platform as a service, with the private `X-Ankra-Platform-Token` header. Reads the account
        linked to the organisation (or the account the Cloud workspace sync made the organisation for) and applies the
        same rule that answers a billable create with 402: `can_spend` is false with `reason`
        `payment_method_required` while the account has no default payment method (credits pay for usage but do not
        replace the card), or `account_suspended` while an overdue invoice or Ankra staff suspend it.
        `dev_cluster_trial` says whether the organisation may start its free trial dev cluster meanwhile. `billing_url` sends the person
        through Sign in with Ankra and on to the account's payment methods in the Cloud portal; the sign-in confirms
        their membership again, which a membership older than the account's link needs before it can act for the account. Never creates an account: 404 when the organisation has none.
      parameters:
        - name: organisation_id
          in: path
          required: true
          description: The platform organisation's UUID.
          schema: { type: string }
      responses:
        '200':
          description: The account's billing standing. Never cached.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [account_id, can_spend, reason, billing_url, credits_state, credits_remaining_cents, credits_expire_at, dev_cluster_trial, billing_arrangement]
                properties:
                  account_id: { type: string, format: uuid }
                  can_spend: { type: boolean }
                  reason: { type: string, enum: ['', payment_method_required, owner_approval_required, account_suspended], description: Empty while `can_spend` is true. }
                  billing_url: { type: string, description: 'Where to send a person to add a payment method: the portal''s Sign in with Ankra (`/v1/auth/oidc/login?prompt=none&return_to=/settings/billing?account=<account_id>`), silent while their Ankra session is live, which confirms their membership of the organisation again before the billing page acts for the account. An account the platform provisioned is linked after its people last signed in to Cloud, so a link straight to the page would refuse them.' }
                  credits_state: { type: string, enum: [ready, unavailable] }
                  credits_remaining_cents: { type: [integer, 'null'], minimum: 0 }
                  credits_expire_at: { type: [string, 'null'], format: date-time }
                  dev_cluster_trial:
                    oneOf:
                      - { $ref: '#/components/schemas/DevClusterTrialOffer' }
                      - { type: 'null' }
                  billing_arrangement: { type: string, enum: [card, invoice], description: '`invoice` when the platform invoices the organisation itself (PUT …/billing-arrangement): then `can_spend` is true without a card.' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
        default: { $ref: '#/components/responses/Error' }
      security: [{ platformServiceToken: [] }]

  /platform/v1/organisations/{organisation_id}/billing-approval:
    post:
      operationId: create_platform_billing_approval
      tags: [platform_credential]
      summary: Apply a verified organisation owner's approval of paid usage
      description: >-
        Platform delivers committed owner consent through its durable outbox. Cloud resolves the account from the
        organisation link, verifies a current default card, and records approval and audit atomically. Retrying keeps
        the original Cloud approval instant. Saving a card never calls this route. Usage before approval is covered by
        credits or trial protection and cannot be charged retroactively.
      parameters:
        - name: organisation_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [approved_by, terms_version]
              properties:
                approved_by: { type: string, format: uuid }
                terms_version: { type: string, enum: [paid-usage-2026-10-03] }
      responses:
        '204': { description: 'Approval recorded, or already applied.' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
        default: { $ref: '#/components/responses/Error' }
      security: [{ platformServiceToken: [] }]

  /platform/v1/organisations/{organisation_id}/billing-arrangement:
    put:
      operationId: set_platform_billing_arrangement
      tags: [platform_credential]
      summary: Record how the platform bills the organisation
      description: >-
        Called by the Ankra platform as a service when an organisation's billing changes: `invoice` when the platform
        invoices the organisation under its own agreement (an approved invoicing application), `card` to return to
        card payments through Cloud. An invoiced account creates billable resources without a card or an owner's
        approval of paid usage, and Cloud never pushes its invoices to Stripe; the platform consolidates them.
        Idempotent: setting the same arrangement again refreshes the reference. Recorded in the account's audit log
        as the platform. Never creates an account: 404 when the organisation has none.
      parameters:
        - name: organisation_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [arrangement]
              properties:
                arrangement: { type: string, enum: [card, invoice] }
                reference: { type: string, maxLength: 200, description: 'The agreement on the platform, for example the invoicing application id.' }
                set_by: { type: string, maxLength: 254, description: 'Who approved it on the platform, for the audit log.' }
      responses:
        '200':
          description: The arrangement as stored. Never cached.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [account_id, billing_arrangement, reference, changed_at]
                properties:
                  account_id: { type: string, format: uuid }
                  billing_arrangement: { type: string, enum: [card, invoice] }
                  reference: { type: [string, 'null'] }
                  changed_at: { type: [string, 'null'], format: date-time }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
        default: { $ref: '#/components/responses/Error' }
      security: [{ platformServiceToken: [] }]

  /platform/v1/organisations/{organisation_id}/billing-customer:
    get:
      operationId: get_platform_billing_customer
      tags: [platform_credential]
      summary: Read the shared billing customer without creating it
      description: >-
        Service-only access to the canonical Stripe customer of the linked Cloud account. Does not create an account,
        select a plan, authorise charges or save a card. An empty customer_id on GET means no customer exists yet.
        POST uses the account's stable idempotency key. Both products must use the same Stripe account.
      parameters:
        - name: organisation_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: The shared customer reference. Never cached.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [customer_id]
                properties:
                  customer_id: { type: string }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
        default: { $ref: '#/components/responses/Error' }
      security: [{ platformServiceToken: [] }]
    post:
      operationId: create_platform_billing_customer
      tags: [platform_credential]
      summary: Ensure one billing customer for Cloud and Platform
      description: >-
        Service-only access to the canonical Stripe customer of the linked Cloud account. Does not create an account,
        select a plan, authorise charges or save a card. An empty customer_id on GET means no customer exists yet.
        POST uses the account's stable idempotency key. Both products must use the same Stripe account.
      parameters:
        - name: organisation_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: The shared customer reference. Never cached.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [customer_id]
                properties:
                  customer_id: { type: string }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
        default: { $ref: '#/components/responses/Error' }
      security: [{ platformServiceToken: [] }]

  /v1/kubernetes-clusters/{id}/kubeconfig:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    get:
      operationId: get_kubernetes_cluster_kubeconfig
      tags: [kubernetes_cluster]
      x-ankra-credential-read: true
      summary: A kubeconfig with a short-lived cluster-admin credential (audited)
      description: >-
        The `admin` context holds a service account token bound to `cluster-admin` that expires at `expires_at`
        (8 hours). The `oidc` context signs you in as yourself instead: its exec credential plugin calls
        `get_kubernetes_cluster_token`, and your Ankra role decides your Kubernetes role (owner and admin:
        cluster-admin, member: edit, viewer: view). Every download is written to the audit log.
      x-ankra-permission: operate
      security: [{ apiToken: [] }, { sessionCookie: [] }]
      responses:
        '200':
          description: The kubeconfig.
          content:
            application/json:
              schema:
                type: object
                required: [kubeconfig, expires_at]
                properties:
                  kubeconfig: { type: string, description: 'The kubeconfig YAML.' }
                  expires_at: { type: string, format: date-time }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
        default: { $ref: '#/components/responses/Error' }
  /v1/kubernetes-clusters/{id}/token:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    get:
      operationId: get_kubernetes_cluster_token
      tags: [kubernetes_cluster]
      x-ankra-credential-read: true
      summary: An OIDC token for the cluster's API, as a client.authentication.k8s.io ExecCredential
      description: >-
        Signed by the Ankra Cloud Kubernetes issuer (`oidc_issuer_url` of the cluster), valid for one hour, for
        this cluster only (`aud`). `groups` holds `ankra:<role>` of the caller's role, which the cluster binds to
        cluster-admin (owner, admin), edit (member) or view (viewer). The answer is an ExecCredential, so a
        kubeconfig's exec plugin can print it as is. Audited.
      x-ankra-permission: read
      security: [{ apiToken: [] }, { sessionCookie: [] }]
      responses:
        '200':
          description: The ExecCredential.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/KubernetesExecCredential' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
        default: { $ref: '#/components/responses/Error' }
  /v1/kubernetes-clusters/{id}/etcd-snapshots:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    get:
      operationId: list_kubernetes_cluster_etcd_snapshots
      tags: [kubernetes_cluster]
      summary: The etcd snapshots of a cluster, newest first
      description: Taken every six hours and on request; the newest `retention` are kept.
      x-ankra-permission: read
      security: [{ apiToken: [] }, { sessionCookie: [] }]
      responses:
        '200':
          description: The snapshots (`next_cursor` is always null).
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor, schedule, retention]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/KubernetesEtcdSnapshot' } }
                  next_cursor: { type: 'null' }
                  schedule: { type: string, description: 'Cron schedule, UTC.' }
                  retention: { type: integer }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
        default: { $ref: '#/components/responses/Error' }
    post:
      operationId: create_kubernetes_cluster_etcd_snapshot
      tags: [kubernetes_cluster]
      summary: Take an etcd snapshot now
      x-ankra-permission: operate
      security:
        - apiToken: []
        - sessionCookie: []
          csrfHeader: []
      responses:
        '202': { $ref: '#/components/responses/OperationAccepted' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        default: { $ref: '#/components/responses/Error' }
  /v1/kubernetes-clusters/{id}/restore:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    post:
      operationId: restore_kubernetes_cluster
      tags: [kubernetes_cluster]
      summary: Restore the cluster's etcd from a snapshot
      description: >-
        Replaces the cluster's whole state (every object in etcd) with the snapshot's. The API is unavailable while
        the control plane restarts; nodes and their volumes are kept.
      x-ankra-permission: operate
      security:
        - apiToken: []
        - sessionCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [snapshot]
              properties:
                snapshot: { type: string, description: 'The `name` of a snapshot from list_kubernetes_cluster_etcd_snapshots.' }
      responses:
        '202': { $ref: '#/components/responses/OperationAccepted' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        default: { $ref: '#/components/responses/Error' }
  /v1/kubernetes-clusters/{id}/node-pools:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    get:
      operationId: list_kubernetes_node_pools
      tags: [kubernetes_cluster]
      summary: List a cluster's node pools with their nodes
      x-ankra-permission: read
      security: [{ apiToken: [] }, { sessionCookie: [] }]
      responses:
        '200':
          description: Every node pool of the cluster (`next_cursor` is always null).
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/KubernetesNodePool' } }
                  next_cursor: { type: 'null' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        default: { $ref: '#/components/responses/Error' }
    post:
      operationId: create_kubernetes_node_pool
      tags: [kubernetes_cluster]
      summary: Add a node pool to a cluster
      description: >-
        Creates `count` servers of `plan` in your account (billed as servers), spread across `zones`, each joining
        the cluster with a short-lived bootstrap token. Nodes are IPv6-first; `public_ipv4` gives every node a
        public IPv4 too (the server add-on). `autoscaling` is stored for the cluster autoscaler, which is not running
        yet: the pool keeps `count` nodes.
      x-ankra-permission: operate
      x-ankra-billable-create: true
      x-ankra-idempotent: true
      x-ankra-verified-email: true
      security:
        - apiToken: []
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/KubernetesNodePoolRequest' }
      responses:
        '202':
          description: The node pool and its `node_pool.sync` operation.
          content:
            application/json:
              schema:
                type: object
                required: [node_pool, operation]
                properties:
                  node_pool: { $ref: '#/components/schemas/KubernetesNodePool' }
                  operation: { $ref: '#/components/schemas/Operation' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/PaymentRequired' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/QuotaExceeded' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        default: { $ref: '#/components/responses/Error' }
  /v1/kubernetes-clusters/{id}/node-pools/{pool}:
    parameters:
      - $ref: '#/components/parameters/IdPath'
      - $ref: '#/components/parameters/NodePoolPath'
    get:
      operationId: get_kubernetes_node_pool
      tags: [kubernetes_cluster]
      summary: Get a node pool with its nodes
      x-ankra-permission: read
      security: [{ apiToken: [] }, { sessionCookie: [] }]
      responses:
        '200':
          description: The node pool.
          content:
            application/json:
              schema:
                type: object
                required: [node_pool]
                properties:
                  node_pool: { $ref: '#/components/schemas/KubernetesNodePool' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        default: { $ref: '#/components/responses/Error' }
    patch:
      operationId: update_kubernetes_node_pool
      tags: [kubernetes_cluster]
      summary: Scale a node pool or change its labels, taints or autoscaling bounds
      description: >-
        A new `count` scales the pool: new nodes join, surplus nodes are cordoned, drained and deleted, newest first.
        New labels and taints apply to every node. The pool's plan, zones and IPv4 setting are fixed; create another
        pool to change them.
      x-ankra-permission: operate
      security:
        - apiToken: []
        - sessionCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                count: { type: integer, minimum: 0, maximum: 100 }
                labels: { $ref: '#/components/schemas/Labels' }
                taints: { type: array, maxItems: 16, items: { $ref: '#/components/schemas/KubernetesTaint' } }
                autoscaling: { oneOf: [{ $ref: '#/components/schemas/KubernetesAutoscaling' }, { type: 'null' }] }
      responses:
        '202':
          description: The node pool and its `node_pool.sync` operation.
          content:
            application/json:
              schema:
                type: object
                required: [node_pool, operation]
                properties:
                  node_pool: { $ref: '#/components/schemas/KubernetesNodePool' }
                  operation: { $ref: '#/components/schemas/Operation' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/PaymentRequired' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/QuotaExceeded' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        default: { $ref: '#/components/responses/Error' }
    delete:
      operationId: delete_kubernetes_node_pool
      tags: [kubernetes_cluster]
      summary: Delete a node pool
      description: Every node is cordoned and drained, then its server is deleted.
      x-ankra-permission: operate
      security:
        - apiToken: []
        - sessionCookie: []
          csrfHeader: []
      responses:
        '202': { $ref: '#/components/responses/OperationAccepted' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        default: { $ref: '#/components/responses/Error' }
  /v1/kubernetes-oidc/.well-known/openid-configuration:
    get:
      operationId: get_kubernetes_oidc_configuration
      tags: [kubernetes_cluster]
      summary: OpenID Connect discovery for the Kubernetes token issuer
      description: Every managed cluster's API server trusts this issuer for `get_kubernetes_cluster_token` tokens.
      security: []
      responses:
        '200':
          description: The discovery document.
          content:
            application/json:
              schema:
                type: object
                required: [issuer, jwks_uri, response_types_supported, subject_types_supported, id_token_signing_alg_values_supported]
                properties:
                  issuer: { type: string }
                  jwks_uri: { type: string }
                  response_types_supported: { type: array, items: { type: string } }
                  subject_types_supported: { type: array, items: { type: string } }
                  id_token_signing_alg_values_supported: { type: array, items: { type: string } }
                  claims_supported: { type: array, items: { type: string } }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
        default: { $ref: '#/components/responses/Error' }
  /v1/kubernetes-oidc/keys:
    get:
      operationId: get_kubernetes_oidc_keys
      tags: [kubernetes_cluster]
      summary: The Kubernetes token issuer's public keys (JWKS)
      security: []
      responses:
        '200':
          description: The JSON Web Key Set.
          content:
            application/json:
              schema:
                type: object
                required: [keys]
                properties:
                  keys:
                    type: array
                    items:
                      type: object
                      required: [kty, kid, use, alg]
                      properties:
                        kty: { type: string }
                        kid: { type: string }
                        use: { type: string }
                        alg: { type: string }
                        crv: { type: string }
                        x: { type: string }
                        y: { type: string }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
        default: { $ref: '#/components/responses/Error' }
  /v1/kubernetes-hosts:
    get:
      operationId: list_kubernetes_hosts
      tags: [kubernetes_cluster]
      x-ankra-operator-scope: read
      summary: List the regional host clusters that run tenant control planes (operator only)
      security:
        - operatorToken: []
      responses:
        '200':
          description: Every host cluster (`next_cursor` is always null).
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/KubernetesHost' } }
                  next_cursor: { type: 'null' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        default: { $ref: '#/components/responses/Error' }
  /v1/kubernetes-hosts/{id}:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    get:
      operationId: get_kubernetes_host
      tags: [kubernetes_cluster]
      x-ankra-operator-scope: read
      summary: Get a regional host cluster with its servers and the Ankra platform import it waits for (operator only)
      security:
        - operatorToken: []
      responses:
        '200':
          description: The host cluster.
          content:
            application/json:
              schema:
                type: object
                required: [kubernetes_host]
                properties:
                  kubernetes_host: { $ref: '#/components/schemas/KubernetesHost' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Error' }
  /v1/regions/{region}/kubernetes-host:
    parameters:
      - name: region
        in: path
        required: true
        schema: { type: string, examples: ['eu-central'] }
    post:
      operationId: bootstrap_region_kubernetes_host
      tags: [kubernetes_cluster]
      x-ankra-operator-scope: nodes
      summary: Bootstrap the region's host cluster for managed Kubernetes (operator only)
      description: >-
        Creates three control-plane servers and `workers` worker servers in the platform account, spread across the
        region's zones (and so its racks), installs Kubernetes with kubeadm through cloud-init behind an Ankra load
        balancer, Cilium, and the API credentials the Ankra CSI driver and cloud controller use. The host is then
        `awaiting_platform_import`: import it into the Ankra platform with the ImportCluster in
        `deploy/kubernetes-host/` (`ankra cluster apply`), which declares its stacks (the CSI driver, the cloud
        controller, cert-manager, the Flux helm-controller, metrics-server). It turns `ready` once those stacks are
        observed. One host per region.
      security:
        - operatorToken: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                control_plane_plan: { type: string, description: 'Defaults to premium-4c-8g.' }
                worker_plan: { type: string, description: 'Defaults to premium-4c-32g.' }
                workers: { type: integer, minimum: 3, maximum: 50, description: 'Defaults to 3.' }
      responses:
        '202':
          description: The host cluster and its `kubernetes_host.bootstrap` operation.
          content:
            application/json:
              schema:
                type: object
                required: [kubernetes_host, operation]
                properties:
                  kubernetes_host: { $ref: '#/components/schemas/KubernetesHost' }
                  operation: { $ref: '#/components/schemas/Operation' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
        default: { $ref: '#/components/responses/Error' }
  /mcp:
    post:
      operationId: send_mcp_message
      tags: [mcp]
      summary: Send one MCP JSON-RPC message as the API token
      description: |
        The customer MCP server (Streamable HTTP, stateless; docs/mcp.md). The body is one JSON-RPC 2.0 message;
        requests are answered with one JSON-RPC response, notifications and client responses with 202 and no body.
        Only an API token is accepted, a read-only one included: every tool call is dispatched to the REST route it
        names, which decides with the token's scope and its user's role. Rate limited per token (429). `GET /mcp`
        answers 405: the server opens no event stream.
      x-ankra-mcp: { exclude: true }
      security:
        - apiToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/JSONRPCMessage' }
      responses:
        '200':
          description: The JSON-RPC response; protocol errors are JSON-RPC errors.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JSONRPCResponse' }
        '400':
          description: A malformed message, a batch, or (revision 2026-07-28) a header that disagrees with the body.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JSONRPCResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: A browser request from another origin.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JSONRPCResponse' }
        '429':
          description: The token's MCP rate limit is spent; see Retry-After.
          headers:
            Retry-After:
              schema: { type: integer }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JSONRPCResponse' }
        default: { $ref: '#/components/responses/Error' }

  /operator/mcp:
    post:
      operationId: send_operator_mcp_message
      tags: [mcp]
      summary: Send one MCP JSON-RPC message as the operator token
      description: |
        The operator MCP server: the same protocol as `POST /mcp`, offering the operator operations (zones, nodes,
        cordon, drain, migrate, primary gateway). Connecting needs the `read` scope; every tool call is dispatched to
        its route, which checks the scope it needs.
      x-ankra-mcp: { exclude: true }
      x-ankra-operator-scope: read
      security:
        - operatorToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/JSONRPCMessage' }
      responses:
        '200':
          description: The JSON-RPC response; protocol errors are JSON-RPC errors.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JSONRPCResponse' }
        '400':
          description: A malformed message or a batch.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JSONRPCResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429':
          description: The token's MCP rate limit is spent; see Retry-After.
          headers:
            Retry-After:
              schema: { type: integer }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JSONRPCResponse' }
        default: { $ref: '#/components/responses/Error' }

  /internal/v1/nodes/register:
    post:
      operationId: register_node
      tags: [node]
      summary: A node agent registers with a one-time bootstrap token
      description: |
        Called by `ankra-node`, not by people. The body is a protobuf `ankra.node.v1.RegisterRequest`
        (`proto/ankra/node/v1/node.proto`) carrying the bootstrap token, the hostname, the requested roles and the
        inventory; the answer is a `RegisterResponse` with the node's certificate and its node bus settings. The token
        is the credential, so the route carries no other security.
      security: []
      requestBody:
        required: true
        content:
          application/x-protobuf:
            schema: { type: string, format: binary, description: 'ankra.node.v1.RegisterRequest' }
      responses:
        '200':
          description: Registered.
          content:
            application/x-protobuf:
              schema: { type: string, format: binary, description: 'ankra.node.v1.RegisterResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        default: { $ref: '#/components/responses/Error' }

  /internal/v1/nodes/renew:
    post:
      operationId: renew_node_certificate
      tags: [node]
      summary: A node agent renews its certificate
      description: |
        Called by `ankra-node` with its current node certificate as the TLS client certificate (or forwarded in
        `X-Forwarded-Client-Cert` by a peer in `ANKRA_CLOUD_CLIENT_CERTIFICATE_PROXIES`, which is empty by default and
        not implied by `ANKRA_CLOUD_TRUSTED_PROXIES`). The body is a protobuf `ankra.node.v1.RenewRequest` whose CSR is
        signed with the key of the presented certificate: renewal keeps the node's key, and a CSR for another key
        answers 400 and changes nothing. The answer is a `RenewResponse`. An expired or revoked certificate answers
        401 and the agent falls back to a bootstrap token.
      security:
        - nodeCertificate: []
      requestBody:
        required: true
        content:
          application/x-protobuf:
            schema: { type: string, format: binary, description: 'ankra.node.v1.RenewRequest' }
      responses:
        '200':
          description: Renewed.
          content:
            application/x-protobuf:
              schema: { type: string, format: binary, description: 'ankra.node.v1.RenewResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        default: { $ref: '#/components/responses/Error' }

  /internal/v1/node-agent-artifacts/{version}:
    parameters:
      - name: version
        in: path
        required: true
        schema: { type: string }
    get:
      operationId: get_node_agent_artifact
      tags: [host]
      summary: A node agent downloads the build its maintenance installs
      description: |
        Called by `ankra-node`, not by people, at the path its spec's `AgentUpgrade.url` names. It needs no
        credentials: the node installs the binary only when its SHA-256 equals `AgentUpgrade.sha256`, which reaches the
        node over its authenticated bus connection. `X-Ankra-Sha256` and `X-Ankra-Commit` repeat what the store holds.
      security: []
      responses:
        '200':
          description: The binary.
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Error' }

  /internal/v1/node-agent-artifacts/{version}/guest:
    parameters:
      - name: version
        in: path
        required: true
        schema: { type: string }
    get:
      operationId: get_node_agent_artifact_guest
      tags: [host]
      summary: A node agent downloads the guest binary of the build it installs
      description: |
        Called by `ankra-node`, not by people, at the path its spec's `AgentUpgrade.guest_url` names: the `ankra-guest`
        binary that belongs to the build, which compute nodes put into managed service VMs. The node installs it before
        it replaces its own binary. It needs no credentials: the node installs it only when its SHA-256 equals
        `AgentUpgrade.guest_sha256`, which reaches the node over its authenticated bus connection. `X-Ankra-Sha256` is
        the guest binary's digest and `X-Ankra-Commit` the build's commit. 404 for a build that carries no guest.
      security: []
      responses:
        '200':
          description: The binary.
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Error' }

  /v1/node-installer/{artifact}:
    parameters:
      - name: artifact
        in: path
        required: true
        description: '`ankra-node-<version>-linux-amd64`, where the version is a build of the artefact store.'
        schema: { type: string, examples: ['ankra-node-0.2.0-linux-amd64'] }
    get:
      operationId: get_node_installer
      tags: [host]
      summary: A fresh server downloads the ankra-node installer
      description: |
        The binary `ankra-cloud-api node join-token --agent-version <version>` tells a fresh Debian 13 server to
        download before it runs `ankra-node install` (ADR 0004). It needs no credentials: the join token carries the
        build's SHA-256, the printed command checks the download with `sha256sum -c`, and the installer refuses to
        install itself when its digest differs. `X-Ankra-Sha256` and `X-Ankra-Commit` repeat what the store holds.
      security: []
      responses:
        '200':
          description: The binary.
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Error' }

  /admin/v1/auth/login:
    post:
      operationId: log_in_staff
      tags: [admin]
      summary: Staff sign-in to the admin console
      description: |
        Sets `ankracloud_admin_session` (HttpOnly) and `ankracloud_admin_csrf`, scoped to the admin console's host.
        Limited to 5 attempts per client address per minute, with a lockout per email after repeated failures;
        refused outside `ANKRA_CLOUD_STAFF_ALLOWED_CIDRS` when that is set. Every attempt is recorded in the platform
        audit chain (`staff.login`, `staff.login_failed`); when it cannot be, the request fails.

        Staff MFA is enforced (every staff member by default): a right password opens no session. The answer is 200
        with `mfa_required: true`, `mfa_step` and a short-lived `challenge`; `verify` is completed by
        `POST /admin/v1/auth/login/mfa`, `enroll` (no authenticator yet, and only with an enrolment invite) by `POST /admin/v1/auth/login/mfa/enroll`
        and `.../enroll/confirm`, before any other admin route works. Recorded as `staff.login_mfa_required`. Without a
        secret key (`ANKRA_CLOUD_SECRET_KEY_FILE`) enforced staff cannot sign in (503).

        With `ANKRA_CLOUD_STAFF_PASSWORD_LOGIN=false` staff sign in with Ankra only: this route answers 403 ("staff sign
        in with Ankra") before reading the body, and `get_staff_identity_provider_status` reports `password_login: false`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StaffLoginRequest' }
      responses:
        '200':
          description: Signed in, or the password was right and the second factor is next.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/StaffSession'
                  - $ref: '#/components/schemas/SecondFactorChallenge'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
        default: { $ref: '#/components/responses/Error' }

  /admin/v1/auth/login/mfa:
    post:
      operationId: verify_staff_login_second_factor
      tags: [admin]
      summary: Finish a staff sign-in with a code or a recovery code
      description: >-
        Takes the staff `challenge` and exactly one of `code` and `recovery_code`, and sets the staff cookies like a
        sign-in without MFA. The same rate limit, lockout and allowed networks as the password step apply. Recorded as
        `staff.login` with `second factor: console_totp` (and `staff.mfa_recovery_code_used`), wrong codes as
        `staff.login_failed` (`mfa_failed`). With `ANKRA_CLOUD_STAFF_PASSWORD_LOGIN=false` a challenge a password
        sign-in issued is refused with 403; one from Sign in with Ankra is not.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SecondFactorLoginRequest' }
      responses:
        '200':
          description: Signed in.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StaffSecondFactorSession' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
        default: { $ref: '#/components/responses/Error' }

  /admin/v1/auth/login/mfa/enroll:
    post:
      operationId: start_staff_login_second_factor_setup
      tags: [admin]
      summary: Start the authenticator setup a staff member needs before their first session
      description: |
        With an `enroll` challenge and an open enrolment `invite` of that same staff member (minted by an admin with
        `POST /admin/v1/staff/{id}/enrollment-invites` or on the control plane host, and handed over out of band), a new
        TOTP secret, returned once as `secret` and `otpauth_uri`. Without an open invite of the member (none, unknown,
        expired, used, revoked or another member's) the answer is 403; the refusal is recorded as `staff.login_failed`
        (`mfa_failed`) and counts towards the member's lockout. The password alone never enrols an authenticator. With
        `ANKRA_CLOUD_STAFF_PASSWORD_LOGIN=false` a challenge a password sign-in issued is refused with 403.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StaffEnrollmentRequest' }
      responses:
        '200':
          description: The secret, shown once.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthenticatorSetup' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
        default: { $ref: '#/components/responses/Error' }

  /admin/v1/auth/login/mfa/enroll/confirm:
    post:
      operationId: finish_staff_login_second_factor_setup
      tags: [admin]
      summary: Activate the staff member's authenticator with its first code and sign in
      description: >-
        Needs the same open enrolment `invite` as the setup step (403 otherwise) and closes it: an invite sets up one
        authenticator. Returns the ten recovery codes once and sets the staff cookies. Recorded as `staff.mfa_enabled`
        and `staff.login`, and logged as an operator notification.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StaffEnrollmentConfirmRequest' }
      responses:
        '200':
          description: Signed in; keep the recovery codes.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StaffSecondFactorSession' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
        default: { $ref: '#/components/responses/Error' }

  /admin/v1/auth/logout:
    post:
      operationId: log_out_staff
      tags: [admin]
      summary: End the staff session
      description: Idempotent. Ending a live session needs the staff CSRF header; without a live session it only clears the cookies.
      security:
        - {}
        - staffSession: []
          staffCsrfHeader: []
      responses:
        '204': { description: Signed out; the staff cookies are cleared. }
        '403': { $ref: '#/components/responses/Forbidden' }
        default: { $ref: '#/components/responses/Error' }

  /admin/v1/auth/oidc:
    get:
      operationId: get_staff_identity_provider_status
      tags: [admin]
      summary: Whether staff may sign in with their Ankra account
      description: >-
        The staff sign-in page offers "Sign in with Ankra" when `enabled` is true (the `ankra` provider plus
        `ANKRA_CLOUD_STAFF_OIDC_REDIRECT_URL` are configured), and the email-and-password form only while
        `password_login` is true (`ANKRA_CLOUD_STAFF_PASSWORD_LOGIN`, default true).
      security: []
      responses:
        '200':
          description: The staff identity provider, if any.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [enabled, display_name, password_login]
                properties:
                  enabled: { type: boolean }
                  display_name: { type: [string, 'null'], examples: ['Ankra account'] }
                  password_login:
                    type: boolean
                    description: False when staff sign in with Ankra only; `log_in_staff` then answers 403.
        default: { $ref: '#/components/responses/Error' }

  /admin/v1/auth/oidc/login:
    get:
      operationId: start_staff_identity_provider_login
      tags: [admin]
      summary: Start a staff sign-in with the Ankra account
      description: |
        Answers 302 to the provider (authorization code flow with state, nonce and PKCE) and sets the signed,
        10-minute `ankracloud_admin_oidc` cookie the callback verifies. A client outside
        `ANKRA_CLOUD_STAFF_ALLOWED_CIDRS` is refused before anything leaves for the provider (recorded as
        `address_refused`, 302 back to `/admin/login?ankra_error=network`). 404 when not configured. Rate limited per
        client address. Not a browser-XHR endpoint: navigate to it.
      security: []
      parameters:
        - name: next
          in: query
          required: false
          schema: { type: string, examples: ['/admin/accounts'] }
          description: A path inside the staff console to land on afterwards; anything else becomes `/admin/accounts`.
      responses:
        '302': { description: 'Redirect to the provider, or back to the sign-in page with `ankra_error`.' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        default: { $ref: '#/components/responses/Error' }

  /admin/v1/auth/oidc/callback:
    get:
      operationId: finish_staff_identity_provider_login
      tags: [admin]
      summary: Finish a staff sign-in with the Ankra account
      description: |
        Verifies the provider's answer against the signed cookie and requires an email the provider verified. That
        email signs in the active staff member with exactly that address and nobody else: no staff member is created,
        and an unknown or disabled address is recorded and refused like a wrong password. The allowed networks and
        the per-email lockout apply. Staff MFA is still required. When the provider's verified ID token (never userinfo
        or this request's query) has an `amr` (RFC 8176) naming `mfa`, `otp`, `hwk` or `swk` and
        `ANKRA_CLOUD_STAFF_OIDC_TRUST_PROVIDER_MFA` is on (the default), the provider proved the second factor (for a
        staff member with MFA enforced, only once the console's authenticator is set up): the staff
        cookies are set and the browser goes to the console, recorded as `staff.login` with
        `second factor: provider_mfa:<amr values>` and the `acr`. Otherwise the console's second factor is due: the
        browser returns to `/admin/login#challenge=<token>&step=verify|enroll` and finishes with
        `verify_staff_login_second_factor` (or the enrolment routes with an invite). Refusals return to
        `/admin/login?ankra_error=<reason>` (`not_staff`, `unverified`, `expired`, `network`, `locked`, `provider`,
        `unavailable`). Every attempt is a staff login event.
      security: []
      parameters:
        - { name: state, in: query, required: false, schema: { type: string } }
        - { name: code, in: query, required: false, schema: { type: string } }
        - { name: error, in: query, required: false, schema: { type: string } }
        - { name: error_description, in: query, required: false, schema: { type: string } }
      responses:
        '302': { description: 'To the staff console (second factor or signed in), or back to the sign-in page with `ankra_error`.' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        default: { $ref: '#/components/responses/Error' }

  /admin/v1/auth/me:
    get:
      operationId: get_current_staff
      tags: [admin]
      summary: The signed-in staff member
      x-ankra-staff-role: support
      security:
        - staffSession: []
      responses:
        '200':
          description: The staff member and the CSRF token of the session.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StaffSession' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        default: { $ref: '#/components/responses/Error' }

  /admin/v1/auth/mfa:
    get:
      operationId: get_staff_mfa
      tags: [admin]
      summary: The signed-in staff member's second factor
      x-ankra-staff-role: support
      security:
        - staffSession: []
      responses:
        '200':
          description: The staff member's second factor.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StaffSecondFactorStatus' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
        default: { $ref: '#/components/responses/Error' }

  /admin/v1/auth/mfa/totp:
    post:
      operationId: start_staff_totp_setup
      tags: [admin]
      summary: Start setting up an authenticator app (staff without enforcement)
      description: Staff with MFA enforced set theirs up at sign-in; this is for staff without it. 409 while one is set up.
      x-ankra-staff-role: support
      security:
        - staffSession: []
          staffCsrfHeader: []
      responses:
        '200':
          description: The secret, shown once.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthenticatorSetup' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
        default: { $ref: '#/components/responses/Error' }
    delete:
      operationId: disable_staff_totp
      tags: [admin]
      summary: Turn the staff member's authenticator off (only without enforcement)
      description: Needs a current `code` or a `recovery_code`; refused (409) while MFA is enforced for the staff member. Recorded as `staff.mfa_disabled`.
      x-ankra-staff-role: support
      security:
        - staffSession: []
          staffCsrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SecondFactorProof' }
      responses:
        '204': { description: The authenticator and every recovery code are gone. }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        default: { $ref: '#/components/responses/Error' }

  /admin/v1/auth/mfa/totp/confirm:
    post:
      operationId: finish_staff_totp_setup
      tags: [admin]
      summary: Activate the staff member's authenticator with its first code
      description: Returns the ten recovery codes once. Recorded as `staff.mfa_enabled`.
      x-ankra-staff-role: support
      security:
        - staffSession: []
          staffCsrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AuthenticatorCodeRequest' }
      responses:
        '200':
          description: Active; keep the recovery codes.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RecoveryCodes' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        default: { $ref: '#/components/responses/Error' }

  /admin/v1/auth/mfa/recovery-codes:
    post:
      operationId: replace_staff_recovery_codes
      tags: [admin]
      summary: Replace the staff member's recovery codes
      description: Needs a current `code` or a `recovery_code`; ten new codes are returned once. Recorded as `staff.mfa_recovery_codes_regenerated`.
      x-ankra-staff-role: support
      security:
        - staffSession: []
          staffCsrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SecondFactorProof' }
      responses:
        '200':
          description: The new recovery codes.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RecoveryCodes' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        default: { $ref: '#/components/responses/Error' }

  /admin/v1/auth/password:
    put:
      operationId: change_staff_password
      tags: [admin]
      summary: Change the signed-in staff member's password
      description: |
        Needs the current password. The new one follows the password rules (12 to 1024 characters) and must differ
        from the current one. The member's other staff sessions end; this one stays, and the second factor is
        untouched. Attempts count against the staff sign-in limits (429 when exceeded). Recorded as
        `staff.password_changed`, a wrong current password as a denied `staff.password_change_failed`.
      x-ankra-staff-role: support
      security:
        - staffSession: []
          staffCsrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChangeStaffPasswordRequest' }
      responses:
        '204': { description: The password was changed. }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        default: { $ref: '#/components/responses/Error' }

  /admin/v1/accounts:
    get:
      operationId: search_accounts
      tags: [admin]
      summary: Find customer accounts by name or user email
      description: >-
        Ordered by account name, 50 per page. Every row carries its billing posture read from the database alone (never
        from Stripe): whether a payment method and a Stripe customer are on file, the credit left, a billing status, the
        servers and dev clusters it holds, its live trial dev cluster and its Ankra platform organisation.
      x-ankra-staff-role: support
      security:
        - staffSession: []
      parameters:
        - name: query
          in: query
          description: Part of the account's name or of a user's email; empty lists every account.
          schema: { type: string }
        - name: attention
          in: query
          description: >-
            Lists only the accounts staff should look at: `no_card_with_resources` (no payment method on file but holds
            servers the meter charges, so nothing can be charged once its credit runs out), `suspended` (for payment or
            by staff) or `trial_running` (holds a live trial dev cluster). Empty lists every account.
          schema:
            type: string
            enum: ['', no_card_with_resources, suspended, trial_running]
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: One page of accounts.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StaffAccountSummaryList' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        default: { $ref: '#/components/responses/Error' }

  /admin/v1/accounts/{id}:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    get:
      operationId: get_account
      tags: [admin]
      summary: An account with its users and servers
      description: >-
        The account, its support access setting, its users and its servers (managed service VMs included). The read
        is written to the customer's audit log (`staff.read`) first; when it cannot be, nothing is shown.
      x-ankra-staff-role: support
      security:
        - staffSession: []
      responses:
        '200':
          description: The account.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StaffAccountDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Error' }

  /admin/v1/accounts/{id}/usage:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    get:
      operationId: get_account_usage
      tags: [admin]
      summary: An account's usage this month
      description: The same summary the customer sees at `GET /v1/usage/summary`; the read is written to the customer's audit log.
      x-ankra-staff-role: support
      security:
        - staffSession: []
      responses:
        '200':
          description: The usage summary.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UsageSummary' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Error' }

  /admin/v1/accounts/{id}/support-sessions:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    post:
      operationId: open_support_session
      tags: [admin]
      summary: Open a support session acting as one of the account's users
      description: |
        A read-only session by default. An `elevated` session needs the admin staff role and, unless the account's
        support access is `always_allowed`, a consent code the customer created in Settings, Support. The answer
        carries a one-time handoff code; the staff browser opens `redirect` on the customer portal, which redeems it
        with `POST /v1/auth/support-handoff`. The session and its audit event are stored together.
      x-ankra-staff-role: support
      security:
        - staffSession: []
          staffCsrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OpenSupportSessionRequest' }
      responses:
        '200':
          description: The session is open; redeem the handoff code on the portal.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OpenedSupportSession' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Error' }

  /admin/v1/accounts/{id}/quotas:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    put:
      operationId: replace_account_quotas
      tags: [quota]
      summary: Change an account's quotas (admin staff)
      description: Fields left out keep their value. The change is written to the customer's audit log.
      x-ankra-staff-role: admin
      security:
        - staffSession: []
          staffCsrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/QuotaChange' }
      responses:
        '200':
          description: The account's quotas and usage afterwards.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Quota' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Error' }

  /admin/v1/accounts/{id}/credits:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    get:
      operationId: list_account_credits_for_staff
      tags: [coupon]
      summary: An account's credits and balance
      description: >-
        The same page the customer sees at `GET /v1/account/credits`. The first page's read is written to the
        customer's audit log (`staff.read`); when it cannot be, nothing is shown.
      x-ankra-staff-role: support
      security:
        - staffSession: []
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: One page of credits with the live balance.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CreditList' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Error' }
    post:
      operationId: grant_account_credit
      tags: [coupon]
      summary: Grant an account credit (admin staff)
      description: |
        A credit with source `staff` that the account's invoices spend like a coupon's, soonest expiring first. It
        pays for usage inside [`valid_from`, expiry): a past `valid_from` covers usage already metered (a goodwill
        credit for last month's outage). Give exactly one of `expires_at` and `validity_days` (counted from
        `valid_from`); the expiry must be in the future. At most EUR 100 000 per grant. The credit and its audit event
        (`billing.credit.grant`, in the customer's audit log) are stored together.
      x-ankra-staff-role: admin
      security:
        - staffSession: []
          staffCsrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GrantCreditRequest' }
      responses:
        '201':
          description: The credit.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Credit' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Error' }

  /admin/v1/accounts/{id}/credits/{credit}/void:
    parameters:
      - $ref: '#/components/parameters/IdPath'
      - name: credit
        in: path
        required: true
        description: The credit's id.
        schema: { type: string }
    post:
      operationId: void_account_credit
      tags: [coupon]
      summary: Void an account credit (admin staff)
      description: >-
        What the credit has left is never spent again; what invoices already took stays taken. Voiding a voided
        credit keeps its first voiding time. Written to the customer's audit log (`billing.credit.void`) with the
        reason, in the same transaction.
      x-ankra-staff-role: admin
      security:
        - staffSession: []
          staffCsrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [reason]
              properties:
                reason: { type: string, minLength: 1, maxLength: 500 }
      responses:
        '200':
          description: The voided credit.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Credit' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Error' }

  /admin/v1/audit:
    get:
      operationId: list_account_audit_for_staff
      tags: [admin]
      summary: An account's audit log
      description: 100 events per page, newest first. The first page's read is written to that same audit log.
      x-ankra-staff-role: support
      security:
        - staffSession: []
      parameters:
        - name: account_id
          in: query
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: One page of audit entries.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuditEntryList' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Error' }

  /admin/v1/staff:
    get:
      operationId: list_staff
      tags: [admin]
      summary: Every staff member, active or disabled (admin staff)
      x-ankra-staff-role: admin
      security:
        - staffSession: []
      responses:
        '200':
          description: The staff members, oldest first.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StaffList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        default: { $ref: '#/components/responses/Error' }
    post:
      operationId: create_staff
      tags: [admin]
      summary: Add a staff member (admin staff)
      description: Without a password one is generated and returned once in `password`. Without a role the member is support staff.
      x-ankra-staff-role: admin
      security:
        - staffSession: []
          staffCsrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateStaffRequest' }
      responses:
        '201':
          description: The staff member.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CreatedStaff' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        default: { $ref: '#/components/responses/Error' }

  /admin/v1/staff/{id}:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    patch:
      operationId: update_staff
      tags: [admin]
      summary: Change a staff member's role or name (admin staff)
      description: |
        Staff cannot change their own role (409), so the console always keeps the admin who made a change. The
        member's open sessions carry the new role from their next request. The change and its platform audit event
        (`staff.update`) are stored together; a change to what the member already has records nothing. On the
        control plane host `ankra-cloud-api staff set-role` does the same, for the first admin.
      x-ankra-staff-role: admin
      security:
        - staffSession: []
          staffCsrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateStaffRequest' }
      responses:
        '200':
          description: The staff member afterwards.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StaffEnvelope' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        default: { $ref: '#/components/responses/Error' }
    delete:
      operationId: disable_staff
      tags: [admin]
      summary: Disable a staff member (admin staff)
      description: No sign-in, and every staff and support session the member holds ends at once. Staff cannot disable themselves (409).
      x-ankra-staff-role: admin
      security:
        - staffSession: []
          staffCsrfHeader: []
      responses:
        '200':
          description: The disabled staff member.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StaffEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        default: { $ref: '#/components/responses/Error' }

  /admin/v1/staff/{id}/password:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    post:
      operationId: reset_staff_password
      tags: [admin]
      summary: Reset another staff member's password (admin staff)
      description: |
        Generates a new password and returns it once in `password`; it is never stored in plaintext or logged. Every
        staff session of the member ends; their second factor stays. The reason is recorded with the platform audit
        event (`staff.password_reset`). Admins change their own password with `PUT /admin/v1/auth/password` (409
        here). On the control plane host `ankra-cloud-api staff set-password` does the same.
      x-ankra-staff-role: admin
      security:
        - staffSession: []
          staffCsrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ResetStaffPasswordRequest' }
      responses:
        '200':
          description: The staff member and their new password, shown once.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ResetStaffPassword' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        default: { $ref: '#/components/responses/Error' }

  /admin/v1/staff/{id}/enrollment-invites:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    post:
      operationId: create_staff_enrollment_invite
      tags: [admin]
      summary: Mint a one-time second-factor enrolment link for a staff member (admin staff)
      description: |
        For an active staff member without an authenticator: a link to the admin console's `/admin/enroll` page with
        the invite in the fragment, shown once. Send it to the staff member out of band; with it and their password
        they set up their authenticator at sign-in. It is open for 72 hours and sets up one authenticator; minting
        another revokes the member's earlier open ones. 409 when the member has an authenticator already, 404 for an
        unknown or disabled member. Recorded as `staff.mfa_invite_issued`. On the control plane host
        `ankra-cloud-api staff invite`, `staff create` and `staff reset-mfa` print one too.
      x-ankra-staff-role: admin
      security:
        - staffSession: []
          staffCsrfHeader: []
      responses:
        '201':
          description: The link, shown once.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StaffEnrollmentInvite' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        default: { $ref: '#/components/responses/Error' }

  /admin/v1/accounts/{id}/organisation:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    delete:
      operationId: unlink_account_organisation
      tags: [organisation]
      summary: Unlink an account from its Ankra organisation (admin staff)
      description: >-
        Members who reached the account only through the organisation lose access at once and their API tokens in it
        are revoked; the account's own owner and members and the owner seat's holder keep theirs, and the account keeps
        its resources and billing. A reason of at least 10 characters is required. Audited as `organisation.unlinked`.
      x-ankra-staff-role: admin
      security:
        - staffSession: []
          staffCsrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [reason]
              properties:
                reason: { type: string, minLength: 10, maxLength: 1000 }
      responses:
        '200':
          description: The link that was removed.
          content:
            application/json:
              schema:
                type: object
                required: [link]
                properties:
                  link: { $ref: '#/components/schemas/OrganisationLink' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        default: { $ref: '#/components/responses/Error' }

  /admin/v1/coupons:
