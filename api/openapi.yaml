          staffCsrfHeader: []
      responses:
        '200':
          description: The coupon afterwards.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Coupon' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Error' }

  /admin/v1/regions:
    get:
      operationId: list_infrastructure_regions
      tags: [infrastructure]
      summary: Every region with every zone, hidden ones included (staff)
      description: The operator's region list (`list_regions` with the operator token), for the admin console.
      x-ankra-staff-role: support
      security:
        - staffSession: []
      responses:
        '200':
          description: Every region (`next_cursor` is always null).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RegionList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        default: { $ref: '#/components/responses/Error' }
    post:
      operationId: create_region
      tags: [infrastructure]
      summary: Create a region (admin staff)
      description: >-
        What `ankra-cloud-api region create` does. The country is upper-cased; the control plane endpoint is an https URL,
        or empty while the global control plane serves the region. Recorded in the platform audit chain (`region.create`).
      x-ankra-staff-role: admin
      security:
        - staffSession: []
          staffCsrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateRegionRequest' }
      responses:
        '201':
          description: The new region.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RegionEnvelope' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422':
          description: The name, display name, country or endpoint is malformed.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        default: { $ref: '#/components/responses/Error' }

  /admin/v1/regions/{region}:
    parameters:
      - name: region
        in: path
        required: true
        schema: { type: string, examples: ['eu-central'] }
    patch:
      operationId: update_region
      tags: [infrastructure]
      summary: Change a region's display name, country or control plane endpoint (admin staff)
      description: >-
        Absent fields stay as they are; the name never changes. What `ankra-cloud-api region update` does. Recorded in the
        platform audit chain (`region.update`).
      x-ankra-staff-role: admin
      security:
        - staffSession: []
          staffCsrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateRegionRequest' }
      responses:
        '200':
          description: The region afterwards, with its zones.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RegionEnvelope' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422':
          description: Nothing to change, or a malformed value.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        default: { $ref: '#/components/responses/Error' }

  /admin/v1/zones:
    get:
      operationId: list_infrastructure_zones
      tags: [infrastructure]
      summary: Every zone, hidden ones included, with how its hosts join and its gateways route (staff)
      description: >-
        The operator's zone list (`list_zones` with the operator token), in listing order, for the admin console, with
        what only staff see: the public uplink, the autonomous system every join token for the zone carries and the
        NAT64 egress addresses recorded on the zone.
      x-ankra-staff-role: support
      security:
        - staffSession: []
      responses:
        '200':
          description: Every zone (`next_cursor` is always null).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StaffZoneList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        default: { $ref: '#/components/responses/Error' }
    post:
      operationId: create_zone
      tags: [infrastructure]
      summary: Create a zone in a region (admin staff)
      description: >-
        What `ankra-cloud-api zone create` does. `position` and `customer_visible`, when given, set the new zone's listing;
        otherwise it is listed at position 100 and visible to customers. `autonomous_system` and `nat64_egress_addresses`
        are recorded on the zone, `underlay: wireguard` switches it to the WireGuard mesh and `public_uplink:
        provider_native` sets its uplink; a zone starts on the physical fabric with a bgp uplink otherwise. The whole body
        is checked before the zone is created. Recorded in the platform audit chain (`zone.create`, then `zone.update`
        for the listing, `zone.set_networking`, `zone.set_underlay` and `zone.set_public_uplink` for what the body sets).
      x-ankra-staff-role: admin
      security:
        - staffSession: []
          staffCsrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateZoneRequest' }
      responses:
        '201':
          description: The new zone.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StaffZoneEnvelope' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: The zone exists, or a NAT64 egress address is another zone's.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422':
          description: >-
            A malformed name (`de-fsn1`), a missing display name, an unknown region, a listing out of range, a public ASN,
            a NAT64 egress address that is no public IPv4 address, or an unknown underlay or uplink.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        default: { $ref: '#/components/responses/Error' }

  /admin/v1/zones/{zone}:
    parameters:
      - $ref: '#/components/parameters/ZonePath'
    patch:
      operationId: update_zone
      tags: [infrastructure]
      summary: Change a zone's listing, autonomous system or NAT64 settings (admin staff)
      description: >-
        Absent fields stay as they are. A zone that is not `customer_visible` is left out of customers' zone lists and
        refuses their new resources, unless the account may use hidden zones. `autonomous_system` is the private ASN every
        later join token for the zone carries (hosts already joined keep theirs); `nat64_egress_addresses` replace the
        zone's `ANKRA_CLOUD_ZONE_NAT64_EGRESS_ADDRESSES` entry and republish its gateways, and an empty list hands the
        zone's NAT64 back to that environment variable; `nat64_ports_per_client` replaces
        `ANKRA_CLOUD_ZONE_NAT64_PORTS_PER_CLIENT` for the zone and 0 hands it back. What `ankra-cloud-api zone update`
        and `zone set-networking` do.
        Recorded in the platform audit chain (`zone.update` for the listing, `zone.set_networking` for the rest).
        Making a hidden zone `customer_visible` answers 409 while the zone keeps one copy of every volume
        (`storage_durability: single_copy`) and no backup vault outside the zone holds their backups (`offsite_backups:
        false` in its capabilities): create the region's backup vault first, or set `allow_single_copy_without_vault` with
        an `override_reason`.
      x-ankra-staff-role: admin
      security:
        - staffSession: []
          staffCsrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateZoneRequest' }
      responses:
        '200':
          description: The zone afterwards.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StaffZoneEnvelope' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: >-
            A NAT64 egress address is another zone's, or the zone keeps one copy of every volume and has no backup vault
            outside the zone, so it cannot be made visible to customers without the override.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422':
          description: >-
            Nothing to change, a position out of range, an empty display name, a public ASN, a NAT64 egress address that
            is no public IPv4 address, NAT64 ports per client out of range, or a single-copy override without a reason of
            10 to 500 characters or without `customer_visible: true`.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        default: { $ref: '#/components/responses/Error' }

  /admin/v1/zones/{zone}/underlay:
    parameters:
      - $ref: '#/components/parameters/ZonePath'
    get:
      operationId: get_infrastructure_zone_underlay
      tags: [infrastructure]
      summary: Read a zone's underlay, its WireGuard mesh and the measured latency budget (staff)
      description: The operator's `get_zone_underlay`, read-only, for the admin console.
      x-ankra-staff-role: support
      security:
        - staffSession: []
      responses:
        '200':
          description: The zone's underlay.
          content:
            application/json:
              schema:
                type: object
                required: [underlay]
                properties:
                  underlay: { $ref: '#/components/schemas/UnderlayMesh' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Error' }
    put:
      operationId: set_infrastructure_zone_underlay
      tags: [infrastructure]
      summary: Switch a zone between its physical fabric and the WireGuard mesh (admin staff)
      description: >-
        The operator's `set_zone_underlay` for the admin console: `wireguard` gives the zone its underlay prefixes
        (10.40.<index>.0/24 and 10.41.<index>.0/24) and republishes every node, which meets every other node over a full
        WireGuard mesh; servers added with the wireguard underlay need it. Going back to `fabric` is refused (409) while a
        node joined over WireGuard is in the zone. Recorded in the platform audit chain (`zone.set_underlay`).
      x-ankra-staff-role: admin
      security:
        - staffSession: []
          staffCsrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SetZoneUnderlayRequest' }
      responses:
        '200':
          description: The zone after the change.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StaffZoneEnvelope' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Nodes of the zone joined over the WireGuard underlay, so it cannot go back to its fabric.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422':
          description: The underlay is neither fabric nor wireguard.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        default: { $ref: '#/components/responses/Error' }

  /admin/v1/zones/{zone}/retire:
    parameters:
      - $ref: '#/components/parameters/ZonePath'
    post:
      operationId: retire_zone
      tags: [infrastructure]
      summary: Retire a zone (admin staff)
      description: >-
        The zone leaves the offering for good: no account sees it or places new resources in it, hidden zone access and
        private hosts included, and the control plane's zone retirement loop force-releases every customer server left in
        it (the VM goes, its storages stay detached). A zone that runs customer servers is refused (409) unless
        `release_servers` accepts that. Retiring a retired zone changes nothing. What `ankra-cloud-api zone retire` does;
        recorded in the platform audit chain (`zone.retire`) with the reason.
      x-ankra-staff-role: admin
      security:
        - staffSession: []
          staffCsrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RetireZoneRequest' }
      responses:
        '200':
          description: The zone afterwards.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ZoneRetirementOutcome' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: The zone runs customer servers and `release_servers` is not set.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422':
          description: The reason is missing, shorter than 10 or longer than 500 characters, or spans lines.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        default: { $ref: '#/components/responses/Error' }

  /admin/v1/zones/{zone}/unretire:
    parameters:
      - $ref: '#/components/parameters/ZonePath'
    post:
      operationId: unretire_zone
      tags: [infrastructure]
      summary: Return a retired zone to service (admin staff)
      description: >-
        Clears the zone's retirement. The zone stays hidden from customers until staff list it again (`customer_visible`
        on `update_zone`); accounts with hidden zone access or private hosts there see it at once. Unretiring a zone in
        service changes nothing. What `ankra-cloud-api zone unretire` does; recorded in the platform audit chain
        (`zone.unretire`) with the reason.
      x-ankra-staff-role: admin
      security:
        - staffSession: []
          staffCsrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UnretireZoneRequest' }
      responses:
        '200':
          description: The zone afterwards.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ZoneRetirementOutcome' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422':
          description: The reason is missing, shorter than 10 or longer than 500 characters, or spans lines.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        default: { $ref: '#/components/responses/Error' }

  /admin/v1/zones/{zone}/ip-pools:
    parameters:
      - $ref: '#/components/parameters/ZonePath'
    get:
      operationId: list_ip_pools
      tags: [infrastructure]
      summary: A zone's public IP pools (staff)
      description: Ordered by family, age and network, at most 1000.
      x-ankra-staff-role: support
      security:
        - staffSession: []
      responses:
        '200':
          description: The zone's public pools (`next_cursor` is always null).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IPPoolList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Error' }
    post:
      operationId: create_ip_pool
      tags: [infrastructure]
      summary: Register a zone's routed public address range (admin staff)
      description: >-
        What `ankra-cloud-api ip-pool create` does. An IPv6 pool is a /44 to a /60 delegating one /64 per server from
        its second /64 on, or (with `node`) the provider /64 of a gateway of a provider_native zone delegating one /80 per
        server from its second /80 on; an IPv4 pool hands out addresses between `first_address` and `last_address`. An
        IPv4 network with `node` is a host-attached pool: the addresses a provider delivers to that gateway's host with
        its dedicated server, a /24 to a /32 under either uplink, each handed to one server as a /32 that the gateway
        routes to it; `gateway`, `first_address` and `last_address` may be left out. A
        pool the zone has already is left as it is and answered with 200. Either way the zone's gateways are republished
        (a `public_pool.sync` operation). Recorded in the platform audit chain (`ip_pool.create`).
      x-ankra-staff-role: admin
      security:
        - staffSession: []
          staffCsrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateIPPoolRequest' }
      responses:
        '200':
          description: The zone had the pool already; it is unchanged and its gateways were republished.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IPPoolEnvelope' }
        '201':
          description: The new pool.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IPPoolEnvelope' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422':
          description: >-
            A malformed prefix or address, an address outside the prefix, no nameserver, a geometry the platform does not
            delegate, or a `node` that is unknown, no gateway, in a zone whose uplink is not provider_native, or does not
            hold the /64; for a host-attached IPv4 pool, a `node` that is no gateway or holds one of the addresses on its
            own interfaces.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        default: { $ref: '#/components/responses/Error' }

  /admin/v1/zones/{zone}/public-uplink:
    parameters:
      - $ref: '#/components/parameters/ZonePath'
    put:
      operationId: set_zone_public_uplink
      tags: [infrastructure]
      summary: Set how a zone's gateways reach the internet (admin staff)
      description: >-
        bgp (every zone's default) or provider_native (ADR 0008: one gateway holds the provider /64 on-link on its public
        interface, which stays in the default VRF, and answers neighbour discovery for its servers; no BGP upstream).
        What `ankra-cloud-api zone set-public-uplink` does; the zone's gateways are republished. Leaving provider_native
        is refused while a host-scoped pool of the zone is active. Recorded in the platform audit chain
        (`zone.set_public_uplink`).
      x-ankra-staff-role: admin
      security:
        - staffSession: []
          staffCsrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SetPublicUplinkRequest' }
      responses:
        '200':
          description: The zone's public uplink afterwards.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublicUplink' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422':
          description: The mode is neither bgp nor provider_native.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        default: { $ref: '#/components/responses/Error' }

  /admin/v1/zones/{zone}/ip-pools/{id}/state:
    parameters:
      - $ref: '#/components/parameters/ZonePath'
      - $ref: '#/components/parameters/IdPath'
    put:
      operationId: set_ip_pool_state
      tags: [infrastructure]
      summary: Make a public IP pool active or draining (admin staff)
      description: >-
        A draining pool keeps what it delegated and delegates nothing new: new servers take the zone's newest active IPv6
        pool. What `ankra-cloud-api ip-pool set-state` does; the zone's gateways are republished. Recorded in the platform
        audit chain (`ip_pool.set_state`).
      x-ankra-staff-role: admin
      security:
        - staffSession: []
          staffCsrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SetIPPoolStateRequest' }
      responses:
        '200':
          description: The pool afterwards.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IPPoolEnvelope' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422':
          description: The state is not active or draining.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        default: { $ref: '#/components/responses/Error' }

  /admin/v1/platform-audit:
    get:
      operationId: list_platform_audit
      tags: [platform_audit]
      summary: The platform audit log, newest first (staff)
      description: >-
        The platform hash chain: every staff, operator and platform action that belongs to no customer account (servers
        added and offered, nodes cordoned or given a rack, scrape credentials minted, staff signing in). A page holds up
        to `limit` events (100 by default, at most 200); `next_cursor` continues it.
      x-ankra-staff-role: support
      security:
        - staffSession: []
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 200, default: 100 }
      responses:
        '200':
          description: A page of the platform audit log.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuditEntryList' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        default: { $ref: '#/components/responses/Error' }

  /admin/v1/zones/{zone}/racks:
    parameters:
      - name: zone
        in: path
        required: true
        schema: { type: string }
    get:
      operationId: list_zone_racks_for_staff
      tags: [fleet]
      summary: A zone's racks with how many nodes each holds (staff)
      x-ankra-staff-role: support
      security:
        - staffSession: []
      responses:
        '200':
          description: The zone's racks.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RackList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Error' }
    post:
      operationId: create_zone_rack_for_staff
      tags: [fleet]
      summary: Add a rack to a zone (admin staff)
      description: Rack spread in server groups keeps members apart by it. Recorded in the platform audit chain (`rack.create`).
      x-ankra-staff-role: admin
      security:
        - staffSession: []
          staffCsrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name]
              properties:
                name: { type: string, examples: ['r01'] }
      responses:
        '201':
          description: The rack.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RackEnvelope' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422':
          description: A rack name that is not lower-case letters, digits and dashes.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        default: { $ref: '#/components/responses/Error' }

  /admin/v1/fleet/nodes/{id}/storage-policy:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    put:
      operationId: set_fleet_node_storage_policy
      tags: [fleet]
      summary: Set what a storage node's disks serve, then start the zone's storage policy (admin staff)
      description: >-
        ankra-local keeps the node's disks to Ankra Local and never gives it an OSD; ceph gives its data disks to the zone's
        replicated storage; both keeps its Ankra Local pool and carves one logical volume of `ceph_volume_gibibytes` GiB
        (10 to 262144) from its volume group for its only OSD, thick when the group has free extents for it and thin in
        the Ankra Local pool otherwise (the pool's volumes then never overcommit it). The zone's storage.rebalance_policy
        starts so the replicated storage counts and configures the node as the policy now says. A change that would strand
        data, taking a node that carries OSDs off them, moving its OSDs between its data disks and its Ankra Storage volume
        or resizing that volume, is refused with 409 until the host's OSDs are drained. Recorded in the platform audit chain
        (`node.storage_policy.set`).
      x-ankra-staff-role: admin
      security:
        - staffSession: []
          staffCsrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [policy]
              properties:
                policy: { type: string, enum: [ankra-local, ceph, both] }
                ceph_volume_gibibytes: { type: [integer, 'null'], description: The size of the node's Ankra Storage volume; set exactly with the policy both. }
      responses:
        '200':
          description: The node with its new policy, and the operation that applies it.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NodeStoragePolicyChange' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: The node carries OSDs the change would strand; drain the host's OSDs first.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422':
          description: An unknown policy, a volume size outside 10 to 262144 GiB or one without the policy both, or a node without the storage role.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        default: { $ref: '#/components/responses/Error' }
  /admin/v1/fleet/nodes/{id}/storage-drain:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    post:
      operationId: drain_fleet_node_storage
      tags: [fleet]
      summary: Drain a storage node's OSDs from the zone's replicated storage (admin staff)
      description: >-
        Starts storage.drain_host. Its storage policy becomes ankra-local, so the policy never gives it an OSD again. Its
        OSDs are marked out and removed once Ceph says their data is safe on the other hosts. The orchestrator drains and
        forgets the host, its Ankra Storage volume is removed, and the replication converges again. Refused with 409 when
        the hosts with OSDs left without it would not hold the pools' size (as the policy last recorded them; the
        operation checks the live cluster again before it changes anything), when the zone's replicated storage is not
        active, or while the node runs another operation. Recorded in the platform audit chain (`node.storage_drain`).
      x-ankra-staff-role: admin
      security:
        - staffSession: []
          staffCsrfHeader: []
      responses:
        '202':
          description: The storage.drain_host operation.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OperationEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: The remaining hosts with OSDs would not hold the pools' size, the replicated storage is not active, or the node runs another operation.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422':
          description: The node has no storage role.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        default: { $ref: '#/components/responses/Error' }
  /admin/v1/agent-rollouts/{id}/promote:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    post:
      operationId: promote_agent_rollout
      tags: [agent_rollout]
      summary: Continue a rollout that awaits promotion without waiting for the soak (admin staff)
      description: >-
        A rollout that is `awaiting_promotion` after a zone's canaries took the build becomes `running` again at once and
        takes the zone's other nodes; the zone is added to `promoted_zones`. It is the decision of the staff member who
        looked at the canaries: nothing about their health is checked. Without it the rollout promotes itself at
        `awaiting_promotion.auto_promote_at` while the canaries are healthy. 409 for a rollout that does not await
        promotion. Recorded in the platform audit chain (`agent_rollout.promote`).
      x-ankra-staff-role: admin
      security:
        - staffSession: []
          staffCsrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StaffNodeActionRequest' }
      responses:
        '200':
          description: The promoted rollout.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AgentRolloutEnvelope' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422':
          description: A missing or malformed reason.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        default: { $ref: '#/components/responses/Error' }

  /admin/v1/fleet/nodes/{id}/rollout-canary:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    put:
      operationId: set_node_rollout_canary
      tags: [agent_rollout]
      summary: Mark a node as one of its zone's rollout canaries, or clear the mark (admin staff)
      description: >-
        A fleet rollout of an agent build takes a zone's canaries before every other node of the zone and waits for them
        to prove the build (`start_agent_rollout`); a zone without a canary is refused. The node's zone is found from its
        id. A rollout reads the marks when it starts: changing one does not move a node inside a rollout that is already
        active. Pick a node whose restart costs least, a compute or control node before a gateway or a storage node.
        Recorded in the platform audit chain (`node.rollout_canary.set`).
      x-ankra-staff-role: admin
      security:
        - staffSession: []
          staffCsrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [canary]
              properties:
                canary: { type: boolean, description: 'true marks the node as a canary of its zone; false clears the mark.' }
      responses:
        '200':
          description: The node with its mark.
          content:
            application/json:
              schema:
                type: object
                required: [node]
                properties:
                  node:
                    type: object
                    required: [id, hostname, zone, roles, rollout_canary]
                    properties:
                      id: { type: string }
                      hostname: { type: string }
                      zone: { type: string }
                      roles: { type: array, items: { type: string } }
                      rollout_canary: { type: boolean }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422':
          description: The body names no `canary`.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        default: { $ref: '#/components/responses/Error' }

  /admin/v1/fleet/nodes/{id}/rack:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    put:
      operationId: set_fleet_node_rack
      tags: [fleet]
      summary: Put a node in one of its zone's racks, or take it out (admin staff)
      description: >-
        The node's zone is found from its id. Placement reads the rack at the next scheduling decision; running servers stay
        where they are. Recorded in the platform audit chain (`node.rack.set`).
      x-ankra-staff-role: admin
      security:
        - staffSession: []
          staffCsrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [rack]
              properties:
                rack: { type: [string, 'null'], description: The rack's name; null or empty takes the node out of its rack. }
      responses:
        '200':
          description: The node.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FleetNodeDetail' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422':
          description: A rack the node's zone does not have, or a malformed name.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        default: { $ref: '#/components/responses/Error' }

  /admin/v1/fleet/nodes/{id}/servers:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    get:
      operationId: list_fleet_node_servers
      tags: [fleet]
      summary: The servers placed on a node, largest first (staff)
      description: >-
        Each server's account, size, lifecycle and the managed service it runs for, never its hostname, title or anything the
        customer put in it. At most 500; `truncated` says when there are more.
      x-ankra-staff-role: support
      security:
        - staffSession: []
      responses:
        '200':
          description: The node's servers.
          content:
            application/json:
              schema:
                type: object
                required: [items, truncated]
                properties:
                  truncated: { type: boolean }
                  items:
                    type: array
                    items:
                      type: object
                      required: [id, account, cores, memory_mebibytes, lifecycle, managed_by]
                      properties:
                        id: { type: string }
                        account:
                          type: object
                          required: [id, name]
                          properties:
                            id: { type: string }
                            name: { type: string }
                        cores: { type: integer, minimum: 0 }
                        memory_mebibytes: { type: integer, minimum: 0 }
                        lifecycle: { type: string }
                        managed_by: { type: [string, 'null'] }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Error' }

  /admin/v1/fleet/servers:
    get:
      operationId: list_fleet_servers
      tags: [fleet]
      summary: Every live server across the fleet, newest first (staff)
      description: >-
        One page of the servers of every account in every zone, deleted ones left out: each server's account, size,
        lifecycle, zone, the node it is placed on (null while it has none), when it was created and the managed service it
        runs for, never its hostname, title or anything the customer put in it. Narrow it with `zone`, `account_id` and
        `query`; `query` matches the account's name or one of its users' emails, or names a server or an account by
        identifier.
      x-ankra-staff-role: support
      security:
        - staffSession: []
      parameters:
        - name: zone
          in: query
          description: Only servers in this zone.
          schema: { type: string }
        - name: account_id
          in: query
          description: Only servers of this account.
          schema: { type: string }
        - name: query
          in: query
          description: The account's name or a user's email (case-insensitive, anywhere in it), or a server or account identifier.
          schema: { type: string }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: One page of the fleet's servers.
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  next_cursor: { type: [string, 'null'] }
                  items:
                    type: array
                    items:
                      type: object
                      required: [id, account, cores, memory_mebibytes, lifecycle, managed_by, zone, node, created_at]
                      properties:
                        id: { type: string }
                        account:
                          type: object
                          required: [id, name]
                          properties:
                            id: { type: string }
                            name: { type: string }
                        cores: { type: integer, minimum: 0 }
                        memory_mebibytes: { type: integer, minimum: 0 }
                        lifecycle: { type: string }
                        managed_by: { type: [string, 'null'] }
                        zone: { type: string }
                        node:
                          type: [object, 'null']
                          required: [id, hostname]
                          properties:
                            id: { type: string }
                            hostname: { type: string }
                        created_at: { type: string, format: date-time }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        default: { $ref: '#/components/responses/Error' }

  /v1/monitoring/targets:
    get:
      operationId: list_monitoring_targets
      tags: [monitoring]
      summary: Prometheus HTTP service discovery of the API, the node agents and Ceph (operator)
      description: |
        The answer is Prometheus HTTP service discovery: one group per node with `targets` (`host:port`) and `labels`
        (`region`, `zone`, `node`, `hostname`, `roles`, `allocation`, and `rack`, `datacenter`, `account` when set).
        `ankra-cloud-api` lists the control hosts on 8443, `ankra-node` every compute and gateway node's agent on 9101,
        `ceph` every storage node's mgr on 9283, `node` every control host's node_exporter on 9100 and `ankra-cloud-db-supervisor` every control host's database supervisor on 9188 when there are 3 or more. A node is listed at its first inventory address inside
        `ANKRA_CLOUD_MONITORING_NETWORKS`; a control host outside them at the address it serves the control plane on;
        any other node outside them is left out. A server added from the console is listed once it registers.
        Authenticate with the read-only scrape credential (`create_monitoring_credential`); each call marks it used.
      x-ankra-operator-scope: read
      security:
        - operatorToken: []
      parameters:
        - name: job
          in: query
          required: true
          schema: { type: string, enum: [ankra-cloud-api, ankra-node, ceph, node, ankra-cloud-db-supervisor] }
      responses:
        '200':
          description: The job's target groups.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [targets, labels]
                  properties:
                    targets: { type: array, items: { type: string } }
                    labels: { type: object, additionalProperties: { type: string } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422':
          description: An unknown job.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        default: { $ref: '#/components/responses/Error' }

  /admin/v1/monitoring:
    get:
      operationId: get_monitoring_status
      tags: [monitoring]
      summary: The monitoring integration's credentials and how many targets each job lists (staff)
      description: >-
        A credential's `last_used_at` is when Prometheus last read its targets (minute resolution).
        `network_configured` is false while `ANKRA_CLOUD_MONITORING_NETWORKS` is unset, when only control hosts are listed.
      x-ankra-staff-role: support
      security:
        - staffSession: []
      responses:
        '200':
          description: The status.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MonitoringStatus' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        default: { $ref: '#/components/responses/Error' }

  /admin/v1/monitoring/credentials:
    post:
      operationId: create_monitoring_credential
      tags: [monitoring]
      summary: Mint the read-only scrape credential for the cluster whose Prometheus scrapes the cloud (admin staff)
      description: >-
        An operator token named `monitoring-<cluster>` with only the read scope, valid for a year, shown once. Put it in the
        monitoring stack's Secret (encrypted with SOPS) on that cluster. Recorded in the platform audit chain
        (`monitoring.credential.create`).
      x-ankra-staff-role: admin
      security:
        - staffSession: []
          staffCsrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [cluster]
              properties:
                cluster: { type: string, minLength: 1, maxLength: 52, pattern: '^[a-z0-9][a-z0-9._-]*$' }
      responses:
        '201':
          description: The credential and its token, shown this once.
          content:
            application/json:
              schema:
                type: object
                required: [credential, token]
                properties:
                  credential: { $ref: '#/components/schemas/MonitoringCredential' }
                  token: { type: string }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422':
          description: A cluster name that cannot name a credential.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        default: { $ref: '#/components/responses/Error' }

  /admin/v1/monitoring/credentials/{cluster}:
    parameters:
      - name: cluster
        in: path
        required: true
        schema: { type: string }
    delete:
      operationId: revoke_monitoring_credential
      tags: [monitoring]
      summary: End the cluster's scrape credential (admin staff)
      description: Prometheus stops discovering and scraping at once. Recorded in the platform audit chain (`monitoring.credential.revoke`).
      x-ankra-staff-role: admin
      security:
        - staffSession: []
          staffCsrfHeader: []
      responses:
        '204': { description: Revoked. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Error' }

  /admin/v1/setup:
    get:
      operationId: get_setup_checklist
      tags: [setup]
      summary: The steps from bought bare-metal servers to a live cloud, each with where it stands (staff)
      description: |
        Read from the provider's real state at one instant, in order: `region`, `zone`, `zone_network` (every zone in
        service records its autonomous system; `zones` names those without, whose new hosts would join with the
        installer's default AS 65001), `servers` (added over SSH and
        registered; `attention` when an add failed), `compute_online`, `offering` (public or private compute servers),
        `ipv6` (every zone with compute servers has an active, globally routed IPv6 pool; `zones` names those without),
        `ipv4` (always `optional`: IPv6-only servers reach IPv4 through NAT64), `monitoring` (Prometheus read the targets
        within 15 minutes) and `go_live` (a zone customers see has a public compute server taking servers; `zones` names
        them). `live` is set once `go_live` is done.
      x-ankra-staff-role: support
      security:
        - staffSession: []
      responses:
        '200':
          description: The checklist.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SetupChecklist' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        default: { $ref: '#/components/responses/Error' }

  /admin/v1/fleet:
    get:
      operationId: get_fleet
      tags: [fleet]
      summary: Every region, zone and node with its health and capacity (staff)
      description: |
        Regions in listing order, each zone with its capability summary and its nodes by hostname (at most 2000 per zone;
        `truncated` says when there are more). Each node carries its liveness, heartbeat age, maintenance, agent, the
        components its last heartbeat reported unhealthy, the servers placed on it and its capacity counted with the
        scheduler's rules: a compute node's vCPU budget is its logical CPUs times the overcommit ratio (4), and 2048 MiB
        of its memory is reserved for the host. A server migrating to a node counts on it until the switch. A node's
        `free` goes negative when it is allocated past its budget.

        Every zone, region and the fleet have a `rollup`. Cores and memory count compute nodes only; `free` counts each
        node's free capacity with an over-allocated node as zero, and `available` counts only the nodes that take new
        servers now (online, schedulable, with KVM). `local_storage` is the raw disk capacity the nodes' inventories
        report, the Ankra Local storage pinned to them, how many nodes report an Ankra Local thin pool (`pools`) and how
        many of those take no new volumes (`refusing_pools`), with the reported pools' size, provisioned and written bytes.
        `ipv4` and `ipv6` count the zones' address pools (IPv6 in delegated prefixes) and what the active ones have left;
        `ceph` counts the zones whose Ceph serves volumes, the hosts holding OSDs and the volumes on it. A node's `usage.local_storage.pool` is its thin pool as
        its last heartbeat reported it: a pool at or above `maximum_used_percent` of its data or metadata, or one a new
        volume would provision past `maximum_overcommit_ratio` times its size, takes no new local volume and no new
        server with local disks (`accepts_new_volumes` false, `refusal` says why).
      x-ankra-staff-role: support
      security:
        - staffSession: []
      responses:
        '200':
          description: The fleet.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Fleet' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        default: { $ref: '#/components/responses/Error' }

  /admin/v1/fleet/nodes/{id}:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    get:
      operationId: get_fleet_node
      tags: [fleet]
      summary: One node of the fleet with its health and capacity (staff)
      description: The operator's node view with the fleet's figures for the node (see `get_fleet`).
      x-ankra-staff-role: support
      security:
        - staffSession: []
      responses:
        '200':
          description: The node.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FleetNodeDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
