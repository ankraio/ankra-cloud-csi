  /admin/v1/fleet/nodes/{id}/tailnet:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    get:
      operationId: get_node_tailnet
      tags: [tailnet]
      summary: A node's tailnet membership and the actions on offer (staff)
      description: >-
        Read from headscale's node list, matched on the node's hostname under any user. `can_join` and `can_move` say
        which action applies; `action_note` says why neither does (the tailnet is off, the node was not added from the
        console so the control plane has no SSH access to it, it is online under its region's user already). `operation`
        is the host's newest tailnet operation with its events. 502 when headscale does not answer.
      x-ankra-staff-role: support
      security:
        - staffSession: []
      responses:
        '200':
          description: The node's membership.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NodeTailnetEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '502': { $ref: '#/components/responses/BadGateway' }
        default: { $ref: '#/components/responses/Error' }

  /admin/v1/fleet/nodes/{id}/tailnet/join:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    post:
      operationId: start_node_tailnet_join
      tags: [tailnet]
      summary: Join a node to its region's tailnet user (admin staff)
      description: >-
        Starts `host.join_tailnet` on the host the node was added with: the region's headscale user is created when it is
        missing, a single-use pre-auth key valid for 15 minutes is minted, Tailscale is installed over SSH when it is
        missing (`https://tailscale.com/install.sh`) and `tailscale up --login-server … --hostname <node>
        --accept-dns=false --accept-routes=false` runs with the key read from a 0600 file; the step waits until headscale
        lists the node online under the region's user, then the key is expired. 409 for a node added outside the console
        (no SSH access), one online under another user (move it instead) or while another operation of the host runs;
        503 while the tailnet is off. Recorded in the platform audit chain (`host.tailnet_join`).
      x-ankra-staff-role: admin
      security:
        - staffSession: []
          staffCsrfHeader: []
      responses:
        '202':
          description: The operation, pending.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HostOperationEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
        default: { $ref: '#/components/responses/Error' }

  /admin/v1/fleet/nodes/{id}/tailnet/move:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    post:
      operationId: start_node_tailnet_move
      tags: [tailnet]
      summary: Move a node to its region's tailnet user (admin staff)
      description: >-
        Starts `host.move_tailnet_user`. headscale has no `nodes move`, so the host re-authenticates (`tailscale up
        --force-reauth`) with a key of its region's user, handed over together with a key of its previous user: when the
        new key does not reach the Running state the host re-authenticates back at once, and when headscale does not list
        it online under the region's user the control plane moves it back with a fresh key. Once it holds, the offline
        entries it left under other users are removed. The control plane connects over the host's public address and
        refuses a host it reaches over a tailnet address (409). Recorded in the platform audit chain
        (`host.tailnet_move`).
      x-ankra-staff-role: admin
      security:
        - staffSession: []
          staffCsrfHeader: []
      responses:
        '202':
          description: The operation, pending.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HostOperationEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
        default: { $ref: '#/components/responses/Error' }

  /admin/v1/regions/{region}/tailnet:
    parameters:
      - name: region
        in: path
        required: true
        schema: { type: string, examples: ['eu-north'] }
    get:
      operationId: get_region_tailnet
      tags: [tailnet]
      summary: A region's tailnet user and who is on it (staff)
      description: >-
        The region's headscale user (named after the region; `user_exists` is false until the first host joined), its
        members with the registered node each one is, the region's nodes on the tailnet under another user (`elsewhere`)
        and those not on it at all. 502 when headscale does not answer.
      x-ankra-staff-role: support
      security:
        - staffSession: []
      responses:
        '200':
          description: The region's tailnet.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RegionTailnetEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '502': { $ref: '#/components/responses/BadGateway' }
        default: { $ref: '#/components/responses/Error' }

  /admin/v1/edge-routers:
    get:
      operationId: list_edge_routers
      tags: [edge_router]
      summary: The regions' IPv6 edge routers, by name (staff)
      description: >-
        Every live edge router (ADR 0007) with its routed prefixes, NAT64 and how many gateway uplinks it carries. A
        `managed` edge is reached over SSH with the control plane's key and its pinned host key; an `external` one (the
        simulation's upstream-sim) is only recorded so an uplink can name it.
      x-ankra-staff-role: support
      security:
        - staffSession: []
      responses:
        '200':
          description: The edge routers.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EdgeRouterList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        default: { $ref: '#/components/responses/Error' }
    post:
      operationId: adopt_edge_router
      tags: [edge_router]
      summary: Record an edge router that runs already, with its prefixes and uplinks (admin staff)
      description: |
        Records an edge router as it runs, with the prefixes the provider routes to it, the downstream tunnel it forwards
        them into and the gateway uplinks it carries, keeping their addresses, ports and keys: nothing is renumbered and
        nothing on the edge or the gateways changes. `ankra-cloud-api edge-router adopt` does the same from the control
        plane host and reads uplinks in the simulation's `EDGE_GATEWAYS` row format. Unset fields take the defaults:
        management `managed`, SSH port 22, uplink interface `eth0`, NAT64 prefix `64:ff9b::/96`, a 120 s firewall
        rollback, the routed address `<prefix>::1`, gateway interface `wg-up`, uplink state `active` and the endpoint
        `<public IPv4>:<listen port>`. Recorded in the platform audit chain (`edge_router.adopt`).
      x-ankra-staff-role: admin
      security:
        - staffSession: []
          staffCsrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdoptEdgeRouterRequest' }
      responses:
        '201':
          description: The adopted edge router and its uplinks.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EdgeRouterDetail' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        default: { $ref: '#/components/responses/Error' }

  /admin/v1/edge-routers/{id}:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    get:
      operationId: get_edge_router
      tags: [edge_router]
      summary: An edge router with its gateway uplinks (staff)
      description: Each uplink carries the networks the edge accepts from the gateway over BGP, the zone's routed pools.
      x-ankra-staff-role: support
      security:
        - staffSession: []
      responses:
        '200':
          description: The edge router.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EdgeRouterDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Error' }

  /admin/v1/edge-routers/{id}/health:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    get:
      operationId: get_edge_router_health
      tags: [edge_router]
      summary: What an edge router reports now (staff)
      description: >-
        Read over SSH with the control plane's key, pinned to the edge's host key, by a fixed read-only script: every
        WireGuard peer with its endpoint, allowed IPs, latest handshake and bytes (never the private keys), the BGP
        sessions, the routes of the routed prefixes and the zone networks BGP learned, the transit units (NAT64, FRR,
        the persistent firewall and the rollback timer) and the firewall's counters, NAT64 ones marked. An edge the
        control plane cannot reach answers 200 with `reachable` false and the problem. An external edge is 409.
      x-ankra-staff-role: support
      security:
        - staffSession: []
      responses:
        '200':
          description: The edge's health.
          content:
            application/json:
              schema:
                type: object
                required: [health]
                properties:
                  health: { $ref: '#/components/schemas/EdgeRouterHealth' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        default: { $ref: '#/components/responses/Error' }

  /admin/v1/edge-routers/{id}/plan:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    get:
      operationId: get_edge_router_plan
      tags: [edge_router]
      summary: What applying an edge router's configuration would change (staff, read only)
      description: >-
        Renders the edge's WireGuard, firewall, NAT64, FRR and sysctl configuration for its live uplinks (byte for byte
        what `sim/node/transit-setup.sh` renders for the same values), reads the files the edge has over SSH with the
        pinned host key (private keys left out), and diffs each one: `unchanged`, `changed`, `added`, or `retired` for a
        gateway interface an earlier rendering made and no uplink needs now. `refusal` says why it may not be applied:
        NAT64 rendered off while a zone with an uplink there has no zone NAT64, or an edge the control plane cannot
        render. `problem` says why the edge could not be read; every file is then `added`. Nothing changes. An external
        edge is 409.
      x-ankra-staff-role: support
      security:
        - staffSession: []
      responses:
        '200':
          description: The plan.
          content:
            application/json:
              schema:
                type: object
                required: [plan]
                properties:
                  plan: { $ref: '#/components/schemas/EdgeRouterPlan' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        default: { $ref: '#/components/responses/Error' }

  /admin/v1/edge-routers/{id}/apply:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    post:
      operationId: start_edge_router_apply
      tags: [edge_router]
      summary: Apply the rendered configuration to an edge router (admin staff)
      description: |
        Starts `edge_router.apply` for the configuration whose plan staff compared with the edge: `digest` is the plan's
        digest, and 409 answers when the control plane renders something else by now (compare again). The operation
        keeps the rendering it was started with and runs, over SSH with the control plane's key and the edge's pinned
        host key:

        1. `stage_edge_configuration`: uploads the files and the apply script, creates the WireGuard key of every
           interface that has none (private keys never leave the edge), records the interfaces' public keys on their
           uplinks and what differs from the edge's files.
        2. `apply_edge_configuration`: installs WireGuard (an interface restarts only when its file changed, an
           interface of a gateway no longer rendered is retired), loads the firewall with a rollback armed for the
           edge's `rollback_seconds`, then NAT64 and FRR.
        3. `verify_edge_configuration`: logs in over a fresh SSH connection. A firewall that cut the control plane off
           rolls back by itself; the operation then fails and never loads it again.
        4. `confirm_edge_configuration`: disarms the rollback and makes the firewall persistent.

        Refused (409) while NAT64 would be rendered off for a zone that reaches IPv4 only through the edge, for an edge
        the control plane cannot render, for an external edge, and while another operation of the edge runs. Recorded in
        the platform audit chain (`edge_router.apply`) in the same transaction as the operation.
      x-ankra-staff-role: admin
      security:
        - staffSession: []
          staffCsrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [digest]
              properties:
                digest: { type: string, description: 'The digest of the plan that was compared with the edge.' }
      responses:
        '202':
          description: The operation, pending.
          content:
            application/json:
              schema:
                type: object
                required: [operation]
                properties:
                  operation: { $ref: '#/components/schemas/EdgeRouterOperation' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        default: { $ref: '#/components/responses/Error' }

  /admin/v1/edge-routers/{id}/operations:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    get:
      operationId: list_edge_router_operations
      tags: [edge_router]
      summary: An edge router's operations and the progress of the newest (staff)
      description: The edge's 20 newest operations, newest first, and the events of the newest one, oldest first.
      x-ankra-staff-role: support
      security:
        - staffSession: []
      responses:
        '200':
          description: The operations.
          content:
            application/json:
              schema:
                type: object
                required: [operations, events]
                properties:
                  operations: { type: array, items: { $ref: '#/components/schemas/EdgeRouterOperation' } }
                  events: { type: array, items: { $ref: '#/components/schemas/EdgeRouterOperationEvent' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Error' }

  /admin/v1/zones/{zone}/uplinks:
    parameters:
      - $ref: '#/components/parameters/ZonePath'
    get:
      operationId: list_zone_uplinks
      tags: [edge_router]
      summary: A zone's gateway uplinks, active first (staff)
      description: Each gateway's active uplink (the one its transit interface peers with now) and the standby ones it can be moved to.
      x-ankra-staff-role: support
      security:
        - staffSession: []
      responses:
        '200':
          description: The zone's uplinks.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/GatewayUplink' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Error' }

  /admin/v1/zones/{zone}/uplink-operations:
    parameters:
      - $ref: '#/components/parameters/ZonePath'
    get:
      operationId: list_zone_uplink_operations
      tags: [edge_router]
      summary: The moves of a zone's gateway uplinks and the progress of the newest (staff)
      description: The 20 newest `gateway_uplink.move` operations of the zone's uplinks, newest first, and the events of the newest one, oldest first.
      x-ankra-staff-role: support
      security:
        - staffSession: []
      responses:
        '200':
          description: The operations.
          content:
            application/json:
              schema:
                type: object
                required: [operations, events]
                properties:
                  operations: { type: array, items: { $ref: '#/components/schemas/EdgeRouterOperation' } }
                  events: { type: array, items: { $ref: '#/components/schemas/EdgeRouterOperationEvent' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Error' }

  /admin/v1/gateway-uplinks/{id}/move-plan:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    get:
      operationId: get_gateway_uplink_move_plan
      tags: [edge_router]
      summary: What moving a gateway to an uplink would change (staff, read only)
      description: >-
        Reads the `[Peer]` of the gateway's transit interface over SSH (the control plane's key, the gateway's pinned
        host key), and shows it against the peer the gateway would get: the uplink's edge interface key and endpoint.
        `refusal` says why the gateway may not be moved there: the uplink is not a standby one, the edge interface's key
        or the gateway's SSH target is not recorded, or a managed edge does not carry the gateway's interface yet (apply
        the edge's configuration first). `problem` says why the gateway could not be read. Nothing changes.
      x-ankra-staff-role: support
      security:
        - staffSession: []
      responses:
        '200':
          description: The plan.
          content:
            application/json:
              schema:
                type: object
                required: [plan]
                properties:
                  plan: { $ref: '#/components/schemas/GatewayUplinkMovePlan' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Error' }

  /admin/v1/gateway-uplinks/{id}/move:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    post:
      operationId: move_gateway_uplink
      tags: [edge_router]
      summary: Move a gateway's transit to this uplink, or roll it back to it (admin staff)
      description: |
        Starts `gateway_uplink.move` to a standby uplink. Over SSH to the gateway (the control plane's key, the gateway's
        pinned host key, an address that stays reachable while the transit moves):

        1. `stage_gateway_uplink_move`: checks a managed edge carries the gateway's interface, uploads the swap script
           (`sim/node/gateway-uplink.sh`, unchanged) and records the peer the gateway has and gets.
        2. `switch_gateway_uplink`: starts the swap as a transient unit, so it finishes whatever happens to the
           connection: the new peer takes over on the running interface, the BGP sessions are reset, and the script
           waits up to 90 s for a handshake and both sessions; without them it swaps back by itself.
        3. `await_gateway_uplink_switch`: reads the verdict; a swap that went back fails the operation.
        4. `verify_gateway_uplink`: the gateway peers with the uplink's edge, and a managed edge sees the gateway's
           fresh handshake and both BGP sessions Established.
        5. `record_gateway_uplink_move`: the uplink becomes the gateway's active one, the one it left its standby.

        `rollback: true` goes back to the uplink the gateway was on before its last move (`rollback_target` on the
        uplink) by the configuration the gateway kept, without waiting for the upstream's verdict; the control plane
        then checks the gateway peers with that uplink. 409 for an uplink that is not movable (see the move plan) and
        while another move of the same gateway runs. Recorded in the platform audit chain (`gateway_uplink.move`) in the
        same transaction as the operation.
      x-ankra-staff-role: admin
      security:
        - staffSession: []
          staffCsrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                rollback: { type: boolean }
      responses:
        '202':
          description: The operation, pending.
          content:
            application/json:
              schema:
                type: object
                required: [operation]
                properties:
                  operation: { $ref: '#/components/schemas/EdgeRouterOperation' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        default: { $ref: '#/components/responses/Error' }

  /admin/v1/zones/{zone}/object-storage:
    parameters:
      - $ref: '#/components/parameters/ZonePath'
    get:
      operationId: get_zone_object_storage
      tags: [zone_object_storage]
      summary: A zone's S3 exposure (staff)
      description: >-
        The S3 endpoint in effect and where it comes from (the zone or `ANKRA_CLOUD_OBJECT_STORAGE_ENDPOINTS`), the
        storage node staff named to serve the zone's single-node S3 server and the node it runs on now, the addresses
        its front listens on, the certificate it serves (never its key), how durable the store is, and the zone's
        storage nodes to choose from.
      x-ankra-staff-role: support
      security:
        - staffSession: []
      responses:
        '200':
          description: The zone's S3 exposure.
          content:
            application/json:
              schema:
                type: object
                required: [object_storage]
                properties:
                  object_storage: { $ref: '#/components/schemas/ZoneObjectStorage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Error' }
    patch:
      operationId: update_zone_object_storage
      tags: [zone_object_storage]
      summary: Change a zone's S3 exposure (admin staff)
      description: >-
        Records the zone's S3 endpoint, the storage node that serves its single-node S3 server, the addresses its front
        listens on and an uploaded certificate. Absent fields stay as they are; an empty endpoint, node, address list or
        certificate hands that part back to its fallback: the endpoint to the zone's
        `ANKRA_CLOUD_OBJECT_STORAGE_ENDPOINTS` entry, the node to the storage policy's choice (the zone's first storage
        node), the listen addresses and the certificate to the serving node's `node.toml`. The resulting settings are
        validated as a whole: listen addresses are the named node's own addresses on the endpoint's port (no wildcard),
        and the certificate is in date and names an https endpoint's host. A change of the node, the addresses or the
        certificate starts the zone's `storage.rebalance_policy` operation, which hands them to the running node, so
        nobody edits a `node.toml`; the node's public filter admits the port within one convergence (30 s). The
        single-node server's objects do not move: naming another node than the one that serves is refused (409). The
        certificate's private key is sealed with the control plane's secret key and never answered. Recorded in the
        platform audit chain (`zone.set_object_storage`) with the certificate's fingerprint, never its key.
      x-ankra-staff-role: admin
      security:
        - staffSession: []
          staffCsrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateZoneObjectStorageRequest' }
      responses:
        '200':
          description: The zone's S3 exposure afterwards and the storage policy operation that applies it.
          content:
            application/json:
              schema:
                type: object
                required: [object_storage, operation, policy_problem]
                properties:
                  object_storage: { $ref: '#/components/schemas/ZoneObjectStorage' }
                  operation:
                    oneOf:
                      - $ref: '#/components/schemas/Operation'
                      - type: 'null'
                    description: The `storage.rebalance_policy` operation that applies the change to the serving node; null when the change needs none or one already runs.
                  policy_problem:
                    type: [string, 'null']
                    description: Why the storage policy did not start although the change is recorded; start it with `rebalance_zone_storage`.
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: The zone's single-node S3 server already runs on another node; its objects do not move with the setting.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422':
          description: >-
            Nothing to change, an endpoint that is not an http or https URL of a host, a node that is not a storage node
            of the zone, a listen address that is a wildcard, loopback, listed twice, without a named node or on another
            port than the endpoint's, or a certificate that cannot be read, has expired, does not match its key or does
            not name the endpoint's host.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '503':
          description: The control plane has no secret key to seal the certificate's private key with.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        default: { $ref: '#/components/responses/Error' }

  /admin/v1/hosts/{id}/probe:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    post:
      operationId: start_host_probe
      tags: [host_onboarding]
      summary: Probe a host again (admin staff)
      description: >-
        After its network was fixed (`awaiting_network`), to read its facts anew, or after a failure. Until staff
        confirmed a host key the probe records whatever key the server offers; afterwards it refuses any other. 409 while
        the host installs or once it registered. Recorded in the platform audit chain (`host.probe`).
      x-ankra-staff-role: admin
      security:
        - staffSession: []
          staffCsrfHeader: []
      responses:
        '202':
          description: The host, probing.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HostEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        default: { $ref: '#/components/responses/Error' }

  /admin/v1/hosts/{id}/install:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    post:
      operationId: start_host_install
      tags: [host_onboarding]
      summary: Confirm the host key and install the node agent (admin staff)
      description: |
        `host_key_fingerprint` must be the one the probe recorded (409 otherwise); it is pinned, and every later
        connection refuses a server presenting another key. `host.install` then mints the join token through the same
        usecase as `ankra-cloud-api node join-token` (kept sealed, never shown), puts the agent build on the server (the
        server downloads it from `GET /v1/node-installer` and checks its SHA-256, or the control plane uploads it over SSH
        when it cannot), runs `ankra-node install --dry-run` and records its plan, fails on any `REFUSED` preflight, then
        runs the install as a transient systemd unit (it outlives the SSH connection while the installer moves the
        network) and records every line it prints. The host moves to `registered` when the server registers, then shows
        its node's burn-in. Without `agent_version` the newest uploaded build is installed; 409 when there is none. 503
        without `ANKRA_CLOUD_HOST_API_AUTHORITY_FILE`. Installing again after a failure keeps the pinned key. Recorded in
        the platform audit chain (`host.install`).
      x-ankra-staff-role: admin
      security:
        - staffSession: []
          staffCsrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InstallHostRequest' }
      responses:
        '202':
          description: The host, installing.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HostEnvelope' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
        default: { $ref: '#/components/responses/Error' }

  /admin/v1/hosts/{id}/adopt:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    post:
      operationId: link_host_node
      tags: [host_onboarding]
      summary: Take a node that joined by hand into SSH management (admin staff)
      description: |
        For a host added with `node_id` (a registered node that joined with `ankra-cloud-api node join-token` by hand):
        `host_key_fingerprint` must be the one its probe recorded (409 otherwise) and is pinned, the server must report
        the node's hostname (409 otherwise), and the host is linked to the node and moves to `registered` with the
        install flags its request names recorded as `installed_arguments`. Nothing on the server changes. From then on
        the node's roles can be changed from the console (`start_host_reprovision`). 409 when another host manages the
        node already. Recorded in the platform audit chain (`host.adopt`).
      x-ankra-staff-role: admin
      security:
        - staffSession: []
          staffCsrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdoptHostRequest' }
      responses:
        '200':
          description: The host, registered as the node.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HostEnvelope' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        default: { $ref: '#/components/responses/Error' }

  /admin/v1/hosts/{id}/reprovision:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    post:
      operationId: start_host_reprovision
      tags: [host_onboarding]
      summary: Change a registered node's roles (admin staff)
      description: |
        Re-installs the host's node with new roles over SSH, with the pinned host key, the way `ankra-cloud-api node
        join-token --reprovision <hostname>` and a hand-run `ankra-node install` did. The join token is minted with the
        new roles and may register only that node, which keeps its id, its mesh addresses and its servers; it is kept
        sealed and never shown. `ankra-node install` runs with the host's recorded install flags, the gateway's flags
        (`--public-interface` with `--uplink provider-native` in a provider_native zone, or the BGP transit flags),
        without the burn-in and with `--force`.

        With `plan_only` it starts `host.reprovision_plan`: the agent build is put on the server and the plan of
        `ankra-node install --dry-run` is recorded as the operation's events (`host.install.plan`); nothing on the
        server changes and the token stops working. Without it, `host.reprovision` runs the same dry run first (a
        `REFUSED` preflight fails it before anything changed), then the install as a transient systemd unit, recording
        every line, and waits until the node registered again with exactly the new roles; the host then records its
        roles, request and install flags. Follow either with `get_host` or `get_fleet_node_host`.

        A gateway of a provider_native zone gets `uplink: provider_native` when the request names no uplink; naming the
        other uplink than the zone's is refused (400), as is a gateway role without `gateway` or `gateway` without the
        role. 409 when the host is not a registered node with a confirmed host key, an operation of the host runs, or
        the artefact store holds no such build; 503 without `ANKRA_CLOUD_HOST_API_AUTHORITY_FILE`. Recorded in the
        platform audit chain (`host.reprovision_plan`, `host.reprovision`).
      x-ankra-staff-role: admin
      security:
        - staffSession: []
          staffCsrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReprovisionHostRequest' }
      responses:
        '202':
          description: The host and the operation that started.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HostReprovisionStarted' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
        default: { $ref: '#/components/responses/Error' }

  /admin/v1/fleet/nodes/{id}/host:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    get:
      operationId: get_fleet_node_host
      tags: [host_onboarding]
      summary: The host that manages a node over SSH (staff)
      description: >-
        The host the node registered from, or the one added to adopt it, with its install flags, its operations (newest
        first) and the events of the newest one, as `get_host` answers them. `host` is null (and the lists empty) for a
        node that joined by hand and was never adopted: add a host with its `node_id` and adopt it first.
      x-ankra-staff-role: support
      security:
        - staffSession: []
      responses:
        '200':
          description: The node's host.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NodeHostDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        default: { $ref: '#/components/responses/Error' }

  /admin/v1/accounts/{id}/suspension:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    post:
      operationId: suspend_account
      tags: [account_administration]
      summary: Suspend an account (admin staff)
      description: >-
        The account may not create billable resources: every billable create answers 402 with `reason:
        account_suspended`, exactly as for an overdue invoice, and what it already runs keeps running. The staff
        suspension is kept apart from the payment one: paying an invoice never lifts it, and the overdue loop never
        touches it. A reason of 10 to 500 characters is required; the suspension and its audit event
        (`account.suspended_by_staff`, in the customer's audit log) are stored together. 409 when staff suspended the
        account already.
      x-ankra-staff-role: admin
      security:
        - staffSession: []
          staffCsrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StaffReasonRequest' }
      responses:
        '200':
          description: What suspends the account now.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StaffAccountSuspension' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        default: { $ref: '#/components/responses/Error' }
    delete:
      operationId: unsuspend_account
      tags: [account_administration]
      summary: Unsuspend an account suspended by staff (admin staff)
      description: >-
        Lifts only the suspension staff placed. A suspension for an overdue invoice stays until the invoice is paid;
        the answer still shows it. A reason of 10 to 500 characters is required; audited as
        `account.staff_suspension_lifted`. 409 when staff did not suspend the account.
      x-ankra-staff-role: admin
      security:
        - staffSession: []
          staffCsrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StaffReasonRequest' }
      responses:
        '200':
          description: What suspends the account now.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StaffAccountSuspension' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        default: { $ref: '#/components/responses/Error' }

  /admin/v1/accounts/{id}/members/{user}:
    parameters:
      - $ref: '#/components/parameters/IdPath'
      - name: user
        in: path
        required: true
        description: The member's user id.
        schema: { type: string }
    put:
      operationId: change_account_member_role
      tags: [account_administration]
      summary: Change a member's role (admin staff)
      description: >-
        Gives a member of the account `owner`, `admin`, `member` or `viewer`. Making a member the `owner` hands ownership
        over: the previous owner becomes an `admin` in the same transaction (`previous_owner`). The owner is never
        demoted on its own (409), since an account always keeps its one owner. A user who reaches the account only
        through its Ankra organisation is managed in the Ankra platform (409). Giving the role the member already has
        changes nothing (`changed: false`) and records nothing; a change is audited as `member.role_change` with the
        reason.
      x-ankra-staff-role: admin
      security:
        - staffSession: []
          staffCsrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [role, reason]
              properties:
                role: { type: string, enum: [owner, admin, member, viewer] }
                reason: { type: string, minLength: 10, maxLength: 500 }
      responses:
        '200':
          description: The member afterwards.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StaffMemberRoleChange' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        default: { $ref: '#/components/responses/Error' }
    delete:
      operationId: remove_account_member
      tags: [account_administration]
      summary: Remove a member (admin staff)
      description: >-
        A member belongs to exactly one account, so removing them deletes the user with their sessions and API tokens,
        as the account's own admins removing them does. The owner is never removed (409): hand ownership to another
        member first. A user who reaches the account only through its Ankra organisation is removed in the Ankra
        platform (409). Audited as `member.remove` with the reason.
      x-ankra-staff-role: admin
      security:
        - staffSession: []
          staffCsrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StaffReasonRequest' }
      responses:
        '200':
          description: The member who was removed.
          content:
            application/json:
              schema:
                type: object
                required: [member]
                properties:
                  member: { $ref: '#/components/schemas/StaffUserSummary' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        default: { $ref: '#/components/responses/Error' }

  /admin/v1/accounts/{id}/invoices:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    get:
      operationId: list_account_invoices_for_staff
      tags: [account_administration]
      summary: An account's invoices
      description: >-
        The invoices the customer sees at `GET /v1/invoices`, newest first, with the Stripe invoice and a link to it in
        the Stripe dashboard of the configured key's mode. The first page's read is written to the customer's audit log
        (`staff.read`); when it cannot be, nothing is shown.
      x-ankra-staff-role: support
      security:
        - staffSession: []
      parameters:
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: One page of invoices.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StaffInvoiceList' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Error' }

  /admin/v1/accounts/{id}/billing:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    get:
      operationId: get_account_billing_for_staff
      tags: [account_administration]
      summary: An account's payment standing
      description: >-
        Whether the account may create billable resources and what suspends it, whether a default payment method was
        seen, its Stripe customer with a link to the Stripe dashboard, what its credits have left, what its open and
        overdue invoices still charge, the owner's billing approval, its Ankra platform organisation, what it runs and
        whether it runs servers with no payment method on file, and its trial dev clusters. Read only; the read is
        written to the customer's audit log (`staff.read`).
      x-ankra-staff-role: support
      security:
        - staffSession: []
      responses:
        '200':
          description: The account's payment standing.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StaffAccountBilling' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Error' }

  /admin/v1/users:
    get:
      operationId: search_users
      tags: [account_administration]
      summary: Find users across every account
      description: Users whose email or name contains the query (or whose id it is), ordered by email, 50 per page.
      x-ankra-staff-role: support
      security:
        - staffSession: []
      parameters:
        - name: query
          in: query
          description: Part of the user's email or name, or their id; empty lists every user.
          schema: { type: string, maxLength: 254 }
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: One page of users.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StaffUserSummaryList' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        default: { $ref: '#/components/responses/Error' }

  /admin/v1/users/{id}:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    get:
      operationId: get_user
      tags: [account_administration]
      summary: A user and the accounts they reach
      description: >-
        The user with their second factor state, last sign-in and whether they are disabled, and every account
        (workspace) they reach with their role in it: their own account and the ones they reach through an Ankra
        organisation or an owner seat. The read is written to the audit log of the user's own account (`staff.read`).
      x-ankra-staff-role: support
      security:
        - staffSession: []
      responses:
        '200':
          description: The user and their workspaces.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StaffUserDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Error' }

  /admin/v1/users/{id}/disabled:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    post:
      operationId: disable_user
      tags: [account_administration]
      summary: Disable a user (admin staff)
      description: >-
        The user cannot sign in (403) with a password or an identity provider, their own sessions end now
        (`ended_sessions`) and their API tokens are refused until they are enabled again; nothing is deleted. Support
        sessions staff open as them keep working. A reason of 10 to 500 characters is required; the change and its audit
        event (`user.disabled_by_staff`, in the audit log of the user's own account) are stored together. 409 when the
        user is disabled already.
      x-ankra-staff-role: admin
      security:
        - staffSession: []
          staffCsrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StaffReasonRequest' }
      responses:
        '200':
          description: The user afterwards.
          content:
            application/json:
              schema:
                type: object
                required: [user, ended_sessions]
                properties:
                  user: { $ref: '#/components/schemas/StaffUser' }
                  ended_sessions: { type: integer, description: How many of the user's sessions ended. }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        default: { $ref: '#/components/responses/Error' }
    delete:
      operationId: enable_user
      tags: [account_administration]
      summary: Enable a disabled user (admin staff)
      description: >-
        The user may sign in again and their API tokens work again. A reason of 10 to 500 characters is required; audited
        as `user.enabled_by_staff`. 409 when the user is not disabled.
      x-ankra-staff-role: admin
      security:
        - staffSession: []
          staffCsrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StaffReasonRequest' }
      responses:
        '200':
          description: The user afterwards.
          content:
            application/json:
              schema:
                type: object
                required: [user]
                properties:
                  user: { $ref: '#/components/schemas/StaffUser' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        default: { $ref: '#/components/responses/Error' }

components:
  securitySchemes:
    apiToken:
      type: http
      scheme: bearer
      bearerFormat: act_…
      description: An API token. It acts as the account and the user who created it, with that user's current role. Scope `read` gets 403 on every unsafe method. No CSRF header is needed.
    sessionCookie:
      type: apiKey
      in: cookie
      name: ankracloud_session
      description: The portal session (HttpOnly), set by `POST /v1/auth/login`, `POST /v1/auth/signup` or `POST /v1/auth/accept-invitation`.
    csrfHeader:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: Required with the session cookie on unsafe methods; equals the `ankracloud_csrf` cookie (and the `csrf_token` of the sign-in response).
    staffSession:
      type: apiKey
      in: cookie
      name: ankracloud_admin_session
      description: The admin console's staff session (HttpOnly), set by `POST /admin/v1/auth/login` and scoped to the admin console's host. Every `/admin/v1` route is served only on that host when one is configured.
    staffCsrfHeader:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: Required with the staff session on unsafe methods; equals the `ankracloud_admin_csrf` cookie (and the `csrf_token` of the staff sign-in response).
    nodeCertificate:
      type: mutualTLS
      description: The node certificate the control plane's certificate authority issued at registration, presented as the TLS client certificate.
    platformServiceToken:
      type: apiKey
      in: header
      name: X-Ankra-Platform-Token
      description: The Ankra platform's service token (`ANKRA_CLOUD_PLATFORM_SERVICE_TOKEN`, or `ANKRA_CLOUD_PLATFORM_SERVICE_TOKEN_NEXT` during a rotation). Only the `/platform/v1` routes accept it.
    operatorToken:
      type: http
      scheme: bearer
      description: The operator token, whose SHA-256 is configured on the control plane. Any bearer token that is not an `act_…` API token is checked as the operator token.

  parameters:
    IdPath:
      name: id
      in: path
      required: true
      schema: { type: string }
    ZonePath:
      name: zone
      in: path
      required: true
      schema: { type: string, examples: ['de-fsn1'] }
    NetworkPath:
      name: network
      in: path
      required: true
      description: The private network's id.
      schema: { type: string }
    Cursor:
      name: cursor
      in: query
      description: The `next_cursor` of the previous page.
      schema: { type: string }
    Limit:
      name: limit
      in: query
      description: Page size; the server applies its default and maximum.
      schema: { type: integer }
    NodePoolPath:
      name: pool
      in: path
      required: true
      description: The node pool's id.
      schema: { type: string }
    CouponCode:
      name: coupon
      in: query
      required: false
      description: A coupon code redeemed for the account a sign-up creates; a value that is not shaped like a code (3 to 32 letters, digits, dashes, underscores) is dropped.
      schema: { type: string, maxLength: 64, examples: ['WELCOME500'] }
    IdentityProviderName:
      name: provider
      in: query
      required: false
      description: One of the `providers` names `GET /v1/auth/oidc` lists (`ankra`, `google`, `microsoft`, …); the first provider without it. Any other name answers 400.
      schema: { type: string, pattern: '^[a-z][a-z0-9]{0,31}$', examples: ['microsoft'] }
    IdentityProviderConnection:
      name: connection
      in: query
      required: false
      description: One of the `connections` names `GET /v1/auth/oidc` lists for the provider; forwarded to the provider's authorization endpoint so it goes straight to Google, Microsoft or GitHub. Any other name answers 400. Ignored with `prompt=none`.
      schema: { type: string, pattern: '^[A-Za-z0-9_-]{1,128}$', examples: ['github'] }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: >-
        A key the client chooses for this create, for example a UUID. The same create sent again with the same key
        within 24 hours answers the first one's answer with `Idempotent-Replayed: true` and creates nothing. 409 with
        `reason: idempotency_key_in_progress` while the first request is still running (try again shortly), with
        `reason: idempotency_key_outcome_unknown` when the first request answered 5xx or never finished (the create
        may or may not exist: list the resource before creating again with a new key), or with
        `reason: idempotency_key_answer_not_stored` when the create succeeded but its answer could not be kept (read
        the resource). 422 with `reason: idempotency_key_reused` when the key was used with a different request, 400
        when the key is not 1 to 255 visible ASCII characters. Only a 4xx answer frees a key before the 24 hours.
      schema: { type: string, minLength: 1, maxLength: 255, pattern: '^[\x21-\x7e]+$', examples: ['0190f3a2-7b1c-4d43-9a55-0c1d2e3f4a5b'] }

  responses:
    OperationAccepted:
      description: Accepted; poll the operation.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/OperationEnvelope' }
    ServerOperationAccepted:
      description: Accepted; the server as it is now and the operation to poll.
      content:
        application/json:
          schema:
            type: object
            required: [server, operation]
            properties:
              server: { $ref: '#/components/schemas/Server' }
              operation: { $ref: '#/components/schemas/Operation' }
    CustomImageAccepted:
      description: The custom image is being created.
      content:
        application/json:
          schema:
            type: object
            required: [custom_image, operation]
            properties:
              custom_image: { $ref: '#/components/schemas/CustomImage' }
              operation: { $ref: '#/components/schemas/Operation' }
    BadRequest:
      description: The request is invalid; `detail` says why.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Unauthorized:
      description: Not signed in, or the credential is invalid or expired.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Forbidden:
      description: >-
        The role lacks the permission, the token is read-only (a read-only token also gets
        `reason: read_only_token_cannot_read_credentials` on every credential read), the CSRF header is missing, a
        support session may not do this, or the route needs a verified email address and the caller's is not
        (`reason: email_unverified`).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    NotFound:
      description: No such resource in the caller's account.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Conflict:
      description: The resource's state does not allow this now.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    QuotaExceeded:
      description: The account would exceed a quota; `detail` names the limit and `reason` is `quota_exceeded`.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    IdempotencyKeyReused:
      description: >-
        The `Idempotency-Key` was already used with a different request (`reason: idempotency_key_reused`).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    PaymentRequired:
      description: >-
        The account may not create billable resources. `reason` is `payment_method_required` while it has no default
        payment method, whatever credit it holds (add one through `POST /v1/account/billing/setup-session`; credits pay
        for usage but do not replace the card), `owner_approval_required` while its owner has not approved paid usage
        and no credit is left, or `account_suspended` while an invoice is overdue past the grace period (pay it; nothing already
        running is stopped) or Ankra staff suspended the account (contact support). `GET /v1/account/billing` reports
        the same `standing`.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    TooManyRequests:
      description: >-
        Rate limited. On a customer operation the credential (the API token, or the signed-in user for a session) is
        over its requests per minute and the `X-RateLimit-*` headers say when the window ends; on a sign-in route the
        client network is over its attempts or the email is locked out.
      headers:
        Retry-After:
          schema: { type: integer }
          description: Seconds until the next attempt may succeed.
        X-RateLimit-Limit:
          schema: { type: integer }
          description: Requests the credential may make per minute. Customer operations send it on every answer.
        X-RateLimit-Remaining:
          schema: { type: integer }
          description: Requests left in the current window. Customer operations send it on every answer.
        X-RateLimit-Reset:
          schema: { type: integer, format: int64 }
          description: When the current window ends, in Unix seconds. Customer operations send it on every answer.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    TooManyRequestsOfTheRoute:
      description: >-
        The operation's own limit is reached (its description says what the limit is). The operation is not counted
        against the credential's requests per minute and sends no `X-RateLimit-*` headers.
      headers:
        Retry-After:
          schema: { type: integer }
          description: Seconds until the next request may succeed.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    NotImplemented:
      description: The capability is not implemented yet; `detail` names the follow-up that adds it.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    ServiceUnavailable:
      description: No capacity or address is free, or a host did not answer; try again later.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    BadGateway:
      description: A service the control plane depends on (headscale) did not answer; `detail` says how.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    PaymentsNotConfigured:
      description: Payments are not configured on this control plane (`payments not configured`).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    UnsupportedMediaType:
      description: The body is not in the media type the route takes.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Error:
      description: Any other error, usually 500.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }

  schemas:
    JSONRPCMessage:
      type: object
      description: One JSON-RPC 2.0 message of the Model Context Protocol.
      required: [jsonrpc]
      properties:
        jsonrpc: { type: string, enum: ['2.0'] }
        id:
          description: Absent on notifications.
          oneOf:
            - { type: string }
            - { type: integer }
        method: { type: string, examples: ['tools/call'] }
        params: { type: object, additionalProperties: true }
    JSONRPCResponse:
      type: object
      description: A JSON-RPC 2.0 response - a result or an error.
      required: [jsonrpc, id]
      properties:
        jsonrpc: { type: string, enum: ['2.0'] }
        id:
          oneOf:
            - { type: string }
            - { type: integer }
            - { type: 'null' }
        result: { type: object, additionalProperties: true }
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: integer }
            message: { type: string }
            data: {}
    Problem:
      type: object
      description: RFC 7807 problem document.
      required: [type, title, status]
      properties:
        type: { type: string, examples: ['about:blank'] }
        title: { type: string }
        status: { type: integer }
        detail: { type: string, description: Written for the customer. }
        reason:
          type: string
          description: >-
            A stable, machine-readable cause where a client can act on it: `payment_method_required` and
            `account_suspended` (402 on a billable create), `read_only_token_cannot_read_credentials` (403 when a
            read-only API token asks for a credential read).
          examples: [payment_method_required]

    HostSSHPublicKey:
      type: object
      required: [public_key, fingerprint, authorized_keys_path]
      properties:
        public_key: { type: string, description: 'The authorized_keys line.', examples: ['ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAA… ankra-cloud-control-plane'] }
        fingerprint: { type: string, examples: ['SHA256:47DEQpj8HBSa+/TImW+5JCeuQeRkm5NMpJWZG3hSuFU'] }
        authorized_keys_path: { type: string, const: /root/.ssh/authorized_keys }
    CreateHostRequest:
      type: object
      additionalProperties: false
      description: >-
        `zone` and `roles` are required for a blank server. With `node_id` the server is a registered node that joined
        by hand: the host takes the node's zone and roles (naming others is refused), records the flags the request
        names as the ones it was installed with, and is adopted (`link_host_node`) instead of installed.
      required: [address]
      properties:
        address: { type: string, description: 'IPv4 or IPv6 address, or DNS name, the control plane reaches the server at.', examples: ['203.0.113.24'] }
        ssh_port: { type: integer, minimum: 1, maximum: 65535, default: 22 }
        zone: { type: string, examples: ['de-fsn1'] }
        roles:
          type: array
          minItems: 1
          items: { type: string, enum: [control, gateway, storage, compute, backup, ceph-witness] }
        node_id: { type: string, description: 'The registered node the server is, to adopt it.' }
        autonomous_system:
          type: integer
          minimum: 1
          maximum: 4294967294
          description: 'Overrides the fabric AS (`--autonomous-system`); left out, the join token carries the zone''s recorded AS, and without one the installer keeps the one a previous install wrote, else 65001.'
        datacenter: { type: string, examples: ['fsn1-dc14'] }
        rack: { type: string, description: 'A rack of the zone (create it first with `ankra-cloud-api rack create`).', examples: ['r01'] }
        underlay: { type: string, enum: ['', wireguard], description: '`wireguard` for a server without a private network to the zone''s other hosts.' }
        storage:
          type: object
          additionalProperties: false
          properties:
            policy: { type: string, enum: ['', auto, ankra-local, ceph], description: 'Where a storage server''s data disks go.' }
            local_storage_file: { type: string, description: 'Back Ankra Local with this preallocated file on the root filesystem.', examples: ['/var/lib/ankra-local.img'] }
            local_storage_size_gibibytes: { type: integer, minimum: 1, maximum: 1048576 }
        gateway: { $ref: '#/components/schemas/HostGatewayRequest' }
        ssh_allowed_networks:
          type: array
          maxItems: 16
          description: WireGuard underlay only - networks SSH is admitted from on the public interface.
          items: { type: string, examples: ['198.51.100.0/24'] }
        wireguard_endpoint: { type: string, description: 'WireGuard underlay only - address:port peers reach the server at.', examples: ['203.0.113.24:51820'] }
        skip_burn_in: { type: boolean, default: false, description: 'Install without the burn-in; the node is ready once it registers.' }
        allocation:
          description: >-
            Who the server's compute capacity is offered to from the moment it registers; only for a server with the
            compute role. Absent registers it in the region's public offering.
          oneOf:
            - $ref: '#/components/schemas/HostAllocation'
            - type: 'null'
    HostAllocation:
      type: object
      additionalProperties: false
      description: >-
        The allocation an added server registers with: `public` (the region's public offering), `private` (dedicated to
        `account_id`, a private cloud) or `unassigned` (takes no servers until staff assign it). Change it later with
        `set_fleet_node_allocation`.
      required: [kind]
      properties:
        kind: { type: string, enum: [public, private, unassigned] }
        account_id: { type: string, description: 'The account a private server is dedicated to; required for private, refused otherwise.' }
    HostGatewayRequest:
      type: object
      additionalProperties: false
      description: >-
        A gateway server's link to the internet; required with the gateway role. On a bgp zone its transit towards the
        upstream router (`transit_address`, `upstream_peer` and `upstream_autonomous_system` are required); on a
        provider_native zone (ADR 0008) only its public interface, which keeps the host's addresses, and optionally the
        provider's IPv6 gateway. `uplink` must be the zone's public uplink.
      required: [public_interface]
      properties:
        uplink: { type: string, enum: [bgp, provider_native], description: "The zone's public uplink; bgp when absent." }
        public_interface: { type: string, examples: ['enp1s0f0'] }
        transit_address: { type: string, description: 'IPv4 in CIDR form; bgp only.', examples: ['192.0.2.2/30'] }
        upstream_peer: { type: string, description: bgp only., examples: ['192.0.2.1'] }
        upstream_autonomous_system: { type: integer, minimum: 1, maximum: 4294967294, description: bgp only. }
        transit_address6: { type: string, description: 'IPv6 in CIDR form, with upstream_peer6; bgp only.' }
        upstream_peer6: { type: string }
        provider_gateway6:
          type: string
          description: >-
            provider_native only: the provider's IPv6 gateway on the public interface (`ankra-node install
            --provider-gateway6`); the host's IPv6 default route names it when absent.
          examples: ['2001:41d0:2:9bff:ff:ff:ff:ff']
    AdoptHostRequest:
      type: object
      additionalProperties: false
      required: [host_key_fingerprint]
      properties:
        host_key_fingerprint: { type: string, pattern: '^SHA256:[A-Za-z0-9+/]{43}$', description: 'The fingerprint staff checked against the server.' }
    ReprovisionHostRequest:
      type: object
      additionalProperties: false
      required: [roles]
      properties:
        roles:
          type: array
          minItems: 1
          description: The node's roles after the reprovision, the ones it keeps included.
          items: { type: string, enum: [control, gateway, storage, compute, backup, ceph-witness] }
        gateway:
          description: The gateway's link; required when roles name gateway, refused otherwise.
          oneOf:
            - $ref: '#/components/schemas/HostGatewayRequest'
            - type: 'null'
        agent_version: { type: string, description: 'An uploaded node agent build; the newest by default.' }
        plan_only: { type: boolean, default: false, description: 'Record the dry run''s plan and change nothing (host.reprovision_plan).' }
    HostReprovisionStarted:
      type: object
      required: [host, operation]
      properties:
        host: { $ref: '#/components/schemas/Host' }
        operation: { $ref: '#/components/schemas/HostOperation' }
    NodeHostDetail:
      type: object
      required: [host, operations, events, control_link]
      properties:
        host:
          description: The host that manages the node; null for a node that joined by hand and was never adopted.
          oneOf:
            - $ref: '#/components/schemas/Host'
            - type: 'null'
        control_link:
          description: The host's control-plane link; null when it has none.
          oneOf:
            - $ref: '#/components/schemas/ControlLink'
            - type: 'null'
        operations:
          type: array
          description: The host's operations, newest first (at most 10).
          items: { $ref: '#/components/schemas/HostOperation' }
        events:
          type: array
          description: The newest operation's events, oldest first (at most 1000).
          items: { $ref: '#/components/schemas/HostOperationEvent' }
    InstallHostRequest:
      type: object
      additionalProperties: false
      required: [host_key_fingerprint]
      properties:
        host_key_fingerprint: { type: string, pattern: '^SHA256:[A-Za-z0-9+/]{43}$', description: 'The fingerprint staff checked against the server.' }
        agent_version: { type: string, description: 'An uploaded node agent build; the newest by default.' }
    HostEnvelope:
      type: object
      required: [host]
      properties:
        host: { $ref: '#/components/schemas/Host' }
    HostList:
      type: object
      required: [items, next_cursor]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Host' } }
        next_cursor: { $ref: '#/components/schemas/NextCursor' }
    ControlLink:
      type: object
      description: >-
        A remote host's control-plane link (ADR 0009): a WireGuard /30 between the host's `wg-ctl` and a hub on the
        management network. The first address is the hub's, the second the host's.
      required: [id, zone, network, hub_address, host_address, host_public_address, host_public_key, hub, hub_public_key, hub_endpoint,
        hub_interface, state, pending_host_id, node_id, hub_applied_at, last_handshake_at, created_by, created_at, updated_at, released_at]
      properties:
        id: { type: string }
        zone: { type: string, examples: ['se-sto1'] }
        network: { type: string, examples: ['10.44.0.4/30'] }
        hub_address: { type: string, examples: ['10.44.0.5'] }
        host_address: { type: string, examples: ['10.44.0.6'] }
        host_public_address: { type: string, examples: ['103.197.150.23'] }
        host_public_key: { type: string, description: 'The public key of the host''s wg-ctl; the private key never leaves the host.' }
        hub:
          type: string
          enum: [managed, external]
          description: '`managed` links end on `ankra-ctl0`, which `ankra-cloud-api control-link hub` reconciles; `external` ones on an interface built by hand.'
        hub_public_key: { type: string }
        hub_endpoint: { type: string, description: 'The address:port the host dials.', examples: ['168.119.65.46:51830'] }
        hub_interface: { type: string, examples: [ankra-ctl0, wg-sto2] }
        state: { type: string, enum: [configuring, active, released] }
        pending_host_id: { type: [string, 'null'], description: 'The host Add server made the link for.' }
        node_id: { type: [string, 'null'], description: 'The node the link serves.' }
        hub_applied_at: { type: [string, 'null'], format: date-time, description: 'When a managed hub last applied the peer.' }
        last_handshake_at: { type: [string, 'null'], format: date-time, description: 'The latest handshake a managed hub saw.' }
        created_by: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        released_at: { type: [string, 'null'], format: date-time }
    ControlLinkEnvelope:
      type: object
      required: [control_link]
      properties:
        control_link: { $ref: '#/components/schemas/ControlLink' }
    ControlLinkList:
      type: object
      required: [items, next_cursor]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/ControlLink' } }
        next_cursor: { $ref: '#/components/schemas/NextCursor' }
    EdgeRouter:
      type: object
      description: >-
        A region's IPv6 edge (ADR 0007): a host the provider routes a prefix to, which carries it to zones' gateways over
        WireGuard and BGP, and may run NAT64 for zones whose gateways have no IPv4 egress.
      required: [id, name, region, management, public_ipv4, public_ipv6, ssh_address, ssh_port, ssh_host_key_fingerprint, uplink_interface,
        autonomous_system, nat64, protected_networks, rollback_seconds, downstream, prefixes, uplink_count, state, created_by, created_at, updated_at]
      properties:
        id: { type: string }
        name: { type: string, examples: [quick-badger] }
        region: { type: string, examples: [eu-north] }
        management:
          type: string
          enum: [managed, external]
          description: '`managed` edges are read (and, later, configured) by the control plane over SSH; `external` ones are only recorded.'
        public_ipv4: { type: [string, 'null'], examples: ['136.148.210.54'] }
        public_ipv6: { type: [string, 'null'] }
        ssh_address: { type: [string, 'null'] }
        ssh_port: { type: [integer, 'null'] }
        ssh_host_key_fingerprint: { type: [string, 'null'], description: 'The pinned host key; any other is refused.', examples: ['SHA256:GlEkuCp8A6VjPH4vbdiBFcZMvBIogTSXldrOUrsImso'] }
        uplink_interface: { type: string, examples: [eth0] }
        autonomous_system: { type: integer, examples: [64600] }
        nat64:
          type: object
          required: [enabled, prefix]
          properties:
            enabled: { type: boolean }
            prefix: { type: string, examples: ['64:ff9b::/96'] }
        protected_networks: { type: array, items: { type: string }, description: 'What a gateway''s zone never reaches through the edge, besides private, shared, link-local and ULA space.' }
        rollback_seconds: { type: integer, description: 'How long a new firewall stays armed before it rolls back unless confirmed.' }
        downstream:
          description: The WireGuard peer the edge forwards its routed prefixes to, or null.
          oneOf:
            - $ref: '#/components/schemas/EdgeRouterDownstream'
            - type: 'null'
        prefixes: { type: array, items: { $ref: '#/components/schemas/EdgeRouterPrefix' } }
        uplink_count: { type: integer }
        state: { type: string, enum: [active, retired] }
        created_by: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    EdgeRouterDownstream:
      type: object
      required: [name, interface, listen_port, tunnel_address, peer_tunnel_address, peer_public_key, peer_source_address]
      properties:
        name: { type: string, examples: [upstream-sim] }
        interface: { type: string, examples: [wg0] }
        listen_port: { type: integer, examples: [51820] }
        tunnel_address: { type: string, examples: ['fd64:98::1/64'] }
        peer_tunnel_address: { type: string, examples: ['fd64:98::2'] }
        peer_public_key: { type: string }
        peer_source_address: { type: [string, 'null'], description: 'The only IPv4 address WireGuard is accepted from; null accepts any.' }
    EdgeRouterPrefix:
      type: object
      required: [id, prefix, routed_address, state]
      properties:
        id: { type: string }
        prefix: { type: string, examples: ['2a13:7c82:103a::/48'] }
        routed_address: { type: string, description: 'The edge''s own address in the prefix.', examples: ['2a13:7c82:103a::1'] }
        state: { type: string, enum: [active, draining, retired] }
    EdgeRouterList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/EdgeRouter' } }
    EdgeRouterDetail:
      type: object
      required: [edge_router, uplinks]
      properties:
        edge_router: { $ref: '#/components/schemas/EdgeRouter' }
        uplinks: { type: array, items: { $ref: '#/components/schemas/GatewayUplink' } }
    GatewayUplink:
      type: object
      description: >-
        A zone gateway's transit to an edge router: the gateway's WireGuard interface dials the edge's interface for it,
        and two eBGP sessions over the tunnel carry a default route to the gateway and exactly the zone's pools back.
      required: [id, zone, gateway_node_id, gateway_name, gateway_public_address, gateway_interface, gateway_public_key, gateway_autonomous_system,
        edge_router_id, edge_router_name, edge_interface, edge_listen_port, edge_public_key, edge_endpoint, edge_transit_address4,
        gateway_transit_address4, edge_transit_address6, gateway_transit_address6, edge_link_local, presented_autonomous_system, accepted_networks,
        gateway_ssh_address, rollback_target, state, created_by, created_at, updated_at]
      properties:
        id: { type: string }
        zone: { type: string, examples: [se-sto1] }
        gateway_node_id: { type: [string, 'null'] }
        gateway_name: { type: string, examples: [sto1-1] }
        gateway_public_address: { type: string, examples: ['194.68.59.70'] }
        gateway_interface: { type: string, examples: [wg-up] }
        gateway_public_key: { type: string }
        gateway_autonomous_system: { type: integer, examples: [65004] }
        edge_router_id: { type: string }
        edge_router_name: { type: string, examples: [quick-badger] }
        edge_interface: { type: string, examples: [wg-sto1-1] }
        edge_listen_port: { type: integer, examples: [51821] }
        edge_public_key: { type: [string, 'null'], description: 'The edge interface''s key; its private key never leaves the edge.' }
        edge_endpoint: { type: string, description: 'The address:port the gateway dials.', examples: ['136.148.210.54:51821'] }
        edge_transit_address4: { type: string, examples: ['10.99.1.1/30'] }
        gateway_transit_address4: { type: string, examples: ['10.99.1.2'] }
        edge_transit_address6: { type: string, examples: ['fd64:97::1/64'] }
        gateway_transit_address6: { type: string, examples: ['fd64:97::2'] }
        edge_link_local: { type: string, examples: ['fe80::97:1/64'] }
        presented_autonomous_system: { type: [integer, 'null'], description: 'The AS the gateway expects its upstream to be; null presents the edge''s own.' }
        gateway_ssh_address: { type: [string, 'null'], description: 'Where the control plane reaches the gateway to move its uplink; null when not recorded.' }
        rollback_target: { type: boolean, description: 'On a zone''s uplinks: the standby uplink the gateway was on before its last move and can be rolled back to.' }
        accepted_networks: { type: array, items: { type: string }, description: 'What the edge accepts from the gateway and routes to it: the zone''s routed pools.' }
        state:
          type: string
          enum: [active, standby, retired]
          description: '`active` is the uplink the gateway peers with now; `standby` one it can be moved to.'
        created_by: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    EdgeRouterHealth:
      type: object
      required: [checked_at, reachable, problem, tunnels, sessions, routed_prefixes, learned_routes, units, counters]
      properties:
        checked_at: { type: string, format: date-time }
        reachable: { type: boolean }
        problem: { type: [string, 'null'], description: 'Why the edge could not be read, or its report not understood.' }
        tunnels:
          type: array
          items:
            type: object
            required: [interface, listen_port, interface_public_key, peer_public_key, endpoint, allowed_ips, latest_handshake_at, received_bytes, sent_bytes]
            properties:
              interface: { type: string }
              listen_port: { type: integer }
              interface_public_key: { type: string }
              peer_public_key: { type: string }
              endpoint: { type: [string, 'null'] }
              allowed_ips: { type: array, items: { type: string } }
              latest_handshake_at: { type: [string, 'null'], format: date-time }
              received_bytes: { type: integer }
              sent_bytes: { type: integer }
        sessions:
          type: array
          items:
            type: object
            required: [family, neighbor, description, remote_as, local_as, state, uptime, prefixes_received, prefixes_sent]
            properties:
              family: { type: integer, enum: [4, 6] }
              neighbor: { type: string }
              description: { type: string }
              remote_as: { type: integer }
              local_as: { type: integer, description: 'The AS the edge presents to the neighbour.' }
              state: { type: string, examples: [Established, Active, Connect] }
              uptime: { type: string }
              prefixes_received: { type: integer }
              prefixes_sent: { type: integer }
        routed_prefixes: { type: array, items: { $ref: '#/components/schemas/EdgeRoute' } }
        learned_routes: { type: array, items: { $ref: '#/components/schemas/EdgeRoute' } }
        units:
          type: array
          items:
            type: object
            required: [name, state]
            properties:
              name: { type: string, examples: [ankra-transit-nat64.service] }
              state: { type: string, examples: [active, inactive, failed] }
        counters:
          type: array
          items:
            type: object
            required: [rule, packets, bytes, nat64]
            properties:
              rule: { type: string }
              packets: { type: integer }
              bytes: { type: integer }
              nat64: { type: boolean }
    EdgeRouterPlan:
      type: object
      required: [checked_at, digest, refusal, problem, has_changes, files]
      properties:
        checked_at: { type: string, format: date-time }
        digest: { type: [string, 'null'], description: 'Names the rendering; an apply is started with it. Null for an edge that cannot be rendered.' }
        refusal: { type: [string, 'null'], description: 'Why the configuration may not be applied; null when it may.' }
        problem: { type: [string, 'null'], description: 'Why the edge could not be read.' }
        has_changes: { type: boolean }
        files:
          type: array
          items:
            type: object
            required: [path, status, diff]
            properties:
              path: { type: string, examples: [/etc/wireguard/wg-sto1-1.conf] }
              status: { type: string, enum: [unchanged, changed, added, retired] }
              diff: { type: [string, 'null'], description: 'The edge''s file against the rendered one, every line with its context.' }
    GatewayUplinkMovePlan:
      type: object
      required: [checked_at, refusal, problem, current, target, already_there, rollback_target, diff]
      properties:
        checked_at: { type: string, format: date-time }
        refusal: { type: [string, 'null'], description: 'Why the gateway may not be moved to the uplink; null when it may.' }
        problem: { type: [string, 'null'], description: 'Why the gateway could not be read.' }
        current:
          description: The peer the gateway has now; null when it could not be read.
          oneOf:
            - $ref: '#/components/schemas/GatewayUplinkPeer'
            - type: 'null'
        target: { $ref: '#/components/schemas/GatewayUplinkPeer' }
        already_there: { type: boolean }
        rollback_target: { type: boolean }
        diff: { type: [string, 'null'], description: 'The [Peer] the gateway has against the one it gets.' }
    GatewayUplinkPeer:
      type: object
      required: [public_key, endpoint]
      properties:
        public_key: { type: string }
        endpoint: { type: string, examples: ['136.148.210.54:51821'] }
    EdgeRouterOperation:
      type: object
      required: [id, kind, status, step, error, actor, created_at, started_at, finished_at, gateway_uplink_id, source_gateway_uplink_id, rollback]
      properties:
        id: { type: string }
        kind: { type: string, enum: [edge_router.apply, gateway_uplink.move] }
        gateway_uplink_id: { type: [string, 'null'], description: 'The uplink a gateway_uplink.move goes to.' }
        source_gateway_uplink_id: { type: [string, 'null'], description: 'The uplink a gateway_uplink.move leaves.' }
        rollback: { type: boolean, description: 'A move that goes back to the configuration the gateway kept.' }
        status: { type: string, enum: [pending, running, succeeded, failed, cancelled] }
        step: { type: [string, 'null'], description: 'The step it runs next; null once done.' }
        error: { type: [string, 'null'] }
        actor: { type: string, examples: ['staff:ops@ankra.io'] }
        created_at: { type: string, format: date-time }
        started_at: { type: [string, 'null'], format: date-time }
        finished_at: { type: [string, 'null'], format: date-time }
    EdgeRouterOperationEvent:
      type: object
      required: [id, operation_id, occurred_at, kind, message, data]
      properties:
        id: { type: string }
        operation_id: { type: string }
        occurred_at: { type: string, format: date-time }
        kind: { type: string, examples: [edge_router.apply, gateway_uplink.move] }
        message: { type: string }
        data: { type: object, additionalProperties: true }
    EdgeRoute:
      type: object
      required: [network, device, gateway, protocol]
      properties:
        network: { type: string }
        device: { type: [string, 'null'], description: 'Null when the edge has no route for a routed prefix.' }
        gateway: { type: [string, 'null'] }
        protocol: { type: [string, 'null'] }
    AdoptEdgeRouterRequest:
      type: object
      additionalProperties: false
      required: [name, region, autonomous_system]
      properties:
        name: { type: string }
        region: { type: string }
        management: { type: string, enum: [managed, external] }
        public_ipv4: { type: string }
        public_ipv6: { type: string }
        ssh_address: { type: string }
        ssh_port: { type: integer }
        ssh_host_key_fingerprint: { type: string }
        uplink_interface: { type: string }
        autonomous_system: { type: integer }
        nat64_enabled: { type: boolean }
        nat64_prefix: { type: string }
        protected_networks: { type: array, items: { type: string } }
        rollback_seconds: { type: integer }
        prefixes:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [prefix]
            properties:
              prefix: { type: string }
              routed_address: { type: string }
        downstream:
          type: object
          additionalProperties: false
          required: [name, listen_port, tunnel_address, peer_tunnel_address, peer_public_key]
          properties:
            name: { type: string }
            listen_port: { type: integer }
            tunnel_address: { type: string }
            peer_tunnel_address: { type: string }
            peer_public_key: { type: string }
            peer_source_address: { type: string }
        uplinks:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [zone, gateway_name, gateway_public_address, gateway_public_key, gateway_autonomous_system, edge_interface, edge_listen_port,
              edge_transit_address4, gateway_transit_address4, edge_transit_address6, gateway_transit_address6, edge_link_local]
            properties:
              zone: { type: string }
              gateway_name: { type: string }
              gateway_node_id: { type: string }
              gateway_public_address: { type: string }
              gateway_interface: { type: string }
              gateway_public_key: { type: string }
              gateway_autonomous_system: { type: integer }
              edge_interface: { type: string }
              edge_listen_port: { type: integer }
              edge_public_key: { type: string }
              edge_endpoint: { type: string }
              edge_transit_address4: { type: string }
              gateway_transit_address4: { type: string }
              edge_transit_address6: { type: string }
              gateway_transit_address6: { type: string }
              edge_link_local: { type: string }
              presented_autonomous_system: { type: integer }
              gateway_ssh_address: { type: string, description: 'An address of the gateway that stays reachable while its transit moves (control link or tailnet).' }
              gateway_ssh_port: { type: integer }
              gateway_ssh_host_key_fingerprint: { type: string }
              state: { type: string, enum: [active, standby] }
    HostDetail:
      type: object
      required: [host, operations, events, control_link]
      properties:
        host: { $ref: '#/components/schemas/Host' }
        control_link:
          description: The host's control-plane link; null when it has none.
          oneOf:
            - $ref: '#/components/schemas/ControlLink'
            - type: 'null'
        operations:
          type: array
          description: The host's operations, newest first (at most 10).
          items: { $ref: '#/components/schemas/HostOperation' }
        events:
          type: array
          description: The newest operation's events, oldest first (at most 1000).
          items: { $ref: '#/components/schemas/HostOperationEvent' }
    HostOperation:
      type: object
      required: [id, kind, status, step, error, created_at, started_at, finished_at]
      properties:
        id: { type: string }
        kind: { type: string, enum: [host.probe, host.install, host.join_tailnet, host.move_tailnet_user, host.reprovision_plan, host.reprovision] }
        status: { type: string, enum: [pending, running, succeeded, failed, cancelled] }
        step: { type: [string, 'null'], description: 'The step it runs next; null once done.' }
        error: { type: [string, 'null'] }
        created_at: { type: string, format: date-time }
        started_at: { type: [string, 'null'], format: date-time }
        finished_at: { type: [string, 'null'], format: date-time }
    HostOperationEvent:
      type: object
      required: [id, operation_id, occurred_at, kind, message, data]
      properties:
        id: { type: string }
        operation_id: { type: string }
        occurred_at: { type: string, format: date-time }
        kind: { type: string, examples: [host.probe.facts, host.install.control_link, host.install.plan, host.install.output, host.tailnet, host.reprovision] }
        message: { type: string }
        data: { type: object, additionalProperties: true }
    HostOperationEnvelope:
      type: object
      required: [operation]
      properties:
        operation: { $ref: '#/components/schemas/HostOperation' }
    TailnetMember:
      type: object
      description: A machine headscale knows.
      required: [id, name, given_name, user, addresses, online, last_seen, node_id, zone]
      properties:
        id: { type: string, description: "headscale's node id." }
        name: { type: string, description: The hostname it joined with. }
        given_name: { type: string, description: Its MagicDNS name. }
        user: { type: string, description: The headscale user it is registered under. }
        addresses: { type: array, items: { type: string }, examples: [['100.64.0.7', 'fd7a:115c:a1e0::7']] }
        online: { type: boolean }
        last_seen: { type: [string, 'null'], format: date-time }
        node_id: { type: [string, 'null'], description: 'The registered node it is; null for a machine that is not one.' }
        zone: { type: [string, 'null'] }
    NodeTailnet:
      type: object
      required: [configured, login_server, node_id, hostname, zone, region, region_user, members, host_id, can_join, can_move, action_note, operation, events]
      properties:
        configured: { type: boolean, description: 'Whether the control plane has a headscale URL and API key.' }
        login_server: { type: [string, 'null'], examples: ['https://headscale.ankra.cloud'] }
        node_id: { type: string }
        hostname: { type: string }
        zone: { type: string }
        region: { type: string }
        region_user: { type: string, description: "The region's headscale user, named after the region." }
        members:
          type: array
          description: The headscale entries that joined as the node's hostname, under any user.
          items: { $ref: '#/components/schemas/TailnetMember' }
        host_id: { type: [string, 'null'], description: 'The console record the node was added with; null for a node joined by hand.' }
        can_join: { type: boolean }
        can_move: { type: boolean }
        action_note: { type: [string, 'null'], description: 'Why neither action is on offer.' }
        operation:
          description: "The host's newest tailnet operation; null when it has none."
          oneOf:
            - $ref: '#/components/schemas/HostOperation'
            - type: 'null'
        events:
          type: array
          description: The events of that operation, oldest first (at most 200).
          items: { $ref: '#/components/schemas/HostOperationEvent' }
    NodeTailnetEnvelope:
      type: object
      required: [tailnet]
      properties:
        tailnet: { $ref: '#/components/schemas/NodeTailnet' }
    RegionTailnet:
      type: object
      required: [configured, login_server, region, user, user_exists, members, elsewhere, not_on_tailnet]
      properties:
        configured: { type: boolean }
        login_server: { type: [string, 'null'] }
        region: { type: string }
        user: { type: string, description: "The region's headscale user." }
        user_exists: { type: boolean, description: 'False until the first host of the region joined.' }
        members:
          type: array
          items: { $ref: '#/components/schemas/TailnetMember' }
        elsewhere:
          type: array
          description: "The region's nodes on the tailnet under another user (move them)."
          items: { $ref: '#/components/schemas/TailnetMember' }
        not_on_tailnet:
          type: array
          description: "The region's registered nodes no headscale entry matches."
          items:
            type: object
            required: [node_id, hostname, zone]
            properties:
              node_id: { type: string }
              hostname: { type: string }
              zone: { type: string }
    RegionTailnetEnvelope:
      type: object
      required: [tailnet]
      properties:
        tailnet: { $ref: '#/components/schemas/RegionTailnet' }
    Host:
      type: object
      required: [id, address, ssh_port, zone, roles, datacenter, rack, underlay, storage, gateway, ssh_allowed_networks, wireguard_endpoint,
        autonomous_system, skip_burn_in, allocation, installed_arguments, adopts_node_id, reprovisionable, state, reason, host_key_fingerprint,
        host_key_confirmed, agent_version, node_id, node_hostname, facts, created_by, created_at, updated_at]
      properties:
        id: { type: string }
        address: { type: string }
        ssh_port: { type: integer }
        zone: { type: string }
        roles: { type: array, items: { type: string } }
        datacenter: { type: [string, 'null'] }
        rack: { type: [string, 'null'] }
        underlay: { type: [string, 'null'] }
        storage:
          type: object
          required: [policy, local_storage_file, local_storage_size_gibibytes]
          properties:
            policy: { type: [string, 'null'] }
            local_storage_file: { type: [string, 'null'] }
            local_storage_size_gibibytes: { type: [integer, 'null'] }
        gateway:
          type: [object, 'null']
          description: The gateway's link to the internet; the transit and upstream fields are null on a provider_native gateway.
          required: [uplink, public_interface, transit_address, upstream_peer, upstream_autonomous_system, transit_address6, upstream_peer6,
            provider_gateway6]
          properties:
            uplink: { type: string, enum: [bgp, provider_native] }
            public_interface: { type: string }
            transit_address: { type: [string, 'null'] }
            upstream_peer: { type: [string, 'null'] }
            upstream_autonomous_system: { type: [integer, 'null'] }
            transit_address6: { type: [string, 'null'] }
            upstream_peer6: { type: [string, 'null'] }
            provider_gateway6: { type: [string, 'null'] }
        ssh_allowed_networks: { type: array, items: { type: string } }
        wireguard_endpoint: { type: [string, 'null'] }
        autonomous_system: { type: [integer, 'null'], description: 'The fabric AS the join token carries; null leaves it to the installer.' }
        installed_arguments:
          type: array
          items: { type: string }
          description: >-
            The `ankra-node install` arguments the server was installed (or last reprovisioned) with, without the join
            token; rendered from the request for a host that registered before they were recorded, empty before it
            registered.
          examples: [[install, --api, 'https://cloud.example.test', --underlay, wireguard, --wireguard-endpoint, '188.165.208.189:51820']]
        adopts_node_id: { type: [string, 'null'], description: 'The registered node the host was added for, to adopt it.' }
        reprovisionable: { type: boolean, description: 'Whether the node''s roles can be changed: it registered or was adopted and its host key is confirmed.' }
        skip_burn_in: { type: boolean }
        allocation:
          description: The allocation the server registers with; null when it was added without one (public).
          oneOf:
            - $ref: '#/components/schemas/HostAllocation'
            - type: 'null'
        state:
          type: string
          enum: [probing, awaiting_network, awaiting_confirmation, installing, registered, burn_in, ready, failed, forgotten]
          description: >-
            probing → awaiting_confirmation (or awaiting_network) → installing → registered → burn_in → ready; failed
            with `reason` from any step. forgotten only in the answer to `remove_host`.
        reason: { type: [string, 'null'], description: 'Why the host failed or awaits its network.' }
        host_key_fingerprint: { type: [string, 'null'], description: 'SHA256 fingerprint of the host key the last probe was offered.' }
        host_key_confirmed: { type: boolean, description: 'Whether staff confirmed (pinned) the host key.' }
        agent_version: { type: [string, 'null'] }
        node_id: { type: [string, 'null'] }
        node_hostname: { type: [string, 'null'] }
        facts:
          oneOf:
            - { $ref: '#/components/schemas/HostFacts' }
            - { type: 'null' }
        created_by: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    HostFacts:
      type: object
      description: What the last probe read; nothing on the server was changed to read it.
      required: [operating_system, kernel, architecture, hostname, cpu, memory_bytes, disks, reachability, has_curl, probed_at]
      properties:
        operating_system:
          type: object
          required: [id, version_id, pretty_name, supported]
          properties:
            id: { type: string, examples: [debian] }
            version_id: { type: string, examples: ['13'] }
            pretty_name: { type: string }
            supported: { type: boolean }
        kernel: { type: string }
        architecture: { type: string, examples: [x86_64] }
        hostname: { type: string }
        cpu:
          type: object
          required: [model, logical_cpus, sockets, hardware_virtualisation, hypervisor]
          properties:
            model: { type: string }
            logical_cpus: { type: integer }
            sockets: { type: integer }
            hardware_virtualisation: { type: boolean, description: 'VT-x or AMD-V offered to the node''s VMs.' }
            hypervisor: { type: string, description: 'systemd-detect-virt; none on bare metal.' }
        memory_bytes: { type: integer }
        disks:
          type: array
          items:
            type: object
            required: [name, type, size_bytes, rotational]
            properties:
              name: { type: string }
              type: { type: string }
              size_bytes: { type: integer }
              model: { type: string }
              serial: { type: string }
              rotational: { type: boolean }
              filesystem_type: { type: string }
              mountpoints: { type: array, items: { type: string } }
              children: { type: array, items: { type: string } }
        default_route:
          type: object
          required: [interface]
          properties:
            interface: { type: string }
            gateway: { type: string }
            addresses: { type: array, items: { type: string } }
        reachability:
          type: array
          description: Whether the server opened a TCP connection to each control plane endpoint nodes are given.
          items:
            type: object
            required: [target, reachable]
            properties:
              target: { type: string, examples: ['api cloud.example.com:443'] }
              reachable: { type: boolean }
              detail: { type: string }
        has_curl: { type: boolean }
        probed_at: { type: string, format: date-time }
    NextCursor:
      type: [string, 'null']
      description: Pass as `?cursor=` for the next page; null on the last page.

    Permission:
      type: string
      enum: [read, operate, members.manage, tokens.manage, billing.read, billing.manage, self]
    Role:
      type: string
      enum: [owner, admin, member, viewer]
    AssignableRole:
      type: string
      description: Nobody can be made owner through the API.
      enum: [admin, member, viewer]
    TokenScope:
      type: string
      description: >-
        `read` (any read the role allows, no writes), `read_write` (everything the role allows), or a
        comma-separated list of permissions from read, operate, billing.read, billing.manage and self, stored in
        that order; a list always includes read and self. tokens.manage and members.manage cannot be granted.
      pattern: '^(read|read_write|(read|operate|billing\.read|billing\.manage|self)(,(read|operate|billing\.read|billing\.manage|self))*)$'
      example: read,operate,self

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string }
        password: { type: string }
        end_other_sessions:
          type: boolean
          default: false
          description: Sign the user out everywhere else once this sign-in succeeds; the response reports `ended_sessions`.
    SignupRequest:
      type: object
      additionalProperties: false
      required: [name, email, password]
      properties:
        name: { type: string, minLength: 1, maxLength: 128, description: 'Your name.' }
        email: { type: string, format: email, maxLength: 254 }
        password: { type: string, minLength: 12, maxLength: 1024 }
        account_name: { type: string, maxLength: 128, description: 'Defaults to `name`.' }
        coupon_code: { type: string, maxLength: 64, description: 'A coupon code redeemed for the new account, for example from `/signup?coupon=WELCOME500`.', examples: ['WELCOME500'] }
    User:
      type: object
      required: [id, email, account_id, role]
      properties:
        id: { type: string }
        email: { type: string }
        name: { type: string, description: 'Set for users who signed up themselves.' }
        account_id: { type: string }
        role: { $ref: '#/components/schemas/Role' }
    SignupAccepted:
      type: object
      required: [detail, email]
      properties:
        detail: { type: string, description: 'The same sentence for every accepted sign-up.' }
        email: { type: string, description: 'The address as it was stored: trimmed and lowercased.' }
    SignupCoupon:
      type: object
      required: [code, applied]
      properties:
        code: { type: string, examples: ['WELCOME500'] }
        applied: { type: boolean }
        reason:
          type: string
          enum: [unknown, inactive, not_yet_valid, expired, exhausted, already_redeemed, unavailable]
          description: Why the code was not applied; `unavailable` means it could not be checked (redeem it later in Settings, Billing).
        message: { type: string }
        credit: { $ref: '#/components/schemas/Credit' }
    IssuedSession:
      type: object
      required: [user, csrf_token, expires_at]
      properties:
        user: { $ref: '#/components/schemas/User' }
        csrf_token: { type: string }
        expires_at: { type: string, format: date-time }
        ended_sessions: { type: integer, description: 'Sign-in only: how many other sessions `end_other_sessions` ended.' }
    SecondFactorChallenge:
      type: object
      required: [mfa_required, mfa_step, challenge, expires_at]
      properties:
        mfa_required: { type: boolean, const: true }
        mfa_step:
          type: string
          enum: [verify, enroll]
          description: '`verify` asks for a code or a recovery code; `enroll` sets up an authenticator first, because it is required.'
        challenge: { type: string, description: 'Signed, short-lived (5 minutes to verify, 15 to set up); opens no session by itself.' }
        expires_at: { type: string, format: date-time }
    SecondFactorChallengeRequest:
      type: object
      additionalProperties: false
      required: [challenge]
      properties:
        challenge: { type: string }
    SecondFactorLoginRequest:
      type: object
      additionalProperties: false
      required: [challenge]
      properties:
        challenge: { type: string }
        code: { type: string, description: 'Six digits from the authenticator app.', examples: ['123456'] }
        recovery_code: { type: string, description: 'One of the single-use recovery codes (verify only).', examples: ['abcd-efgh-jkmn'] }
    StaffEnrollmentRequest:
      type: object
      additionalProperties: false
      required: [challenge]
      properties:
        challenge: { type: string }
        invite: { type: string, description: 'The enrolment invite from the link an admin sent (the `invite` of its fragment).', examples: ['asi_Q2h5c2x2c2VjcmV0'] }
    StaffEnrollmentConfirmRequest:
      type: object
      additionalProperties: false
      required: [challenge]
      properties:
        challenge: { type: string }
        code: { type: string, description: 'Six digits from the authenticator app.', examples: ['123456'] }
        invite: { type: string, description: 'The same enrolment invite as the setup step.' }
    StaffEnrollmentInvite:
      type: object
      additionalProperties: false
      required: [invite_url, expires_at]
      properties:
        invite_url: { type: string, format: uri, description: "The admin console's enrolment page with the invite in the fragment.", examples: ['https://admin.cloud.ankra.app/admin/enroll#invite=asi_Q2h5c2x2c2VjcmV0'] }
        expires_at: { type: string, format: date-time }
    SecondFactorProof:
      type: object
      additionalProperties: false
      properties:
        code: { type: string, description: 'Six digits from the authenticator app.', examples: ['123456'] }
        recovery_code: { type: string, description: 'One of the single-use recovery codes.' }
    AuthenticatorCodeRequest:
      type: object
      additionalProperties: false
      required: [code]
      properties:
        code: { type: string, description: 'Six digits from the authenticator app.', examples: ['123456'] }
    AuthenticatorSetup:
      type: object
      required: [secret, otpauth_uri, expires_at]
      properties:
        secret: { type: string, description: 'Base32, for typing into the app.' }
        otpauth_uri: { type: string, description: 'otpauth://totp/… for the QR code; render it locally.' }
        expires_at: { type: string, format: date-time, description: 'Confirm with the first code before this.' }
    RecoveryCodes:
      type: object
      required: [recovery_codes]
      properties:
        recovery_codes:
          type: array
          items: { type: string }
          description: Ten single-use codes, shown once.
    SecondFactorSession:
      allOf:
        - $ref: '#/components/schemas/IssuedSession'
        - type: object
          properties:
            recovery_codes: { type: array, items: { type: string }, description: 'After a setup at sign-in: the ten recovery codes, shown once.' }
            recovery_codes_remaining: { type: integer, description: 'After a code check: how many unused recovery codes are left.' }
            return_to: { type: string, description: 'After an identity provider sign-in: where the portal continues.' }
    SecondFactorStatus:
      type: object
      required: [totp_enabled, totp_pending, enabled_at, recovery_codes_remaining, required_by_account, available]
      properties:
        totp_enabled: { type: boolean }
        totp_pending: { type: boolean, description: 'A setup was started and waits for its first code.' }
        enabled_at: { type: [string, 'null'], format: date-time }
        recovery_codes_remaining: { type: integer }
        required_by_account: { type: boolean, description: 'The owner requires a second factor of every member; it cannot be turned off.' }
        available: { type: boolean, description: 'False when the control plane has no secret key and cannot seal authenticator secrets.' }
    Impersonation:
      type: object
      required: [staff_email, staff_name, reason, mode, expires_at, account_id]
      properties:
        staff_email: { type: string }
        staff_name: { type: string }
        reason: { type: string }
        mode: { $ref: '#/components/schemas/SupportMode' }
        expires_at: { type: string, format: date-time }
        account_id: { type: string }
    SupportMode:
      type: string
      enum: [read_only, elevated]
      description: '`read_only` sessions change nothing and read no credential (database passwords, object storage keys, the console, instance metadata, payment methods). `elevated` sessions act like the customer, except that no support session manages API tokens, members, payment methods or support consents.'
    CurrentUser:
      type: object
      required: [user, csrf_token, impersonation, permissions, identities, email_verified, email_verification_required]
      properties:
        email_verified: { type: boolean, description: 'Whether the user''s email address is verified.' }
        email_verification_required:
          type: boolean
          description: >-
            Whether the routes marked `x-ankra-verified-email` still refuse the user: the address is not verified and
            this deployment can send the link (`POST /v1/auth/email-verification`).
        user: { $ref: '#/components/schemas/User' }
        csrf_token: { type: string }
        impersonation:
          oneOf:
            - $ref: '#/components/schemas/Impersonation'
            - type: 'null'
        permissions:
          type: array
          items: { $ref: '#/components/schemas/Permission' }
        identities:
          type: array
          description: The identity provider identities linked to the user (empty without a provider).
          items: { $ref: '#/components/schemas/LinkedIdentity' }
    LinkedIdentity:
      type: object
      required: [id, provider, provider_name, subject_hint, linked_at, last_login_at]
      properties:
        id: { type: string }
        provider: { type: string, description: 'The issuer URL.', examples: ['https://auth.platform.ankra.app'] }
        provider_name: { type: string, description: 'The upstream provider, from the subject''s connection prefix: Google (`google-oauth2`), GitHub (`github`), Microsoft (`waad`, `windowslive`, `microsoft`), the provider''s own accounts for `auth0` or no prefix (the display name, default "Ankra account"), else the prefix itself.', examples: ['GitHub'] }
        subject_hint: { type: string, description: 'The connection and the last characters of the subject; never the subject itself.', examples: ['google-oauth2|…7890'] }
        linked_at: { type: string, format: date-time }
        last_login_at: { type: [string, 'null'], format: date-time }
    PasswordResetStatus:
      type: object
      required: [available]
      properties:
        available: { type: boolean, description: 'False when this deployment cannot send email.' }
    PasswordResetRequest:
      type: object
      additionalProperties: false
      required: [email]
      properties:
        email: { type: string, format: email, maxLength: 254 }
    PasswordResetAccepted:
      type: object
      required: [detail]
      properties:
        detail: { type: string, examples: ['If an account exists for that address, we sent a link to reset its password. It works for 30 minutes.'] }
    PasswordResetConfirmation:
      type: object
      additionalProperties: false
      required: [token, password]
      properties:
        token: { type: string, maxLength: 256, description: 'The `token` query parameter of the reset link.' }
        password: { type: string, minLength: 12, maxLength: 1024 }
    EmailVerificationRequest:
      type: object
      required: [status, email]
      properties:
        status: { type: string, enum: [sent, already_verified] }
        email: { type: string, description: 'The address the link goes to.' }
    EmailVerificationConfirmation:
      type: object
      additionalProperties: false
      required: [token]
      properties:
        token: { type: string, maxLength: 256, description: 'The `token` query parameter of the verification link.' }
    EmailVerificationResult:
      type: object
      required: [email, email_verified]
      properties:
        email: { type: string }
        email_verified: { type: boolean, const: true }
    EmailVerificationRefusalProblem:
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          required: [reason]
          properties:
            reason: { type: string, enum: [invalid_token, expired_token, used_token] }
    PasswordResetRefusalProblem:
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          required: [reason]
          properties:
            reason: { type: string, enum: [invalid_token, expired_token, used_token, weak_password] }
    IdentityProviderStatus:
      type: object
      required: [configured, connections, providers]
      properties:
        configured: { type: boolean }
        display_name: { type: string, description: 'The first provider''s button label; present when configured.', examples: ['Ankra account', 'Google'] }
        icon:
          type: string
          enum: [google, microsoft, github, generic]
          description: The mark on the first provider's "Continue with `display_name`" button; `google` when the deployment signs in with Google directly (issuer `https://accounts.google.com`). Absent draws none (also when the mark is the Ankra one, which `providers[0].icon` carries).
        silent_sign_in:
          type: boolean
          description: Whether the portal should first try a silent sign-in (`prompt=none`) at the first provider; true for a broker whose session the Ankra platform shares (Auth0), false for a direct provider such as Google or Microsoft.
        connections:
          type: array
          description: The first provider's upstream providers offered as one-click buttons, in the order `ANKRA_CLOUD_OIDC_CONNECTIONS` lists them; empty when none are configured or no provider is.
          items: { $ref: '#/components/schemas/IdentityProviderConnection' }
        providers:
          type: array
          description: Every sign-in provider in the order of their buttons (`ANKRA_CLOUD_OIDC_PROVIDERS`); the first is the primary one. Empty when no provider is configured.
          items: { $ref: '#/components/schemas/IdentityProvider' }
    IdentityProvider:
      type: object
      required: [name, display_name, silent_sign_in, connections]
      properties:
        name: { type: string, description: 'Passed as `provider=` to the login and sign-up routes.', pattern: '^[a-z][a-z0-9]{0,31}$', examples: ['ankra', 'google', 'microsoft'] }
        display_name: { type: string, examples: ['Ankra account', 'Microsoft'] }
        icon:
          type: string
          enum: [ankra, google, microsoft, github, generic]
          description: The mark on the "Continue with `display_name`" button; absent draws none.
        silent_sign_in: { type: boolean, description: 'Whether the portal may try a silent sign-in (`prompt=none`) at this provider: a broker with a session other Ankra applications share.' }
        connections:
          type: array
          description: The upstream providers this (Auth0) provider offers as one-click buttons of their own; empty for a direct provider.
          items: { $ref: '#/components/schemas/IdentityProviderConnection' }
    IdentityProviderConnection:
      type: object
      required: [name, display_name, icon]
      properties:
        name: { type: string, description: 'The provider connection name, passed as `connection=` to the login and sign-up routes.', examples: ['github'] }
        display_name: { type: string, examples: ['GitHub'] }
        icon: { type: string, enum: [google, microsoft, github, generic] }

    Zone:
      type: object
      required: [name, region, display_name, created_at]
      properties:
        name: { type: string, examples: ['de-fsn1'] }
        region: { type: string }
        display_name: { type: string, examples: ['Falkenstein 1'] }
        created_at: { type: string, format: date-time }
        underlay: { type: string, enum: [fabric, wireguard], description: "How the zone's hosts reach each other (ADR 0004): `fabric` is a private network, `wireguard` the encrypted underlay." }
        country: { type: string, examples: ['DE'], description: "The zone's region's ISO 3166-1 alpha-2 country code." }
        position: { type: integer, minimum: 0, maximum: 10000, description: 'Where the zone is listed, lowest first (then by name); regions follow the position of their first zone.' }
        customer_visible:
          type: boolean
          description: >-
            False for a zone hidden from customers: a customer only sees it, and places new resources in it, when the
            account may use hidden zones or has private hosts there. Operators always see every zone.
        is_private_cloud:
          type: boolean
          description: >-
            True, in a customer's listing, on a zone in which Ankra dedicated compute hosts to the caller's account (its
            private cloud): the account's servers there run only on its own hosts. Hidden zone access alone never sets
            it; always false for operators.
    ZoneList:
      type: object
      required: [items, next_cursor]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Zone' } }
        next_cursor: { $ref: '#/components/schemas/NextCursor' }
    ZoneCapabilities:
      type: object
      required: [stage, servers, gateways, storage_backends, features, underlay, datacenters, latency_budget, default_storage_tier,
        ceph_tiers_offered, ceph_tiers_unavailable_reason]
      properties:
        stage: { type: integer, minimum: 0, maximum: 3, description: '1 for one server, 2 for two, 3 from three on; 0 before any server registered.' }
        servers: { type: integer, minimum: 0, description: 'Nodes with a gateway, storage or compute role.' }
        gateways: { type: integer, minimum: 0 }
        compute_nodes: { type: integer, minimum: 0, description: 'The hypervisor hosts servers are placed on; 0 in a network-only location.' }
        storage_backends:
          type: array
          items: { type: string, enum: [ankra-local, ceph, ankra-s3-single] }
          description: '`ankra-local` is Local NVMe on the storage nodes, `ceph` is Ankra Storage, `ankra-s3-single` the single-node S3 server.'
        features:
          type: object
          required: [compute, live_migration, ha_restart, load_balancer_ha, separate_edges]
          properties:
            compute: { type: boolean, description: 'False in a network-only location: the zone has no compute node and runs no servers.' }
            live_migration: { type: boolean }
            ha_restart: { type: boolean }
            load_balancer_ha: { type: boolean }
            separate_edges: { type: boolean }
        reasons:
          type: object
          additionalProperties: { type: string }
          description: Why the zone lacks each feature that is false, keyed by the feature's name.
          examples: [{ compute: 'network-only location: IPv6 and IPv4 routing; the zone has no compute nodes' }]
        underlay: { type: string, enum: [fabric, wireguard], description: "How the zone's hosts reach each other (ADR 0004): `fabric` is a private network, `wireguard` the encrypted underlay." }
        datacenters: { type: array, items: { $ref: '#/components/schemas/Datacenter' }, description: Where the zone's nodes stand. }
        latency_budget:
          type: array
          items: { $ref: '#/components/schemas/DatacenterLink' }
          description: >-
            Every pair of the zone's datacenters (a datacenter with itself included) rated against the budget measured
            over the underlay: Ankra Storage replicates across hosts only under 2 ms p95 RTT, live migration needs under 5 ms and at
            least 1 Gbit/s.
        storage_durability:
          type: string
          enum: [replicated, degraded, single_copy]
          description: >-
            `replicated` is Ankra Storage on three or more hosts; `degraded` is Ankra Storage on two hosts (a zone that set ceph_min_hosts to
            2): two copies, and writes continue on one while a host is down; `single_copy` is Ankra Local only.
        storage_durability_reason: { type: [string, 'null'], description: Why the durability is not replicated. }
        storage_copies:
          type: string
          examples: ['2 copies, one per host']
          description: >-
            How many copies of a volume on the zone's replicated tiers its storage keeps and where, as its policy last
            converged: "3 copies, one per host" from three storage hosts, "2 copies, one per host" in a two-host zone, "1
            copy" while the zone has no active replicated storage (every volume is Ankra Local on one host).
        default_storage_tier:
          type: string
          description: >-
            The tier a new server's disk or a new storage gets in the zone when the request names none: `standard` once the
            zone offers the Ankra Storage tiers, `local-nvme` before.
          examples: [standard]
        ceph_tiers_offered:
          type: boolean
          description: >-
            Whether new storages and server disks may use the Ankra Storage tiers (`backend: ceph`) in the zone. The Ankra Local tiers
            (`backend: ankra-local` in `GET /v1/storage-tiers`) are offered either way.
        ceph_tiers_unavailable_reason:
          type: [string, 'null']
          description: 'Why the Ankra Storage tiers are not offered: Ankra Storage is not active yet, or replicates below size 3 / min_size 2 on three hosts without the operator override.'
        public_ipv4:
          type: object
          required: [total, free]
          description: >-
            The zone's public IPv4 addresses for a server's IPv4 add-on: `total` is what the pools an allocation takes
            from span, `free` what no server, floating IP or NAT gateway has taken there. A zone with `free: 0` cannot
            give a new server (create_server with `public_ipv4: true`) or an existing one (add_server_public_ipv4,
            409) an address.
          properties:
            total: { type: integer, minimum: 0 }
            free: { type: integer, minimum: 0 }
        cpu_pools:
          type: array
          description: The compute nodes grouped by exact CPU; servers are placed in one and migrate within it.
          items:
            type: object
            required: [name, vendor, family, model, flag_count, nodes]
            properties:
              name: { type: string, examples: ['amd-f25-3fa9c21b07'] }
              vendor: { type: string }
              family: { type: integer }
              model: { type: string }
              flag_count: { type: integer }
              nodes: { type: integer }
        backup_targets:
          type: array
          items: { type: string, enum: [ceph, vault, zone-object-store] }
          description: '`ceph` is the zone''s Ankra Storage, `vault` the region''s off-host backup vault, `zone-object-store` the zone''s single-node S3 server.'
        local_storage:
          type: object
          description: Whether the zone's Ankra Local (`local-nvme`) storage takes new volumes now.
          required: [accepts_new_volumes, reason]
          properties:
            accepts_new_volumes: { type: boolean, description: False when every Ankra Local thin pool of the zone is too full or too overcommitted for a new volume. }
            reason: { type: [string, 'null'], description: Why some or all of the zone's pools take no new volumes; null when every pool does. }
        warnings:
          type: array
          items: { type: string }
          description: What limits the zone's durability, such as a backup target on the same host as the volumes, or local storage pools that take no new volumes.
        recovery:
          type: string
          enum: [none, restore, restart]
          description: >-
            What brings a server back after its host is lost. `restart`: the control plane restarts it on another host
            from the zone's replicated storage. `restore`: nothing restarts it, but its volumes' backups are in the
            region's backup vault outside the zone, so the account can restore them as new storages (by hand; no
            operation does it by itself). `none`: it returns only with its host.
        recovery_reason: { type: [string, 'null'], description: Why recovery is not a restart. }
        gateway_redundancy:
          type: string
          enum: [none, single, redundant]
          description: '`single`: the zone has one gateway, and its public networking stops while that host is down.'
        gateway_redundancy_reason: { type: [string, 'null'] }
        uplink_redundancy:
          type: string
          enum: [none, single, redundant, unknown]
          description: >-
            `redundant`: at least two gateways each reach the internet through a different edge router. `single`: one
            gateway or one edge router carries every uplink, or (a `provider_native` zone) each gateway's public addresses
            are routed to that host and do not move. `unknown`: no gateway uplink is recorded for the zone.
        uplink_redundancy_reason: { type: [string, 'null'] }
        object_storage_durability:
          type: string
          enum: [none, single_copy, degraded, replicated]
          description: >-
            How many copies of an object survive a host loss: `single_copy` on the zone's single-node S3 server, Ankra
            Storage's durability once the zone serves objects from its replicated object storage, `none` while the zone has no object storage.
        offsite_backups:
          type: boolean
          description: >-
            Whether backups of the zone's volumes go to a backup vault outside the zone. False while the region has no
            vault, while its vault is served from the zone itself, and while the zone backs up into its own Ankra Storage cluster.
        offsite_backups_reason: { type: [string, 'null'], description: Why backups do not leave the zone. }
        default_backup:
          description: >-
            The backup rule a new server disk or storage gets in the zone when its request names none: a zone that keeps
            one copy of every volume backs each new one up to its region's backup vault unless the request sets
            `acknowledge_single_copy_without_backup`. Null when the zone applies no default (replicated storage, or no
            backup vault yet).
          oneOf:
            - type: object
              required: [interval, retention_days]
              properties:
                interval: { type: string, enum: [daily] }
                retention_days: { type: integer, examples: [7] }
            - type: 'null'
    Region:
      type: object
      required: [name, display_name, country, control_plane_endpoint, zones, created_at]
      properties:
        name: { type: string, examples: ['eu-central'] }
        display_name: { type: string, examples: ['Europe Central'] }
        country: { type: string, pattern: '^[A-Z]{2}$', examples: ['DE'] }
        control_plane_endpoint: { type: [string, 'null'], description: "The regional control plane's API URL; null while the global one serves the region." }
        zones: { type: array, items: { $ref: '#/components/schemas/Zone' }, description: The region's zones by name. }
        created_at: { type: string, format: date-time }
        is_private_cloud: { type: boolean, description: "True, in a customer's listing, when one of the region's zones holds hosts dedicated to the caller's account." }
    RegionEnvelope:
      type: object
      required: [region]
      properties:
        region: { $ref: '#/components/schemas/Region' }
    RegionList:
      type: object
      required: [items, next_cursor]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Region' } }
        next_cursor: { $ref: '#/components/schemas/NextCursor' }
    CreateRegionRequest:
      type: object
      additionalProperties: false
      required: [name, display_name, country]
      properties:
        name: { type: string, pattern: '^[a-z0-9]+(-[a-z0-9]+)*$', maxLength: 32, examples: ['eu-central'] }
        display_name: { type: string, examples: ['Europe Central'] }
        country: { type: string, examples: ['DE'], description: ISO 3166-1 alpha-2; upper-cased. }
        control_plane_endpoint: { type: string, description: "The regional control plane's https API URL; empty while the global one serves the region." }
    UpdateRegionRequest:
      type: object
      additionalProperties: false
      properties:
        display_name: { type: string }
        country: { type: string, description: ISO 3166-1 alpha-2; upper-cased. }
        control_plane_endpoint: { type: string, description: 'An https URL, or empty for the global control plane.' }
    ZoneEnvelope:
      type: object
      required: [zone]
      properties:
        zone: { $ref: '#/components/schemas/Zone' }
    StaffZone:
      allOf:
        - $ref: '#/components/schemas/Zone'
        - type: object
          required: [public_uplink, autonomous_system, nat64_egress_addresses, nat64_ports_per_client, nat64, retired_at]
          properties:
            public_uplink: { type: string, enum: [bgp, provider_native], description: "How the zone's gateways reach the internet (ADR 0008)." }
            autonomous_system:
              type: [integer, 'null']
              description: >-
                The zone's private ASN, carried by every join token for the zone; null when nobody recorded it, and hosts
                added there then join with the installer's default 65001.
              examples: [65004]
            nat64_egress_addresses:
              type: array
              items: { type: string }
              description: >-
                The NAT64 egress IPv4 addresses recorded on the zone; empty when the zone's NAT64 comes from
                `ANKRA_CLOUD_ZONE_NAT64_EGRESS_ADDRESSES` (or it has none).
            nat64_ports_per_client:
              type: [integer, 'null']
              description: >-
                The source ports each client /64 gets from the zone's NAT64, set on the zone; null leaves it to
                `ANKRA_CLOUD_ZONE_NAT64_PORTS_PER_CLIENT`.
              examples: [2048]
            nat64: { $ref: '#/components/schemas/ZoneNAT64' }
            retired_at:
              type: [string, 'null']
              format: date-time
              description: When the zone was retired; null while it is in service.
    ZoneNAT64:
      type: object
      description: >-
        The zone's effective NAT64 and where each part comes from. Egress addresses recorded on the zone take precedence
        over the zone's `ANKRA_CLOUD_ZONE_NAT64_EGRESS_ADDRESSES` entry, and ports per client set on the zone over
        `ANKRA_CLOUD_ZONE_NAT64_PORTS_PER_CLIENT`; the connection limits are the environment's for every zone.
      required: [source, egress_addresses, environment_egress_addresses, ports_per_client, ports_per_client_source, environment_ports_per_client,
        connections_per_client, new_connections_per_second]
      properties:
        source: { type: string, enum: [zone, environment, none], description: "Where the egress addresses come from; none: the zone's gateways serve no NAT64." }
        egress_addresses: { type: array, items: { type: string }, description: The addresses the zone's gateways translate to. }
        environment_egress_addresses: { type: array, items: { type: string }, description: "The zone's `ANKRA_CLOUD_ZONE_NAT64_EGRESS_ADDRESSES` entry, the fallback." }
        ports_per_client: { type: integer, description: The source ports each client /64 gets. }
        ports_per_client_source: { type: string, enum: [zone, environment] }
        environment_ports_per_client: { type: integer, description: '`ANKRA_CLOUD_ZONE_NAT64_PORTS_PER_CLIENT`, the fallback.' }
        connections_per_client: { type: integer }
        new_connections_per_second: { type: integer }
    RetireZoneRequest:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason: { type: string, minLength: 10, maxLength: 500, description: 'Why, one line; recorded in the platform audit chain.' }
        release_servers:
          type: boolean
          description: >-
            Accept that the zone retirement loop force-releases the customer servers left in the zone (their storages stay);
            a zone that runs any is refused without it.
    UnretireZoneRequest:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason: { type: string, minLength: 10, maxLength: 500, description: 'Why, one line; recorded in the platform audit chain.' }
    ZoneRetirementOutcome:
      type: object
      required: [zone, changed, active_servers]
      properties:
        zone: { $ref: '#/components/schemas/StaffZone' }
        changed: { type: boolean, description: False when the zone already was as asked; nothing is then recorded. }
        active_servers: { type: integer, description: The customer servers the zone runs (a retirement releases them). }
    StaffZoneEnvelope:
      type: object
      required: [zone]
      properties:
        zone: { $ref: '#/components/schemas/StaffZone' }
    StaffZoneList:
      type: object
      required: [items, next_cursor]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/StaffZone' } }
        next_cursor: { $ref: '#/components/schemas/NextCursor' }
    CreateZoneRequest:
      type: object
      additionalProperties: false
      required: [name, region, display_name]
      properties:
        name: { type: string, examples: ['de-fsn1'], description: '<country>-<site><number>.' }
        region: { type: string, examples: ['eu-central'] }
        display_name: { type: string, examples: ['Falkenstein 1'] }
        position: { type: integer, minimum: 0, maximum: 10000, description: 'Where the zone is listed, lowest first; 100 when absent.' }
        customer_visible: { type: boolean, description: Whether customers see the zone and may place new resources in it; true when absent. }
        underlay: { type: string, enum: [fabric, wireguard], description: "How the zone's hosts reach each other; fabric when absent." }
        public_uplink: { type: string, enum: [bgp, provider_native], description: "How the zone's gateways reach the internet; bgp when absent." }
        autonomous_system:
          type: integer
          description: 'A private ASN (64512 to 65534 or 4200000000 to 4294967294) every join token for the zone carries.'
          examples: [65005]
        nat64_egress_addresses:
          type: array
          maxItems: 16
          items: { type: string }
          description: >-
            Public IPv4 addresses the zone's gateways translate NAT64 to: on a bgp zone addresses of its public networks
            outside the allocatable range, on a provider_native zone the gateways' own public IPv4 addresses.
    UpdateZoneRequest:
      type: object
      additionalProperties: false
      properties:
        display_name: { type: string, minLength: 1, maxLength: 100 }
        position: { type: integer, minimum: 0, maximum: 10000 }
        customer_visible: { type: boolean }
        autonomous_system: { type: integer, description: 'A private ASN (64512 to 65534 or 4200000000 to 4294967294).' }
        nat64_egress_addresses:
          type: array
          maxItems: 16
          items: { type: string }
          description: The zone's NAT64 egress IPv4 addresses; an empty list hands the zone's NAT64 back to the environment.
        nat64_ports_per_client:
          type: integer
          minimum: 0
          maximum: 64512
          description: Source ports per client /64 in the zone, 64 to 64512; 0 hands them back to the environment.
        allow_single_copy_without_vault:
          type: boolean
          description: >-
            With `customer_visible: true`, lists the zone for customers although it keeps one copy of every volume and no
            backup vault outside the zone holds their backups. Needs `override_reason`; recorded in the platform audit
            chain as `zone.override_single_copy_gate` when it set a refusal aside.
        override_reason:
          type: string
          minLength: 10
          maxLength: 500
          description: Why the single-copy gate is overridden, one line.
    SetZoneUnderlayRequest:
      type: object
      additionalProperties: false
      required: [underlay]
      properties:
        underlay: { type: string, enum: [fabric, wireguard] }
    IPPool:
      type: object
      required: [id, zone, network, family, gateway, first_address, last_address, nameservers, vni, delegation_prefix_length, state, created_at, node_id]
      properties:
        id: { type: string }
        zone: { type: string }
        network: { type: string, examples: ['2a13:7c82:103a:100::/56'] }
        family: { type: integer, enum: [4, 6] }
        gateway: { type: string }
        first_address: { type: string }
        last_address: { type: string }
        nameservers: { type: array, items: { type: string } }
        vni: { type: integer, description: VXLAN network identifier of the public network. }
        delegation_prefix_length: { type: [integer, 'null'], description: 'The prefix each server gets from an IPv6 pool: 64 on a routed /44 to /60, 80 on a routed /64 to /72 and on a provider /64 bound to its gateway node; null on an IPv4 pool.' }
        state: { type: string, enum: [active, draining] }
        created_at: { type: string, format: date-time }
        node_id: { type: [string, 'null'], description: 'The gateway node whose public interface holds a host-scoped IPv6 pool on-link (ADR 0008), or the gateway node a provider delivers a host-attached IPv4 pool to; null on a pool every gateway of the zone serves.' }
    IPPoolEnvelope:
      type: object
      required: [ip_pool]
      properties:
        ip_pool: { $ref: '#/components/schemas/IPPool' }
    IPPoolList:
      type: object
      required: [items, next_cursor]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/IPPool' } }
        next_cursor: { $ref: '#/components/schemas/NextCursor' }
    CreateIPPoolRequest:
      type: object
      additionalProperties: false
      required: [network, nameservers]
      properties:
        network: { type: string, examples: ['2a13:7c82:103a:100::/56'] }
        gateway: { type: string, description: 'The gateway address inside the prefix. Required unless the pool is a host-attached IPv4 pool (an IPv4 network with `node`), whose gateway is the link-local next hop its node holds: the one the node has already, or the lowest free address of 169.254.0.0/24 in the zone, when absent.' }
        first_address: { type: string, description: 'The first assignable address. Required unless the pool is a host-attached IPv4 pool: the network''s first address when absent.' }
        last_address: { type: string, description: 'The last assignable address. Required unless the pool is a host-attached IPv4 pool: the network''s last address when absent.' }
        nameservers: { type: array, minItems: 1, items: { type: string }, description: DNS resolvers handed to servers. }
        vni: { type: integer, description: VXLAN network identifier of the public network; 200 when absent. }
        state: { type: string, enum: [active, draining], description: 'active when absent; draining has the gateways announce the pool before it delegates anything.' }
        node:
          type: string
          description: >-
            The identifier or hostname of the gateway node whose public interface holds this IPv6 network on-link: a
            provider /64 delegated in /80s (ADR 0008). Refused unless the zone's public uplink is provider_native, the node
            is a gateway of the zone and it reports an address inside the /64 with prefix length 64. With an IPv4 network,
            the gateway node whose provider delivers these addresses to its host (a host-attached pool, a /24 to a /32):
            refused unless the node is a gateway of the zone that holds none of the addresses on its own interfaces.
        delegation_prefix_length: { type: integer, enum: [64, 80], description: 'The prefix each server gets, longer than the network: 64 on a routed /44 to /60, 80 on a routed /64 to /72 (whose gateway lies in its first /80) and on a pool with `node`; the one the network allows when absent.' }
    SetPublicUplinkRequest:
      type: object
      additionalProperties: false
      required: [mode]
      properties:
        mode: { type: string, enum: [bgp, provider_native], description: 'bgp: the gateways announce routed pools upstream over eBGP. provider_native: one gateway holds the provider /64 of its public interface and reaches the internet through the provider gateway (ADR 0008).' }
    PublicUplink:
      type: object
      required: [zone, public_uplink]
      properties:
        zone: { type: string }
        public_uplink: { type: string, enum: [bgp, provider_native] }
    SetIPPoolStateRequest:
      type: object
      additionalProperties: false
      required: [state]
      properties:
        state: { type: string, enum: [active, draining] }
    Fleet:
      type: object
      required: [generated_at, rollup, latest_agent_build, regions]
      properties:
        generated_at: { type: string, format: date-time, description: The instant liveness and heartbeat ages are computed at. }
        rollup: { $ref: '#/components/schemas/FleetRollup' }
        latest_agent_build:
          description: The newest build of the artefact store, which each node's `agent_is_current` is measured against; null while the store holds none.
          oneOf:
            - $ref: '#/components/schemas/AgentBuildReference'
            - type: 'null'
        regions: { type: array, items: { $ref: '#/components/schemas/FleetRegion' } }
    FleetRegion:
      type: object
      required: [name, display_name, country, control_plane_endpoint, rollup, zones]
      properties:
        name: { type: string }
        display_name: { type: string }
        country: { type: string }
        control_plane_endpoint: { type: [string, 'null'] }
        rollup: { $ref: '#/components/schemas/FleetRollup' }
        zones: { type: array, items: { $ref: '#/components/schemas/FleetZone' } }
    FleetZone:
      allOf:
        - $ref: '#/components/schemas/Zone'
        - type: object
          required: [capabilities, truncated, rollup, nodes]
          properties:
            capabilities:
              type: object
              required: [stage, features, reasons, storage_backends, storage_durability, warnings, recovery, gateway_redundancy,
                uplink_redundancy, object_storage_durability, offsite_backups]
              properties:
                recovery: { type: string, enum: [none, restore, restart], description: What brings a server back after its host is lost. }
                gateway_redundancy: { type: string, enum: [none, single, redundant] }
                uplink_redundancy: { type: string, enum: [none, single, redundant, unknown] }
                object_storage_durability: { type: string, enum: [none, single_copy, degraded, replicated] }
                offsite_backups: { type: boolean, description: Whether backups of the zone's volumes go to a backup vault outside the zone. }
                stage: { type: integer, minimum: 0, maximum: 3 }
                features:
                  type: object
                  required: [compute, live_migration, ha_restart, load_balancer_ha, separate_edges]
                  properties:
                    compute: { type: boolean }
                    live_migration: { type: boolean }
                    ha_restart: { type: boolean }
                    load_balancer_ha: { type: boolean }
                    separate_edges: { type: boolean }
                reasons: { type: object, additionalProperties: { type: string } }
                storage_backends: { type: array, items: { type: string } }
                storage_durability: { type: string, enum: [replicated, degraded, single_copy] }
                warnings: { type: array, items: { type: string } }
            truncated: { type: boolean, description: The zone has more nodes than the fleet lists; nodes and rollup cover the first 2000 by hostname. }
            rollup: { $ref: '#/components/schemas/FleetRollup' }
            nodes: { type: array, items: { $ref: '#/components/schemas/FleetNode' } }
            ceph:
              description: The zone's replicated storage (Ankra Storage, the Ceph backend); null when the zone never had one.
              oneOf:
                - type: object
                  required: [state, replication_size]
                  properties:
                    state: { type: string, enum: [inactive, bootstrapping, active] }
                    replication_size: { type: [integer, 'null'], minimum: 1, maximum: 3, description: 'Copies kept of each object as the last rebalance converged it; null when unknown.' }
                - type: 'null'
    FleetAddressPools:
      type: object
      required: [pools, draining_pools, total, allocated, available]
      description: Address pools of one family. IPv4 counts assignable addresses; IPv6 counts the prefixes the pools delegate to servers (a /64 or a /80 each).
      properties:
        pools: { type: integer, minimum: 0 }
        draining_pools: { type: integer, minimum: 0, description: Pools that hand out nothing new. }
        total: { type: integer, minimum: 0, description: What every pool holds. }
        allocated: { type: integer, minimum: 0, description: What is taken from the pools. }
        available: { type: integer, minimum: 0, description: What the active pools have left. }
    FleetCeph:
      type: object
      required: [active_zones, osd_hosts, volumes, provisioned_gibibytes]
      description: The replicated storage as the control plane knows it. The cluster's raw and free bytes are not reported by the agents yet.
      properties:
        active_zones: { type: integer, minimum: 0, description: Zones whose Ceph serves volumes. }
        osd_hosts: { type: integer, minimum: 0, description: Hosts holding at least one OSD at the last rebalance. }
        volumes: { type: integer, minimum: 0, description: Volumes online or in maintenance on Ceph. }
        provisioned_gibibytes: { type: integer, minimum: 0, description: Their size added up. }
    FleetRollup:
      type: object
      required: [nodes, servers, cores, memory_mebibytes, local_storage, ipv4, ipv6, ceph]
      properties:
        nodes:
          type: object
          required: [total, pending, online, suspect, offline, unhealthy, compute, available]
          properties:
            total: { type: integer, minimum: 0 }
            pending: { type: integer, minimum: 0 }
            online: { type: integer, minimum: 0 }
            suspect: { type: integer, minimum: 0 }
            offline: { type: integer, minimum: 0 }
            unhealthy: { type: integer, minimum: 0, description: 'Nodes whose last heartbeat reported a gating component (`kvm`, `boot`) unhealthy.' }
            compute: { type: integer, minimum: 0 }
            available: { type: integer, minimum: 0, description: 'Compute nodes that take new servers now (online, schedulable, with KVM).' }
        servers: { type: integer, minimum: 0 }
        cores:
          type: object
          required: [logical, schedulable, allocated, free, available]
          properties:
            logical: { type: integer, minimum: 0 }
            schedulable: { type: integer, minimum: 0, description: Logical CPUs times the overcommit ratio. }
            allocated: { type: integer, minimum: 0 }
            free: { type: integer, minimum: 0 }
            available: { type: integer, minimum: 0 }
        memory_mebibytes:
          type: object
          required: [total, schedulable, allocated, free, available]
          properties:
            total: { type: integer, minimum: 0 }
            schedulable: { type: integer, minimum: 0, description: The total less every compute node's host reservation. }
            allocated: { type: integer, minimum: 0 }
            free: { type: integer, minimum: 0 }
            available: { type: integer, minimum: 0 }
        local_storage: { $ref: '#/components/schemas/FleetLocalStorage' }
        ipv4: { $ref: '#/components/schemas/FleetAddressPools' }
        ipv6: { $ref: '#/components/schemas/FleetAddressPools' }
        ceph: { $ref: '#/components/schemas/FleetCeph' }
    FleetLocalStorage:
      type: object
      required: [disk_total_bytes, allocated_gibibytes, pools, refusing_pools, pool_size_bytes, pool_provisioned_bytes, pool_used_bytes]
      properties:
        disk_total_bytes: { type: integer, minimum: 0, description: The raw disk capacity the inventories report; 0 for an agent that reports none. }
        allocated_gibibytes: { type: integer, minimum: 0, description: The Ankra Local storage pinned to the nodes. }
        pools: { type: integer, minimum: 0, description: Nodes that report an Ankra Local thin pool. }
        refusing_pools: { type: integer, minimum: 0, description: Thin pools too full or too overcommitted to take a new volume. }
        pool_size_bytes: { type: integer, minimum: 0, description: The reported thin pools' physical size added up. }
        pool_provisioned_bytes: { type: integer, minimum: 0, description: 'What their volumes provision (thin, so it may pass the size).' }
        pool_used_bytes: { type: integer, minimum: 0, description: "The bytes written, by the fuller of each pool's data and metadata areas." }
    FleetNodeLocalStorage:
      type: object
      required: [disk_total_bytes, allocated_gibibytes, pool]
      properties:
        disk_total_bytes: { type: integer, minimum: 0, description: The raw disk capacity the inventory reports; 0 for an agent that reports none. }
        allocated_gibibytes: { type: integer, minimum: 0, description: The Ankra Local storage pinned to the node. }
        pool:
          oneOf:
            - { $ref: '#/components/schemas/FleetLocalPool' }
            - { type: 'null' }
          description: The node's Ankra Local thin pool; null on a node whose agent reports none (no pool, or an agent older than the report).
    FleetLocalPool:
      type: object
      description: |
        A node's Ankra Local thin pool as its last heartbeat reported it. A thin pool that reaches 100 % of its data
        or of its metadata stops every volume in it, so new volumes stop at `maximum_used_percent`, and at
        `maximum_overcommit_ratio` times the pool's size provisioned.
      required: [size_bytes, data_percent, metadata_percent, provisioned_bytes, reserved_bytes, overcommit_ratio, maximum_used_percent,
        maximum_overcommit_ratio, accepts_new_volumes, refusal]
      properties:
        size_bytes: { type: integer, minimum: 1, description: "The pool's data size: the physical bytes its volumes share." }
        data_percent: { type: number, minimum: 0, maximum: 100 }
        metadata_percent: { type: number, minimum: 0, maximum: 100 }
        provisioned_bytes: { type: integer, minimum: 0, description: 'The virtual sizes of the pool''s volumes added up: the larger of what the agent counted (templates included, snapshots not) and what the control plane pinned to the node.' }
        reserved_bytes:
          type: integer
          minimum: 0
          description: >-
            The node's Ankra Storage volume when it is a thin volume in this pool (storage policy both), outside
            provisioned_bytes. While the pool holds one, its volumes are placed only in the rest of the pool and never
            overcommit it; 0 when the volume is thick or the node has none.
        overcommit_ratio: { type: number, minimum: 0, description: provisioned_bytes over size_bytes. }
        maximum_used_percent: { type: number, description: 'New volumes stop when data or metadata reach this (ANKRA_CLOUD_LOCAL_POOL_MAX_USED_PERCENT, default 80).' }
        maximum_overcommit_ratio: { type: number, description: 'New volumes stop when one would take the pool past this (ANKRA_CLOUD_LOCAL_POOL_MAX_OVERCOMMIT_RATIO, default 1.5).' }
        accepts_new_volumes: { type: boolean }
        refusal: { type: [string, 'null'], description: Why the pool takes no new volumes; null while it does. }
    FleetNodeUsage:
      type: object
      required: [has_kvm, cores, memory_mebibytes, local_storage]
      properties:
        has_kvm: { type: boolean }
        cores:
          type: object
          required: [logical, overcommit_ratio, schedulable, allocated, free]
          properties:
            logical: { type: integer, minimum: 0 }
            overcommit_ratio: { type: integer, minimum: 1 }
            schedulable: { type: integer, minimum: 0 }
            allocated: { type: integer, minimum: 0 }
            free: { type: integer, description: Negative on a node allocated past its budget. }
        memory_mebibytes:
          type: object
          required: [total, reserved, schedulable, allocated, free]
          properties:
            total: { type: integer, minimum: 0 }
            reserved: { type: integer, minimum: 0, description: Kept free for the host OS and the agent. }
            schedulable: { type: integer }
            allocated: { type: integer, minimum: 0 }
            free: { type: integer, description: Negative on a node allocated past its budget. }
        local_storage: { $ref: '#/components/schemas/FleetNodeLocalStorage' }
    FleetNode:
      type: object
      required: [id, hostname, zone, rack, datacenter, roles, liveness, last_heartbeat_at, heartbeat_age_seconds, schedulable, available, maintenance,
        agent_version, agent_commit, agent_built_at, agent_is_current, agent_upgrade, provisioning_state, unhealthy_components,
        advisory_unhealthy_components, server_count, usage, allocation, rollout_canary]
      properties:
        id: { type: string }
        hostname: { type: string }
        zone: { type: string }
        rack: { type: [string, 'null'] }
        datacenter: { type: [string, 'null'] }
        roles: { type: array, items: { type: string } }
        liveness: { type: string, enum: [pending, online, suspect, offline] }
        last_heartbeat_at: { type: [string, 'null'], format: date-time }
        heartbeat_age_seconds: { type: [integer, 'null'], minimum: 0, description: Seconds since the last heartbeat; null before the first. }
        schedulable: { type: boolean, description: 'False while the node is cordoned, draining or fenced.' }
        available: { type: boolean, description: 'A compute node that takes new servers now (online, schedulable, with KVM).' }
        maintenance: { $ref: '#/components/schemas/NodeMaintenance' }
        agent_version: { type: string }
        agent_commit: { type: string }
        agent_built_at: { type: [string, 'null'], format: date-time }
        agent_is_current: { type: boolean, description: "True when the node's agent reports the commit of the fleet's `latest_agent_build`." }
        agent_upgrade:
          oneOf:
            - $ref: '#/components/schemas/NodeAgentUpgrade'
            - type: 'null'
        provisioning_state: { type: string }
        unhealthy_components:
          type: array
          items: { type: string }
          description: >-
            The gating components (`kvm`, `boot`) the node's last heartbeat reported unhealthy. Only these hold the node's
            maintenance, its agent upgrade and an agent rollout.
        advisory_unhealthy_components:
          type: array
          items: { type: string }
          description: >-
            The other components the node's last heartbeat reported unhealthy (`frr_bgp`, `vrrp`, `conntrackd`,
            `ceph_client`, `watchdog_armed`, `time_sync`). They are shown and alerted on at warning severity and hold nothing.
        server_count: { type: integer, minimum: 0, description: Servers placed on the node. }
        usage: { $ref: '#/components/schemas/FleetNodeUsage' }
        allocation: { $ref: '#/components/schemas/NodeAllocation' }
        rollout_canary: { type: boolean, description: "True for a node marked as one of its zone's rollout canaries: a fleet rollout takes it first (`set_node_rollout_canary`)." }
    MonitoringCredential:
      type: object
      required: [id, cluster, created_at, expires_at, last_used_at]
      properties:
        id: { type: string }
        cluster: { type: string }
        created_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
        last_used_at: { type: [string, 'null'], format: date-time }
    MonitoringStatus:
      type: object
      required: [generated_at, credentials, jobs, network_configured]
      properties:
        generated_at: { type: string, format: date-time }
        credentials: { type: array, items: { $ref: '#/components/schemas/MonitoringCredential' } }
        jobs:
          type: array
          items:
            type: object
            required: [name, target_count, targets_path]
            properties:
              name: { type: string, enum: [ankra-cloud-api, ankra-node, ceph, node, ankra-cloud-db-supervisor] }
              target_count: { type: integer, minimum: 0 }
              targets_path: { type: string }
        network_configured: { type: boolean }
    SetupChecklist:
      type: object
      required: [generated_at, live, steps]
      properties:
        generated_at: { type: string, format: date-time }
        live: { type: boolean, description: Customers can create servers somewhere. }
        steps:
          type: array
          items:
            type: object
            required: [key, status, detail, zones]
            properties:
              key: { type: string, enum: [region, zone, zone_network, servers, compute_online, offering, ipv6, ipv4, monitoring, go_live] }
              status: { type: string, enum: [done, todo, attention, optional] }
              detail: { type: string, description: 'What the step found, in a sentence.' }
              zones: { type: array, items: { type: string }, description: 'The zones a per-zone step is not done for (zone_network: the zones without a recorded autonomous system), or the live zones for go_live.' }
    NodeAllocation:
      type: object
      description: >-
        Who the host's compute capacity is offered to. `public` hosts are the region's public offering and serve every
        account of their zone; a `private` host serves only `account`, whose servers in the zone then run only on its
        private hosts; an `unassigned` host takes no new servers. Changing it moves no running server.
      required: [kind, account, change]
      properties:
        kind: { type: string, enum: [public, private, unassigned] }
        account:
          description: The account a private host is dedicated to; null otherwise.
          oneOf:
            - type: object
              required: [id, name]
              properties:
                id: { type: string }
                name: { type: string }
            - type: 'null'
        change:
          description: The last staff change; null for a host never changed.
          oneOf:
            - type: object
              required: [at, staff_id, reason]
              properties:
                at: { type: string, format: date-time }
                staff_id: { type: [string, 'null'] }
                reason: { type: string }
            - type: 'null'
    StaffNodeAllocationRequest:
      type: object
      additionalProperties: false
      required: [kind, reason]
      properties:
        kind: { type: string, enum: [public, private, unassigned] }
        account_id: { type: string, description: 'The account a private host is dedicated to; required for private, refused otherwise.' }
        reason: { type: string, minLength: 10, maxLength: 500, description: Why; one line. }
    StaffNodeAllocationAnswer:
      type: object
      required: [node, servers_outside_allocation]
      properties:
        node: { $ref: '#/components/schemas/FleetNodeDetail' }
        servers_outside_allocation:
          type: integer
          minimum: 0
          description: Servers still running on the host that the new allocation would not place there; draining the host moves them.
    StaffNodeActionRequest:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason: { type: string, minLength: 10, maxLength: 500, description: Why; one line. }
    StaffNodeMaintenanceRequest:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason: { type: string, minLength: 10, maxLength: 500, description: Why; one line. }
        agent_version: { type: string, description: A build of the artefact store to upgrade the agent to; empty keeps the running one. }
        reboot: { type: boolean, description: Reboot the node once it is drained (and upgraded). }
        mode:
          type: string
          enum: [evacuate, in-place]
          description: As `start_zone_node_maintenance` takes it; absent chooses evacuate when every server can move.
    StaffNodeAgentUpgradeRequest:
      type: object
      additionalProperties: false
      required: [version, reason]
      properties:
        version: { type: string, description: A build of the artefact store (see `list_agent_builds`). }
        reason: { type: string, minLength: 10, maxLength: 500, description: Why; one line. }
    AgentBuildReference:
      type: object
      required: [version, commit]
      properties:
        version: { type: string }
        commit: { type: string }
    AgentBuild:
      type: object
      required: [version, commit, sha256, size_bytes, has_guest, uploaded_at, uploaded_by, nodes_running]
      properties:
        version: { type: string }
        commit: { type: string }
        sha256: { type: string, description: "Lowercase hex digest of the `ankra-node` binary." }
        size_bytes: { type: integer, minimum: 1 }
        has_guest: { type: boolean, description: "Whether the build carries the `ankra-guest` binary that an upgrade installs with it." }
        uploaded_at: { type: string, format: date-time }
        uploaded_by: { type: string, description: "`release:<commit>` for a build the release published, `operator:<name>` for an uploaded one." }
        nodes_running: { type: integer, minimum: 0, description: "Nodes whose agent reports the build's commit." }
    AgentBuildList:
      type: object
      required: [items, next_cursor]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/AgentBuild' } }
        next_cursor: { $ref: '#/components/schemas/NextCursor' }
    StartAgentRolloutRequest:
      type: object
      additionalProperties: false
      required: [version, reason]
      properties:
        version: { type: string, description: A build of the artefact store (see `list_agent_builds`). }
        reason: { type: string, minLength: 10, maxLength: 500, description: "Why; one line. Recorded on the rollout and on every node operation." }
        zones: { type: array, items: { type: string }, description: Limit the rollout to these zones; absent or empty takes every zone. }
        auto_promote_after_seconds: { type: integer, minimum: 60, maximum: 86400, default: 1800, description: "How long each zone's canaries soak, healthy, before the rollout continues on its own." }
        allow_without_canary: { type: boolean, default: false, description: 'Take zones that have no canary node instead of refusing them. For the simulation; a release never sets it.' }
    AgentRollout:
      type: object
      required: [id, version, commit, status, reason, started_by, started_at, finished_at, zones, error, auto_promote_after_seconds, allow_without_canary,
        awaiting_promotion, promoted_zones, nodes]
      properties:
        id: { type: string }
        version: { type: string }
        commit: { type: string, description: "The build's commit; a node is done once its agent reports it." }
        status: { type: string, enum: [running, awaiting_promotion, succeeded, failed, cancelled], description: "`awaiting_promotion` is the pause after a zone's canaries took the build; it is as unfinished as `running`." }
        reason: { type: string }
        started_by: { type: string, description: "`staff:<staff id>` or `release:<commit>`." }
        started_at: { type: string, format: date-time }
        finished_at: { type: [string, 'null'], format: date-time }
        zones: { type: array, items: { type: string }, description: The zones the rollout is limited to; empty means every zone. }
        error: { type: [string, 'null'], description: "Which node failed and why, which zones were refused, or who cancelled or superseded the rollout; null otherwise." }
        auto_promote_after_seconds: { type: integer, minimum: 60, maximum: 86400, description: "How long each zone's canaries soak before the rollout continues on its own." }
        allow_without_canary: { type: boolean, description: True for a rollout that takes zones without a canary node instead of refusing them. }
        awaiting_promotion:
          description: The pause of a rollout whose status is `awaiting_promotion`; null otherwise.
          oneOf:
            - type: object
              required: [zone, since, auto_promote_at]
              properties:
                zone: { type: string, description: The zone whose canaries took the build and whose other nodes wait. }
                since: { type: string, format: date-time, description: "When the zone's canary stage completed." }
                auto_promote_at: { type: string, format: date-time, description: When the rollout continues on its own if the canaries stay healthy. }
            - type: 'null'
        promoted_zones: { type: array, items: { type: string }, description: 'The zones whose canary stage was promoted, by the soak or by staff.' }
        nodes: { type: array, items: { $ref: '#/components/schemas/AgentRolloutNode' }, description: The nodes in the order the rollout takes them. }
    AgentRolloutNode:
      type: object
      required: [node_id, hostname, zone, roles, canary, status, detail, operation_id, started_at, finished_at]
      properties:
        node_id: { type: string }
        hostname: { type: string }
        zone: { type: string }
        roles: { type: array, items: { type: string } }
        canary: { type: boolean, description: "Whether the node was one of its zone's canaries when the rollout started." }
        status: { type: string, enum: [pending, upgrading, succeeded, failed, skipped] }
        detail: { type: [string, 'null'], description: "Why the node was skipped or failed, or what a pending node waits for; null otherwise." }
        operation_id: { type: [string, 'null'], description: "The node's `node.agent_upgrade` operation once it started (see `get_fleet_node_operation`)." }
        started_at: { type: [string, 'null'], format: date-time }
        finished_at: { type: [string, 'null'], format: date-time }
    AgentRolloutEnvelope:
      type: object
      required: [rollout]
      properties:
        rollout: { $ref: '#/components/schemas/AgentRollout' }
    AgentRolloutList:
      type: object
      required: [items, next_cursor]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/AgentRollout' } }
        next_cursor: { $ref: '#/components/schemas/NextCursor' }
    PrivateCloudRequestState:
      type: string
      enum: [open, in_review, fulfilled, declined, withdrawn]
      description: >-
        `open` waits for staff, `in_review` is being worked on, `fulfilled` means the hosts are dedicated, `declined`
        carries the staff's reason, `withdrawn` was taken back by the account.
    PrivateCloudAmounts:
      type: object
      required: [vcpus, memory_gibibytes, disk_gigabytes]
      properties:
        vcpus: { type: integer }
        memory_gibibytes: { type: integer }
        disk_gigabytes: { type: integer }
    CreatePrivateCloudRequest:
      type: object
      additionalProperties: false
      required: [vcpus, memory_gibibytes, disk_gigabytes]
      properties:
        vcpus: { type: integer, minimum: 1, description: 'vCPUs wanted; at least `minimums.vcpus`.' }
        memory_gibibytes: { type: integer, minimum: 1, description: 'Memory wanted in GiB; at least `minimums.memory_gibibytes`.' }
        disk_gigabytes: { type: integer, minimum: 1, description: 'Disk wanted in GB; at least `minimums.disk_gigabytes`.' }
        region: { type: [string, 'null'], description: 'The region wanted (a name from `list_regions`); null or absent for any.' }
        notes: { type: [string, 'null'], maxLength: 2000, description: 'Anything staff should know: workloads, timing, contacts.' }
    PrivateCloudRequest:
      type: object
      required: [id, state, vcpus, memory_gibibytes, disk_gigabytes, region, notes, staff_reason, requested_by_email, created_at, updated_at, decided_at]
      properties:
        id: { type: string }
        state: { $ref: '#/components/schemas/PrivateCloudRequestState' }
        vcpus: { type: integer }
        memory_gibibytes: { type: integer }
        disk_gigabytes: { type: integer }
        region: { type: [string, 'null'] }
        notes: { type: string }
        staff_reason: { type: [string, 'null'], description: 'What staff said when they last moved the request on; a decline always carries one.' }
        requested_by_email: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        decided_at: { type: [string, 'null'], format: date-time, description: 'When the request was fulfilled, declined or withdrawn.' }
    PrivateCloudRequestEnvelope:
      type: object
      required: [request]
      properties:
        request: { $ref: '#/components/schemas/PrivateCloudRequest' }
    PrivateCloudRequestList:
      type: object
      required: [items, next_cursor]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/PrivateCloudRequest' } }
        next_cursor: { $ref: '#/components/schemas/NextCursor' }
    PrivateCloudCapacity:
      type: object
      description: >-
        Dedicated capacity and what the account's servers on it take. `vcpus` is the vCPU budget the scheduler places
        against (each logical CPU carries 4 vCPUs), `memory_mebibytes` the memory servers may take (each host keeps 2 GiB
        for itself), `disk_gigabytes` the hosts' raw disk. `local_storage_used_gibibytes` is the Ankra Local volumes the
        account keeps on the hosts.
      required: [host_count, logical_cpus, vcpus, vcpus_used, memory_mebibytes, memory_used_mebibytes, disk_gigabytes, local_storage_used_gibibytes, server_count]
      properties:
        host_count: { type: integer }
        logical_cpus: { type: integer }
        vcpus: { type: integer }
        vcpus_used: { type: integer }
        memory_mebibytes: { type: integer }
        memory_used_mebibytes: { type: integer }
        disk_gigabytes: { type: integer }
        local_storage_used_gibibytes: { type: integer }
        server_count: { type: integer }
    PrivateCloudZone:
      allOf:
        - type: object
          required: [zone, zone_display_name, region, region_display_name]
          properties:
            zone: { type: string }
            zone_display_name: { type: string }
            region: { type: string }
            region_display_name: { type: string }
        - $ref: '#/components/schemas/PrivateCloudCapacity'
    PrivateCloudServer:
      type: object
      required: [id, hostname, title, zone, plan, cores, memory_mebibytes, state]
      properties:
        id: { type: string }
        hostname: { type: string }
        title: { type: string }
        zone: { type: string }
        plan: { type: string }
        cores: { type: integer }
        memory_mebibytes: { type: integer }
        state: { type: string, description: 'The server state as `get_server` reports it.' }
    PrivateCloudOverview:
      type: object
      required: [has_private_hosts, minimums, maximums, totals, zones, servers, servers_truncated, open_request, recent_requests]
      properties:
        has_private_hosts: { type: boolean }
        minimums: { $ref: '#/components/schemas/PrivateCloudAmounts' }
        maximums: { $ref: '#/components/schemas/PrivateCloudAmounts' }
        totals: { $ref: '#/components/schemas/PrivateCloudCapacity' }
        zones: { type: array, items: { $ref: '#/components/schemas/PrivateCloudZone' } }
        servers: { type: array, items: { $ref: '#/components/schemas/PrivateCloudServer' } }
        servers_truncated: { type: boolean }
        open_request:
          oneOf:
            - $ref: '#/components/schemas/PrivateCloudRequest'
            - type: 'null'
        recent_requests: { type: array, items: { $ref: '#/components/schemas/PrivateCloudRequest' } }
    StaffPrivateCloudRequest:
      allOf:
        - $ref: '#/components/schemas/PrivateCloudRequest'
        - type: object
          required: [account_id, account_name, decided_by_staff_email]
          properties:
            account_id: { type: string }
            account_name: { type: string }
            decided_by_staff_email: { type: [string, 'null'], description: 'The staff member who last moved the request on.' }
    StaffPrivateCloudRequestEnvelope:
      type: object
      required: [request]
      properties:
        request: { $ref: '#/components/schemas/StaffPrivateCloudRequest' }
    StaffPrivateCloudRequestDetail:
      type: object
      required: [request, private_host_count]
      properties:
        request: { $ref: '#/components/schemas/StaffPrivateCloudRequest' }
        private_host_count: { type: integer, description: 'Compute hosts dedicated to the account today.' }
    StaffPrivateCloudRequestList:
      type: object
      required: [items, next_cursor]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/StaffPrivateCloudRequest' } }
        next_cursor: { $ref: '#/components/schemas/NextCursor' }
    SetPrivateCloudRequestState:
      type: object
      additionalProperties: false
      required: [state]
      properties:
        state: { type: string, enum: [in_review, fulfilled, declined] }
        reason: { type: [string, 'null'], description: 'Required to decline (10 to 500 characters, one line); the customer sees it.' }
    PlaygroundState:
      type: string
      enum: [provisioning, ready, deleting, deleted]
      description: >-
        `provisioning` until the API is ready, `ready` until it expires or is ended, `deleting` until everything it ran
        is gone, then `deleted`.
    PlaygroundLimits:
      type: object
      description: What the playground's workloads may use; the control plane's own reservation comes on top.
      required: [vcpus, memory_mebibytes, storage_gibibytes, pods, volumes]
      properties:
        vcpus: { type: integer, minimum: 1 }
        memory_mebibytes: { type: integer, minimum: 1 }
        storage_gibibytes: { type: integer, minimum: 1 }
        pods: { type: integer, minimum: 1 }
        volumes: { type: integer, minimum: 0 }
    DevClusterState:
      type: string
      enum: [creating, running, error, deleting, deleted]
      description: >-
        `creating` until the cluster's API answers; `running`; `error` when it never came up or lost its server
        (`failure_reason` says which; only a deletion leaves it); `deleting` until its server is gone; `deleted`.
    DevClusterHealth:
      type: object
      required: [api_server, node_ready, observed_at, detail]
      properties:
        api_server: { type: string, enum: [healthy, unhealthy, unknown], description: 'Whether the API answered /readyz when last observed; `unknown` before the first observation.' }
        node_ready: { type: boolean, description: 'Whether the node reported Ready.' }
        observed_at: { type: [string, 'null'], format: date-time }
        detail: { type: string, description: 'What is wrong, empty when nothing is.' }
    DevCluster:
      type: object
      required: [id, zone, region, name, version, k3s_version, plan, state, public_ipv4, network_id, server_id, endpoint, endpoint_ipv4,
                 ipv6_address, ipv4_address, labels, health, failure_reason, production_recommended, production_warning, created_at, updated_at]
      properties:
        id: { type: string }
        zone: { type: string }
        region: { type: string }
        name: { type: string, examples: ['dev'] }
        version: { type: string, description: 'The Kubernetes minor.', examples: ['1.36'] }
        k3s_version: { type: string, description: 'The k3s release installed when the cluster was created.', examples: ['v1.36.5+k3s1'] }
        plan: { type: string, description: "The server's plan.", examples: ['starter-2c-4g'] }
        state: { $ref: '#/components/schemas/DevClusterState' }
        public_ipv4: { type: boolean, description: 'Whether the server holds a public IPv4 (the add-on) and the cluster is dual-stack.' }
        network_id: { type: [string, 'null'], description: 'The private network the server also joins.' }
        server_id: { type: [string, 'null'], description: "The cluster's server, in the account's servers." }
        endpoint: { type: [string, 'null'], description: 'The API server URL on IPv6, once the server has its address.', examples: ['https://[2a13:7c82:103a:42::1]:6443'] }
        endpoint_ipv4: { type: [string, 'null'], description: 'The API server URL on IPv4, with `public_ipv4`.' }
        ipv6_address: { type: [string, 'null'], description: "The server's public IPv6 address: the API on 6443, ingress on 80 and 443." }
        ipv4_address: { type: [string, 'null'], description: "The server's public IPv4 address, with `public_ipv4`." }
        labels: { $ref: '#/components/schemas/Labels' }
        health: { $ref: '#/components/schemas/DevClusterHealth' }
        failure_reason: { type: [string, 'null'], description: 'Why a cluster in `error` failed.' }
        production_recommended: { type: boolean, enum: [false], description: 'Always false: a dev cluster is one server.' }
        production_warning: { type: string, description: 'What running on one server means, to show wherever the cluster is shown.' }
        is_trial: { type: boolean, description: 'Created without a payment method: free, and deleted with its server at `trial_expires_at` unless the account saves a card first.' }
        trial_expires_at: { type: [string, 'null'], format: date-time, description: 'When a live trial is deleted; null once it converted or for a paid cluster.' }
        trial_converted_at: { type: [string, 'null'], format: date-time, description: 'When the account saved a card and the trial became an ordinary cluster, its server billed from the next full hour.' }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    DevClusterTrialTerms:
      type: object
      required: [lifetime_hours, maximum_cores, maximum_memory_mebibytes, trials_per_window, window_days]
      properties:
        lifetime_hours: { type: integer, minimum: 1, description: 'How long a trial runs before it is deleted with its server.' }
        maximum_cores: { type: integer, minimum: 1, description: "The largest plan's cores a trial may use." }
        maximum_memory_mebibytes: { type: integer, minimum: 1, description: "The largest plan's memory a trial may use." }
        trials_per_window: { type: integer, minimum: 1, description: 'How many trials an account may start in `window_days`.' }
        window_days: { type: integer, minimum: 1 }
    DevClusterTrialOffer:
      type: object
      description: >-
        Whether the account may start a free trial dev cluster now. A trial is for an account linked to an Ankra platform
        organisation that has no payment method: one at a time, on the smallest dev cluster plan, without the public IPv4
        add-on, never charged, and deleted with its server when its time is up unless the account saves a card first.
      required: [is_available, reason, detail, trials_used_in_window, running_trial_id, terms]
      properties:
        is_available: { type: boolean }
        reason:
          type: [string, 'null']
          enum: [not_linked_to_platform, trial_running, trials_used, dev_clusters_not_offered, null]
        detail: { type: [string, 'null'], description: 'Why the trial is not on offer, in a sentence.' }
        trials_used_in_window: { type: integer, minimum: 0 }
        running_trial_id: { type: [string, 'null'], description: "The account's live trial dev cluster." }
        terms: { $ref: '#/components/schemas/DevClusterTrialTerms' }
    DevClusterEnvelope:
      type: object
      required: [dev_cluster]
      properties:
        dev_cluster: { $ref: '#/components/schemas/DevCluster' }
    DevClusterList:
      type: object
      required: [items, next_cursor]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/DevCluster' } }
        next_cursor: { $ref: '#/components/schemas/NextCursor' }
    DevClusterVersions:
      type: object
      required: [items, is_available, all_zones, zones, minimum_memory_mebibytes, ipv4_price_monthly_cents, production_warning, trial]
      properties:
        items:
          type: array
          items:
            type: object
            required: [version, k3s_version, is_default]
            properties:
              version: { type: string, examples: ['1.36'] }
              k3s_version: { type: string, examples: ['v1.36.5+k3s1'] }
              is_default: { type: boolean }
        is_available: { type: boolean, description: 'Whether any zone offers dev clusters.' }
        all_zones: { type: boolean, description: 'Every zone offers dev clusters; `zones` is then empty.' }
        zones: { type: array, items: { type: string }, description: 'The zones that offer dev clusters, unless `all_zones`.' }
        minimum_memory_mebibytes: { type: integer, minimum: 1, description: 'The smallest plan a dev cluster runs on.' }
        ipv4_price_monthly_cents: { type: integer, minimum: 0, description: 'What `public_ipv4` adds a month.' }
        production_warning: { type: string }
        trial: { $ref: '#/components/schemas/DevClusterTrialTerms' }
    CreateDevCluster:
      type: object
      additionalProperties: false
      required: [zone, name, plan]
      properties:
        zone: { type: string, description: 'A zone that offers dev clusters (list_dev_cluster_versions).' }
        name: { type: string, pattern: '^[a-z][a-z0-9-]{0,38}[a-z0-9]$', description: "DNS label, 2 to 40 characters, unique among the account's dev clusters." }
        plan: { type: string, description: 'A server plan with at least `minimum_memory_mebibytes` of memory.' }
        version: { type: string, examples: ['1.36'], description: 'A minor from list_dev_cluster_versions; defaults to the default one.' }
        public_ipv4: { type: boolean, description: 'Give the server a public IPv4 too (paid add-on) and make the cluster dual-stack. Default false: IPv6 only.' }
        network_id: { type: string, description: 'A private network of the zone the server also joins.' }
        ssh_keys: { type: array, items: { type: string }, description: 'SSH public keys for the server. Without these and `ssh_key_ids` nobody can log in to it.' }
        ssh_key_ids: { type: array, items: { type: string }, description: "Keys from the account's library for the server." }
        labels: { $ref: '#/components/schemas/Labels' }
    Playground:
      type: object
      required: [id, name, region, state, limits, app_domain, endpoint, end_reason, failure_reason, created_at, ready_at, expires_at, ended_at, deleted_at]
      properties:
        id: { type: string }
        name: { type: string, description: 'The DNS label, `pg-` and ten hex digits.', examples: ['pg-0a1b2c3d4e'] }
        region: { type: string }
        state: { $ref: '#/components/schemas/PlaygroundState' }
        limits: { $ref: '#/components/schemas/PlaygroundLimits' }
        app_domain: { type: string, description: 'The wildcard the playground serves its Ingresses under.', examples: ['*.pg-0a1b2c3d4e.eu-central.play.ankra.cc'] }
        endpoint: { type: [string, 'null'], description: 'The API server URL once ready.' }
        end_reason: { type: [string, 'null'], enum: [expired, deleted, ended_by_staff, failed, null] }
        failure_reason: { type: [string, 'null'], description: 'Why a playground that failed to start did.' }
        created_at: { type: string, format: date-time }
        ready_at: { type: [string, 'null'], format: date-time }
        expires_at: { type: string, format: date-time }
        ended_at: { type: [string, 'null'], format: date-time }
        deleted_at: { type: [string, 'null'], format: date-time }
    PlaygroundEnvelope:
      type: object
      required: [playground]
      properties:
        playground: { $ref: '#/components/schemas/Playground' }
    PlaygroundList:
      type: object
      required: [items, next_cursor]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Playground' } }
        next_cursor: { $ref: '#/components/schemas/NextCursor' }
    PlaygroundOffer:
      type: object
      required: [is_available, eligibility, regions, lifetime_hours, allowance, allowance_used, limits, active]
      properties:
        is_available: { type: boolean }
        eligibility: { type: string, enum: [eligible, unavailable, active_playground, allowance_used, account_suspended] }
        regions: { type: array, items: { type: string } }
        lifetime_hours: { type: integer, minimum: 1 }
        allowance: { type: integer, minimum: 1 }
        allowance_used: { type: integer, minimum: 0 }
        limits: { $ref: '#/components/schemas/PlaygroundLimits' }
        active:
          oneOf:
            - $ref: '#/components/schemas/Playground'
            - type: 'null'
    StartPlayground:
      type: object
      additionalProperties: false
      properties:
        region: { type: [string, 'null'], description: 'A region from `regions` of `get_playground_offer`; the first when absent.' }
    StaffPlayground:
      allOf:
        - $ref: '#/components/schemas/Playground'
        - type: object
          required: [account_id, account_name, created_by_email, staff_reason]
          properties:
            account_id: { type: string }
            account_name: { type: string }
            created_by_email: { type: string }
            staff_reason: { type: [string, 'null'], description: 'What staff said when they ended it.' }
    StaffPlaygroundEnvelope:
      type: object
      required: [playground]
      properties:
        playground: { $ref: '#/components/schemas/StaffPlayground' }
    StaffPlaygroundList:
      type: object
      required: [items, next_cursor]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/StaffPlayground' } }
        next_cursor: { $ref: '#/components/schemas/NextCursor' }
    EndPlaygroundForStaff:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason: { type: string, description: '10 to 500 characters on one line; recorded in the account audit log.' }
    FleetNodeDetail:
      allOf:
        - $ref: '#/components/schemas/Node'
        - type: object
          required: [agent_is_current, heartbeat_age_seconds, available, unhealthy_components, advisory_unhealthy_components, server_count, usage,
            allocation, rollout_canary]
          properties:
            rollout_canary: { type: boolean, description: "True for a node marked as one of its zone's rollout canaries (`set_node_rollout_canary`)." }
            agent_is_current: { type: boolean, description: "True when the node's agent runs the newest build of the artefact store." }
            heartbeat_age_seconds: { type: [integer, 'null'], minimum: 0 }
            available: { type: boolean }
            unhealthy_components: { type: array, items: { type: string }, description: 'The gating components (`kvm`, `boot`) the last heartbeat reported unhealthy.' }
            advisory_unhealthy_components: { type: array, items: { type: string }, description: The other components the last heartbeat reported unhealthy; they hold nothing. }
            server_count: { type: integer, minimum: 0 }
            usage: { $ref: '#/components/schemas/FleetNodeUsage' }
            allocation: { $ref: '#/components/schemas/NodeAllocation' }
            storage:
              oneOf:
                - { $ref: '#/components/schemas/NodeStoragePolicy' }
                - { type: 'null' }
              description: The node's storage policy; null for a node without the storage role.
    NodeStoragePolicy:
      type: object
      description: >-
        What a storage node's disks serve. ankra-local keeps them to Ankra Local and the node never gets an OSD; ceph gives
        its data disks to the zone's replicated storage (Ankra Storage, the Ceph backend); both keeps its Ankra Local pool
        and carves one logical volume of ceph_volume_gibibytes from its volume group as its only OSD. The replicated storage
        counts and configures only the nodes whose policy is ceph or both.
      required: [policy, ceph_volume_gibibytes]
      additionalProperties: false
      properties:
        policy: { type: string, enum: [ankra-local, ceph, both] }
        ceph_volume_gibibytes: { type: [integer, 'null'], minimum: 10, maximum: 262144, description: "The size of the node's Ankra Storage volume with the policy both; null otherwise." }
    NodeStoragePolicyChange:
      type: object
      required: [node, operation, policy_problem]
      properties:
        node: { $ref: '#/components/schemas/FleetNodeDetail' }
        operation:
          oneOf:
            - { $ref: '#/components/schemas/Operation' }
            - { type: 'null' }
          description: The storage.rebalance_policy operation that applies the policy; null when one already runs (it reads the new policy) or it could not start.
        policy_problem: { type: [string, 'null'], description: Why the zone's storage policy did not start although the change is recorded. }
    Rack:
      type: object
      required: [zone, name, node_count, created_at]
      properties:
        zone: { type: string }
        name: { type: string, examples: ['r01'] }
        node_count: { type: integer, minimum: 0 }
        created_at: { type: string, format: date-time }
    RackEnvelope:
      type: object
      required: [rack]
      properties:
        rack: { $ref: '#/components/schemas/Rack' }
    RackList:
      type: object
      required: [items, next_cursor]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Rack' } }
        next_cursor: { $ref: '#/components/schemas/NextCursor' }

    Node:
      type: object
      required: [id, zone, hostname, roles, agent_version, liveness, capacity, registered_at, last_heartbeat_at, last_heartbeat_sequence]
      properties:
        id: { type: string }
        zone: { type: string }
        rack: { type: [string, 'null'], description: The rack of the zone the node sits in; null until one is assigned. }
        hostname: { type: string }
        roles:
          type: array
          items: { type: string, enum: [control, gateway, storage, compute, backup] }
        agent_version: { type: string }
        liveness: { type: string, enum: [pending, online, suspect, offline] }
        capacity: { $ref: '#/components/schemas/NodeCapacity' }
        registered_at: { type: string, format: date-time }
        last_heartbeat_at: { type: [string, 'null'], format: date-time }
        last_heartbeat_sequence: { type: [integer, 'null'], minimum: 0 }
        schedulable: { type: boolean, description: False unless the maintenance state is active. }
        maintenance: { $ref: '#/components/schemas/NodeMaintenance' }
        compatibility:
          oneOf:
            - $ref: '#/components/schemas/NodeCompatibility'
            - type: 'null'
          description: What a live migration must match; null until the node's agent reports it.
        boot:
          oneOf:
            - $ref: '#/components/schemas/NodeBoot'
            - type: 'null'
          description: The node's current boot; null until its agent reports a boot id.
        spec_epoch: { type: integer, minimum: 0, description: Orders the node's specs above their generation; a fence and the uncordon after it raise it. }
        agent_commit: { type: string, description: The git commit the node's agent was built from; empty for an older agent. }
        agent_built_at: { type: [string, 'null'], format: date-time, description: When the node's agent was built. }
        agent_upgrade:
          oneOf:
            - $ref: '#/components/schemas/NodeAgentUpgrade'
            - type: 'null'
          description: The upgrade the node's maintenance asks for and what the node last reported; null when neither.
        hardware: { $ref: '#/components/schemas/NodeHardware' }
        provisioning: { $ref: '#/components/schemas/NodeProvisioning' }
        datacenter: { type: [string, 'null'], description: The datacenter the node stands in; null until one is recorded. }
        wireguard:
          oneOf:
            - $ref: '#/components/schemas/WireGuardIdentity'
            - type: 'null'
          description: The node's identity on the zone's WireGuard underlay; null outside one.
    NodeHardware:
      type: object
      description: The key facts of the node's inventory (ADR 0004); zero for an agent that reports none.
      required: [cpu_sockets, cpu_cores, virtualisation, numa_nodes, iommu_groups, disk_count, disk_total_bytes, nic_count, bmc, pending_kernel_arguments, reboot_required]
      properties:
        cpu_sockets: { type: integer, minimum: 0 }
        cpu_cores: { type: integer, minimum: 0, description: Physical cores over every socket. }
        virtualisation: { type: string, enum: ['', vmx, svm], description: 'vmx (Intel VT-x), svm (AMD-V), or empty when the CPU exposes neither.' }
        numa_nodes: { type: integer, minimum: 0 }
        iommu_groups: { type: integer, minimum: 0, description: 0 while the IOMMU is off. }
        disk_count: { type: integer, minimum: 0 }
        disk_total_bytes: { type: integer, minimum: 0 }
        nic_count: { type: integer, minimum: 0, description: Physical network interfaces. }
        bmc: { type: string, enum: ['', ipmi, redfish], description: The BMC the agent sees; empty when none. }
        pending_kernel_arguments: { type: array, items: { type: string }, description: Kernel arguments the priming wrote that the running kernel was not booted with. }
        reboot_required: { type: boolean, description: 'True while kernel arguments are pending; run the maintenance operation with `reboot: true`.' }
    NodeProvisioning:
      type: object
      required: [state, burn_in]
      properties:
        state: { type: string, enum: [ready, burn_in, failed], description: 'burn_in: the node stays cordoned until its burn-in passes; failed: its burn-in failed.' }
        burn_in:
          oneOf:
            - $ref: '#/components/schemas/NodeBurnIn'
            - type: 'null'
          description: The last burn-in the node reported; null when it ran none.
    NodeBurnIn:
      type: object
      required: [outcome, detail, finished_at]
      properties:
        outcome: { type: string, enum: [passed, failed] }
        detail: { type: string }
        finished_at: { type: string, format: date-time }
    NodeAgentUpgrade:
      type: object
      required: [request_id, version, reboot, reported_request_id, phase, detail, reported_at]
      properties:
        request_id: { type: string, description: The maintenance operation asking; empty once it is done. }
        version: { type: string, description: The build it installs; empty for a reboot alone. }
        reboot: { type: boolean }
        reported_request_id: { type: string, description: The request the node's last report is about. }
        phase: { type: string, enum: ['', downloading, restarting, rebooting, completed, failed] }
        detail: { type: string }
        reported_at: { type: [string, 'null'], format: date-time }
    NodeMaintenanceOperationRequest:
      type: object
      additionalProperties: false
      properties:
        reason: { type: string, maxLength: 500, description: One line. }
        agent_version: { type: string, description: A build of the artefact store to upgrade the agent to; empty keeps the running one. }
        reboot: { type: boolean, description: Reboot the node once it is drained (and upgraded). }
        mode:
          type: string
          enum: [evacuate, in-place]
          description: >-
            `evacuate` drains the node first. `in-place` (chosen automatically when a server cannot leave: one host, no
            other node of its CPU pool, or local-nvme volumes) announces the maintenance to each account, snapshots every
            volume, stops the servers (gracefully, then powered off), upgrades and reboots, starts them again, and records
            each server's downtime; the snapshots are deleted after the retention window.
    PowerControllerRequest:
      type: object
      additionalProperties: false
      required: [kind, address, username, password]
      properties:
        kind: { type: string, enum: [ipmi, redfish] }
        address: { type: string, description: 'The BMC''s host name or IP address, optionally with a port.', examples: ['10.0.9.21', 'bmc-7.example.net:443'] }
        username: { type: string }
        password: { type: string, format: password, description: Sealed at rest; never answered back. }
        redfish_system_path: { type: string, description: 'The ComputerSystem to reset, for example /redfish/v1/Systems/1; empty takes the only member of /redfish/v1/Systems. Redfish only.' }
        certificate_authority_pem: { type: string, description: The authority the Redfish endpoint's certificate is verified against; empty uses the system roots. Redfish only. }
    PowerController:
      type: object
      required: [node_id, kind, address, username, redfish_system_path, certificate_authority_pem, updated_at, updated_by]
      properties:
        node_id: { type: string, format: uuid }
        kind: { type: string, enum: [ipmi, redfish] }
        address: { type: string }
        username: { type: string }
        redfish_system_path: { type: string }
        certificate_authority_pem: { type: string }
        updated_at: { type: string, format: date-time }
        updated_by: { type: string, description: 'The operator token that set it, as `operator:<name>`.' }
    NodeAgentArtifact:
      type: object
      required: [version, commit, sha256, size_bytes, uploaded_at, uploaded_by]
      properties:
        version: { type: string }
        commit: { type: string }
        sha256: { type: string, description: Lowercase hex; nodes refuse a download that does not match. }
        size_bytes: { type: integer, minimum: 1 }
        uploaded_at: { type: string, format: date-time }
        uploaded_by: { type: string }
    NodeAgentArtifactList:
      type: object
      required: [items, next_cursor]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/NodeAgentArtifact' } }
        next_cursor: { $ref: '#/components/schemas/NextCursor' }
    WireGuardIdentity:
      type: object
      required: [public_key, alternate_public_key, endpoint, underlay_addresses, rotation, key_since]
      properties:
        public_key: { type: string, description: The key peers route the node's underlay addresses to (base64). }
        alternate_public_key:
          type: [string, 'null']
          description: The second key peers accept during a key rotation (the new key before the switch, the previous one after it).
        endpoint: { type: [string, 'null'], examples: ['198.51.100.44:51820'] }
        underlay_addresses: { type: array, items: { type: string }, description: The fabric and storage addresses routed to the node over the mesh. }
        rotation: { type: integer, minimum: 0, description: Key rotations the control plane asked for; keys rotate every 30 days with a 10-minute overlap. }
        key_since: { type: [string, 'null'], format: date-time }
    Datacenter:
      type: object
      required: [name, nodes, storage_nodes, compute_nodes]
      properties:
        name: { type: [string, 'null'], description: null groups the nodes without a recorded datacenter. }
        nodes: { type: integer, minimum: 0 }
        storage_nodes: { type: integer, minimum: 0 }
        compute_nodes: { type: integer, minimum: 0 }
    DatacenterLink:
      type: object
      description: >-
        A pair of datacenters (or a datacenter with itself) rated against the latency budget over every pair of their
        storage and compute hosts. A budget is `within` when every host pair was measured within it, `over` when any
        measured pair misses it, `unmeasured` otherwise.
      required: [from, to, host_pairs, measured_pairs, worst_p95_rtt_ms, lowest_bandwidth_bits_per_second, ceph_replication, live_migration]
      properties:
        from: { type: [string, 'null'] }
        to: { type: [string, 'null'] }
        host_pairs: { type: integer, minimum: 0 }
        measured_pairs: { type: integer, minimum: 0 }
        worst_p95_rtt_ms: { type: [number, 'null'] }
        lowest_bandwidth_bits_per_second: { type: [integer, 'null'], minimum: 0 }
        ceph_replication: { type: string, enum: [within, over, unmeasured], description: "Ankra Storage replication's budget: p95 RTT under 2 ms." }
        live_migration: { type: string, enum: [within, over, unmeasured], description: Budget p95 RTT under 5 ms and at least 1 Gbit/s. }
    UnderlayMesh:
      type: object
      required: [zone, underlay, prefixes, guest_mtu, nodes, links, datacenters, latency_budget]
      properties:
        zone: { type: string }
        underlay: { type: string, enum: [fabric, wireguard] }
        prefixes: { type: array, items: { type: string }, description: The zone's fabric and storage underlay prefixes (reserved against customer networks). }
        guest_mtu: { type: integer, description: 'The overlay MTU of the zone''s guests, taps and bridges: 1370 on WireGuard, 1450 on a fabric.' }
        nodes:
          type: array
          items:
            type: object
            required: [node_id, hostname, roles, datacenter, liveness, wireguard, underlay_addresses]
            properties:
              node_id: { type: string }
              hostname: { type: string }
              roles: { type: array, items: { type: string } }
              datacenter: { type: [string, 'null'] }
              liveness: { type: string, enum: [pending, online, suspect, offline] }
              wireguard:
                oneOf:
                  - $ref: '#/components/schemas/WireGuardIdentity'
                  - type: 'null'
              underlay_addresses:
                type: [object, 'null']
                description: The addresses assigned to a node that joined with the WireGuard underlay.
                required: [fabric, storage]
                properties:
                  fabric: { type: string, examples: ['10.40.3.1/24'] }
                  storage: { type: string, examples: ['10.41.3.1/24'] }
        links:
          type: array
          items:
            type: object
            required: [node_id, peer_node_id, p50_rtt_ms, p95_rtt_ms, samples, loss_ratio, bandwidth_bits_per_second, bandwidth_measured_at, last_handshake_at, measured_at]
            properties:
              node_id: { type: string }
              peer_node_id: { type: string }
              p50_rtt_ms: { type: number }
              p95_rtt_ms: { type: number }
              samples: { type: integer, minimum: 0 }
              loss_ratio: { type: number, minimum: 0, maximum: 1 }
              bandwidth_bits_per_second: { type: [integer, 'null'], minimum: 0 }
              bandwidth_measured_at: { type: [string, 'null'], format: date-time }
              last_handshake_at: { type: [string, 'null'], format: date-time }
              measured_at: { type: string, format: date-time }
        datacenters: { type: array, items: { $ref: '#/components/schemas/Datacenter' } }
        latency_budget: { type: array, items: { $ref: '#/components/schemas/DatacenterLink' } }
    PublicAddressController:
      type: object
      required: [zone, provider, has_credentials, addresses, updated_at]
      properties:
        zone: { type: string }
        provider: { type: string, enum: [hetzner-robot, command] }
        has_credentials: { type: boolean }
        addresses:
          type: array
          items:
            type: object
            required: [address, datacenter, routed_node_id, routed_to, routed_at, last_error]
            properties:
              address: { type: string }
              datacenter: { type: [string, 'null'] }
              routed_node_id: { type: [string, 'null'], description: The gateway the provider delivers the address to now. }
              routed_to: { type: [string, 'null'], description: That gateway's public address. }
              routed_at: { type: [string, 'null'], format: date-time }
              last_error: { type: [string, 'null'] }
        updated_at: { type: string, format: date-time }
    LatencyBudgetProblem:
      type: object
      description: A problem document; a live migration refused by the latency budget adds `latency_budget`.
      required: [type, title, status]
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        latency_budget:
          type: object
          required: [purpose, source_node_id, source_datacenter, target_node_id, target_datacenter, measured, p50_rtt_ms, p95_rtt_ms,
                     bandwidth_bits_per_second, maximum_p95_rtt_ms, minimum_bandwidth_bits_per_second]
          properties:
            purpose: { type: string, examples: ['live migration'] }
            source_node_id: { type: string }
            source_datacenter: { type: [string, 'null'] }
            target_node_id: { type: string }
            target_datacenter: { type: [string, 'null'] }
            measured: { type: boolean }
            p50_rtt_ms: { type: [number, 'null'] }
            p95_rtt_ms: { type: [number, 'null'] }
            bandwidth_bits_per_second: { type: [integer, 'null'], minimum: 0 }
            maximum_p95_rtt_ms: { type: number }
            minimum_bandwidth_bits_per_second: { type: integer }
    NodeCompatibility:
      type: object
      required: [cpu_model, cpu_vendor, cpu_flags, hypervisor_version, kernel_version, hugepage_size_bytes, hugepages_total, hugepages_free, reported_at]
      properties:
        cpu_model: { type: string }
        cpu_vendor: { type: string }
        cpu_flags: { type: array, items: { type: string }, description: "The CPU flags of /proc/cpuinfo, sorted; a live migration's target needs every flag of the source." }
        hypervisor_version: { type: string, description: The Cloud Hypervisor version the agent runs; a live migration needs the same version on both nodes. }
        kernel_version: { type: string }
        hugepage_size_bytes: { type: integer, minimum: 0 }
        hugepages_total: { type: integer, minimum: 0 }
        hugepages_free: { type: integer, minimum: 0 }
        physical_address_bits: { type: integer, minimum: 0, description: The CPU's physical address width; the zone's CPU baseline takes the smallest. 0 when unknown. }
        reported_at: { type: string, format: date-time }
    NodeBoot:
      type: object
      required: [id, booted_at]
      properties:
        id: { type: string, description: The kernel's boot id. }
        booted_at: { type: [string, 'null'], format: date-time, description: When the control plane first heard this boot. }
    NodeMaintenance:
      type: object
      required: [state, reason, changed_at]
      properties:
        state: { type: string, enum: [active, cordoned, draining, fenced] }
        reason: { type: string }
        changed_at: { type: [string, 'null'], format: date-time }
        fenced_at: { type: [string, 'null'], format: date-time, description: "Set once a fence completed (power-off confirmed, storage client blocklisted)." }
        fence_storage_addresses: { type: array, items: { type: string }, description: Every storage-network address the fence blocklisted (IPv4 and IPv6). }
    NodeDetail:
      allOf:
        - $ref: '#/components/schemas/Node'
        - type: object
          required: [inventory, latest_operation, server_ids]
          properties:
            inventory:
              type: object
              additionalProperties: true
              description: The node's last inventory document (the agent's NodeInventory as JSON); an empty object before the first.
            latest_operation:
              oneOf:
                - $ref: '#/components/schemas/Operation'
                - type: 'null'
            server_ids: { type: array, items: { type: string } }
    HAPolicyBody:
      type: object
      additionalProperties: false
      required: [ha_policy]
      properties:
        ha_policy: { type: string, enum: [restart, none] }
    HAPolicyResult:
      type: object
      required: [ha_policy, ha_status, ha_status_reason]
      properties:
        ha_policy: { type: string, enum: [restart, none] }
        ha_status: { type: string, enum: [available, unavailable] }
        ha_status_reason: { type: [string, 'null'], description: Why the zone cannot act on the policy yet; null while it can. }
    MigrationPolicyBody:
      type: object
      additionalProperties: false
      required: [migration_policy]
      properties:
        migration_policy: { type: string, enum: [default, relaxed, strict] }
    NodeMaintenanceRequest:
      type: object
      additionalProperties: false
      properties:
        reason: { type: string, maxLength: 500, description: One line. }
    NodeCapacity:
      type: object
      required: [logical_cpu_count, memory_total_bytes, has_kvm]
      properties:
        logical_cpu_count: { type: integer, minimum: 0 }
        memory_total_bytes: { type: integer, minimum: 0 }
        has_kvm: { type: boolean }
    NodeList:
      type: object
      required: [items, next_cursor]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Node' } }
        next_cursor: { $ref: '#/components/schemas/NextCursor' }

    Gateway:
      type: object
      required: [node_id, hostname, slot, is_primary, priority]
      properties:
        node_id: { type: string, format: uuid }
        hostname: { type: string }
        slot:
          description: 0 or 1 for the two gateways that share the zone's networks; null for any further gateway.
          type: [integer, 'null']
        is_primary: { type: boolean }
        priority: { type: integer, description: 'VRRP priority: 200 for the primary, 100 otherwise.' }

    GatewayList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Gateway' } }

    PrimaryGatewayRequest:
      type: object
      required: [node_id]
      additionalProperties: false
      properties:
        node_id: { type: [string, 'null'], format: uuid }

    Plan:
      type: object
      required: [name, family, cores, memory_mebibytes, storage_gibibytes, price_monthly_cents, price_hourly_millicents]
      properties:
        name: { type: string, examples: ['premium-2xcpu-4gb'] }
        family: { type: string, enum: [starter, premium, cloud_native] }
        cores: { type: integer }
        memory_mebibytes: { type: integer }
        storage_gibibytes: { type: integer }
        price_monthly_cents: { type: integer }
        price_hourly_millicents: { type: integer, description: "The monthly price / 730, rounded." }
        cpu_pool: { type: [string, 'null'], description: The CPU pool every server of the plan is placed in; null lets the scheduler choose. }
    PlanList:
      type: object
      required: [items, next_cursor]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Plan' } }
        next_cursor: { $ref: '#/components/schemas/NextCursor' }

    Template:
      type: object
      required: [id, display_name, operating_system, version, minimum_storage_gibibytes, is_custom, zone]
      properties:
        id: { type: string, examples: ['debian-13'] }
        display_name: { type: string }
        operating_system: { type: string }
        version: { type: string }
        minimum_storage_gibibytes: { type: integer }
        is_custom: { type: boolean, description: "An account's custom image, deployable only in `zone`." }
        zone: { type: [string, 'null'], description: Set for custom images only. }
    TemplateList:
      type: object
      required: [items, next_cursor]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Template' } }
        next_cursor: { $ref: '#/components/schemas/NextCursor' }

    StorageTier:
      type: object
      required: [name, display_name, iops_limit, bandwidth_mebibytes_per_second, price_per_gibibyte_monthly_millicents, backend, is_offered]
      properties:
        name: { type: string, examples: [standard, local-nvme, hdd] }
        display_name: { type: string }
        iops_limit: { type: integer }
        bandwidth_mebibytes_per_second: { type: integer }
        price_per_gibibyte_monthly_millicents: { type: integer }
        backend:
          type: string
          enum: [ceph, ankra-local]
          description: '`ceph` tiers are Ankra Storage, replicated, and exist once the zone has Ankra Storage; `ankra-local` volumes are one copy on one node''s disks and pin their server to that node.'
        is_offered:
          type: boolean
          description: >-
            False for a retired tier. It is listed so the volumes already in it can be named and priced; new volumes,
            servers and moves are refused in it, and only a clone of a volume or snapshot already there stays in it.
    StorageTierList:
      type: object
      required: [items, next_cursor]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/StorageTier' } }
        next_cursor: { $ref: '#/components/schemas/NextCursor' }

    OperationKind:
      type: string
      enum:
        - server.create
        - server.metadata
        - server.start
        - server.stop
        - server.restart
        - server.delete
        - server.force_release
        - server.change_plan
        - server.rebuild
        - server.renumber_ipv6
        - server.add_public_ipv4
        - server.remove_public_ipv4
        - server.settle_public_ipv4
        - server.attach_network
        - server.detach_network
        - server.firewall
        - storage.create
        - storage.attach
        - storage.detach
        - storage.resize
        - storage.delete
        - storage.backup
        - backup.restore
        - backup.delete
        - template.create
        - template.copy
        - template.delete
        - snapshot.create
        - snapshot.delete
        - router.sync
        - floating_ip.sync
        - network.sync
        - public_pool.sync
        - server.move
        - server.migrate
        - server.recover
        - server.settle_migration
        - node.cordon
        - node.uncordon
        - node.drain
        - node.fence
        - node.maintenance
        - node.agent_upgrade
        - node.provision
        - load_balancer.create
        - load_balancer.delete
        - database.create
        - database.delete
        - database.restore
        - database.change_plan
        - database.start
        - database.resize
        - edge.sync
        - edge.delete
        - storage.move
        - storage.rebalance_policy
        - storage.drain_host
        - object_storage.migrate
        - kubernetes_cluster.create
        - kubernetes_cluster.delete
        - kubernetes_cluster.upgrade
        - kubernetes_cluster.snapshot
        - kubernetes_cluster.restore
        - node_pool.sync
        - node_pool.delete
        - kubernetes_host.bootstrap
        - kubernetes_cluster.platform_register
        - kubernetes_cluster.platform_deregister
        - control_plane.expand
        - control_plane.shrink
        - backup.verify
    Operation:
      type: object
      required: [id, kind, server_id, storage_id, backup_id, template_id, router_id, floating_ip_id, status, step, step_index, step_count, error, created_at, started_at, finished_at, deadline_at]
      properties:
        id: { type: string }
        kind: { $ref: '#/components/schemas/OperationKind' }
        server_id: { type: [string, 'null'] }
        storage_id: { type: [string, 'null'] }
        backup_id: { type: [string, 'null'] }
        template_id: { type: [string, 'null'] }
        router_id: { type: [string, 'null'] }
        floating_ip_id: { type: [string, 'null'] }
        node_id: { type: string, description: Set on node maintenance operations (operator only); absent otherwise. }
        load_balancer_id: { type: [string, 'null'], description: Set on the operations that create and delete a load balancer. }
        database_id: { type: [string, 'null'], description: Set on the operations that create and delete a managed database. }
        edge_id: { type: [string, 'null'], description: Set on the operations that sync and delete a network edge. }
        snapshot_id: { type: [string, 'null'], description: 'Set on the operations that create and delete a snapshot, and on a `storage.create` that clones one.' }
        kubernetes_cluster_id: { type: [string, 'null'], description: 'Set on the operations of a managed Kubernetes cluster.' }
        node_pool_id: { type: [string, 'null'], description: 'Set on the operations of a Kubernetes node pool.' }
        kubernetes_host_id: { type: string, description: 'Set on a regional host cluster bootstrap (operator only); absent otherwise.' }
        status: { type: string, enum: [pending, running, succeeded, failed, cancelled] }
        step: { type: string, description: 'Machine name of the current step, e.g. `create_disk` or `transfer_cross_zone`.' }
        step_index: { type: integer }
        step_count: { type: integer }
        error: { type: string, description: Empty unless the operation failed. }
        created_at: { type: string, format: date-time }
        started_at: { type: [string, 'null'], format: date-time }
        finished_at: { type: [string, 'null'], format: date-time }
        deadline_at: { type: string, format: date-time }
        actor: { type: string, description: 'Who asked for the operation: `user:<id>`, `token:<name>`, `operator`, `system:<component>`; empty on older operations.' }
        progress:
          $ref: '#/components/schemas/MigrationProgress'
          description: Present on `GET /v1/operations/{id}` while a `server.migrate` drives a live transfer.
        events:
          type: array
          items: { $ref: '#/components/schemas/OperationEvent' }
          description: Present on `GET /v1/operations/{id}`; the newest 100 entries of the operation's log, oldest first.
    MigrationProgress:
      type: object
      required: [state, source_node_id, target_node_id, phase, attempt, iteration, transferred_bytes, total_bytes, dirty_bytes_per_second, downtime_milliseconds, detail, reported_at]
      properties:
        state: { type: string, enum: [reserved, detached, preparing, sending, switched, aborting] }
        source_node_id: { type: string }
        target_node_id: { type: string }
        phase: { type: string, enum: ['', preparing, transferring, completed, failed], description: How far the nodes report the current attempt. }
        attempt: { type: integer, minimum: 0, description: "Which send this is under the convergence policy, from 1." }
        iteration: { type: integer, minimum: 0, description: Memory passes so far in the current attempt. }
        transferred_bytes: { type: integer, minimum: 0 }
        total_bytes: { type: integer, minimum: 0, description: 0 when the hypervisor does not report it. }
        dirty_bytes_per_second: { type: integer, minimum: 0 }
        downtime_milliseconds: { type: integer, minimum: 0, description: "The pause the guest took at handover, once completed." }
        detail: { type: string }
        reported_at: { type: [string, 'null'], format: date-time, description: The reporting node's clock. }
    OperationEvent:
      type: object
      required: [at, kind, message, data]
      properties:
        at: { type: string, format: date-time }
        kind: { type: string, description: 'For example `target_chosen`, `send_started`, `handed_over`, `undoing`, `cold_fallback`, `move_cancelled`, `recovery_started`, `succeeded`, `failed`.' }
        message: { type: string }
        data: { type: object, additionalProperties: true }
    OperationEnvelope:
      type: object
      required: [operation]
      properties:
        operation: { $ref: '#/components/schemas/Operation' }
    OperationList:
      type: object
      required: [items, next_cursor]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Operation' } }
        next_cursor: { $ref: '#/components/schemas/NextCursor' }

    KubernetesAddon:
      type: object
      required: [name, version]
      properties:
        name: { type: string, examples: ['cilium'] }
        version: { type: string, description: 'The pinned Helm chart version.' }
    KubernetesVersion:
      type: object
      required: [version, kubernetes_version, is_default, addons]
      properties:
        version: { type: string, examples: ['1.36'], description: 'The minor.' }
        kubernetes_version: { type: string, examples: ['v1.36.5'], description: 'The patch release this minor runs.' }
        is_default: { type: boolean }
        addons: { type: array, items: { $ref: '#/components/schemas/KubernetesAddon' } }
    KubernetesControlPlaneTier:
      type: string
      enum: [development, production]
      description: >-
        What a cluster's control plane is built for. `development`: one API server and etcd replica, no control-plane
        fee, the nodes are the whole bill; an upgrade or a host node failure interrupts the API. `production`: three
        replicas with embedded etcd quorum spread across host nodes, the monthly control-plane fee. The tier is chosen
        at create and does not change in place.
    KubernetesControlPlaneOffer:
      type: object
      required: [control_plane, replicas, high_availability, price_monthly_cents, is_default, production_recommended, description]
      properties:
        control_plane: { $ref: '#/components/schemas/KubernetesControlPlaneTier' }
        replicas: { type: integer, description: 'API server and embedded etcd replicas.' }
        high_availability: { type: boolean }
        price_monthly_cents: { type: integer, description: 'Per cluster, billed per hour; 0 for development.' }
        is_default: { type: boolean }
        production_recommended: { type: boolean, description: 'False for the tier every surface flags as not for production.' }
        description: { type: string }
    KubernetesVersionList:
      type: object
      required: [items, vcluster_chart_version, control_planes, default_control_plane, control_plane_price_monthly_cents, ipv4_price_monthly_cents]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/KubernetesVersion' } }
        vcluster_chart_version: { type: string }
        control_planes:
          type: array
          items: { $ref: '#/components/schemas/KubernetesControlPlaneOffer' }
          description: 'The control-plane tiers on offer, cheapest first.'
        default_control_plane: { $ref: '#/components/schemas/KubernetesControlPlaneTier' }
        control_plane_price_monthly_cents: { type: integer, description: "The default tier's price per cluster, billed per hour; `control_planes` has every tier." }
        ipv4_price_monthly_cents: { type: integer, description: 'The IPv4 API endpoint add-on, billed per hour.' }
    KubernetesHealth:
      type: object
      required: [api_server, etcd_members_ready, etcd_members_total, has_etcd_quorum, nodes_ready, nodes_total, observed_at, detail]
      properties:
        api_server: { type: string, enum: [healthy, unhealthy, unknown] }
        etcd_members_ready: { type: integer }
        etcd_members_total: { type: integer }
        has_etcd_quorum: { type: boolean }
        nodes_ready: { type: integer }
        nodes_total: { type: integer }
        observed_at: { type: [string, 'null'], format: date-time }
        detail: { type: string }
    KubernetesTaint:
      type: object
      additionalProperties: false
      required: [key, effect]
      properties:
        key: { type: string }
        value: { type: string }
        effect: { type: string, enum: [NoSchedule, PreferNoSchedule, NoExecute] }
    KubernetesAutoscaling:
      type: object
      additionalProperties: false
      required: [min, max]
      properties:
        min: { type: integer, minimum: 0, maximum: 100 }
        max: { type: integer, minimum: 1, maximum: 100 }
    KubernetesNodePoolRequest:
      type: object
      additionalProperties: false
      required: [name, plan, count]
      properties:
        name: { type: string, pattern: '^[a-z][a-z0-9-]{0,30}[a-z0-9]$' }
        plan: { type: string, description: 'A server plan from list_plans.' }
        count: { type: integer, minimum: 0, maximum: 100 }
        zones: { type: array, maxItems: 8, items: { type: string }, description: "Zones of the cluster's region to spread nodes across; defaults to the cluster's zone." }
        labels: { $ref: '#/components/schemas/Labels' }
        taints: { type: array, maxItems: 16, items: { $ref: '#/components/schemas/KubernetesTaint' } }
        autoscaling: { oneOf: [{ $ref: '#/components/schemas/KubernetesAutoscaling' }, { type: 'null' }] }
        public_ipv4: { type: boolean, description: 'Give every node a public IPv4 too (the server add-on). Default false.' }
    KubernetesNode:
      type: object
      required: [server_id, hostname, zone, state, is_ready, kubelet_version, public_ipv6, public_ipv4]
      properties:
        server_id: { type: string }
        hostname: { type: string }
        zone: { type: string }
        state: { type: string, description: "The server's state." }
        is_ready: { type: boolean, description: 'The node reports Ready to the cluster.' }
        kubelet_version: { type: string, description: 'Empty until the node joined.' }
        public_ipv6: { type: [string, 'null'] }
        public_ipv4: { type: [string, 'null'] }
    KubernetesNodePool:
      type: object
      required: [id, cluster_id, name, plan, count, zones, labels, taints, autoscaling, public_ipv4, version, state, nodes, active_operation, created_at]
      properties:
        id: { type: string }
        cluster_id: { type: string }
        name: { type: string }
        plan: { type: string }
        count: { type: integer }
        zones: { type: array, items: { type: string } }
        labels: { $ref: '#/components/schemas/Labels' }
        taints: { type: array, items: { $ref: '#/components/schemas/KubernetesTaint' } }
        autoscaling: { oneOf: [{ $ref: '#/components/schemas/KubernetesAutoscaling' }, { type: 'null' }] }
        public_ipv4: { type: boolean }
        version: { type: string, description: 'The minor its nodes run or are rolling to.' }
        state: { type: string, enum: [creating, running, scaling, upgrading, deleting, deleted, error] }
        nodes: { type: array, items: { $ref: '#/components/schemas/KubernetesNode' } }
        active_operation: { oneOf: [{ $ref: '#/components/schemas/Operation' }, { type: 'null' }] }
        created_at: { type: string, format: date-time }
    KubernetesCluster:
      type: object
      required: [id, zone, region, name, version, kubernetes_version, available_upgrade, state, network_id, control_plane, control_plane_replicas,
                 control_plane_price_monthly_cents, production_recommended, public_ipv4, private_endpoint,
                 endpoint, endpoint_ipv4, oidc_issuer_url, labels, health, addons, etcd_snapshot_schedule, etcd_snapshot_retention,
                 platform, active_operation, created_at]
      properties:
        id: { type: string }
        zone: { type: string }
        region: { type: string }
        name: { type: string }
        version: { type: string, description: 'The minor, e.g. 1.36.' }
        kubernetes_version: { type: string, description: 'The patch release the control plane runs, e.g. v1.36.5.' }
        available_upgrade: { type: [string, 'null'], description: 'The next minor this cluster can upgrade to.' }
        state: { type: string, enum: [creating, running, upgrading, restoring, error, deleting, deleted] }
        network_id: { type: string }
        control_plane: { $ref: '#/components/schemas/KubernetesControlPlaneTier' }
        control_plane_replicas: { type: integer, description: 'API server and embedded etcd replicas the control plane runs.' }
        control_plane_price_monthly_cents: { type: integer, description: "The tier's control-plane fee per month, billed per hour; 0 for development. The IPv4 endpoint add-on is on top." }
        production_recommended: { type: boolean, description: 'False for a development control plane: no high availability, no service level.' }
        public_ipv4: { type: boolean }
        private_endpoint: { type: boolean }
        endpoint: { type: [string, 'null'], description: 'The API server URL on IPv6; null until the control plane is up.' }
        endpoint_ipv4: { type: [string, 'null'], description: 'The API server URL on IPv4, with the add-on.' }
        oidc_issuer_url: { type: string }
        labels: { $ref: '#/components/schemas/Labels' }
        health: { $ref: '#/components/schemas/KubernetesHealth' }
        addons: { type: array, items: { $ref: '#/components/schemas/KubernetesAddon' } }
        etcd_snapshot_schedule: { type: string }
        etcd_snapshot_retention: { type: integer }
        node_pools: { type: array, items: { $ref: '#/components/schemas/KubernetesNodePool' }, description: 'Only on get_kubernetes_cluster.' }
        platform: { $ref: '#/components/schemas/KubernetesPlatformRegistration' }
        active_operation: { oneOf: [{ $ref: '#/components/schemas/Operation' }, { type: 'null' }] }
        created_at: { type: string, format: date-time }
    KubernetesPlatformRegistration:
      type: object
      description: >-
        The cluster's registration in the Ankra platform (ADR 0006). `url` is the cluster's page in the platform once
        registered; `reason` says why it is not registered otherwise (`unlinked`: link an Ankra organisation to the
        account first).
      required: [state, organisation_id, cluster_id, url, reason, next_attempt_at, registered_at]
      properties:
        state: { type: string, enum: [pending, unlinked, registered, failed, deregistered] }
        organisation_id: { type: [string, 'null'] }
        cluster_id: { type: [string, 'null'], description: "The platform's identifier of the cluster." }
        url: { type: [string, 'null'] }
        reason: { type: string }
        next_attempt_at: { type: [string, 'null'], format: date-time, description: 'When a pending registration is tried again.' }
        registered_at: { type: [string, 'null'], format: date-time }
    KubernetesEtcdSnapshot:
      type: object
      required: [name, taken_at, size_bytes]
      properties:
        name: { type: string }
        taken_at: { type: string, format: date-time }
        size_bytes: { type: integer }
    KubernetesExecCredential:
      type: object
      required: [apiVersion, kind, status]
      properties:
        apiVersion: { type: string, enum: [client.authentication.k8s.io/v1] }
        kind: { type: string, enum: [ExecCredential] }
        status:
          type: object
          required: [token, expirationTimestamp]
          properties:
            token: { type: string }
            expirationTimestamp: { type: string, format: date-time }
    KubernetesHostServer:
      type: object
      required: [server_id, hostname, zone, role, state]
      properties:
        server_id: { type: string }
        hostname: { type: string }
        zone: { type: string }
        role: { type: string, enum: [control_plane, worker] }
        state: { type: string }
    KubernetesHost:
      type: object
      required: [id, region, state, kubernetes_version, endpoint, control_plane_plan, worker_plan, workers, servers, platform_import, tenant_clusters, active_operation, created_at]
      properties:
        id: { type: string }
        region: { type: string }
        state: { type: string, enum: [bootstrapping, awaiting_platform_import, ready, error] }
        kubernetes_version: { type: string }
        endpoint: { type: [string, 'null'] }
        control_plane_plan: { type: string }
        worker_plan: { type: string }
        workers: { type: integer }
        servers: { type: array, items: { $ref: '#/components/schemas/KubernetesHostServer' } }
        platform_import:
          type: string
          description: 'What the Ankra platform import still needs: the command to run, or empty once the host is ready.'
        tenant_clusters: { type: integer }
        active_operation: { oneOf: [{ $ref: '#/components/schemas/Operation' }, { type: 'null' }] }
        created_at: { type: string, format: date-time }

    Database:
      type: object
      required: [id, zone, name, network_id, engine, plan, storage_gibibytes, database_name, owner_name, host, port, connection_uri, state, is_healthy, health_detail, is_configuration_applied, backup_schedule, backups, tls_server_name, certificate_expires_at, restored_from, active_operation, created_at]
      properties:
        id: { type: string }
        zone: { type: string }
        name: { type: string }
        network_id: { type: string }
        engine: { type: string, enum: [postgresql-17] }
        plan: { type: string }
        storage_gibibytes: { type: integer }
        database_name: { type: string }
        owner_name: { type: string }
        host: { type: [string, 'null'], description: The VM's private address; null until placed. }
        port: { type: integer }
        connection_uri: { type: [string, 'null'], description: 'Without the password; sslmode=verify-full, so save `ca_certificate` as ~/.postgresql/root.crt or pass it as sslrootcert.' }
        state: { type: string, enum: [creating, running, error, deleting] }
        is_healthy: { type: boolean }
        health_detail: { type: string }
        is_configuration_applied: { type: boolean }
        backup_schedule: { type: string }
        backups: { $ref: '#/components/schemas/DatabaseBackupSummary' }
        tls_server_name: { type: string, description: The DNS name the server certificate carries besides the host address. }
        certificate_expires_at: { type: [string, 'null'], format: date-time, description: Renewed 30 days before. }
        ca_certificate: { type: [string, 'null'], description: 'PEM of the zone''s database authority the server certificate chains to; only on GET /v1/databases/{id}.' }
        storage_growth_available:
          type: boolean
          description: >-
            Whether `POST /v1/databases/{id}/resize` would be accepted right now; only on GET /v1/databases/{id}. False
            while the database is not running, at the maximum size, or while its VM's data file system size is not
            known to the platform (see `storage_growth_unavailable_reason`).
        storage_growth_unavailable_reason:
          type: string
          description: >-
            Why storage cannot grow online right now; only on GET /v1/databases/{id}, and only when
            `storage_growth_available` is false. It names the remedy when there is one: a host that cannot report the
            file system yet has to be updated by the platform first, and a restart would not help; a database that started before online storage
            growth has to restart once (a plan change restarts it).
        restored_from:
          oneOf:
            - type: object
              required: [database_id, target_time]
              properties:
                database_id: { type: string }
                target_time: { type: [string, 'null'], format: date-time }
            - type: 'null'
        active_operation: { oneOf: [{ $ref: '#/components/schemas/Operation' }, { type: 'null' }] }
        created_at: { type: string, format: date-time }
    DatabaseBackupSummary:
      type: object
      required: [is_enabled, retention_days, earliest_recoverable_at, latest_recoverable_at, observed_at, archive_failure]
      properties:
        is_enabled: { type: boolean, description: "False until the controller created the repository, or when the zone has no backup endpoint." }
        retention_days: { type: integer }
        earliest_recoverable_at: { type: [string, 'null'], format: date-time }
        latest_recoverable_at: { type: [string, 'null'], format: date-time }
        observed_at: { type: [string, 'null'], format: date-time }
        archive_failure: { type: string }
    DatabaseBaseBackup:
      type: object
      required: [id, label, kind, started_at, finished_at, database_bytes, repository_bytes]
      properties:
        id: { type: string }
        label: { type: string }
        kind: { type: string, enum: [full, diff, incr] }
        started_at: { type: string, format: date-time }
        finished_at: { type: string, format: date-time }
        database_bytes: { type: integer }
        repository_bytes: { type: integer, description: "What the backup stores in object storage, compressed and encrypted." }
    DatabaseCredentials:
      type: object
      required: [owner_name, password, connection_uri]
      properties:
        owner_name: { type: string }
        password: { type: string }
        connection_uri: { type: string, description: With the password. }
    ObjectStorage:
      type: object
      required: [id, zone, endpoint, certificate_authority, access_key_id, quota_bytes, used_bytes, object_count, usage_measured_at, created_at, backend, bucket_prefix, durability]
      properties:
        id: { type: string }
        zone: { type: string }
        endpoint: { type: string, description: 'The S3 endpoint, an https URL on the zone''s DNS name (path-style URLs, SigV4 with any region).' }
        certificate_authority:
          type: [string, 'null']
          description: PEM of the private CA that signed the endpoint's certificate, for clients to verify it with; null when a public CA signed it or the endpoint is plain HTTP.
        access_key_id: { type: string }
        quota_bytes: { type: integer }
        used_bytes: { type: integer }
        object_count: { type: integer }
        usage_measured_at: { type: [string, 'null'], format: date-time }
        created_at: { type: string, format: date-time }
        backend:
          type: string
          enum: [rgw, ankra-s3-single]
          description: '`rgw` is replicated object storage on Ankra Storage; `ankra-s3-single`, the single-node S3 server, serves a zone without Ankra Storage, and `migrate_object_storage` moves the buckets to replicated object storage once it has Ankra Storage.'
        bucket_prefix:
          type: [string, 'null']
          description: On ankra-s3-single, every bucket of the account must start with it (its buckets share one namespace). Null on `rgw`.
        durability:
          type: string
          enum: [replicated, degraded, single_copy]
          description: >-
            How many copies the store that holds the account's objects keeps. `single_copy` on `ankra-s3-single`: one
            copy on one host, lost with that host's disks, so keep a second copy of what matters elsewhere. On `rgw`
            what the zone's Ankra Storage replicates: `replicated` (three copies on three hosts), `degraded` (two) or
            `single_copy` (one host).
    ZoneObjectStorageCertificate:
      type: object
      required: [common_name, dns_names, not_before, not_after, fingerprint_sha256]
      properties:
        common_name: { type: string }
        dns_names: { type: array, items: { type: string } }
        not_before: { type: string, format: date-time }
        not_after: { type: string, format: date-time }
        fingerprint_sha256: { type: string, description: 'SHA-256 of the leaf certificate, hexadecimal.' }
    ZoneObjectStorage:
      type: object
      required: [zone, endpoint, endpoint_source, recorded_endpoint, environment_endpoint, node_id, serving_node_id, listen_addresses, certificate, backend, served, durability, nodes, updated_at, updated_by]
      properties:
        zone: { type: string }
        endpoint: { type: [string, 'null'], description: The S3 endpoint in effect; null when neither the zone nor the environment names one (the zone then offers no object storage). }
        endpoint_source:
          type: string
          enum: [zone, environment, none]
          description: Whether staff recorded the endpoint on the zone or `ANKRA_CLOUD_OBJECT_STORAGE_ENDPOINTS` sets it.
        recorded_endpoint: { type: [string, 'null'], description: What staff recorded on the zone. }
        environment_endpoint: { type: [string, 'null'], description: 'The zone''s `ANKRA_CLOUD_OBJECT_STORAGE_ENDPOINTS` entry, the fallback.' }
        node_id: { type: [string, 'null'], description: The storage node staff named to serve the zone's single-node S3 server; null leaves the choice to the storage policy. }
        serving_node_id: { type: [string, 'null'], description: The node the single-node S3 server runs on now; null while it runs nowhere. }
        listen_addresses:
          type: array
          items: { type: string }
          description: 'The serving node''s own addresses, with the port, its S3 front listens on (`[2001:db8::10]:443`); empty leaves the node on its `node.toml`.'
        certificate:
          oneOf:
            - $ref: '#/components/schemas/ZoneObjectStorageCertificate'
            - type: 'null'
          description: The uploaded certificate the node's S3 gateway serves; null leaves the node on its `node.toml`. The private key is never answered.
        backend: { type: string, enum: [rgw, ankra-s3-single], description: Where a new account's objects go. }
        served: { type: boolean, description: Whether that store runs. }
        durability: { type: string, enum: [replicated, degraded, single_copy], description: 'How many copies that store keeps; the single-node S3 server keeps one copy on one host.' }
        nodes:
          type: array
          description: The zone's storage nodes, the candidates to serve its single-node S3 server.
          items:
            type: object
            required: [node_id, hostname, online]
            properties:
              node_id: { type: string }
              hostname: { type: string }
              online: { type: boolean }
        updated_at: { type: [string, 'null'], format: date-time }
        updated_by: { type: [string, 'null'], description: The staff member who last changed the settings. }
    UpdateZoneObjectStorageRequest:
      type: object
      additionalProperties: false
      properties:
        endpoint: { type: string, description: 'An http or https URL of a host with an optional port, for example `https://s3.eu-north.ankra.cloud`; empty hands the zone back to `ANKRA_CLOUD_OBJECT_STORAGE_ENDPOINTS`.' }
        node_id: { type: string, description: A storage node of the zone; empty leaves the choice to the storage policy. }
        listen_addresses:
          type: array
          maxItems: 8
          items: { type: string }
          description: 'The named node''s own public addresses with the endpoint''s port, IPv6 in brackets (`[2001:db8::10]:443`, `203.0.113.10:443`); empty hands the node back to its `node.toml`.'
        certificate:
          type: object
          additionalProperties: false
          required: [chain_pem, private_key_pem]
          description: The certificate chain (PEM, leaf first) and its unencrypted private key (PEM); both empty removes the recorded certificate.
          properties:
            chain_pem: { type: string }
            private_key_pem: { type: string }
    ObjectStorageCredentials:
      type: object
      required: [access_key_id, secret_access_key]
      properties:
        access_key_id: { type: string }
        secret_access_key: { type: string }
    ObjectStorageWithCredentials:
      type: object
      required: [object_storage, credentials]
      properties:
        object_storage: { $ref: '#/components/schemas/ObjectStorage' }
        credentials: { $ref: '#/components/schemas/ObjectStorageCredentials' }
    LoadBalancerMember:
      type: object
      required: [id, backend_id, name, address, port, weight, enabled]
      properties:
        id: { type: string }
        backend_id: { type: string }
        name: { type: string }
        address: { type: string, description: An IPv4 or IPv6 address. }
        port: { type: integer }
        weight: { type: integer }
        enabled: { type: boolean }
    EdgeRole: { type: string, enum: [bastion, nat_gateway, load_balancer] }
    EdgeMemberInput:
      type: object
      additionalProperties: false
      required: [name, frontend_port, address, port]
      properties:
        name: { type: string, pattern: '^[a-z0-9]([a-z0-9-]{0,30}[a-z0-9])?$' }
        frontend_port: { type: integer, minimum: 1, maximum: 65535, description: The TCP port the edge listens on (IPv4 and IPv6). }
        address: { type: string, description: 'An IPv4 host of the network, or an IPv6 address: a server''s public IPv6 or its leg''s `address6`.' }
        port: { type: integer, minimum: 1, maximum: 65535 }
        weight: { type: integer, minimum: 0, maximum: 256, default: 100 }
        enabled: { type: boolean, default: true }
    CreateEdgeRequest:
      type: object
      additionalProperties: false
      required: [network_id, roles]
      properties:
        network_id: { type: string }
        name: { type: string, maxLength: 64, description: 'Defaults to "<network name> edge".' }
        roles: { type: array, minItems: 1, maxItems: 3, items: { $ref: '#/components/schemas/EdgeRole' } }
        placement: { type: string, enum: [separate, combined], description: 'separate where the zone offers it (separate_edges), combined otherwise.' }
        plan: { type: string, default: starter-1c-1g, description: The plan of the bastion and NAT gateway VMs (the load balancer pair keeps its own). }
        ssh_key_ids: { type: array, items: { type: string }, description: 'The bastion''s keys from the account''s library; defaults to all of them.' }
        members: { type: array, items: { $ref: '#/components/schemas/EdgeMemberInput' }, description: "The load_balancer role's backends, one TCP frontend per frontend_port." }
    DnsZone:
      type: object
      description: A hosted DNS zone. A subzone has `parent_zone_id` and is delegated from that zone with managed NS records.
      required: [id, name, parent_zone_id, record_count, record_limit, nameservers, sync_error, created_at]
      properties:
        id: { type: string }
        name: { type: string, examples: [example.com] }
        parent_zone_id: { type: [string, 'null'] }
        record_count: { type: integer }
        record_limit: { type: integer, description: How many records the zone may hold. }
        nameservers: { type: array, items: { type: string }, description: The hostnames to delegate the domain to at its registrar. }
        sync_error: { type: [string, 'null'], description: The last failure publishing the zone; null once a push succeeds. }
        created_at: { type: string, format: date-time }
    DnsZoneList:
      type: object
      required: [items, next_cursor]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/DnsZone' } }
        next_cursor: { type: 'null' }
    DnsRecordType:
      type: string
      enum: [A, AAAA, CNAME, MX, TXT, SRV, NS, CAA, DS, PTR, HTTPS, SVCB, TLSA, SSHFP]
    DnsRecord:
      type: object
      required: [id, zone_id, name, type, content, ttl, priority, comment, managed, created_at, updated_at]
      properties:
        id: { type: string }
        zone_id: { type: string }
        name: { type: string, description: 'Relative to the zone: `@` for the apex, `www`, `a.b`, `*`.' }
        type: { $ref: '#/components/schemas/DnsRecordType' }
        content: { type: string }
        ttl: { type: integer }
        priority: { type: [integer, 'null'], description: MX and SRV only. }
        comment: { type: [string, 'null'], description: A note for people; never published in DNS. }
        managed: { type: boolean, description: 'Apex NS and subzone delegations, owned by the platform and not editable.' }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    Edge:
      type: object
      required: [id, zone, name, network_id, roles, placement, plan, state, production_recommended, production_recommendation_reason, public_ipv4,
                 bastion_jump_host, dns64_address, load_balancer_id, ssh_key_count, configuration_generation, machines, members, active_operation, created_at]
      properties:
        id: { type: string }
        zone: { type: string }
        name: { type: string }
        network_id: { type: string }
        roles: { type: array, items: { $ref: '#/components/schemas/EdgeRole' } }
        placement: { type: string, enum: [separate, combined] }
        plan: { type: string }
        state: { type: string, enum: [creating, running, error, deleting] }
        production_recommended: { type: boolean, description: False for a combined edge. }
        production_recommendation_reason: { type: [string, 'null'], description: Why a combined edge is not recommended for production. }
        public_ipv4: { type: [string, 'null'], description: "The IPv4 address to allow-list, point DNS at and SSH to (a combined edge's only one)." }
        bastion_jump_host: { type: [string, 'null'], description: '`admin@<ipv4>`, for `ssh -J`.' }
        dns64_address: { type: [string, 'null'], description: The nat_gateway role's DNS64 resolver on the network's ULA /64. }
        load_balancer_id: { type: [string, 'null'], description: The managed load balancer of a separate load_balancer role. }
        ssh_key_count: { type: integer }
        configuration_generation: { type: integer }
        machines:
          type: array
          items:
            type: object
            required: [id, name, roles, state, is_healthy, health_detail, public_ipv4, public_ipv6, public_ipv6_prefix, private_ipv4, private_ipv6]
            properties:
              id: { type: string }
              name: { type: string }
              roles: { type: array, items: { $ref: '#/components/schemas/EdgeRole' } }
              state: { type: string }
              is_healthy: { type: boolean }
              health_detail: { type: string }
              public_ipv4: { type: [string, 'null'] }
              public_ipv6: { type: [string, 'null'] }
              public_ipv6_prefix: { type: [string, 'null'] }
              private_ipv4: { type: [string, 'null'] }
              private_ipv6: { type: [string, 'null'] }
        members:
          type: array
          items:
            type: object
            required: [id, name, frontend_port, address, port, weight, enabled]
            properties:
              id: { type: string }
              name: { type: string }
              frontend_port: { type: integer }
              address: { type: string }
              port: { type: integer }
              weight: { type: integer }
              enabled: { type: boolean }
        active_operation: { oneOf: [{ $ref: '#/components/schemas/Operation' }, { type: 'null' }] }
        created_at: { type: string, format: date-time }
    LoadBalancer:
      type: object
      required: [id, zone, name, network_id, state, labels, high_availability, public_ipv4, public_ipv6, public_ipv6_addresses, address, configuration_generation,
                 is_configuration_applied, nodes, frontends, backends, active_operation, created_at]
      properties:
        id: { type: string }
        zone: { type: string }
        region: { type: string, description: "The region of the load balancer's zone." }
        name: { type: string }
        network_id: { type: string }
        state: { type: string, enum: [creating, running, error, deleting] }
        labels: { $ref: '#/components/schemas/Labels' }
        high_availability:
          type: boolean
          description: >-
            Two VMs on different compute nodes (true) or one (false). A load balancer created without high_availability in
            a zone that lacks the `load_balancer_ha` capability (one compute node, see get_zone_capabilities) runs on a
            single VM; asking for a pair there is refused with 409.
        public_ipv4: { type: [string, 'null'], description: 'The floating IPv4 frontend address (the add-on); null without the add-on or until allocated.' }
        public_ipv6:
          type: [string, 'null']
          description: |
            The IPv6 frontend address to publish: the first VM's own address (the first of its public /64). On a pair it
            does not fail over to the second VM; publish public_ipv6_addresses for that. Null until the VM's /64 is allocated.
        public_ipv6_addresses: { type: array, items: { type: string }, description: 'Every VM''s IPv6 frontend address, in VM order; each VM serves every frontend on its own.' }
        address: { type: [string, 'null'], description: 'The public IPv4 address, the same as public_ipv4 (kept for older clients); null without the IPv4 add-on or until allocated.' }
        configuration_generation: { type: integer }
        is_configuration_applied: { type: boolean }
        nodes:
          type: array
          items:
            type: object
            required: [id, name, state, is_active, is_healthy, health_detail, is_configuration_applied]
            properties:
              id: { type: string }
              name: { type: string }
              state: { type: string }
              is_active: { type: boolean, description: "The VM that holds the load balancer's address (the active member of the pair's failover), as its guest last reported." }
              is_healthy: { type: boolean }
              health_detail: { type: string }
              is_configuration_applied: { type: boolean }
        frontends: { type: array, items: { $ref: '#/components/schemas/LoadBalancerFrontend' } }
        backends: { type: array, items: { $ref: '#/components/schemas/LoadBalancerBackend' } }
        active_operation: { oneOf: [{ $ref: '#/components/schemas/Operation' }, { type: 'null' }] }
        created_at: { type: string, format: date-time }
    LoadBalancerFrontend:
      type: object
      required: [id, name, port, mode, backend_id, tls, certificate_ids, redirect_to_https]
      properties:
        id: { type: string }
        name: { type: string }
        port: { type: integer }
        mode: { type: string, enum: [tcp, http], description: The mode of its backend. }
        backend_id: { type: string }
        tls: { type: boolean, description: Terminates TLS with its certificates. }
        certificate_ids:
          type: array
          items: { type: string }
          description: The first answers clients that send no server name; the others are chosen by SNI.
        redirect_to_https: { type: boolean, description: Answers every request with a 301 to https on the same host. }
    LoadBalancerHealthCheck:
      type: object
      required: [type, path, expected_status, interval_seconds, rise, fall]
      properties:
        type: { type: string, enum: [tcp, http, none], description: 'tcp connects to the member; http sends GET <path>; none never checks.' }
        path: { type: string, pattern: '^/[A-Za-z0-9._~/?&=%-]{0,254}$', description: For http checks. }
        expected_status: { type: string, pattern: '^[1-5][0-9]{2}(-[1-5][0-9]{2})?$', description: 'For http checks: 200, or a range such as 200-399.' }
        interval_seconds: { type: integer, minimum: 1, maximum: 300 }
        rise: { type: integer, minimum: 1, maximum: 10, description: Successes that bring a member back. }
        fall: { type: integer, minimum: 1, maximum: 10, description: Failures that take a member out. }
    LoadBalancerHealthCheckInput:
      type: object
      additionalProperties: false
      description: Fields left out keep their value (on creation, the default of a TCP check every 2 s, rise 2, fall 3, path /, expected 200-399).
      properties:
        type: { type: string, enum: [tcp, http, none] }
        path: { type: string }
        expected_status: { type: string }
        interval_seconds: { type: integer, minimum: 1, maximum: 300 }
        rise: { type: integer, minimum: 1, maximum: 10 }
        fall: { type: integer, minimum: 1, maximum: 10 }
    LoadBalancerBackend:
      type: object
      required: [id, name, mode, balance, health_check_path, health_check, members]
      properties:
        id: { type: string }
        name: { type: string }
        mode: { type: string, enum: [tcp, http] }
        balance: { type: string, enum: [roundrobin, leastconn, source] }
        health_check_path: { type: string, description: 'The http check''s path, empty for other checks. Kept for older clients; read health_check.' }
        health_check: { $ref: '#/components/schemas/LoadBalancerHealthCheck' }
        members: { type: array, items: { $ref: '#/components/schemas/LoadBalancerMember' } }
    LoadBalancerCertificate:
      type: object
      required: [id, name, common_name, dns_names, not_before, not_after, fingerprint_sha256, frontend_count, created_at]
      description: A certificate chain the account's load balancers terminate TLS with. Its private key is sealed at rest and never returned.
      properties:
        id: { type: string }
        name: { type: string }
        common_name: { type: string }
        dns_names: { type: array, items: { type: string } }
        not_before: { type: string, format: date-time }
        not_after: { type: string, format: date-time }
        fingerprint_sha256: { type: string, description: Lowercase hex SHA-256 of the leaf certificate. }
        frontend_count: { type: integer, description: Frontends that terminate TLS with it. }
        created_at: { type: string, format: date-time }

    ConsoleInput:
      type: object
      additionalProperties: false
      required: [session_id, data]
      properties:
        session_id: { type: string, format: uuid, description: One per open console; its first input is audited. }
        data: { type: string, format: byte, description: Base64 of at most 4096 bytes. }
    ConsoleStatus:
      type: object
      required: [state, detail]
      properties:
        state: { type: string, enum: [connected, unavailable] }
        detail: { type: string }
    MetadataSetting:
      type: object
      additionalProperties: false
      required: [enabled]
      properties:
        enabled: { type: boolean }
    MetricsPoint:
      type: object
      required: [at, network_received_bytes, network_transmitted_bytes, disk_read_bytes, disk_written_bytes, disk_read_operations, disk_write_operations]
      properties:
        at: { type: string, format: date-time }
        network_received_bytes: { type: integer, format: int64 }
        network_transmitted_bytes: { type: integer, format: int64 }
        disk_read_bytes: { type: integer, format: int64 }
        disk_written_bytes: { type: integer, format: int64 }
        disk_read_operations: { type: integer, format: int64 }
        disk_write_operations: { type: integer, format: int64 }
    MetricsSeries:
      type: object
      required: [period, step_seconds, points]
      properties:
        period: { type: string, enum: ['1h', '24h', '7d', '30d'] }
        step_seconds: { type: integer }
        points: { type: array, items: { $ref: '#/components/schemas/MetricsPoint' } }
    DatabaseMetricsPoint:
      type: object
      required: [at, cpu_percent, memory_used_bytes, memory_total_bytes, disk_used_bytes, disk_total_bytes, query_count, query_mean_milliseconds]
      properties:
        at: { type: string, format: date-time }
        cpu_percent: { type: [number, 'null'], description: 'Share of the VM''s CPU time spent busy in the step, 0 to 100.' }
        memory_used_bytes: { type: [integer, 'null'], format: int64, description: Average memory in use (total less available). }
        memory_total_bytes: { type: [integer, 'null'], format: int64 }
        disk_used_bytes: { type: [integer, 'null'], format: int64, description: Average space used on the data disk. }
        disk_total_bytes: { type: [integer, 'null'], format: int64 }
        query_count: { type: integer, format: int64, description: Statements the database's roles finished in the step. }
        query_mean_milliseconds: { type: [number, 'null'], description: 'Their mean execution time; null without statements.' }
    DatabaseMetricsSeries:
      type: object
      required: [period, step_seconds, collects_query_statistics, points]
      properties:
        period: { type: string, enum: ['1h', '24h', '7d', '30d'] }
        step_seconds: { type: integer }
        collects_query_statistics: { type: boolean, description: Whether any step in the period carried query statistics. }
        points: { type: array, items: { $ref: '#/components/schemas/DatabaseMetricsPoint' } }
    NetworkTransfer:
      type: object
      required: [period_start, period_end, allowance_bytes_per_server, price_per_gibibyte_millicents, total_received_bytes, total_transmitted_bytes, total_billable_bytes, total_amount_cents, items, daily]
      properties:
        period_start: { type: string, format: date-time }
        period_end: { type: string, format: date-time }
        allowance_bytes_per_server: { type: integer, format: int64 }
        price_per_gibibyte_millicents: { type: integer, format: int64 }
        total_received_bytes: { type: integer, format: int64 }
        total_transmitted_bytes: { type: integer, format: int64 }
        total_billable_bytes: { type: integer, format: int64 }
        total_amount_cents: { type: integer, format: int64 }
        items:
          type: array
          items:
            type: object
            required: [server_id, server_name, received_bytes, transmitted_bytes, billable_bytes, amount_cents]
            properties:
              server_id: { type: string }
              server_name: { type: string }
              received_bytes: { type: integer, format: int64 }
              transmitted_bytes: { type: integer, format: int64 }
              billable_bytes: { type: integer, format: int64 }
              amount_cents: { type: integer, format: int64 }
        daily:
          type: array
          items:
            type: object
            required: [date, received_bytes, transmitted_bytes]
            properties:
              date: { type: string, format: date }
              received_bytes: { type: integer, format: int64 }
              transmitted_bytes: { type: integer, format: int64 }

    BackupRule:
      type: object
      additionalProperties: false
      required: [interval, time, retention_days]
      properties:
        interval: { type: string, enum: [daily, mon, tue, wed, thu, fri, sat, sun] }
        time: { type: string, pattern: '^[0-9]{4}$', description: HHMM in UTC. }
        retention_days: { type: integer, minimum: 1, maximum: 1095 }
        backup_copy_zone:
          type: string
          description: >-
            Where the rule's backups are copied (ADR 0003): another zone of the storage's region, or `none`. Omitted,
            they go to the region's default, another zone of the region, so a backup never shares the zone and Ankra
            Storage cluster of its data. Manual backups follow the storage's rule too.

    Server:
      type: object
      required: [id, zone, hostname, title, plan, cores, memory_mebibytes, storage_gibibytes, template, state, desired_power, state_detail, public_ipv4, public_ipv6, public_ipv6_prefix, public_ipv6_is_private, ipv6_renumber_available, ssh_command, mac_address, labels, server_group_id, active_operation, created_at, updated_at, managed_by]
      properties:
        managed_by: { type: [string, 'null'], description: 'The load balancer or database a managed service VM runs for (`load_balancer:<id>`, `database:<id>`); only staff see service VMs, so customers always get null.' }
        id: { type: string }
        zone: { type: string }
        region: { type: string, description: "The region of the server's zone." }
        hostname: { type: string }
        title: { type: string, description: May be empty. }
        plan: { type: string }
        cores: { type: integer }
        memory_mebibytes: { type: integer }
        storage_gibibytes: { type: integer }
        template: { type: string }
        state: { type: string, enum: [creating, starting, started, stopping, stopped, deleting, error] }
        desired_power: { type: string, enum: [running, stopped] }
        state_detail: { type: string, description: "Customer-readable reason, shown when `state` is `error`." }
        public_ipv4: { type: [string, 'null'], description: The IPv4 add-on; null without it. }
        public_ipv6: { type: [string, 'null'], description: 'The first address of the server''s /64, e.g. fd64:1:0:2a::1; null without IPv6.' }
        public_ipv6_prefix: { type: [string, 'null'], description: 'The server''s routed /64, e.g. fd64:1:0:2a::/64.' }
        public_ipv6_is_private: { type: boolean, description: 'Whether `public_ipv6` is a unique local address (fd00::/8) from a zone''s private pool: reachable from inside Ankra Cloud only. False without IPv6.' }
        ipv6_renumber_available: { type: boolean, description: 'Whether the server''s /64 is from a draining pool and can move to the zone''s active pool with `POST /v1/servers/{id}/renumber-ipv6`.' }
        ssh_command: { type: [string, 'null'], description: 'How to reach the server over SSH (IPv4 directly or through a forwarded port, else a public IPv6); null without a public address and for a private (unique local) IPv6 alone.' }
        mac_address: { type: string }
        labels: { $ref: '#/components/schemas/Labels' }
        server_group_id: { type: [string, 'null'], description: The anti-affinity group the server was created into. }
        ha_policy: { type: string, enum: [restart, none], description: What happens when the server's compute node fails. }
        migration_policy: { type: string, enum: [default, relaxed, strict], description: How hard the server's live migrations try to converge. }
        cpu_pool: { type: [string, 'null'], description: The CPU pool the server was placed in; live migration and HA restart keep it there. }
        active_operation:
          oneOf:
            - $ref: '#/components/schemas/Operation'
            - type: 'null'
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    ServerList:
      type: object
      required: [items, next_cursor]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Server' } }
        next_cursor: { $ref: '#/components/schemas/NextCursor' }
    CreateServerRequest:
      type: object
      additionalProperties: false
      required: [zone, hostname, plan, template]
      properties:
        zone: { type: string, examples: ['de-fsn1'] }
        hostname: { type: string, pattern: '^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$' }
        title: { type: string }
        plan: { type: string }
        template: { type: string, description: A public template or one of the account's custom images in the same zone. }
        storage_gibibytes: { type: integer, description: At least the plan's and the template's minimum. }
        storage_tier: { type: string, description: "Defaults to the zone's `default_storage_tier` (`GET /v1/zones/{zone}/capabilities`)." }
        backup_rule:
          oneOf:
            - $ref: '#/components/schemas/BackupRule'
            - type: 'null'
        public_ipv6: { type: boolean, default: true, description: "A routed public /64, included in the plan." }
        public_ipv4: { type: boolean, default: false, description: 'A public IPv4 address, €3.00 per month billed per hour (`resource_type: public_ipv4`).' }
        networks:
          type: array
          maxItems: 7
          description: Private interfaces; a server needs a public IPv6, a public IPv4 or at least one network.
          items:
            type: object
            additionalProperties: false
            required: [network_id]
            properties:
              network_id: { type: string }
              address: { type: string }
        ssh_keys:
          type: array
          description: OpenSSH public keys; together with `ssh_key_ids` at least one key is required.
          items: { type: string, description: An OpenSSH public key. }
        ssh_key_ids:
          type: array
          description: Keys from the account's SSH key library, added to `ssh_keys`.
          items: { type: string }
        user_data: { type: string, description: A cloud-init initialization script. }
        init_script_id: { type: string, description: Takes the user data from the script library; cannot be combined with `user_data`. }
        server_group_id: { type: string, description: Places the server apart from the group's other members; same zone. }
        labels: { $ref: '#/components/schemas/Labels' }
        cpu_pool: { type: string, description: Pins the server to a CPU pool of the zone; the plan's pin (or the scheduler) otherwise. }
        acknowledge_single_copy_without_backup:
          type: boolean
          default: false
          description: >-
            In a zone that keeps one copy of every volume (`storage_durability: single_copy`) and backs new volumes up by
            default (`default_backup` in `GET /v1/zones/{zone}/capabilities`), the server's boot storage gets a daily backup to the
            region's backup vault, kept 7 days, when the request names no `backup_rule`. True opts out: the volume is then
            a single copy on one host with no backup, and the storage records when the account acknowledged that
            (`single_copy_acknowledged_at`). It cannot be combined with `backup_rule`; elsewhere it changes nothing.
    UpdateServerRequest:
      type: object
      additionalProperties: false
      properties:
        title: { type: string, maxLength: 255 }
        hostname: { type: string, pattern: '^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$', description: Only while the server is stopped. }
        labels: { $ref: '#/components/schemas/Labels' }
    RebuildServerRequest:
      type: object
      additionalProperties: false
      required: [template]
      properties:
        template: { type: string, description: A public template or one of the account's custom images in the server's zone. }
        ssh_keys: { type: array, items: { type: string } }
        ssh_key_ids: { type: array, items: { type: string } }
        user_data: { type: string, description: 'Replaces the user data; an empty string clears it.' }
        init_script_id: { type: string }
    Labels:
      type: object
      maxProperties: 32
      description: 'Keys of 1-63 letters, digits, `.`, `_`, `/` or `-`, starting and ending with a letter or digit; values of at most 255 printable characters. On a server, keys under `kubernetes.ankra.cloud/` and `playground.ankra.cloud/` are set by the platform only.'
      additionalProperties: { type: string, maxLength: 255 }
    SSHKey:
      type: object
      required: [id, name, public_key, fingerprint, created_at]
      properties:
        id: { type: string }
        name: { type: string }
        public_key: { type: string }
        fingerprint: { type: string, description: 'SHA256 fingerprint, as `ssh-keygen -l` prints it.' }
        created_at: { type: string, format: date-time }
    SSHKeyList:
      type: object
      required: [items, next_cursor]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/SSHKey' } }
        next_cursor: { $ref: '#/components/schemas/NextCursor' }
    CreateSSHKeyRequest:
      type: object
      additionalProperties: false
      required: [name, public_key]
      properties:
        name: { type: string, maxLength: 64 }
        public_key: { type: string, description: One OpenSSH public key line. }
    RenameRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: { type: string, maxLength: 64 }
    InitScript:
      type: object
      required: [id, name, content, created_at, updated_at]
      properties:
        id: { type: string }
        name: { type: string }
        content: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    InitScriptList:
      type: object
      required: [items, next_cursor]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/InitScript' } }
        next_cursor: { $ref: '#/components/schemas/NextCursor' }
    InitScriptRequest:
      type: object
      additionalProperties: false
      properties:
        name: { type: string, maxLength: 64 }
        content: { type: string, maxLength: 32768 }
    ServerGroup:
      type: object
      required: [id, zone, region, name, spread, strict, policy, member_count, created_at]
      properties:
        id: { type: string }
        zone: { type: [string, 'null'], description: 'Null for a zone-spread group, whose members live in several zones of `region`.' }
        region: { type: string }
        name: { type: string }
        spread:
          type: string
          enum: [host, rack, zone]
          description: >-
            The failure domain members are kept apart in. host: different compute nodes, preferring different racks;
            rack: different racks of the zone; zone: different zones of the region (and different nodes inside each).
        strict: { type: boolean, description: 'Placement fails with a clear error rather than share a failure domain.' }
        policy: { type: string, enum: [strict, soft], description: 'The same as `strict` (strict: true), kept for older clients.' }
        member_count: { type: integer }
        members: { type: array, items: { type: string }, description: "Server identifiers, oldest first; only on the single-group read." }
        created_at: { type: string, format: date-time }
    ServerGroupList:
      type: object
      required: [items, next_cursor]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/ServerGroup' } }
        next_cursor: { $ref: '#/components/schemas/NextCursor' }
    CreateServerGroupRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        zone: { type: string, description: 'Required for host and rack spread; for zone spread it names a zone of the region instead of `region`.' }
        region: { type: string, description: 'The region of a zone-spread group (or give `zone`).' }
        name: { type: string, maxLength: 64 }
        spread: { type: string, enum: [host, rack, zone], default: host }
        strict: { type: boolean, default: true }
        policy: { type: string, enum: [strict, soft], default: strict, description: 'Older spelling of `strict`; send one of the two.' }

    Storage:
      type: object
      required: [id, zone, title, tier, size_gibibytes, state, source_template, server_id, device_index, device_serial, backup_rule, next_backup_at, active_operation, created_at, updated_at, node_id]
      properties:
        id: { type: string }
        zone: { type: string }
        region: { type: string, description: "The region of the storage's zone." }
        title: { type: string }
        tier: { type: string }
        size_gibibytes: { type: integer }
        state: { type: string, enum: [creating, online, maintenance, error, deleting], description: '`maintenance` while an operation runs.' }
        source_template: { type: [string, 'null'] }
        server_id: { type: [string, 'null'] }
        device_index: { type: [integer, 'null'] }
        device_serial:
          type: string
          maxLength: 20
          description: |
            The virtio serial the storage's disk carries in every server it is attached to: the first 20 characters of
            `id`. A Linux guest sees the disk as `/dev/disk/by-id/virtio-<device_serial>`, whatever its device name.
        backup_rule:
          oneOf:
            - $ref: '#/components/schemas/BackupRule'
            - type: 'null'
        next_backup_at: { type: [string, 'null'], format: date-time }
        active_operation:
          oneOf:
            - $ref: '#/components/schemas/Operation'
            - type: 'null'
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        node_id:
          type: [string, 'null']
          description: The node a local-nvme storage lives on; it attaches only to servers running there. Null for Ankra Storage tiers.
        single_copy_acknowledged_at:
          type: [string, 'null']
          format: date-time
          description: >-
            When the account acknowledged running the storage without a backup rule in a zone that keeps one copy of
            every volume (`acknowledge_single_copy_without_backup`); null for a storage that has a rule or never needed
            the acknowledgement.
    StoragePlacement:
      type: object
      additionalProperties: false
      description: Where a local-nvme storage lands; other tiers ignore it. Without it, on the storage node with the fewest local GiB.
      properties:
        server_id: { type: string, description: On the node that runs this server (preferred). }
        node_id: { type: string, description: On this storage and compute node. }
    ControlPlane:
      type: object
      required: [zone, mode, applied_mode, members, service_address, generation, operation_id, control_nodes]
      properties:
        zone: { type: string }
        mode: { type: string, enum: [single, highly_available] }
        applied_mode: { type: [string, 'null'], enum: [single, highly_available, null] }
        members:
          type: array
          items:
            type: object
            required: [node_id, name, address]
            properties:
              node_id: { type: string }
              name: { type: string }
              address: { type: string }
        service_address: { type: [string, 'null'] }
        generation: { type: integer }
        operation_id: { type: [string, 'null'], description: The operation that last planned the control plane. }
        control_nodes:
          type: array
          items:
            type: object
            required: [node_id, hostname, online, control_address, applied_generation, api_ready, error, reported_at]
            properties:
              node_id: { type: string }
              hostname: { type: string }
              online: { type: boolean }
              control_address: { type: [string, 'null'] }
              applied_generation: { type: integer }
              api_ready: { type: boolean }
              error: { type: [string, 'null'] }
              reported_at: { type: [string, 'null'], format: date-time }
    BackupVault:
      type: object
      required: [id, region, name, endpoint, bucket, signing_region, access_key_id, created_at, created_by]
      properties:
        id: { type: string }
        region: { type: string }
        name: { type: string }
        endpoint: { type: string }
        bucket: { type: string }
        signing_region: { type: string }
        access_key_id: { type: string }
        created_at: { type: string, format: date-time }
        created_by: { type: string }
    BackupVaultList:
      type: object
      required: [items, next_cursor]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/BackupVault' } }
        next_cursor: { $ref: '#/components/schemas/NextCursor' }
    CreateBackupVaultRequest:
      type: object
      additionalProperties: false
      required: [region, name, endpoint, bucket, access_key_id, secret_access_key]
      properties:
        region: { type: string, examples: ['eu-central'] }
        name: { type: string, pattern: '^[a-z0-9][a-z0-9-]{0,62}$' }
        endpoint: { type: string, examples: ['https://s3.eu-central-2.example.com'] }
        bucket: { type: string }
        signing_region: { type: string, description: The SigV4 region; us-east-1 when left out. }
        access_key_id: { type: string }
        secret_access_key: { type: string, writeOnly: true }
        certificate_authority: { type: string, description: A PEM CA for an endpoint with a private certificate. }
    StorageBackendOverview:
      type: object
      required: [backends, nodes, ceph_witnesses, ceph_min_hosts, storage_durability, storage_durability_reason, allow_degraded_replication,
        ceph_tiers_offered, ceph_tiers_unavailable_reason]
      properties:
        backends: { type: array, items: { $ref: '#/components/schemas/StorageBackend' } }
        nodes: { type: array, items: { $ref: '#/components/schemas/StorageNode' } }
        ceph_witnesses: { type: array, items: { $ref: '#/components/schemas/StorageNode' }, description: 'The zone''s ceph-witness nodes: one monitor each, no OSDs.' }
        ceph_min_hosts: { type: integer, enum: [2, 3] }
        storage_durability: { type: string, enum: [replicated, degraded, single_copy] }
        storage_durability_reason: { type: [string, 'null'] }
        storage_copies: { type: string, examples: ['2 copies, one per host'], description: 'How many copies of a volume the replicated storage keeps and where, as the policy last converged it.' }
        allow_degraded_replication: { type: boolean, description: 'Whether the zone sells Ceph tiers below size 3 / min_size 2 on three hosts (the operator override).' }
        ceph_tiers_offered: { type: boolean, description: Whether new volumes and server boot disks may use the Ceph tiers. }
        ceph_tiers_unavailable_reason: { type: [string, 'null'], description: 'Why the Ceph tiers are not offered: Ceph is inactive, or replicates below size 3 / min_size 2 on three hosts without the override.' }
    StorageBackend:
      type: object
      required: [backend, state, node_id, hosts, single_host_ceph, replication, updated_at]
      properties:
        backend: { type: string, enum: [ankra-local, ceph, ankra-s3-single] }
        state: { type: string, enum: [inactive, bootstrapping, active] }
        node_id: { type: [string, 'null'], description: 'Ceph: the storage node that administers the cluster. ankra-s3-single: the node running it.' }
        hosts: { type: integer }
        single_host_ceph: { type: boolean }
        replication:
          oneOf:
            - type: object
              required: [failure_domain, size, min_size, monitors, managers]
              properties:
                failure_domain: { type: string, enum: [osd, host] }
                size: { type: integer }
                min_size: { type: integer }
                monitors: { type: integer }
                managers: { type: integer }
            - type: 'null'
        updated_at: { type: [string, 'null'], format: date-time }
    StorageNode:
      type: object
      required: [node_id, hostname, compute, online, local_gibibytes]
      properties:
        node_id: { type: string }
        hostname: { type: string }
        compute: { type: boolean }
        online: { type: boolean }
        local_gibibytes: { type: integer }
        storage_policy: { type: string, enum: [ankra-local, ceph, both], description: "What the storage node's disks serve (absent for a ceph-witness node)." }
        ceph_volume_gibibytes: { type: [integer, 'null'], description: "The size of the node's Ankra Storage volume with the storage policy both; null otherwise." }
        osd_host: { type: boolean, description: 'Whether the node held an OSD when the storage policy last read the cluster.' }
    StorageEnvelope:
      type: object
      required: [storage]
      properties:
        storage: { $ref: '#/components/schemas/Storage' }
    StorageList:
      type: object
      required: [items, next_cursor]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Storage' } }
        next_cursor: { $ref: '#/components/schemas/NextCursor' }
    CreateStorageRequest:
      type: object
      additionalProperties: false
      required: [zone, title]
      properties:
        zone:
          type: string
          description: With `source_storage_id` or `source_snapshot_id` it must be the source's zone; with `source_backup_id` it may differ from the backup's zone (a cross-zone restore).
        title: { type: string }
        tier: { type: string, description: "Left empty, the source snapshot's tier, otherwise the zone's `default_storage_tier` (`GET /v1/zones/{zone}/capabilities`)." }
        size_gibibytes: { type: integer, description: "Defaults to, and must be at least, the source's size." }
        source_storage_id: { type: string, description: Clone this storage. A local-nvme clone of a local-nvme storage stays on its node (a thin snapshot). }
        source_backup_id: { type: string, description: Restore this backup as a new storage. }
        source_snapshot_id: { type: string, description: 'Clone this snapshot (copy-on-write) as a new storage in its zone.' }
        backup_rule:
          oneOf:
            - $ref: '#/components/schemas/BackupRule'
            - type: 'null'
        placement: { $ref: '#/components/schemas/StoragePlacement' }
        acknowledge_single_copy_without_backup:
          type: boolean
          default: false
          description: >-
            In a zone that keeps one copy of every volume (`storage_durability: single_copy`) and backs new volumes up by
            default (`default_backup` in `GET /v1/zones/{zone}/capabilities`), the storage gets a daily backup to the
            region's backup vault, kept 7 days, when the request names no `backup_rule`. True opts out: the volume is then
            a single copy on one host with no backup, and the storage records when the account acknowledged that
            (`single_copy_acknowledged_at`). It cannot be combined with `backup_rule`; elsewhere it changes nothing.

    Backup:
      type: object
      required: [id, zone, region, origin_storage_id, copy_of_backup_id, title, kind, state, size_gibibytes, created_at, completed_at, expires_at]
      properties:
        id: { type: string }
        zone: { type: string }
        region: { type: string }
        origin_storage_id: { type: string }
        copy_of_backup_id:
          type: [string, 'null']
          description: >-
            Set on another zone's copy of a backup: the backup it copies. A copy restores as a new storage in its own
            zone (`source_backup_id`) even while the original's zone is down.
        title: { type: string }
        kind: { type: string, enum: [manual, scheduled] }
        state: { type: string, enum: [creating, online, error, deleting] }
        size_gibibytes: { type: integer }
        created_at: { type: string, format: date-time }
        completed_at: { type: [string, 'null'], format: date-time }
        expires_at: { type: [string, 'null'], format: date-time }
        target:
          type: string
          enum: [ceph, vault, zone-object-store]
          description: >-
            Where the backup's bytes are: `ceph`, the zone's Ankra Storage; `vault`, the region's off-host backup vault;
            or `zone-object-store`, the zone's single-node S3 server (a zone without Ankra Storage backs its local-nvme
            volumes up to object storage).
        same_host: { type: boolean, description: 'Stored on the host that holds its volume: losing that host loses both.' }
        verified_at: { type: [string, 'null'], format: date-time, description: When an object backup was last read back and checked against its manifest. }
        verification_error: { type: [string, 'null'], description: What the last verification found wrong. }
    BackupList:
      type: object
      required: [items, next_cursor]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Backup' } }
        next_cursor: { $ref: '#/components/schemas/NextCursor' }
    Snapshot:
      type: object
      required: [id, zone, storage_id, title, state, size_gibibytes, tier, created_at, completed_at]
      properties:
        id: { type: string }
        zone: { type: string }
        storage_id: { type: string, description: The storage the snapshot was taken of. }
        title: { type: string }
        state: { type: string, enum: [creating, available, error, deleting], description: '`available` once it is ready: storages can be cloned from it.' }
        size_gibibytes: { type: integer, description: "The storage's size when the snapshot was taken: the least a storage cloned from it has." }
        tier: { type: string, description: "The storage's tier when the snapshot was taken, and the default tier of storages cloned from it." }
        created_at: { type: string, format: date-time }
        completed_at: { type: [string, 'null'], format: date-time }
    SnapshotList:
      type: object
      required: [items, next_cursor]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Snapshot' } }
        next_cursor: { $ref: '#/components/schemas/NextCursor' }

    CustomImage:
      type: object
      required: [id, zone, title, state, size_gibibytes, created_at]
      properties:
        id: { type: string }
        zone: { type: string }
        title: { type: string }
        state: { type: string, examples: [creating, online, error, deleting] }
        size_gibibytes: { type: integer }
        created_at: { type: string, format: date-time }
    CustomImageList:
      type: object
      required: [items, next_cursor]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/CustomImage' } }
        next_cursor: { $ref: '#/components/schemas/NextCursor' }

    Interface:
      type: object
      required: [id, server_id, network_id, address, address6, mac_address, device_index]
      properties:
        id: { type: string }
        server_id: { type: string }
        network_id: { type: string }
        address: { type: string }
        address6: { type: string, description: 'The leg''s address on the network''s ULA /64 (every leg carries one, derived from the network and `address`).' }
        mac_address: { type: string }
        device_index: { type: integer }
    InterfaceList:
      type: object
      required: [items, next_cursor]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Interface' } }
        next_cursor: { $ref: '#/components/schemas/NextCursor' }
    Network:
      type: object
      required: [id, zone, region, zones, name, cidr, ula_prefix, gateway, router_id, created_at]
      properties:
        id: { type: string }
        zone: { type: string, description: 'The home zone, where a router of the network lives.' }
        region: { type: string }
        zones: { type: array, items: { type: string }, description: 'Every zone of `region` the network is present in, sorted.' }
        name: { type: string }
        cidr: { type: string, description: 'The IPv4 subnet, shared by every zone the network spans.' }
        ula_prefix: { type: string, description: "The network's IPv6 ULA /64, the same in every zone it spans." }
        gateway: { type: string, description: "The first host address, reserved for a router." }
        router_id: { type: [string, 'null'] }
        members:
          type: array
          description: Only in `GET /v1/networks/{id}`.
          items: { $ref: '#/components/schemas/Interface' }
        created_at: { type: string, format: date-time }
    NetworkEnvelope:
      type: object
      required: [network]
      properties:
        network: { $ref: '#/components/schemas/Network' }
    NetworkList:
      type: object
      required: [items, next_cursor]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Network' } }
        next_cursor: { $ref: '#/components/schemas/NextCursor' }
    Router:
      type: object
      required: [id, zone, name, nat_enabled, nat_address, networks, created_at]
      properties:
        id: { type: string }
        zone: { type: string }
        name: { type: string }
        nat_enabled: { type: boolean }
        nat_address: { type: [string, 'null'] }
        networks: { type: array, items: { $ref: '#/components/schemas/Network' } }
        created_at: { type: string, format: date-time }
    RouterList:
      type: object
      required: [items, next_cursor]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Router' } }
        next_cursor: { $ref: '#/components/schemas/NextCursor' }
    FloatingIPTarget:
      type: string
      description: '`public` (the default) forwards to the server''s public address; `private:<network_id>` to its interface on that network, which must be attached to a router with NAT enabled.'
      pattern: '^(public|private:.+)$'
    FloatingIP:
      type: object
      required: [id, zone, address, server_id, target, created_at]
      properties:
        id: { type: string }
        zone: { type: string }
        address: { type: string }
        server_id: { type: [string, 'null'] }
        target: { type: [string, 'null'], description: '`public`, `private:<network_id>`, or null while unassigned.' }
        created_at: { type: string, format: date-time }
    FloatingIPList:
      type: object
      required: [items, next_cursor]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/FloatingIP' } }
        next_cursor: { $ref: '#/components/schemas/NextCursor' }
    FirewallRule:
      type: object
      additionalProperties: false
      required: [direction, action, protocol, remote_cidr, port_start, port_end, comment]
      properties:
        direction: { type: string, enum: [inbound, outbound] }
        action: { type: string, enum: [accept, drop] }
        protocol: { type: string, enum: ['', tcp, udp, icmp] }
        remote_cidr: { type: string, description: 'An IPv4 or IPv6 address or CIDR; empty for any.' }
        port_start: { type: integer, description: 0 is any; needs tcp or udp. }
        port_end: { type: integer }
        comment: { type: string }
    Firewall:
      type: object
      additionalProperties: false
      required: [enabled, default_inbound, default_outbound, rules]
      description: Rules apply in order, the first match decides, then the direction's default; established and related traffic is always allowed.
      properties:
        enabled: { type: boolean }
        default_inbound: { type: string, enum: [accept, drop] }
        default_outbound: { type: string, enum: [accept, drop] }
        rules: { type: array, items: { $ref: '#/components/schemas/FirewallRule' } }

    ApiToken:
      type: object
      required: [id, name, prefix, scope, created_by_email, created_at, last_used_at, expires_at]
      properties:
        id: { type: string }
        name: { type: string }
        prefix: { type: string, description: 'The first 8 characters of the token (`act_` plus 4).' }
        scope: { $ref: '#/components/schemas/TokenScope' }
        created_by_email: { type: string }
        created_at: { type: string, format: date-time }
        last_used_at: { type: [string, 'null'], format: date-time }
        expires_at: { type: string, format: date-time }
    ApiTokenList:
      type: object
      required: [items, next_cursor]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/ApiToken' } }
        next_cursor: { $ref: '#/components/schemas/NextCursor' }
    Member:
      type: object
      required: [id, email, role, created_at, last_login_at, is_current_user]
      properties:
        id: { type: string }
        email: { type: string }
        role: { $ref: '#/components/schemas/Role' }
        created_at: { type: string, format: date-time }
        last_login_at: { type: [string, 'null'], format: date-time }
        is_current_user: { type: boolean }
    MemberList:
      type: object
      required: [items, next_cursor]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Member' } }
        next_cursor: { $ref: '#/components/schemas/NextCursor' }
    Invitation:
      type: object
      required: [id, email, role, invited_by_email, created_at, expires_at]
      properties:
        id: { type: string }
        email: { type: string }
        role: { $ref: '#/components/schemas/Role' }
        invited_by_email: { type: string }
        created_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
    InvitationList:
      type: object
      required: [items, next_cursor]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Invitation' } }
        next_cursor: { $ref: '#/components/schemas/NextCursor' }
    Session:
      type: object
      required: [id, created_at, last_seen_at, expires_at, is_current, is_support_session, staff_email]
      properties:
        id: { type: string }
        created_at: { type: string, format: date-time }
        last_seen_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
        is_current: { type: boolean }
        is_support_session: { type: boolean }
        staff_email: { type: [string, 'null'], description: Null unless `is_support_session`. }
    SessionList:
      type: object
      required: [items, next_cursor]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Session' } }
        next_cursor: { $ref: '#/components/schemas/NextCursor' }
    SupportAccessSetting:
      type: object
      required: [support_access]
      properties:
        support_access: { type: string, enum: [consent_required, always_allowed] }
    SupportConsent:
      type: object
      required: [id, created_by_email, created_at, expires_at, used_at, used_by_staff_email, revoked_at, is_open]
      properties:
        id: { type: string }
        created_by_email: { type: string }
        created_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
        used_at: { type: [string, 'null'], format: date-time }
        used_by_staff_email: { type: [string, 'null'] }
        revoked_at: { type: [string, 'null'], format: date-time }
        is_open: { type: boolean, description: "Not used, not revoked and not expired." }
    SupportConsentList:
      type: object
      required: [items, next_cursor]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/SupportConsent' } }
        next_cursor: { $ref: '#/components/schemas/NextCursor' }
    SupportSession:
      type: object
      required: [id, acting_as_email, staff_email, staff_name, reason, mode, created_at, expires_at, last_seen_at]
      properties:
        id: { type: string }
        acting_as_email: { type: string, description: The account user the staff member acts as. }
        staff_email: { type: string }
        staff_name: { type: string }
        reason: { type: string }
        mode: { $ref: '#/components/schemas/SupportMode' }
        created_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
        last_seen_at: { type: string, format: date-time }
    SupportSessionList:
      type: object
      required: [items, next_cursor]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/SupportSession' } }
        next_cursor: { $ref: '#/components/schemas/NextCursor' }

    AuditEntry:
      type: object
      required: [id, sequence, at, actor_email, actor_kind, user_id, staff_id, token_id, token_name, action, resource_type, resource_id, detail, outcome, source_ip, user_agent, request_id, changes, previous_hash, entry_hash]
      properties:
        id: { type: string }
        sequence: { type: integer, description: "Position in the account's hash chain, 1-based." }
        at: { type: string, format: date-time }
        actor_email: { type: string, description: The person behind the action; the operator identity string for operator actions. }
        actor_kind: { type: string, enum: [user, token, staff, operator, system] }
        user_id: { type: string, description: "The acting user, or the user an API token acts as; empty otherwise." }
        staff_id: { type: string, description: "The staff member, for staff actions; empty otherwise." }
        token_id: { type: string, description: "The API token, for token actions; empty otherwise." }
        token_name: { type: string }
        action: { type: string }
        resource_type: { type: string }
        resource_id: { type: string }
        detail: { type: string }
        outcome: { type: string, enum: [success, denied, failed] }
        source_ip: { type: string, description: "The client address, trusted-proxy aware; empty for platform-initiated events." }
        user_agent: { type: string }
        request_id: { type: string, description: The X-Request-Id of the request that caused the event. }
        changes:
          type: array
          description: Before/after summary of an update, only the fields the action chose to disclose.
          items:
            type: object
            required: [field, before, after]
            properties:
              field: { type: string }
              before: { type: string }
              after: { type: string }
        previous_hash: { type: string, description: Hex SHA-256 of the previous entry in the chain (all zeros for the first); empty on entries written before the chain existed. }
        entry_hash: { type: string, description: "Hex SHA-256 of this entry's canonical JSON, including previous_hash." }
    AuditIntegrity:
      type: object
      required: [status, head_sequence, verified_through_sequence, verified_at, pruned_through_sequence, break]
      properties:
        status: { type: string, enum: [verified, unverified, broken] }
        head_sequence: { type: integer }
        verified_through_sequence: { type: integer }
        verified_at: { type: [string, 'null'], format: date-time }
        pruned_through_sequence: { type: integer, description: Entries up to this sequence were removed by retention; the chain verifies from here. }
        break:
          type: [object, 'null']
          required: [sequence, id, reason]
          properties:
            sequence: { type: integer }
            id: { type: string }
            reason: { type: string }
    AuditEntryList:
      type: object
      required: [items, next_cursor]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/AuditEntry' } }
        next_cursor: { $ref: '#/components/schemas/NextCursor' }

    UsageResource:
      type: object
      required: [resource_type, resource_id, name, plan, hours, amount_cents, cap_cents, hourly_price_millicents, is_active, estimated_month_cents]
      properties:
        resource_type: { type: string, examples: [server, storage, backup, floating_ip, nat_gateway] }
        resource_id: { type: string }
        name: { type: string }
        plan: { type: string }
        hours: { type: integer }
        amount_cents: { type: integer }
        cap_cents: { type: integer }
        hourly_price_millicents: { type: integer }
        is_active: { type: boolean }
        estimated_month_cents:
          type: integer
          description: 'The resource''s projected cost for the whole month: metered so far plus, while it still exists, its hourly price for the hours left, never above `cap_cents` (its monthly price). The summary''s `estimated_month_cents` is the sum.'
    UsageDay:
      type: object
      required: [date, amount_cents]
      properties:
        date: { type: string, format: date }
        amount_cents: { type: integer }
    UsageSummary:
      type: object
      required: [currency, period_start, period_end, metered_through, month_to_date_cents, estimated_month_cents, resources, daily]
      properties:
        currency: { type: string, const: EUR }
        period_start: { type: string, format: date-time }
        period_end: { type: string, format: date-time }
        metered_through: { type: [string, 'null'], format: date-time }
        month_to_date_cents: { type: integer }
        estimated_month_cents: { type: integer }
        resources: { type: array, items: { $ref: '#/components/schemas/UsageResource' } }
        daily:
          type: array
          description: The last 90 days including today, oldest first, zero-filled.
          items: { $ref: '#/components/schemas/UsageDay' }
        credit_balance_cents: { type: integer, description: 'What the account''s live credits have left; the next invoice spends it before charging.' }
        credit_next_expiry: { type: [string, 'null'], format: date-time, description: 'The soonest expiry of a live credit.' }
    BillingLogEntry:
      type: object
      required: [date, resource_type, resource_id, name, plan, hours, hourly_price_millicents, amount_cents]
      properties:
        date: { type: string, format: date }
        resource_type: { type: string }
        resource_id: { type: string }
        name: { type: string }
        plan: { type: string }
        hours: { type: integer }
        hourly_price_millicents: { type: integer }
        amount_cents: { type: integer }
    BillingLogEntryList:
      type: object
      required: [items, next_cursor]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/BillingLogEntry' } }
        next_cursor: { $ref: '#/components/schemas/NextCursor' }
    InvoiceLine:
      type: object
      required: [kind, resource_type, resource_id, name, plan, hours, amount_cents, cap_cents]
      properties:
        kind:
          type: string
          enum: [usage, credit]
          description: '`credit` lines are credits applied to the invoice: a negative `amount_cents`, the credit''s label as `name` (for example "Welcome credit WELCOME500") and its id as `resource_id`.'
        resource_type: { type: string }
        resource_id: { type: string }
        name: { type: string }
        plan: { type: string }
        hours: { type: integer }
        amount_cents: { type: integer }
        cap_cents: { type: integer }
    Invoice:
      type: object
      required: [id, period, period_start, period_end, currency, total_cents, created_at, lines]
      properties:
        id: { type: string }
        period: { type: string, pattern: '^[0-9]{4}-[0-9]{2}$' }
        period_start: { type: string, format: date-time }
        period_end: { type: string, format: date-time }
        currency: { type: string }
        total_cents: { type: integer, description: "The usage total, before credits." }
        credit_applied_cents: { type: integer, description: The part of the total account credits paid. }
        amount_due_cents: { type: integer, description: 'What is charged: `total_cents - credit_applied_cents`. An invoice credits pay in full is `paid` and never sent to Stripe.' }
        created_at: { type: string, format: date-time }
        lines: { type: array, items: { $ref: '#/components/schemas/InvoiceLine' } }
        payment_status:
          type: string
          enum: [unbilled, open, paid, overdue]
          description: '`unbilled` until Stripe has the invoice (or when payments are not configured or it totals nothing); `overdue` after a failed charge.'
        hosted_invoice_url:
          type: [string, 'null']
          description: Stripe's page to view and pay the invoice.
    InvoiceList:
      type: object
      required: [items, next_cursor]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Invoice' } }
        next_cursor: { $ref: '#/components/schemas/NextCursor' }
    StaffReasonRequest:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason: { type: string, minLength: 10, maxLength: 500, description: Why; written to the customer's audit log. }
    StaffAction:
      type: object
      description: A suspension or disablement staff placed; `staff_id` and `staff_email` are null once the staff member was deleted.
      required: [at, reason, staff_id, staff_email]
      properties:
        at: { type: string, format: date-time }
        reason: { type: string }
        staff_id: { type: [string, 'null'] }
        staff_email: { type: [string, 'null'] }
    StaffAccountSuspension:
      type: object
      description: >-
        What suspends an account. `suspended_for_payment_at` is set by the overdue loop and lifted by paying;
        `staff_suspension` is set and lifted by staff only.
      required: [account_id, account_name, suspended, suspended_for_payment_at, staff_suspension]
      properties:
        account_id: { type: string }
        account_name: { type: string }
        suspended: { type: boolean, description: Whether anything suspends the account. }
        suspended_for_payment_at: { type: [string, 'null'], format: date-time }
        staff_suspension:
          oneOf:
            - $ref: '#/components/schemas/StaffAction'
            - type: 'null'
    StaffUserSummary:
      type: object
      required: [id, email, name, account_id, account_name, role, created_at, last_login_at, disabled]
      properties:
        id: { type: string }
        email: { type: string }
        name: { type: [string, 'null'] }
        account_id: { type: string, description: The user's own account. }
        account_name: { type: string }
        role: { type: string, enum: [owner, admin, member, viewer], description: The user's role in their own account. }
        created_at: { type: string, format: date-time }
        last_login_at: { type: [string, 'null'], format: date-time }
        disabled:
          description: Set while staff have the user disabled.
          oneOf:
            - $ref: '#/components/schemas/StaffAction'
            - type: 'null'
    StaffUserSummaryList:
      type: object
      required: [items, next_cursor]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/StaffUserSummary' } }
        next_cursor: { $ref: '#/components/schemas/NextCursor' }
    StaffUser:
      allOf:
        - $ref: '#/components/schemas/StaffUserSummary'
        - type: object
          required: [email_verified_at, mfa]
          properties:
            email_verified_at: { type: [string, 'null'], format: date-time }
            mfa:
              type: object
              required: [enrolled, enrolled_at, recovery_codes_remaining, required_by_account]
              properties:
                enrolled: { type: boolean }
                enrolled_at: { type: [string, 'null'], format: date-time }
                recovery_codes_remaining: { type: integer }
                required_by_account: { type: boolean, description: Whether the user's own account requires a second factor of every member. }
    StaffUserWorkspace:
      type: object
      description: One account the user reaches, with their role in it.
      required: [account_id, account_name, role, is_own_account, organisation, platform_role, is_stale, is_owner_retained, confirmed_at]
      properties:
        account_id: { type: string }
        account_name: { type: string }
        role: { type: string, enum: [owner, admin, member, viewer] }
        is_own_account: { type: boolean }
        organisation:
          oneOf:
            - $ref: '#/components/schemas/PlatformOrganisation'
            - type: 'null'
        platform_role: { type: [string, 'null'], description: The role the Ankra platform gave the user in the organisation. }
        is_stale: { type: boolean, description: The last sign-in could not confirm the membership. }
        is_owner_retained: { type: boolean, description: The user holds the owner seat although the platform no longer lists them. }
        confirmed_at: { type: [string, 'null'], format: date-time }
    StaffUserDetail:
      type: object
      required: [user, workspaces]
      properties:
        user: { $ref: '#/components/schemas/StaffUser' }
        workspaces: { type: array, items: { $ref: '#/components/schemas/StaffUserWorkspace' } }
    StaffMemberRoleChange:
      type: object
      required: [member, previous_role, previous_owner, changed]
      properties:
        member: { $ref: '#/components/schemas/StaffUserSummary' }
        previous_role: { type: string, enum: [owner, admin, member, viewer] }
        previous_owner:
          description: Set when the member became the owner; the previous owner, now an admin.
          oneOf:
            - $ref: '#/components/schemas/StaffUserSummary'
            - type: 'null'
        changed: { type: boolean }
    StaffInvoice:
      allOf:
        - $ref: '#/components/schemas/Invoice'
        - type: object
          required: [stripe_invoice_id, stripe_dashboard_url, payment_status_changed_at]
          properties:
            stripe_invoice_id: { type: [string, 'null'], description: 'The Stripe invoice (in_…), once Stripe has it.' }
            stripe_dashboard_url: { type: [string, 'null'], description: The invoice in the Stripe dashboard. }
            payment_status_changed_at: { type: [string, 'null'], format: date-time }
    StaffInvoiceList:
      type: object
      required: [items, next_cursor]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/StaffInvoice' } }
        next_cursor: { $ref: '#/components/schemas/NextCursor' }
    StaffAccountBilling:
      type: object
      required: [account_id, standing, suspension, payments_configured, payment_method_on_file, payment_method_on_file_since, stripe_customer_id,
        stripe_dashboard_url, credits, invoices, billing_approval, platform_organisation, resources, running_without_payment_method, dev_cluster_trial]
      properties:
        account_id: { type: string }
        standing: { $ref: '#/components/schemas/AccountStanding' }
        suspension: { $ref: '#/components/schemas/StaffAccountSuspension' }
        payments_configured: { type: boolean }
        payment_method_on_file: { type: boolean, description: Whether a default payment method was seen. }
        payment_method_on_file_since: { type: [string, 'null'], format: date-time }
        stripe_customer_id: { type: [string, 'null'], description: 'The Stripe customer (cus_…), once the account used payments.' }
        stripe_dashboard_url: { type: [string, 'null'], description: The customer in the Stripe dashboard of the configured key's mode. }
        credits:
          type: object
          required: [remaining_cents, next_expiry]
          properties:
            remaining_cents: { type: integer }
            next_expiry: { type: [string, 'null'], format: date-time }
        invoices:
          type: object
          required: [open_count, overdue_count, outstanding_cents, oldest_overdue_since, currency, push_failing_count, last_push_error,
            last_push_failed_at, next_push_attempt_at]
          properties:
            open_count: { type: integer }
            overdue_count: { type: integer }
            outstanding_cents: { type: integer, description: What open and overdue invoices still charge after credits. }
            oldest_overdue_since: { type: [string, 'null'], format: date-time }
            currency: { type: string }
            push_failing_count: { type: integer, description: 'Unbilled invoices whose last push to Stripe failed; each is retried after a delay that doubles with every failure, up to a day.' }
            last_push_error: { type: [string, 'null'], description: 'The most recent push failure of those invoices, as the provider reported it.' }
            last_push_failed_at: { type: [string, 'null'], format: date-time }
            next_push_attempt_at: { type: [string, 'null'], format: date-time, description: When the earliest of those invoices is pushed again. }
        billing_approval:
          type: object
          description: Whether the organisation owner must approve paid usage beyond credits, and when, by whom and on which terms they did.
          required: [required, pending, approved_at, approved_by, terms_version]
          properties:
            required: { type: boolean }
            pending: { type: boolean, description: Required and not given yet. }
            approved_at: { type: [string, 'null'], format: date-time }
            approved_by: { type: [string, 'null'] }
            terms_version: { type: [string, 'null'] }
        platform_organisation:
          description: The Ankra platform organisation the account is linked to; null without one.
          oneOf:
            - type: object
              required: [id, name, linked_at, confirmed_at, provisioned_at]
              properties:
                id: { type: string }
                name: { type: [string, 'null'] }
                linked_at: { type: [string, 'null'], format: date-time }
                confirmed_at: { type: [string, 'null'], format: date-time }
                provisioned_at: { type: [string, 'null'], format: date-time, description: Set when the Ankra platform created the account rather than a person. }
            - { type: 'null' }
        resources:
          type: object
          required: [server_count, billable_server_count, dev_cluster_count]
          properties:
            server_count: { type: integer, description: 'Undeleted servers, managed service VMs and trial dev cluster servers included.' }
            billable_server_count: { type: integer, description: Undeleted servers the meter charges. }
            dev_cluster_count: { type: integer }
        running_without_payment_method:
          type: boolean
          description: No payment method on file while holding servers the meter charges; nothing can be charged once the credit runs out.
        dev_cluster_trial:
          type: object
          required: [offer, running_trial_id, running_trial_expires_at, started_count, converted_count]
          properties:
            offer:
              description: Whether the account may start a trial dev cluster now; null when the deployment offers no trials.
              oneOf:
                - { $ref: '#/components/schemas/DevClusterTrialOffer' }
                - { type: 'null' }
            running_trial_id: { type: [string, 'null'] }
            running_trial_expires_at: { type: [string, 'null'], format: date-time }
            started_count: { type: integer, description: Every trial dev cluster the account started. }
            converted_count: { type: integer, description: Trials kept as paid clusters after the account saved a card. }
    PaymentConfiguration:
      type: object
      required: [payments_configured, publishable_key, standing, dev_cluster_trial]
      properties:
        payments_configured: { type: boolean }
        publishable_key: { type: [string, 'null'], description: 'Stripe publishable key (pk_…), when configured.' }
        standing: { $ref: '#/components/schemas/AccountStanding' }
        dev_cluster_trial:
          description: Whether the account may start a free trial dev cluster while it cannot create billable resources; null when the deployment offers no trials.
          oneOf:
            - { $ref: '#/components/schemas/DevClusterTrialOffer' }
            - { type: 'null' }
    AccountStanding:
      type: object
      description: Whether the account may create billable resources; a refused create answers 402 with the same `reason`.
      required: [can_create_resources, reason, suspended_for_payment_at, suspended_by_staff_at, requires_billing_approval, billing_arrangement,
        unpaid_usage_since, servers_stop_at]
      properties:
        requires_billing_approval: { type: boolean, description: Saving a card does not authorise paid usage. }
        billing_arrangement:
          type: string
          enum: [card, invoice]
          description: >-
            `card`: a default payment method is required to create billable resources and Cloud charges the invoices
            through Stripe. `invoice`: the Ankra platform invoices the organisation under its own agreement, so no card
            and no owner approval are needed and Cloud never charges the account's invoices.
        can_create_resources: { type: boolean }
        reason:
          type: [string, 'null']
          enum: [payment_method_required, owner_approval_required, account_suspended, null]
          description: >-
            Why the account may not create billable resources; null while it may. `account_suspended` covers both
            suspensions; the two timestamps say which hold.
        suspended_for_payment_at:
          type: [string, 'null']
          format: date-time
          description: When an invoice overdue past the grace period suspended the account; null while it is in good standing.
        suspended_by_staff_at:
          type: [string, 'null']
          format: date-time
          description: >-
            When Ankra staff suspended the account; null while they have not. Paying an invoice does not lift it; contact
            support.
        unpaid_usage_since:
          type: [string, 'null']
          format: date-time
          description: >-
            When the account was first seen running billable servers that nothing pays for: it is billed by card, has
            no payment method on file and no credit left. Null while a payment method, a credit or an invoice
            arrangement pays.
        servers_stop_at:
          type: [string, 'null']
          format: date-time
          description: >-
            When the account's servers are powered off for unpaid usage (seven days after the account was told), or
            were. Powering off keeps disks, addresses and data; adding a payment method under Settings, Billing ends
            it. Null while something pays, and until the account was told.
    PaymentSetupSession:
      type: object
      required: [url]
      properties:
        url: { type: string, format: uri }
    Credit:
      type: object
      required: [id, source, source_id, label, currency, amount_cents, remaining_cents, granted_at, expires_at, status]
      properties:
        id: { type: string }
        source: { type: string, enum: [coupon, staff] }
        source_id: { type: [string, 'null'], description: The coupon that granted it. }
        label: { type: string, examples: ['Welcome credit WELCOME500'] }
        currency: { type: string, const: EUR }
        amount_cents: { type: integer }
        remaining_cents: { type: integer }
        granted_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
        status:
          type: string
          enum: [active, used, expired, voided]
          description: '`expired` credits keep `remaining_cents` for the record; they still pay for usage from before their expiry on an invoice not issued yet, never for later usage.'
    CreditList:
      type: object
      required: [currency, balance_cents, next_expiry, items, next_cursor]
      properties:
        currency: { type: string, const: EUR }
        balance_cents: { type: integer }
        next_expiry: { type: [string, 'null'], format: date-time }
        items: { type: array, items: { $ref: '#/components/schemas/Credit' } }
        next_cursor: { $ref: '#/components/schemas/NextCursor' }
    RedeemCouponRequest:
      type: object
      additionalProperties: false
      required: [code]
      properties:
        code: { type: string, maxLength: 64, examples: ['WELCOME500'] }
    CouponRedemption:
      type: object
      required: [code, description, credit]
      properties:
        code: { type: string }
        description: { type: string }
        credit: { $ref: '#/components/schemas/Credit' }
    CouponRefusalProblem:
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          required: [reason]
          properties:
            reason: { type: string, enum: [unknown, inactive, not_yet_valid, expired, exhausted, already_redeemed] }
    PaymentMethod:
      type: object
      required: [id, type, brand, last4, exp_month, exp_year, is_default]
      properties:
        id: { type: string, examples: ['pm_1Q2w3E'] }
        type: { type: string, examples: [card, sepa_debit] }
        brand: { type: string, description: 'Card brand; empty for other types.' }
        last4: { type: string }
        exp_month: { type: integer }
        exp_year: { type: integer }
        is_default: { type: boolean }
    PaymentMethodList:
      type: object
      required: [items, next_cursor]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/PaymentMethod' } }
        next_cursor: { $ref: '#/components/schemas/NextCursor' }
    WebhookReceipt:
      type: object
      required: [received, outcome]
      properties:
        received: { type: boolean }
        outcome: { type: string, enum: [applied, duplicate, ignored] }

    QuotaAmounts:
      type: object
      required: [servers, cores, storage_gibibytes, floating_ips, routers, private_networks]
      properties:
        servers: { type: integer }
        cores: { type: integer }
        storage_gibibytes: { type: integer }
        floating_ips: { type: integer }
        routers: { type: integer }
        private_networks: { type: integer }
    Notification:
      type: object
      required: [id, kind, severity, title, body, resource_type, resource_id, created_at, read_at]
      properties:
        id: { type: string }
        kind:
          type: string
          description: What the notification is about. New kinds may be added; treat an unknown one as a plain message.
          enum: [operation.failed, billing.payment_failed, billing.suspension_countdown, billing.account_suspended, quota.refused,
            billing.unpaid_usage_found, billing.unpaid_usage_stop_reminder, billing.unpaid_usage_servers_stopped]
        severity: { type: string, enum: [info, warning, critical] }
        title: { type: string }
        body: { type: string, description: The detail under the title; empty when the title says it all. }
        resource_type:
          type: string
          description: >-
            What the notification is about: `operation`, `invoice` or `account`; empty when it is about nothing in
            particular.
        resource_id: { type: string, description: The identifier of that resource. }
        created_at: { type: string, format: date-time }
        read_at:
          type: [string, 'null']
          format: date-time
          description: When somebody in the account first read it; null while unread.
    NotificationList:
      type: object
      required: [items, next_cursor]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Notification' } }
        next_cursor: { $ref: '#/components/schemas/NextCursor' }
    NotificationUnreadCount:
      type: object
      required: [unread, ceiling]
      properties:
        unread: { type: integer, description: 'Unread notifications, at most `ceiling`.' }
        ceiling: { type: integer, description: Where counting stops (100). }
    Quota:
      type: object
      required: [limits, usage]
      properties:
        limits: { $ref: '#/components/schemas/QuotaAmounts' }
        usage: { $ref: '#/components/schemas/QuotaAmounts' }

    PlatformOrganisation:
      type: object
      additionalProperties: false
      required: [id, name]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
    SwitchableAccount:
      type: object
      additionalProperties: false
      required: [id, name, role, is_own_account, is_active, organisation, platform_role, is_stale, is_owner_retained, confirmed_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        role: { type: string, enum: [owner, admin, member, viewer] }
        is_own_account: { type: boolean }
        is_active: { type: boolean }
        organisation:
          oneOf:
            - { $ref: '#/components/schemas/PlatformOrganisation' }
            - { type: 'null' }
        platform_role: { type: string, description: The role the platform gives you in the organisation; empty for your own account. }
        is_stale: { type: boolean, description: The last sign-in could not confirm this membership because the platform did not answer. }
        is_owner_retained: { type: boolean, description: You hold the owner seat although the platform no longer lists you; nobody else could take it. }
        confirmed_at: { type: [string, 'null'], format: date-time }
    OrganisationMembership:
      type: object
      additionalProperties: false
      required: [organisation, platform_role, role, is_current, is_stale, confirmed_at]
      properties:
        organisation: { $ref: '#/components/schemas/PlatformOrganisation' }
        platform_role: { type: string }
        role: { type: string, enum: [admin, member, viewer] }
        is_current: { type: boolean }
        is_stale: { type: boolean }
        confirmed_at: { type: string, format: date-time }
        account_id: { type: string, format: uuid, description: The organisation's Cloud account when you reach it; absent when opening the organisation creates it or needs a fresh sign-in. }
    AccountSwitcher:
      type: object
      additionalProperties: false
      required: [items, active_account_id, organisations, connected, create_organisation_url]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/SwitchableAccount' }
        active_account_id: { type: string, format: uuid }
        organisations:
          type: array
          items: { $ref: '#/components/schemas/OrganisationMembership' }
        connected: { type: boolean, description: Sign-in with an Ankra account follows platform organisations on this deployment. }
        create_organisation_url:
          type: [string, 'null']
          format: uri
          description: The Ankra platform page that creates an organisation; null when this deployment is not connected to the platform. A new organisation is listed after the next sign-in with your Ankra account.
    OrganisationLink:
      type: object
      additionalProperties: false
      required: [organisation, linked_at, confirmed_at, has_owner_seat, is_owner_retained]
      properties:
        organisation: { $ref: '#/components/schemas/PlatformOrganisation' }
        linked_at: { type: string, format: date-time }
        confirmed_at: { type: string, format: date-time }
        has_owner_seat: { type: boolean, description: The organisation holds the account's ownership (the account was created for it). }
        is_owner_retained: { type: boolean }
    OrganisationMember:
      type: object
      additionalProperties: false
      required: [user_id, email, platform_role, role, is_owner, is_stale, confirmed_at]
      properties:
        user_id: { type: string, format: uuid }
        email: { type: string }
        platform_role: { type: string }
        role: { type: string, enum: [owner, admin, member, viewer] }
        is_owner: { type: boolean }
        is_stale: { type: boolean }
        confirmed_at: { type: string, format: date-time }
    AccountOrganisation:
      type: object
      additionalProperties: false
      required: [link, members, candidates, connected]
      properties:
        link:
          oneOf:
            - { $ref: '#/components/schemas/OrganisationLink' }
            - { type: 'null' }
        members:
          type: array
          items: { $ref: '#/components/schemas/OrganisationMember' }
        candidates:
          type: array
          items: { $ref: '#/components/schemas/OrganisationMembership' }
        connected: { type: boolean }
    LinkedIdentityList:
      type: object
      required: [items, next_cursor]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/LinkedIdentity' } }
        next_cursor: { $ref: '#/components/schemas/NextCursor' }

    ForceRelease:
      type: object
      required: [operation, cancelled_operation_ids]
      properties:
        operation: { $ref: '#/components/schemas/Operation' }
        cancelled_operation_ids:
          type: array
          description: The server's operations the force release cancelled.
          items: { type: string }

    HealthStatus:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [ok, ready, parked] }
        revision: { type: string, pattern: '^[0-9a-f]{7,40}$', description: 'The commit this replica was deployed from. Only a 200 of `/readyz` on the main listener carries it, and only when the deployment set it.', examples: ['0123456789abcdef0123456789abcdef01234567'] }

    StaffRole:
      type: string
      description: '`support` views accounts and opens read-only support sessions; `admin` also changes quotas, credits, coupons and staff and opens elevated sessions.'
      enum: [support, admin]
    Staff:
      type: object
      required: [id, email, name, role, mfa_enforced, mfa_enrolled, created_at, last_login_at, disabled_at]
      properties:
        id: { type: string }
        email: { type: string }
        name: { type: string }
        role: { $ref: '#/components/schemas/StaffRole' }
        mfa_enforced: { type: boolean, description: 'No staff session without a second factor (the default).' }
        mfa_enrolled: { type: boolean, description: 'The staff member has an active authenticator.' }
        created_at: { type: string, format: date-time }
        last_login_at: { type: [string, 'null'], format: date-time }
        disabled_at: { type: [string, 'null'], format: date-time }
    StaffEnvelope:
      type: object
      required: [staff]
      properties:
        staff: { $ref: '#/components/schemas/Staff' }
    StaffList:
      type: object
      required: [items, next_cursor]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Staff' } }
        next_cursor: { $ref: '#/components/schemas/NextCursor' }
    StaffSession:
      type: object
      required: [staff, csrf_token]
      properties:
        staff: { $ref: '#/components/schemas/Staff' }
        csrf_token: { type: string, description: 'Send it as X-CSRF-Token on unsafe admin requests.' }
    StaffSecondFactorSession:
      allOf:
        - $ref: '#/components/schemas/StaffSession'
        - type: object
          properties:
            recovery_codes: { type: array, items: { type: string }, description: 'After a setup at sign-in: the ten recovery codes, shown once.' }
            recovery_codes_remaining: { type: integer, description: 'After a code check: how many unused recovery codes are left.' }
    StaffSecondFactorStatus:
      type: object
      required: [totp_enabled, totp_pending, enabled_at, recovery_codes_remaining, enforced, available]
      properties:
        totp_enabled: { type: boolean }
        totp_pending: { type: boolean }
        enabled_at: { type: [string, 'null'], format: date-time }
        recovery_codes_remaining: { type: integer }
        enforced: { type: boolean, description: 'MFA is enforced for the staff member; it cannot be turned off.' }
        available: { type: boolean }
    StaffLoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string }
        password: { type: string }
    CreateStaffRequest:
      type: object
      additionalProperties: false
      required: [email, name]
      properties:
        email: { type: string }
        name: { type: string }
        role: { $ref: '#/components/schemas/StaffRole' }
        password: { type: string, description: 'Leave out to have one generated and returned once.' }
    CreatedStaff:
      type: object
      required: [staff]
      properties:
        staff: { $ref: '#/components/schemas/Staff' }
        password: { type: string, description: 'The generated password, only when none was given.' }
    UpdateStaffRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        role: { $ref: '#/components/schemas/StaffRole' }
        name: { type: string, minLength: 1, maxLength: 200 }
    ResetStaffPasswordRequest:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason: { type: string, minLength: 10, maxLength: 500, description: 'Why the password is reset; recorded in the platform audit chain.' }
    ResetStaffPassword:
      type: object
      required: [staff, password]
      properties:
        staff: { $ref: '#/components/schemas/Staff' }
        password: { type: string, description: 'The generated password, shown once.' }
    ChangeStaffPasswordRequest:
      type: object
      additionalProperties: false
      required: [current_password, new_password]
      properties:
        current_password: { type: string }
        new_password: { type: string, minLength: 12, maxLength: 1024 }

    StaffAccountSummary:
      type: object
      required: [id, name, primary_email, user_count, server_count, billable_server_count, created_at, billing_status, payment_method_on_file_since,
        has_stripe_customer, credit_remaining_cents, running_without_payment_method, dev_cluster_count, running_trial_id, running_trial_expires_at,
        platform_organisation, platform_provisioned_at]
      properties:
        id: { type: string }
        name: { type: string }
        primary_email: { type: string, description: 'The email of the account''s oldest user.' }
        user_count: { type: integer }
        server_count: { type: integer, description: 'Undeleted servers, managed service VMs and trial dev cluster servers included.' }
        billable_server_count: { type: integer, description: Undeleted servers the meter charges (a trial dev cluster's server is not). }
        created_at: { type: string, format: date-time }
        billing_status:
          type: string
          enum: [suspended_by_staff, suspended_for_payment, no_payment_method, owner_approval_pending, ok]
          description: >-
            The account's billing posture from the database alone, in the order the spending gate refuses: a staff
            suspension, an overdue-invoice suspension, no payment method on file (a credit never replaces the card), an
            owner approval no credit covers, else ok.
        payment_method_on_file_since: { type: [string, 'null'], format: date-time, description: When a default payment method was first seen; null without one. }
        has_stripe_customer: { type: boolean }
        credit_remaining_cents: { type: integer, description: 'What unvoided, unexpired credits have left, before uninvoiced usage is reserved against them.' }
        running_without_payment_method:
          type: boolean
          description: No payment method on file while holding servers the meter charges; nothing can be charged once the credit runs out.
        dev_cluster_count: { type: integer, description: Undeleted dev clusters. }
        running_trial_id: { type: [string, 'null'], description: The account's live trial dev cluster. }
        running_trial_expires_at: { type: [string, 'null'], format: date-time, description: When the live trial is deleted unless the account saves a card first. }
        platform_organisation:
          description: The Ankra platform organisation the account is linked to; null without one.
          oneOf:
            - { $ref: '#/components/schemas/StaffPlatformOrganisationSummary' }
            - { type: 'null' }
        platform_provisioned_at: { type: [string, 'null'], format: date-time, description: Set when the Ankra platform created the account rather than a person. }
    StaffPlatformOrganisationSummary:
      type: object
      required: [id, name]
      properties:
        id: { type: string }
        name: { type: string }
    StaffAccountSummaryList:
      type: object
      required: [items, next_cursor]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/StaffAccountSummary' } }
        next_cursor: { $ref: '#/components/schemas/NextCursor' }
    StaffAccountDetail:
      type: object
      required: [account, users, servers]
      properties:
        account:
          type: object
          required: [id, name, created_at, support_access]
          properties:
            id: { type: string }
            name: { type: string }
            created_at: { type: string, format: date-time }
            support_access: { type: string, enum: [consent_required, always_allowed] }
        users:
          type: array
          items:
            type: object
            required: [id, email, role, created_at, last_login_at]
            properties:
              id: { type: string }
              email: { type: string }
              role: { $ref: '#/components/schemas/Role' }
              created_at: { type: string, format: date-time }
              last_login_at: { type: [string, 'null'], format: date-time }
        servers:
          type: array
          description: Every server of the account, managed service VMs included.
          items: { $ref: '#/components/schemas/Server' }
    OpenSupportSessionRequest:
      type: object
      additionalProperties: false
      required: [user_id, reason]
      properties:
        user_id: { type: string, description: 'The account user the session acts as.' }
        mode: { $ref: '#/components/schemas/SupportMode' }
        reason: { type: string, minLength: 10, maxLength: 500, description: 'Shown to the customer in their audit log and banner.' }
        consent_code: { type: string, description: 'The code the customer created in Settings, Support; needed for an elevated session unless support access is always_allowed.' }
    OpenedSupportSession:
      type: object
      required: [redirect, handoff_code, expires_at, mode, acting_as]
      properties:
        redirect: { type: string, description: 'The customer portal page that redeems the handoff code.' }
        handoff_code: { type: string, description: 'Single use; redeem with POST /v1/auth/support-handoff.' }
        expires_at: { type: string, format: date-time }
        mode: { $ref: '#/components/schemas/SupportMode' }
        acting_as:
          type: object
          required: [id, email, role]
          properties:
            id: { type: string }
            email: { type: string }
            role: { $ref: '#/components/schemas/Role' }
    QuotaChange:
      type: object
      additionalProperties: false
      description: Fields left out keep their value.
      properties:
        servers: { type: integer, minimum: 0 }
        cores: { type: integer, minimum: 0 }
        storage_gibibytes: { type: integer, minimum: 0 }
        floating_ips: { type: integer, minimum: 0 }
        routers: { type: integer, minimum: 0 }
        private_networks: { type: integer, minimum: 0 }

    GrantCreditRequest:
      type: object
      additionalProperties: false
      required: [amount_cents, label]
      properties:
        amount_cents: { type: integer, minimum: 1, maximum: 10000000 }
        label: { type: string, minLength: 1, maxLength: 240, description: 'Names the credit on invoices.', examples: ['Goodwill credit for the 2026-09-12 outage'] }
        valid_from: { type: string, format: date-time, description: 'Defaults to now; may be in the past, at most a year ahead.' }
        expires_at: { type: string, format: date-time }
        validity_days: { type: integer, minimum: 1, maximum: 3660 }
    Coupon:
      type: object
      required: [id, code, description, currency, credit_cents, validity_days, max_redemptions, redemption_count, redeemable_from,
        redeemable_until, is_active, created_at, created_by, deactivated_at]
      properties:
        id: { type: string }
        code: { type: string, examples: ['WELCOME500'] }
        description: { type: string }
        currency: { type: string, const: EUR }
