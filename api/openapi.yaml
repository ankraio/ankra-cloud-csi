      security: [{ sessionCookie: [] }]
      responses:
        '200':
          description: The standing decision.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SupportAccessSetting' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        default: { $ref: '#/components/responses/Error' }
    put:
      operationId: set_support_access
      tags: [support]
      summary: Change how elevated support sessions may be opened (owner only)
      description: Session-only. `consent_required` (the default) makes staff ask for a consent code before every elevated session; `always_allowed` lets admin staff open one without asking. Read-only support sessions never need consent. Audited as `support.access_changed`.
      x-ankra-permission: members.manage
      security:
        - sessionCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SupportAccessSetting' }
      responses:
        '200':
          description: Changed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SupportAccessSetting' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        default: { $ref: '#/components/responses/Error' }

  /v1/account/support-consents:
    get:
      operationId: list_support_consents
      tags: [support]
      summary: The account's newest consent codes, open and closed (`next_cursor` is always null)
