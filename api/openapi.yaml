        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        default: { $ref: '#/components/responses/Error' }

  /v1/servers/{id}/renumber-ipv6:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    post:
      operationId: renumber_server_ipv6
      tags: [server]
      summary: Move a server's IPv6 /64 to the zone's public IPv6 pool
      description: |
        Operation `server.renumber_ipv6`. A server created before its zone moved to a new IPv6 pool keeps its /64 from
        the old, draining pool (for example a private `fd64:` address that is unreachable from the internet). This
        delegates it a /64 from the zone's active pool, republishes its node and the zone's gateways, and hands the old
        /64 back to its pool. The guest takes its address from cloud-init on boot, so **a running server is stopped and
        started again** (a few seconds to a minute of downtime); a stopped server stays stopped and boots with the new
        address. The server's IPv4 add-on, floating IPs and private network addresses are unchanged, and bastions of
        its networks' edges forward to the new /64 afterwards. Update any DNS record that names the old address.

        409 when the server's /64 is already from an active pool, when the zone has no active IPv6 pool, when a load
        balancer member, edge member or firewall rule of the account names an address of the old /64 (the message
        lists them; change or remove them first), when the server has no public IPv6 or no storage attached, or while
        another operation runs. `ipv6_renumber_available` on the server says whether the action applies.
      x-ankra-permission: operate
      security:
        - apiToken: []
        - sessionCookie: []
          csrfHeader: []
      responses:
        '202': { $ref: '#/components/responses/OperationAccepted' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        default: { $ref: '#/components/responses/Error' }

  /v1/servers/{id}/public-ipv4:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    post:
      operationId: add_server_public_ipv4
      tags: [server]
      summary: Add a public IPv4 to an existing server
      description: |
        Operation `server.add_public_ipv4`. The server gets the public IPv4 add-on it was deployed without: an address
        of its zone's public IPv4 pool, billed per hour from the hour it is taken (the same price as at deploy time, see
        `public_ipv4` on create_server). The operation takes the address first (a zone without a free one fails it
        before the server is touched), then republishes the server's node and the zone's gateways. The guest takes its
        addresses from cloud-init on boot, so **a running server is stopped and started again** (a few seconds to a
        minute of downtime); a stopped server stays stopped and boots with the address. Its IPv6, floating IPs and
        private network addresses are unchanged. The answer carries the server as it is now and the operation;
        `public_ipv4` on the server is set once the operation's first step has run.

        An addition that fails before the server was started with its address (it does not stop in time) is cleaned up
        by a `server.settle_public_ipv4` operation: the address goes back to the pool, nothing is billed for it, and a
        server that was running is started again. One that fails later (the server does not come up in time) keeps the
        address, since the guest may already answer on it: the operation's error says the public IPv4 was added, it
        is billed, and the server is left starting.

        409 when the server already has a public IPv4, when the zone has no free address (`public_ipv4.free` in
        get_zone_capabilities), when the server is a managed service's VM, a node of a Kubernetes node pool or the
        server of a dev cluster (its public IPv4 is the pool's or the cluster's setting), when it is being deleted,
        when it has no storage attached, or while another operation runs. 402 while the account needs a card to create
        billable resources.
      x-ankra-permission: operate
      x-ankra-billable-create: true
      x-ankra-idempotent: true
      x-ankra-verified-email: true
      security:
        - apiToken: []
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '202': { $ref: '#/components/responses/ServerOperationAccepted' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/PaymentRequired' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/IdempotencyKeyReused' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        default: { $ref: '#/components/responses/Error' }
    delete:
      operationId: remove_server_public_ipv4
      tags: [server]
      summary: Remove a server's public IPv4
      description: |
        Operation `server.remove_public_ipv4`. The server's public IPv4 goes back to the zone's pool and **cannot be got
        back**: a later addition gets whatever address is free then. The operation stops the server first, so the
        address is released only once nothing answers on it, republishes the node and the zone's gateways, and starts
        the server again when it was running (a stopped server stays stopped). The hours the address was held, the
        current one included, are billed; nothing after. Its IPv6 and private network addresses are unchanged; an
        IPv6-only server reaches IPv4 destinations through the zone's NAT64 again.

        What names the address is checked again once the server is stopped, before the address is released: a floating
        IP, member or rule added meanwhile fails the operation, the server keeps its address and a
        `server.settle_public_ipv4` operation starts it again when it was running.

        409 when the server has no public IPv4, when a floating IP is forwarded to the address or a load balancer
        member, edge member or firewall rule of the account names it (the message lists them; change or remove them
        first), when the address is the server's only network interface (attach a private network first), when the
        server is a managed service's VM, a node of a Kubernetes node pool or the server of a dev cluster, when it is
        being deleted, when it has no storage attached, or while another operation runs.
      x-ankra-permission: operate
      security:
        - apiToken: []
        - sessionCookie: []
          csrfHeader: []
      responses:
        '202': { $ref: '#/components/responses/ServerOperationAccepted' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        default: { $ref: '#/components/responses/Error' }

