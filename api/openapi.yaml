        the new allocation would not place there (drain the host to move them). The reason is required. Recorded in the
        platform audit chain (`node.allocation.set`, resource `<zone>/<node>`).
      x-ankra-staff-role: admin
      security:
        - staffSession: []
          staffCsrfHeader: []
