  /admin/v1/agent-rollouts:
    get:
      operationId: list_agent_rollouts
      tags: [agent_rollout]
      summary: The fleet rollouts of agent builds, newest first (staff)
      description: Every rollout with its nodes in the order it takes them. At most 50 per page (20 by default).
      x-ankra-staff-role: support
      security:
        - staffSession: []
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
      responses:
        '200':
          description: A page of rollouts.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AgentRolloutList' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        default: { $ref: '#/components/responses/Error' }
    post:
      operationId: start_agent_rollout
      tags: [agent_rollout]
      summary: Roll one agent build across the fleet, one node at a time (admin staff)
      description: |
        Takes a stored build across the nodes of every zone, or of `zones`, strictly one node at a time fleet-wide. Each
        node goes through its own `node.agent_upgrade` operation (see `start_fleet_node_agent_upgrade`): its agent
        restarts into the build, nothing is cordoned, drained or stopped, and the rollout waits until the agent reports
        the build's commit and the node is healthy before it takes the next.

        The nodes are fixed when the rollout starts, zone by zone and inside a zone control hosts first, then backup,
        storage and compute nodes, and gateways last. Before a zone's next gateway the rollout waits until the gateway it
        upgraded before is online and healthy again, and has been for 30 seconds; it fails when that takes longer than
        15 minutes. A node that already runs the build's commit, is offline, fenced, never reported or no longer exists
        is `skipped` with the reason and does not fail the rollout. While a node's zone is in maintenance, or the node
        has another operation, the rollout waits (the node's `detail` says for what). The first node whose upgrade fails
        stops the rollout: it is `failed`, `error` names the node and why, and the nodes after it are not touched.

        A zone's canaries go first: the nodes marked with `set_node_rollout_canary` when the rollout starts (`canary` on
        each node) are taken before every other node of their zone, in the same role order. Once they took the build the
        rollout is `awaiting_promotion` and touches none of the zone's other nodes until `auto_promote_after_seconds`
        (30 minutes by default) have passed with the canaries online, healthy and on the build, or until
        `promote_agent_rollout`. A canary that goes offline, is fenced or loses the build during the soak fails the
        rollout; one that misses heartbeats or reports a gating component (`kvm`, `boot`) unhealthy holds the promotion back, and fails the
        rollout when it does so more than 15 minutes into the soak. Zones are taken one after the other, so the pause
        happens once per zone. A zone that has no canary is refused: its nodes are `skipped` with that reason, the other
        zones are taken, and the rollout ends `failed` with the refused zones in `error`. A zone whose canaries were all
        skipped without running the build fails the rollout there. `allow_without_canary` lifts the rule for zones
        without a canary; it exists for the simulation, and a release never sets it.

        Only one rollout is active (`running` or `awaiting_promotion`) at a time. Starting the rollout of a build whose
        rollout is already active answers that rollout (whatever zones it covers) and changes nothing. Starting another
        build's rollout supersedes the active one: it is `cancelled` with the new rollout named in `error`, a node it is upgrading finishes, and only then does
        the new rollout take its first node. A rollout's state is in the database, so it continues after an API restart
        or a leader change. Recorded in the platform audit chain (`agent_rollout.start`).
      x-ankra-staff-role: admin
      security:
        - staffSession: []
          staffCsrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StartAgentRolloutRequest' }
      responses:
        '202':
          description: The rollout that now runs - the new one, or the active rollout of the same build.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AgentRolloutEnvelope' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422':
          description: A missing or malformed reason, a version the artefact store does not hold, an unknown zone, or a soak outside 60 to 86400 seconds.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        default: { $ref: '#/components/responses/Error' }

  /admin/v1/agent-rollouts/{id}:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    get:
      operationId: get_agent_rollout
      tags: [agent_rollout]
      summary: One rollout with its nodes (staff)
      description: Poll it to follow a rollout; each upgraded node names its operation for `get_fleet_node_operation`.
      x-ankra-staff-role: support
