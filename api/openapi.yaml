      - $ref: '#/components/parameters/IdPath'
      - $ref: '#/components/parameters/NetworkPath'
    delete:
      operationId: detach_router_network
      tags: [network]
      summary: Detach a private network from a router
      description: 409 when a floating IP forwards into the network.
      x-ankra-permission: operate
      security:
        - apiToken: []
        - sessionCookie: []
          csrfHeader: []
      responses:
        '202': { $ref: '#/components/responses/OperationAccepted' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        default: { $ref: '#/components/responses/Error' }

  /v1/floating-ips:
    get:
      operationId: list_floating_ips
      tags: [network]
      summary: List floating IPs
      x-ankra-permission: read
      security: [{ apiToken: [] }, { sessionCookie: [] }]
      responses:
        '200':
          description: Every floating IP (`next_cursor` is always null).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FloatingIPList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        default: { $ref: '#/components/responses/Error' }
    post:
      operationId: allocate_floating_ip
      tags: [network]
      summary: Allocate a floating IP, optionally assigning it at once
      description: With `server_id` the target is checked first and the address is allocated and assigned in one step, so a refused assignment (400 / 404) keeps no address.
      x-ankra-permission: operate
      security:
        - apiToken: []
        - sessionCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [zone]
              properties:
                zone: { type: string }
                server_id: { type: string }
                target: { $ref: '#/components/schemas/FloatingIPTarget' }
      responses:
        '201':
          description: The floating IP; `operation` is present when it is being assigned.
          content:
            application/json:
              schema:
                type: object
                required: [floating_ip]
                properties:
                  floating_ip: { $ref: '#/components/schemas/FloatingIP' }
                  operation: { $ref: '#/components/schemas/Operation' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/QuotaExceeded' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
        default: { $ref: '#/components/responses/Error' }

  /v1/floating-ips/{id}:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    get:
      operationId: get_floating_ip
      tags: [network]
      summary: Get a floating IP
      x-ankra-permission: read
      security: [{ apiToken: [] }, { sessionCookie: [] }]
      responses:
        '200':
          description: The floating IP.
          content:
            application/json:
              schema:
                type: object
                required: [floating_ip]
                properties:
                  floating_ip: { $ref: '#/components/schemas/FloatingIP' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Error' }
    delete:
      operationId: release_floating_ip
      tags: [network]
      summary: Release a floating IP to the pool
      x-ankra-permission: operate
      security:
        - apiToken: []
        - sessionCookie: []
          csrfHeader: []
      responses:
        '202': { $ref: '#/components/responses/OperationAccepted' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        default: { $ref: '#/components/responses/Error' }

  /v1/floating-ips/{id}/assign:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    post:
      operationId: assign_floating_ip
      tags: [network]
      summary: Move a floating IP to a server, or unassign it
      x-ankra-permission: operate
      security:
        - apiToken: []
        - sessionCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                server_id:
                  type: [string, 'null']
                  description: A null (or missing) `server_id` unassigns the floating IP.
                target: { $ref: '#/components/schemas/FloatingIPTarget' }
      responses:
        '202': { $ref: '#/components/responses/OperationAccepted' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        default: { $ref: '#/components/responses/Error' }

  /v1/servers/{id}/networks:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    get:
      operationId: list_server_interfaces
      tags: [network]
      summary: List a server's private interfaces
      x-ankra-permission: read
      security: [{ apiToken: [] }, { sessionCookie: [] }]
      responses:
        '200':
          description: Every interface (`next_cursor` is always null).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InterfaceList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Error' }
    post:
      operationId: attach_server_network
      tags: [network]
      summary: Attach a stopped server to a private network
      description: 400 when the server is already on the network, has no free interface slot (7 at most) or `address` is taken, all checked before the operation is queued.
      x-ankra-permission: operate
      security:
        - apiToken: []
        - sessionCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [network_id]
              properties:
                network_id: { type: string }
                address: { type: string, description: A fixed address in the network; the next free one when omitted. }
      responses:
        '202': { $ref: '#/components/responses/OperationAccepted' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        default: { $ref: '#/components/responses/Error' }

  /v1/servers/{id}/networks/{network}:
    parameters:
      - $ref: '#/components/parameters/IdPath'
      - $ref: '#/components/parameters/NetworkPath'
    delete:
      operationId: detach_server_network
      tags: [network]
      summary: Detach a stopped server from a private network
      description: 409 when a floating IP forwards to the server on this network.
      x-ankra-permission: operate
      security:
        - apiToken: []
        - sessionCookie: []
          csrfHeader: []
      responses:
        '202': { $ref: '#/components/responses/OperationAccepted' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        default: { $ref: '#/components/responses/Error' }

  /v1/servers/{id}/firewall:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    get:
      operationId: get_server_firewall
      tags: [network]
      summary: Get a server's firewall
      x-ankra-permission: read
      security: [{ apiToken: [] }, { sessionCookie: [] }]
      responses:
        '200':
          description: The firewall.
          content:
            application/json:
              schema:
                type: object
                required: [firewall]
                properties:
                  firewall: { $ref: '#/components/schemas/Firewall' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Error' }
    put:
      operationId: replace_server_firewall
      tags: [network]
      summary: Replace a server's firewall
      description: Applies within seconds, also to running servers.
      x-ankra-permission: operate
      security:
        - apiToken: []
        - sessionCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Firewall' }
      responses:
        '202': { $ref: '#/components/responses/OperationAccepted' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        default: { $ref: '#/components/responses/Error' }

  /v1/api-tokens:
    get:
      operationId: list_api_tokens
      description: "Session-only, like every route under `/v1/api-tokens` and `/v1/members`: an API token gets 403 here, so a leaked token can neither mint another nor invite anyone."
      tags: [governance]
      summary: List API tokens, newest first (revoked tokens are not listed)
      x-ankra-permission: tokens.manage
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: A page of API tokens.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiTokenList' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        default: { $ref: '#/components/responses/Error' }
    post:
      operationId: create_api_token
      tags: [governance]
      summary: Create an API token
      description: The plaintext `token` is returned only here. A support session gets 403.
      x-ankra-permission: tokens.manage
      security:
        - sessionCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name, scope]
              properties:
                name: { type: string, minLength: 1, maxLength: 64 }
                scope: { $ref: '#/components/schemas/TokenScope' }
                expires_at:
                  type: string
                  format: date-time
                  description: In the future and at most 365 days away; 90 days when omitted. An explicit null is refused with 400.
      responses:
        '201':
          description: The token.
          content:
            application/json:
              schema:
                type: object
                required: [api_token, token]
                properties:
                  api_token: { $ref: '#/components/schemas/ApiToken' }
                  token: { type: string, description: '`act_` plus 32 random bytes, base64url.' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        default: { $ref: '#/components/responses/Error' }

  /v1/api-tokens/{id}:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    delete:
      operationId: revoke_api_token
      tags: [governance]
      summary: Revoke an API token
      x-ankra-permission: tokens.manage
      security:
        - sessionCookie: []
          csrfHeader: []
      responses:
        '204': { description: Revoked. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Error' }

  /v1/members:
    get:
      operationId: list_members
      tags: [governance]
      summary: List the account's members, oldest first
      x-ankra-permission: read
