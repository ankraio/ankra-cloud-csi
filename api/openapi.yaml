      x-ankra-permission: members.manage
      security:
        - sessionCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [role]
              properties:
                role: { $ref: '#/components/schemas/AssignableRole' }
      responses:
        '200':
          description: The member.
          content:
            application/json:
              schema:
                type: object
                required: [member]
                properties:
                  member: { $ref: '#/components/schemas/Member' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Error' }
    delete:
      operationId: remove_member
      tags: [governance]
      summary: Remove a member with their sessions and API tokens
      description: 403 for the owner, and for a support session; 409 for yourself.
      x-ankra-permission: members.manage
      security:
        - sessionCookie: []
          csrfHeader: []
      responses:
        '204': { description: Removed. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        default: { $ref: '#/components/responses/Error' }

  /v1/members/invitations:
    get:
      operationId: list_invitations
      tags: [governance]
      summary: List pending invitations (`next_cursor` is always null)
      x-ankra-permission: members.manage
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          description: Every pending invitation.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InvitationList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        default: { $ref: '#/components/responses/Error' }
    post:
      operationId: invite_member
      tags: [governance]
      summary: Invite someone to the account
      description: 409 when the email is already a member of this account. A support session gets 403.
      x-ankra-permission: members.manage
      security:
        - sessionCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
