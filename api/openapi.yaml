                port: { type: integer, minimum: 1, maximum: 65535 }
                weight: { type: integer, minimum: 0, maximum: 256 }
                enabled: { type: boolean }
      responses:
        '201':
          description: The member.
          content:
            application/json:
              schema:
                type: object
                required: [member]
                properties:
                  member: { $ref: '#/components/schemas/LoadBalancerMember' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        default: { $ref: '#/components/responses/Error' }
    put:
      operationId: replace_load_balancer_members
      tags: [load_balancer]
      summary: Replace a backend's whole member list at once
      description: |
        The list becomes the backend's members in one configuration change (one configuration generation), so HAProxy
        never serves a half-replaced backend: members missing from it leave, new ones join, and a member named again
        keeps its id and takes the new address, port, weight and state. An empty list empties the backend; a list equal
        to the current one changes nothing. Members follow the add-member rules (IPv4 host of the network, its ULA /64
        or a global IPv6 address); names are unique within the list; at most 256 members.
      x-ankra-permission: operate
      security:
        - apiToken: []
        - sessionCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
