    parameters:
      - $ref: '#/components/parameters/IdPath'
    delete:
      operationId: release_control_link
      tags: [control_link]
      summary: Release a control link of a host that is taken apart (admin staff)
      description: >-
        The /30 is free again; the managed hub drops the peer and its address on its next pass. Releasing an external
        link only frees the /30 in the table: its hand-made interface stays until it is removed. Recorded in the platform
        audit chain (`control_link.release`).
      x-ankra-staff-role: admin
      security:
        - staffSession: []
          staffCsrfHeader: []
      responses:
        '200':
          description: The released link.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ControlLinkEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Error' }

