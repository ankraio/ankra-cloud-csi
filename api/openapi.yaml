  /v1/operations:
    get:
      operationId: list_operations
      tags: [server]
      summary: List the account's operations across every resource, newest first
      description: |
        Every operation of the account, whichever resource it acts on: servers, storages, backups, custom images,
        snapshots, routers, floating IPs, load balancers, databases, network edges and Kubernetes clusters. Narrow it
        to one `status`, to the ones still in flight (`active=true`: pending or running) or to one `kind`. Pages hold
        50 operations unless `limit` asks for up to 200. Operations on the virtual machines a managed service runs
        (a load balancer's, a database's, an edge's) are left out; the service's own operation stands for that work.
      x-ankra-permission: read
      security: [{ apiToken: [] }, { sessionCookie: [] }]
      parameters:
        - name: status
          in: query
          description: Only the operations in this status. Cannot be combined with `active=true`.
          schema: { type: string, enum: [pending, running, succeeded, failed, cancelled] }
        - name: active
          in: query
          description: '`true` keeps only the pending and running operations.'
          schema: { type: boolean }
        - name: kind
          in: query
          description: Only the operations of this kind, one of `OperationKind`.
          schema: { type: string }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: A page of operations.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OperationList' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        default: { $ref: '#/components/responses/Error' }

