      tags: [edge]
      summary: Rename an edge, change its roles, bastion keys or members
      description: |
        Fields left out keep their value. Roles change only on a combined edge (409 on a separate one, whose roles are
        its VMs); members belong to a combined edge's load_balancer role (a separate one is the managed load balancer
        `load_balancer_id`, configured under /v1/load-balancers). Every change is one `edge.sync` operation.
      x-ankra-permission: operate
      security:
        - apiToken: []
        - sessionCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                name: { type: string, maxLength: 64 }
                roles: { type: array, items: { $ref: '#/components/schemas/EdgeRole' } }
                ssh_key_ids: { type: array, items: { type: string } }
                members: { type: array, items: { $ref: '#/components/schemas/EdgeMemberInput' } }
      responses:
        '202':
          description: The changed edge and its `edge.sync` operation.
          content:
            application/json:
              schema:
                type: object
                required: [edge, operation]
                properties:
                  edge: { $ref: '#/components/schemas/Edge' }
                  operation: { $ref: '#/components/schemas/Operation' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        default: { $ref: '#/components/responses/Error' }
    delete:
      operationId: delete_edge
      tags: [edge]
      summary: Delete an edge, its VMs and (separate placement) its load balancer
      x-ankra-permission: operate
      security:
        - apiToken: []
        - sessionCookie: []
          csrfHeader: []
      responses:
        '202': { $ref: '#/components/responses/OperationAccepted' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        default: { $ref: '#/components/responses/Error' }

  /v1/dns/zones:
    get:
      operationId: list_dns_zones
      tags: [dns]
      summary: List the account's hosted DNS zones and subzones in name order
      x-ankra-permission: read
      security: [{ apiToken: [] }, { sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: A page of zones.
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/DnsZone' } }
                  next_cursor: { $ref: '#/components/schemas/NextCursor' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        default: { $ref: '#/components/responses/Error' }
    post:
      operationId: create_dns_zone
      tags: [dns]
      summary: Host a DNS zone on the Ankra Cloud nameservers
      description: |
        The zone starts with managed NS records for `nameservers` and answers publicly once the registrar delegates the
        domain to them. A name is hosted once across every account: 409 `zone_exists`. Audited as `dns.zone_created`.
      x-ankra-permission: operate
      security:
        - apiToken: []
        - sessionCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name]
              properties:
                name: { type: string, maxLength: 253, examples: [example.com] }
      responses:
        '201':
          description: The zone.
          content:
            application/json:
              schema:
                type: object
                required: [zone]
                properties:
                  zone: { $ref: '#/components/schemas/DnsZone' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        default: { $ref: '#/components/responses/Error' }

  /v1/dns/zones/{id}:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    get:
      operationId: get_dns_zone
      tags: [dns]
      summary: Get a hosted DNS zone
      x-ankra-permission: read
      security: [{ apiToken: [] }, { sessionCookie: [] }]
      responses:
        '200':
          description: The zone.
          content:
            application/json:
              schema:
                type: object
                required: [zone]
                properties:
                  zone: { $ref: '#/components/schemas/DnsZone' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        default: { $ref: '#/components/responses/Error' }
    delete:
      operationId: delete_dns_zone
      tags: [dns]
      summary: Stop hosting a zone and delete its records
      description: |
        A zone that still delegates subzones is refused with 409 `zone_has_subzones`; delete those first. Deleting a subzone
        removes its delegation from the parent. The zone is removed from the nameservers before it is forgotten: 502
        `nameservers_unavailable` leaves it in place to retry. Audited as `dns.zone_deleted`.
      x-ankra-permission: operate
      security:
        - apiToken: []
        - sessionCookie: []
          csrfHeader: []
      responses:
        '204': { description: Deleted. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '502': { $ref: '#/components/responses/BadGateway' }
        default: { $ref: '#/components/responses/Error' }

  /v1/dns/zones/{id}/sync:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    post:
      operationId: sync_dns_zone
      tags: [dns]
      summary: Republish every record of the zone to the nameservers
      description: Clears `sync_error` when every record set is accepted; otherwise the zone carries the new failure.
      x-ankra-permission: operate
      security:
        - apiToken: []
        - sessionCookie: []
          csrfHeader: []
      responses:
        '200':
          description: The zone after the push.
          content:
            application/json:
              schema:
                type: object
                required: [zone]
                properties:
                  zone: { $ref: '#/components/schemas/DnsZone' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        default: { $ref: '#/components/responses/Error' }

  /v1/dns/zones/{id}/subzones:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    get:
      operationId: list_dns_subzones
      tags: [dns]
      summary: List the subzones a zone delegates (`next_cursor` is always null)
      x-ankra-permission: read
      security: [{ apiToken: [] }, { sessionCookie: [] }]
      responses:
        '200':
          description: The subzones in name order.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DnsZoneList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        default: { $ref: '#/components/responses/Error' }
    post:
      operationId: create_dns_subzone
      tags: [dns]
      summary: Host <label>.<zone> as a zone of its own, delegated from this zone
      description: |
        The subzone gets its own records and the parent gets managed NS records at `label`, so a team can own the
        subdomain. Refused with 409 `records_exist_at_subdomain` when the parent already holds records at or below the
        name (they would stop answering), 409 `subzone_exists` when the name is already hosted, and 400
        `invalid_subzone_label`. Audited as `dns.subzone_created`.
      x-ankra-permission: operate
      security:
        - apiToken: []
        - sessionCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [label]
              properties:
                label: { type: string, maxLength: 189, examples: [dev, eu.customers] }
      responses:
        '201':
          description: The subzone.
          content:
            application/json:
              schema:
                type: object
                required: [zone]
                properties:
                  zone: { $ref: '#/components/schemas/DnsZone' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        default: { $ref: '#/components/responses/Error' }

  /v1/dns/zones/{id}/records:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    get:
      operationId: list_dns_records
      tags: [dns]
      summary: List every record of a zone in name and type order (`next_cursor` is always null)
      x-ankra-permission: read
      security: [{ apiToken: [] }, { sessionCookie: [] }]
      responses:
        '200':
          description: The zone's records, at most `record_limit` plus managed delegations.
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/DnsRecord' } }
                  next_cursor: { type: 'null' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        default: { $ref: '#/components/responses/Error' }
    post:
      operationId: create_dns_record
      tags: [dns]
      summary: Add a record to a zone
      description: |
        `name` is relative to the zone (`@` for the apex, `www`, `a.b`, `*`); a fully qualified name is shortened. Content
        is validated per type (400 with a code such as `invalid_ipv4` or `invalid_hostname`). A CNAME must be the only
        record at its name (409 `cname_conflict`) and a zone holds at most `record_limit` records (409
        `record_limit_reached`). `ttl` is clamped to 30-86400 seconds (default 300, "Auto"); `priority` applies to MX
        (default 10) and SRV (default 0). `comment` is for people and never published. A failed publish sets the zone's
        `sync_error`. Audited as `dns.record_created`.
      x-ankra-permission: operate
      security:
        - apiToken: []
        - sessionCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name, type, content]
              properties:
                name: { type: string, maxLength: 253 }
                type: { $ref: '#/components/schemas/DnsRecordType' }
                content: { type: string, maxLength: 4096 }
                ttl: { type: integer }
                priority: { type: integer, minimum: 0, maximum: 65535 }
                comment: { type: [string, 'null'], maxLength: 500 }
      responses:
        '201':
          description: The record.
          content:
            application/json:
              schema:
                type: object
                required: [record]
                properties:
                  record: { $ref: '#/components/schemas/DnsRecord' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        default: { $ref: '#/components/responses/Error' }

  /v1/dns/zones/{id}/records/{record_id}:
    parameters:
      - $ref: '#/components/parameters/IdPath'
      - name: record_id
        in: path
        required: true
        schema: { type: string }
    patch:
      operationId: update_dns_record
      tags: [dns]
      summary: Change a record's name, content, TTL, priority or comment
      description: |
        Fields left out keep their value; the type is fixed (delete and recreate to change it). Managed records (apex NS,
        subzone delegations) are refused with 409 `managed_record`. Audited as `dns.record_updated`.
      x-ankra-permission: operate
      security:
        - apiToken: []
        - sessionCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                name: { type: string, maxLength: 253 }
                content: { type: string, maxLength: 4096 }
                ttl: { type: integer }
                priority: { type: integer, minimum: 0, maximum: 65535 }
                comment: { type: string, maxLength: 500, description: An empty string clears the comment. }
      responses:
        '200':
          description: The changed record.
          content:
            application/json:
              schema:
                type: object
                required: [record]
                properties:
                  record: { $ref: '#/components/schemas/DnsRecord' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        default: { $ref: '#/components/responses/Error' }
    delete:
      operationId: delete_dns_record
      tags: [dns]
      summary: Delete a record
      description: Managed records are refused with 409 `managed_record`. Audited as `dns.records_deleted`.
      x-ankra-permission: operate
      security:
        - apiToken: []
        - sessionCookie: []
          csrfHeader: []
      responses:
        '204': { description: Deleted. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        default: { $ref: '#/components/responses/Error' }

  /v1/dns/zones/{id}/records/bulk-delete:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    post:
      operationId: bulk_delete_dns_records
      tags: [dns]
      summary: Delete up to 500 records of a zone at once
      description: |
        Managed records and ids the zone does not have are skipped and listed with their reason; each affected record
        set is republished once. Audited as one `dns.records_deleted`.
      x-ankra-permission: operate
      security:
        - apiToken: []
        - sessionCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [ids]
              properties:
                ids: { type: array, minItems: 1, maxItems: 500, items: { type: string } }
      responses:
        '200':
          description: How many records were deleted and which were skipped.
          content:
            application/json:
              schema:
                type: object
                required: [deleted, skipped]
                properties:
                  deleted: { type: integer }
                  skipped:
                    type: array
                    items:
                      type: object
                      required: [id, reason]
                      properties:
                        id: { type: string }
                        reason: { type: string, enum: [not_found, managed_record] }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        default: { $ref: '#/components/responses/Error' }

  /v1/object-storage:
    get:
      operationId: list_object_storage
      tags: [object_storage]
      summary: List the zones the account enabled object storage in, with their usage
      x-ankra-permission: read
      security: [{ apiToken: [] }, { sessionCookie: [] }]
      responses:
        '200':
          description: One entry per enabled zone (`next_cursor` is always null).
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/ObjectStorage' } }
                  next_cursor: { type: 'null' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
