                      address: { type: string, description: 'An IPv4 or IPv6 address.', examples: ['10.0.0.20', 'fd64:1:0:2a::1'] }
                      port: { type: integer, minimum: 1, maximum: 65535 }
                      weight: { type: integer, minimum: 0, maximum: 256, default: 100 }
                      enabled: { type: boolean, default: true }
