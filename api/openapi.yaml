  /v1/account/credits:
    get:
      operationId: list_account_credits
      tags: [coupon]
      summary: The account's credits and what they have left
      description: >-
        Every credit the account was granted (coupon redemptions, staff grants), newest first, with its status at the
        time of the response. `balance_cents` sums what live credits have left. A credit pays for the usage incurred
        between `granted_at` and `expires_at` (metered hours, and days of network transfer, that overlap that window),
        on the invoice of the month the usage was in, whenever that invoice is issued; the soonest-expiring credit
        pays first. Usage outside every credit's window is charged.
      x-ankra-permission: billing.read
      security: [{ apiToken: [] }, { sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: A page of credits with the balance.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CreditList' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        default: { $ref: '#/components/responses/Error' }

  /v1/account/coupons:
    post:
      operationId: redeem_coupon
      tags: [coupon]
      summary: Redeem a coupon code for account credit
      description: >-
        Grants the coupon's credit, which expires the coupon's validity days from now. A code is redeemed at most once
        per account and never beyond its cap; the check and the redemption happen under a lock on the coupon, so
        concurrent redemptions cannot exceed it. Codes compare case-insensitively. The redemption, and a refused
        attempt, are written to the account's audit log (`billing.coupon.redeem`).
      x-ankra-permission: billing.manage
      security:
        - apiToken: []
        - sessionCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RedeemCouponRequest' }
      responses:
        '201':
          description: The credit was granted.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CouponRedemption' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422':
          description: The code cannot be applied; `reason` says why.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/CouponRefusalProblem' }
        default: { $ref: '#/components/responses/Error' }

  /v1/webhooks/stripe:
    post:
      operationId: receive_stripe_webhook
      tags: [payment]
      summary: Stripe event delivery
      description: |
        Called by Stripe only. Unauthenticated and CSRF-exempt: the `Stripe-Signature` header over the raw body is
        verified with the endpoint's signing secret (five-minute timestamp tolerance), and each event id is applied
        once. Handles `checkout.session.completed`, `setup_intent.succeeded`, `invoice.paid`,
        `invoice.payment_failed` and `payment_method.detached`; every other type is acknowledged and ignored.
      security:
        - {}
      parameters:
        - name: Stripe-Signature
          in: header
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        '200':
          description: Received (applied, a duplicate, or ignored).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WebhookReceipt' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '503': { $ref: '#/components/responses/PaymentsNotConfigured' }
        default: { $ref: '#/components/responses/Error' }

