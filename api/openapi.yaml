    post:
      operationId: enable_object_storage
      tags: [object_storage]
      summary: Enable S3-compatible object storage in a zone
      description: Idempotent; an enabled zone answers its current key. €0.02 per GiB stored per month.
      x-ankra-permission: operate
      x-ankra-billable-create: true
      x-ankra-idempotent: true
      x-ankra-verified-email: true
      security:
        - apiToken: []
        - sessionCookie: []
          csrfHeader: []
