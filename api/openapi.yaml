  /v1/zones/{zone}/nodes/{id}/maintenance:
    parameters:
      - $ref: '#/components/parameters/ZonePath'
      - $ref: '#/components/parameters/IdPath'
    post:
      operationId: start_zone_node_maintenance
      tags: [host]
      x-ankra-operator-scope: maintenance
      summary: Take a compute node out of service, upgrade its agent, optionally reboot it and bring it back (operator only)
      description: |
        Operation `node.maintenance` (deadline 8 h): the node drains (running servers move live, `cpu_mode: host`
        plans and servers that cannot move live move cold), then, when `agent_version` names a build of the artefact
        store, the node's spec carries the upgrade and the node downloads the build, checks its SHA-256, installs it
        and restarts into it without restarting its VMs; with `reboot` the node then reboots. The operation waits
        until the node reports the build's commit (and a boot after the operation started), checks that it heartbeats
        with every component healthy, and uncordons it. One node of a zone is in maintenance at a time. Every step is
        recorded as an operation event with the operator as actor.
      security:
        - operatorToken: []
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NodeMaintenanceOperationRequest' }
      responses:
        '202': { $ref: '#/components/responses/OperationAccepted' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        default: { $ref: '#/components/responses/Error' }

  /v1/zones/{zone}/nodes/{id}/power-controller:
    parameters:
      - $ref: '#/components/parameters/ZonePath'
      - $ref: '#/components/parameters/IdPath'
    put:
      operationId: set_zone_node_power_controller
      tags: [host]
      x-ankra-operator-scope: nodes
      summary: Set the node's BMC that fencing powers it off through (operator only)
      description: |
        IPMI (`ipmitool -I lanplus ... chassis power off`, confirmed by `chassis power status`) or Redfish
        (`ComputerSystem.Reset` with `ForceOff` over HTTPS, confirmed by polling `PowerState`). The password is sealed
        with the control plane's secret key and never answered back; without a secret key the call answers 503. A
        node without a BMC is fenced through `ANKRA_CLOUD_FENCE_COMMAND`. Audited in the platform chain.
      security:
        - operatorToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PowerControllerRequest' }
      responses:
        '200':
          description: The stored BMC settings, without the password.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PowerController' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
        default: { $ref: '#/components/responses/Error' }
    get:
      operationId: get_zone_node_power_controller
      tags: [host]
      x-ankra-operator-scope: read
      summary: The node's BMC settings, without the password (operator only)
      security:
        - operatorToken: []
      responses:
        '200':
          description: The node's BMC.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PowerController' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Error' }
    delete:
      operationId: delete_zone_node_power_controller
      tags: [host]
      x-ankra-operator-scope: nodes
      summary: Forget the node's BMC; fencing falls back to the command hook (operator only)
      security:
        - operatorToken: []
      responses:
        '204': { description: Deleted. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Error' }

