      responses:
        '201':
          description: The consent and its code.
          content:
            application/json:
              schema:
                type: object
                required: [consent, code]
                properties:
                  consent: { $ref: '#/components/schemas/SupportConsent' }
                  code: { type: string, examples: ['K7F2-9QMD'] }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        default: { $ref: '#/components/responses/Error' }

