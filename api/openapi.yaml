      responses:
        '200':
          description: The operation.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OperationEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        default: { $ref: '#/components/responses/Error' }

  /v1/storages:
    get:
      operationId: list_storages
      tags: [storage]
      summary: List storages, newest first
      x-ankra-permission: read
      security: [{ apiToken: [] }, { sessionCookie: [] }]
      parameters:
        - name: server_id
          in: query
          description: Only the storages attached to this server.
          schema: { type: string }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: A page of storages.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StorageList' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        default: { $ref: '#/components/responses/Error' }
    post:
      operationId: create_storage
      tags: [storage]
      summary: Create an empty storage, clone a storage or a snapshot, or restore a backup as a new storage
      description: |
        The size defaults to, and must be at least, the source's. Cloning a storage (`source_storage_id`) stays within
        the source's zone: `zone` must be the source storage's zone. Cloning a snapshot (`source_snapshot_id`, a
        copy-on-write clone of the snapshot) also stays within the snapshot's zone, and the tier defaults to the
        snapshot's. Restoring a backup (`source_backup_id`) may name a `zone` different from the backup's zone: a
        cross-zone restore, where the operation copies the backup between the zones' storage nodes over mutual TLS
        (step `transfer_cross_zone`). The operation holds a source backup (`backup_id`) or snapshot, so it cannot be
        deleted or expire during the copy, and a storage being cloned cannot be deleted. At most one source.
      x-ankra-permission: operate
      x-ankra-billable-create: true
      x-ankra-idempotent: true
      x-ankra-verified-email: true
      security:
        - apiToken: []
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateStorageRequest' }
      responses:
        '202':
          description: The storage is being created.
          content:
            application/json:
              schema:
                type: object
                required: [storage, operation]
                properties:
                  storage: { $ref: '#/components/schemas/Storage' }
                  operation: { $ref: '#/components/schemas/Operation' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/PaymentRequired' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/QuotaExceeded' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        default: { $ref: '#/components/responses/Error' }

  /v1/storages/{id}:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    get:
      operationId: get_storage
      tags: [storage]
      summary: Get a storage
      x-ankra-permission: read
      security: [{ apiToken: [] }, { sessionCookie: [] }]
      responses:
        '200':
          description: The storage.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StorageEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        default: { $ref: '#/components/responses/Error' }
    patch:
      operationId: update_storage
      tags: [storage]
      summary: Change a storage's title or backup schedule
      x-ankra-permission: operate
      security:
        - apiToken: []
        - sessionCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                title: { type: string }
                backup_rule:
                  description: >-
                    `null` removes the schedule; leaving the field out keeps it. In a zone that backs its single-copy
                    volumes up by default, removing it answers 422 without `acknowledge_single_copy_without_backup`.
                  oneOf:
                    - $ref: '#/components/schemas/BackupRule'
                    - type: 'null'
                acknowledge_single_copy_without_backup:
                  type: boolean
                  default: false
                  description: >-
                    Lets `backup_rule: null` remove the backup rule of a storage that is a single copy on one host; the
                    storage records when (`single_copy_acknowledged_at`).
      responses:
        '200':
          description: The updated storage.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StorageEnvelope' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/PaymentRequired' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        default: { $ref: '#/components/responses/Error' }
    delete:
      operationId: delete_storage
      tags: [storage]
      summary: Delete a storage; its backups are kept
      description: 409 while the storage is attached, and while it has snapshots (they live on its volume; delete them first).
      x-ankra-permission: operate
      security:
        - apiToken: []
        - sessionCookie: []
          csrfHeader: []
      responses:
        '202': { $ref: '#/components/responses/OperationAccepted' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        default: { $ref: '#/components/responses/Error' }

  /v1/storages/{id}/attach:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    post:
      operationId: attach_storage
      tags: [storage]
      summary: Attach a storage to a running or stopped server in the same zone
      description: |
        A running server's hypervisor plugs the disk in at once (hot-plug) with the serial `device_serial`, so the guest
        finds it at `/dev/disk/by-id/virtio-<device_serial>`; the operation succeeds once the server's node reports the
        disk plugged (step `await_storage_plugged`). A stopped server gets the disk at its next start. 409 while the
        server is starting, stopping or busy with another operation. If the hypervisor cannot plug the disk the
        operation fails with the node's reason at its deadline; the storage then stays attached and is plugged at the
        server's next start, or can be detached again.
      x-ankra-permission: operate
      security:
        - apiToken: []
        - sessionCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [server_id]
              properties:
                server_id: { type: string }
      responses:
        '202': { $ref: '#/components/responses/OperationAccepted' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        default: { $ref: '#/components/responses/Error' }

  /v1/storages/{id}/detach:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    post:
      operationId: detach_storage
      tags: [storage]
      summary: Detach a storage from its running or stopped server
      description: |
        A running server's hypervisor unplugs the disk (hot-plug): it asks the guest to eject the device, and the
        operation succeeds once the hypervisor released the block device (step `await_storage_released`). Unmounting
        the file system inside the guest first is the guest's job, not the API's: in Kubernetes the CSI node plugin
        unmounts before it asks for the detach. A guest that keeps the device busy holds the operation until its
        deadline. 409 for the server's only storage, for a running server's boot disk (device index 0), and while the
        server is starting, stopping or busy with another operation.
      x-ankra-permission: operate
      security:
        - apiToken: []
        - sessionCookie: []
          csrfHeader: []
      responses:
        '202': { $ref: '#/components/responses/OperationAccepted' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        default: { $ref: '#/components/responses/Error' }

  /v1/storages/{id}/move:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    post:
      operationId: move_storage
      tags: [storage]
      summary: Move a storage to another tier, across backends
      description: |
        Copies the storage into `tier` and switches it there, keeping its identifier and device: from `local-nvme`
        (Ankra Local, one copy on one node) to an Ankra Storage tier once the zone has Ankra Storage, or from Ankra Storage onto a node's
        local-nvme pool. An attached storage's server must be stopped; a local-nvme target then lands on the server's
        node, a detached one where `placement` says (or on the storage node with the most room). The old volume is
        deleted once the copy is in place (steps copy_storage_to_tier, switch_storage_tier,
        delete_previous_storage_volume).
      x-ankra-permission: operate
      security:
        - apiToken: []
        - sessionCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [tier]
              properties:
                tier: { type: string, examples: [standard, local-nvme] }
                placement: { $ref: '#/components/schemas/StoragePlacement' }
      responses:
        '202':
          description: The storage is being moved.
          content:
            application/json:
              schema:
                type: object
                required: [storage, operation]
                properties:
                  storage: { $ref: '#/components/schemas/Storage' }
                  operation: { $ref: '#/components/schemas/Operation' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        default: { $ref: '#/components/responses/Error' }

  /v1/storages/{id}/resize:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    post:
      operationId: resize_storage
      tags: [storage]
      summary: Grow a storage, online too
      description: |
        Grow only. When the storage is attached to a running server, the operation succeeds once the hypervisor presents
        the new size to the guest (step `await_storage_resized`); the guest then grows its file system (for example
        `resize2fs /dev/disk/by-id/virtio-<device_serial>`). A stopped server's guest sees the new size at its next
        start, and grows its root file system at boot. 409 while the server is starting, stopping or busy.
      x-ankra-permission: operate
      x-ankra-billable-create: true
      x-ankra-idempotent: true
      x-ankra-verified-email: true
      security:
        - apiToken: []
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [size_gibibytes]
              properties:
                size_gibibytes: { type: integer }
      responses:
        '202': { $ref: '#/components/responses/OperationAccepted' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/PaymentRequired' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/QuotaExceeded' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        default: { $ref: '#/components/responses/Error' }

  /v1/storages/{id}/backups:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    post:
      operationId: back_up_storage
      tags: [storage]
      summary: Take a crash-consistent backup, also of a running server
      x-ankra-permission: operate
      x-ankra-billable-create: true
      x-ankra-idempotent: true
      x-ankra-verified-email: true
      security:
        - apiToken: []
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                title: { type: string }
      responses:
        '202':
          description: The backup is being taken.
          content:
            application/json:
              schema:
                type: object
                required: [backup, operation]
                properties:
                  backup: { $ref: '#/components/schemas/Backup' }
                  operation: { $ref: '#/components/schemas/Operation' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/PaymentRequired' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/IdempotencyKeyReused' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        default: { $ref: '#/components/responses/Error' }

  /v1/storages/{id}/templatize:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    post:
      operationId: templatize_storage
      tags: [storage]
      summary: Make a custom image from a storage; its server must be stopped
      x-ankra-permission: operate
      security:
        - apiToken: []
        - sessionCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [title]
              properties:
                title: { type: string }
      responses:
        '202': { $ref: '#/components/responses/CustomImageAccepted' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        default: { $ref: '#/components/responses/Error' }

  /v1/storages/{id}/snapshots:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    post:
      operationId: create_snapshot
      tags: [storage]
      summary: Take a crash-consistent snapshot of a storage, also of a running server's
      description: |
        A snapshot lives next to the storage's volume (copy-on-write), so taking one is quick and new storages are
        cloned from it quickly (`POST /v1/storages` with `source_snapshot_id`, in the storage's zone). It is billed
        like a backup of the storage's size at the time (the backup price per GiB-month, per hour, as a "Snapshot"
        usage line). Unlike a backup it depends on its storage: a storage cannot be deleted, or restored from a backup
        in place, while it has snapshots. The snapshot is ready once its `state` is `available`.
      x-ankra-permission: operate
      x-ankra-billable-create: true
      x-ankra-idempotent: true
      x-ankra-verified-email: true
      security:
        - apiToken: []
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                title: { type: string, description: 'Defaults to the storage title with the time.' }
      responses:
        '202':
          description: The snapshot is being taken.
          content:
            application/json:
              schema:
                type: object
                required: [snapshot, operation]
                properties:
                  snapshot: { $ref: '#/components/schemas/Snapshot' }
                  operation: { $ref: '#/components/schemas/Operation' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/PaymentRequired' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/IdempotencyKeyReused' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        default: { $ref: '#/components/responses/Error' }
    get:
      operationId: list_storage_snapshots
      tags: [storage]
      summary: List a storage's snapshots, newest first
      x-ankra-permission: read
      security: [{ apiToken: [] }, { sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: A page of snapshots.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SnapshotList' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        default: { $ref: '#/components/responses/Error' }

  /v1/snapshots/{id}:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    get:
      operationId: get_snapshot
      tags: [storage]
      summary: Get a snapshot
      x-ankra-permission: read
      security: [{ apiToken: [] }, { sessionCookie: [] }]
      responses:
        '200':
          description: The snapshot.
          content:
            application/json:
              schema:
                type: object
                required: [snapshot]
                properties:
                  snapshot: { $ref: '#/components/schemas/Snapshot' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        default: { $ref: '#/components/responses/Error' }
    delete:
      operationId: delete_snapshot
      tags: [storage]
      summary: Delete a snapshot
      description: |
        Storages cloned from the snapshot keep their data: they are flattened first (their shared blocks are copied),
        which can take a while for large storages. 409 while a storage is being cloned from it.
      x-ankra-permission: operate
      security:
        - apiToken: []
        - sessionCookie: []
          csrfHeader: []
      responses:
        '202': { $ref: '#/components/responses/OperationAccepted' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        default: { $ref: '#/components/responses/Error' }

  /v1/backups:
    get:
      operationId: list_backups
      tags: [storage]
      summary: List backups
      x-ankra-permission: read
      security: [{ apiToken: [] }, { sessionCookie: [] }]
      parameters:
        - name: storage_id
          in: query
          description: Only the backups of this storage.
          schema: { type: string }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: A page of backups.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BackupList' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        default: { $ref: '#/components/responses/Error' }

  /v1/backups/{id}:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    get:
      operationId: get_backup
      tags: [storage]
      summary: Get a backup
      x-ankra-permission: read
      security: [{ apiToken: [] }, { sessionCookie: [] }]
      responses:
        '200':
          description: The backup.
          content:
            application/json:
              schema:
                type: object
                required: [backup]
                properties:
                  backup: { $ref: '#/components/schemas/Backup' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        default: { $ref: '#/components/responses/Error' }
    delete:
      operationId: delete_backup
      tags: [storage]
      summary: Delete a backup
      x-ankra-permission: operate
      security:
        - apiToken: []
        - sessionCookie: []
          csrfHeader: []
      responses:
        '202': { $ref: '#/components/responses/OperationAccepted' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        default: { $ref: '#/components/responses/Error' }

  /v1/backups/{id}/restore:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    post:
      operationId: restore_backup
      tags: [storage]
      summary: Replace the content of the backup's storage with the backup
      description: The storage's server must be stopped. After the storage is deleted, restore the backup as a new storage (`POST /v1/storages` with `source_backup_id`) instead.
      x-ankra-permission: operate
      security:
        - apiToken: []
        - sessionCookie: []
          csrfHeader: []
      responses:
        '202': { $ref: '#/components/responses/OperationAccepted' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        default: { $ref: '#/components/responses/Error' }

  /v1/custom-images:
    get:
      operationId: list_custom_images
      tags: [storage]
      summary: List the account's custom images
      x-ankra-permission: read
      security: [{ apiToken: [] }, { sessionCookie: [] }]
      responses:
        '200':
          description: Every custom image (`next_cursor` is always null).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CustomImageList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        default: { $ref: '#/components/responses/Error' }

  /v1/custom-images/{id}:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    delete:
      operationId: delete_custom_image
      tags: [storage]
      summary: Delete a custom image
      description: Servers deployed from it keep working (their volumes are flattened first). 409 while the image is still being created.
      x-ankra-permission: operate
      security:
        - apiToken: []
        - sessionCookie: []
          csrfHeader: []
      responses:
        '202': { $ref: '#/components/responses/OperationAccepted' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        default: { $ref: '#/components/responses/Error' }

  /v1/custom-images/{id}/copy:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    post:
      operationId: copy_custom_image
      tags: [storage]
      summary: Copy a custom image to another zone
      description: |
        Creates a new custom image in `zone` from an online custom image; the operation kind is `template.copy`.
        400 when `zone` is the source image's zone, is unknown, or `title` is invalid; 409 when the source image is
        not online.
      x-ankra-permission: operate
      security:
        - apiToken: []
        - sessionCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [zone]
              properties:
                zone: { type: string, description: The destination zone; must differ from the source image's zone. }
                title: { type: string, description: Defaults to the source image's title. }
      responses:
        '202': { $ref: '#/components/responses/CustomImageAccepted' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        default: { $ref: '#/components/responses/Error' }

  /v1/networks:
    get:
      operationId: list_networks
      tags: [network]
      summary: List private networks
      description: >-
        Keyset-paginated, newest first: `limit` is 1 to 100 (default 50) and `next_cursor` is null on the last page; pass it back as `cursor` for the next one. A malformed `cursor` or a `limit` out of range is a 400.
      x-ankra-permission: read
      security: [{ apiToken: [] }, { sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: A page of private networks, newest first.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NetworkList' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        default: { $ref: '#/components/responses/Error' }
    post:
      operationId: create_network
      tags: [network]
      summary: Create a private network
      description: >-
        `cidr` is RFC 1918, /16 … /29, and may not overlap any public address pool or the reserved infrastructure
        ranges (400). `zone` is the network's home zone (where a router of it lives); `zones` lists the zones of the
        home zone's region the network is present in (default: the home zone alone). A network in several zones is one
        layer-2 segment across them: its ULA /64 and IPv4 subnet are shared, servers of every listed zone join it, and
        broadcast stays inside each zone (ARP/ND are answered from EVPN).
      x-ankra-permission: operate
      security:
        - apiToken: []
        - sessionCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [zone, name, cidr]
              properties:
                zone: { type: string }
                name: { type: string }
                cidr: { type: string, examples: ['10.0.0.0/24'] }
                zones:
                  type: array
                  maxItems: 16
                  items: { type: string }
