      summary: Create a single-use consent code for one elevated support session
      description: Session-only; a support session cannot call it. The code (`XXXX-XXXX`) is returned once and read to the staff member, who enters it when opening the elevated session. Valid 15 minutes to 24 hours (default one hour). Audited as `support.consent_created`.
