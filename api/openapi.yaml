    post:
      operationId: create_load_balancer_member
      tags: [load_balancer]
      summary: Add a member to a backend
      description: |
        A member is IPv4 or IPv6: an IPv4 host of the load balancer's private network, an address of that network's
        ULA /64 (a server's leg `address6`) or a global IPv6 address (a server's `public_ipv6`). 400 for anything else.
