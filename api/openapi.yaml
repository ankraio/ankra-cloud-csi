  /v1/load-balancers:
    get:
      operationId: list_load_balancers
      tags: [load_balancer]
      summary: List load balancers
      description: >-
        Without nodes, frontends and backends; get one for those. Keyset-paginated, newest first: `limit` is 1 to 100 (default 50) and `next_cursor` is null on the last page; pass it back as `cursor` for the next one. A malformed `cursor` or a `limit` out of range is a 400.
      x-ankra-permission: read
      security: [{ apiToken: [] }, { sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - name: label
          in: query
          description: '`key=value`; repeat to require several labels. Only load balancers carrying every label are listed.'
          schema: { type: array, items: { type: string } }
          style: form
          explode: true
      responses:
        '200':
          description: A page of the load balancers that match, newest first.
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/LoadBalancer' } }
                  next_cursor: { $ref: '#/components/schemas/NextCursor' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        default: { $ref: '#/components/responses/Error' }
    post:
      operationId: create_load_balancer
      tags: [load_balancer]
      summary: Create a load balancer on a private network
      description: |
        HAProxy on the account's private network. `high_availability` true is two VMs on different compute nodes that
        move a floating IPv4 address between them with VRRP; false is one VM. Without the field a zone with two or more
        compute nodes gets a pair and a zone with one gets a single VM; asking for a pair where the zone lacks the
        `load_balancer_ha` capability (one compute node, see get_zone_capabilities) is a 409 that says so.

        IPv6 is always on: every VM serves the frontends on the first address of its own public /64 (`public_ipv6`, all
        of them in `public_ipv6_addresses`). On a pair that address is the first VM's and does not move to the second
        when the first fails: VRRP carries the IPv4 address only, so publish every entry of `public_ipv6_addresses`
        (for example as several AAAA records or Service ingress IPs) for IPv6 failover. `public_ipv4` (default true)
        adds a floating IPv4 frontend address, the paid add-on.

        Price per month: €4.50 per VM plus €3 for the IPv4 add-on, so €12 for a pair with IPv4 (as before), €9 for a
        pair without, €7.50 for one VM with IPv4 and €4.50 for one VM without. An account may hold 5.
      x-ankra-permission: operate
      x-ankra-billable-create: true
      x-ankra-idempotent: true
      x-ankra-verified-email: true
      security:
        - apiToken: []
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [zone, name, network_id]
              properties:
                zone: { type: string }
                name: { type: string, maxLength: 64 }
                network_id: { type: string }
                labels: { $ref: '#/components/schemas/Labels' }
                high_availability:
                  type: boolean
                  description: Two VMs on different compute nodes (true) or one (false). Defaults to true where the zone has two compute nodes, false where it has one.
                public_ipv4: { type: boolean, default: true, description: 'The floating IPv4 frontend address, the paid add-on. IPv6 is always on.' }
                zone_redundant:
                  type: boolean
                  default: false
                  description: >-
                    A VM pair in each of two or more zones of the zone's region. Validated against the region (400 in a
                    region with one zone), then answered 501 until zone-redundant placement lands.
      responses:
        '202':
          description: The load balancer and its `load_balancer.create` operation.
          content:
            application/json:
              schema:
                type: object
                required: [load_balancer, operation]
                properties:
                  load_balancer: { $ref: '#/components/schemas/LoadBalancer' }
                  operation: { $ref: '#/components/schemas/Operation' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
