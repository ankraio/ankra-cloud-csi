          content:
            application/json:
              schema: { $ref: '#/components/schemas/MemberList' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        default: { $ref: '#/components/responses/Error' }

  /v1/members/{id}:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    patch:
      operationId: change_member_role
      tags: [governance]
      summary: Change a member's role
      description: 403 for the owner, and for a support session.
      x-ankra-permission: members.manage
      security:
        - sessionCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [role]
              properties:
                role: { $ref: '#/components/schemas/AssignableRole' }
      responses:
        '200':
          description: The member.
          content:
            application/json:
              schema:
                type: object
                required: [member]
                properties:
                  member: { $ref: '#/components/schemas/Member' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Error' }
    delete:
      operationId: remove_member
      tags: [governance]
      summary: Remove a member with their sessions and API tokens
      description: 403 for the owner, and for a support session; 409 for yourself.
      x-ankra-permission: members.manage
      security:
        - sessionCookie: []
          csrfHeader: []
      responses:
        '204': { description: Removed. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        default: { $ref: '#/components/responses/Error' }

  /v1/members/invitations:
    get:
      operationId: list_invitations
      tags: [governance]
      summary: List pending invitations (`next_cursor` is always null)
      x-ankra-permission: members.manage
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          description: Every pending invitation.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InvitationList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        default: { $ref: '#/components/responses/Error' }
    post:
      operationId: invite_member
      tags: [governance]
      summary: Invite someone to the account
      description: 409 when the email is already a member of this account. A support session gets 403.
      x-ankra-permission: members.manage
      x-ankra-verified-email: true
      security:
        - sessionCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email, role]
              properties:
                email: { type: string, format: email }
                role: { $ref: '#/components/schemas/AssignableRole' }
      responses:
        '201':
          description: The invitation and its single-use signup link (valid 7 days).
          content:
            application/json:
              schema:
                type: object
                required: [invitation, token, signup_path]
                properties:
                  invitation: { $ref: '#/components/schemas/Invitation' }
                  token: { type: string, description: 'The `aci_…` invitation token.' }
                  signup_path: { type: string, examples: ['/signup?invitation=aci_…'] }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        default: { $ref: '#/components/responses/Error' }

  /v1/members/invitations/{id}:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    delete:
      operationId: revoke_invitation
      tags: [governance]
      summary: Revoke a pending invitation
      x-ankra-permission: members.manage
      security:
        - sessionCookie: []
          csrfHeader: []
      responses:
        '204': { description: Revoked. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Error' }

  /v1/sessions:
    get:
      operationId: list_sessions
      tags: [governance]
      summary: The caller's unexpired sessions, newest first (`next_cursor` is always null)
      x-ankra-permission: self
      security: [{ apiToken: [] }, { sessionCookie: [] }]
      responses:
        '200':
          description: Every session of the caller.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        default: { $ref: '#/components/responses/Error' }

  /v1/sessions/{id}:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    delete:
      operationId: revoke_session
      tags: [governance]
      summary: End one of the caller's sessions
      description: Ending the current session also clears its cookies.
      x-ankra-permission: self
      security:
        - apiToken: []
        - sessionCookie: []
          csrfHeader: []
      responses:
        '204': { description: Ended. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        default: { $ref: '#/components/responses/Error' }

  /v1/sessions/revoke-others:
    post:
      operationId: revoke_other_sessions
      tags: [governance]
      summary: End every session of the user except the one making the call
      x-ankra-permission: self
      security:
        - apiToken: []
        - sessionCookie: []
          csrfHeader: []
      responses:
        '200':
          description: How many sessions were ended.
          content:
            application/json:
              schema:
                type: object
                required: [revoked]
                properties:
                  revoked: { type: integer }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        default: { $ref: '#/components/responses/Error' }

  /v1/usage/summary:
    get:
      operationId: get_usage_summary
      tags: [billing]
      summary: This month's usage and estimate
      x-ankra-permission: billing.read
      security: [{ apiToken: [] }, { sessionCookie: [] }]
      responses:
        '200':
          description: The usage summary.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UsageSummary' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        default: { $ref: '#/components/responses/Error' }

  /v1/usage/billing-log:
    get:
      operationId: list_billing_log
      tags: [billing]
      summary: One line per resource per day, newest day first
      x-ankra-permission: billing.read
      security: [{ apiToken: [] }, { sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - name: limit
          in: query
          schema: { type: integer, default: 50, maximum: 200 }
      responses:
        '200':
          description: A page of billing-log lines.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BillingLogEntryList' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        default: { $ref: '#/components/responses/Error' }

  /v1/usage/network-transfer:
    get:
      operationId: get_network_transfer
      tags: [compute_data]
      summary: Public network traffic per server in a month
      description: >-
        Outbound traffic of a server's public interface beyond 1 TiB per calendar month is billed at €0.01 per GiB
        (resource_type `network_transfer`); inbound and private-network traffic are free.
      x-ankra-permission: billing.read
      security: [{ apiToken: [] }, { sessionCookie: [] }]
      parameters:
        - name: month
          in: query
          description: The UTC month, `YYYY-MM`; the current one when omitted.
          schema: { type: string, pattern: '^[0-9]{4}-[0-9]{2}$' }
      responses:
        '200':
          description: The month's network transfer.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NetworkTransfer' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        default: { $ref: '#/components/responses/Error' }

  /v1/invoices:
    get:
      operationId: list_invoices
      tags: [billing]
      summary: Invoices, newest month first
      x-ankra-permission: billing.read
      security: [{ apiToken: [] }, { sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: A page of invoices.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InvoiceList' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        default: { $ref: '#/components/responses/Error' }

  /v1/account/support-access:
    get:
      operationId: get_support_access
      tags: [support]
      summary: How elevated support sessions may be opened for this account
      x-ankra-permission: members.manage
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          description: The standing decision.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SupportAccessSetting' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        default: { $ref: '#/components/responses/Error' }
    put:
      operationId: set_support_access
      tags: [support]
      summary: Change how elevated support sessions may be opened (owner only)
      description: Session-only. `consent_required` (the default) makes staff ask for a consent code before every elevated session; `always_allowed` lets admin staff open one without asking. Read-only support sessions never need consent. Audited as `support.access_changed`.
      x-ankra-permission: members.manage
      security:
        - sessionCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SupportAccessSetting' }
      responses:
        '200':
          description: Changed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SupportAccessSetting' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        default: { $ref: '#/components/responses/Error' }

  /v1/account/support-consents:
    get:
      operationId: list_support_consents
      tags: [support]
      summary: The account's newest consent codes, open and closed (`next_cursor` is always null)
      x-ankra-permission: members.manage
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          description: Up to 50 consents, newest first.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SupportConsentList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        default: { $ref: '#/components/responses/Error' }
    post:
      operationId: create_support_consent
      tags: [support]
      summary: Create a single-use consent code for one elevated support session
      description: Session-only; a support session cannot call it. The code (`XXXX-XXXX`) is returned once and read to the staff member, who enters it when opening the elevated session. Valid 15 minutes to 24 hours (default one hour). Audited as `support.consent_created`.
      x-ankra-permission: members.manage
      security:
        - sessionCookie: []
          csrfHeader: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                duration_minutes: { type: integer, minimum: 15, maximum: 1440, default: 60 }
      responses:
        '201':
          description: The consent and its code.
          content:
            application/json:
              schema:
                type: object
                required: [consent, code]
                properties:
                  consent: { $ref: '#/components/schemas/SupportConsent' }
                  code: { type: string, examples: ['K7F2-9QMD'] }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        default: { $ref: '#/components/responses/Error' }

  /v1/account/support-consents/{id}:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    delete:
      operationId: revoke_support_consent
      tags: [support]
      summary: Revoke an open consent code before staff use it
      x-ankra-permission: members.manage
      security:
        - sessionCookie: []
          csrfHeader: []
      responses:
        '204': { description: Revoked. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Error' }

  /v1/account/support-sessions:
    get:
      operationId: list_support_sessions
      tags: [support]
      summary: The support sessions open in the account, newest first (`next_cursor` is always null)
      x-ankra-permission: read
      security: [{ apiToken: [] }, { sessionCookie: [] }]
      responses:
        '200':
          description: Every unexpired support session, with the staff member, mode and reason.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SupportSessionList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        default: { $ref: '#/components/responses/Error' }

  /v1/account/support-sessions/{id}:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    delete:
      operationId: end_support_session
      tags: [support]
      summary: End a support session now
      description: Session-only; the staff browser is signed out of the account at once. Audited as `support.session_ended` by the customer.
      x-ankra-permission: members.manage
      security:
        - sessionCookie: []
          csrfHeader: []
      responses:
        '204': { description: Ended. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Error' }

  /v1/account/platform:
    get:
      operationId: get_platform_workspace_sync
      tags: [platform]
      summary: Workspace organisation mapping and membership sync status
      x-ankra-permission: read
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          description: Current sync state, last success, revision and member count. A not_configured state carries no mapping.
          content:
            application/json:
              schema:
                type: object
                required: [state]
                properties:
                  state: { type: string, enum: [not_configured, pending, synced, failed, stale] }
                  workspace_id: { type: string, format: uuid }
                  name: { type: string }
                  organisation_id: { type: [string, 'null'], format: uuid }
                  revision: { type: integer }
                  synced_revision: { type: integer }
                  synced_at: { type: [string, 'null'], format: date-time }
                  member_count: { type: integer }
                  last_error: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        default: { $ref: '#/components/responses/Error' }
  /v1/account/platform/domains:
    get:
      operationId: get_platform_workspace_domains
      tags: [platform]
      summary: Assigned organisation and cluster domains in the linked Platform workspace
      description: Session-only read using the current member's delegated identity. Pending membership returns 409; an unavailable inventory never returns an empty list. API tokens and support impersonation are refused. DNS authority remains in Platform.
      x-ankra-permission: read
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          description: Assigned hostnames and their authoritative provisioning states.
          content:
            application/json:
              schema:
                type: object
                required: [organisation_id, zone, clusters]
                properties:
                  organisation_id: { type: string, format: uuid }
                  zone:
                    type: object
                    required: [fqdn, state]
                    properties:
                      fqdn: { type: string }
                      state: { type: string }
                  clusters:
                    type: array
                    items:
                      type: object
                      required: [cluster_id, cluster_name, fqdn, state]
                      properties:
                        cluster_id: { type: string, format: uuid }
                        cluster_name: { type: string }
                        fqdn: { type: string }
                        state: { type: string }
        '409': { description: Workspace membership is pending or stale. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        default: { $ref: '#/components/responses/Error' }
  /v1/account/platform/sync:
    post:
      operationId: start_platform_workspace_sync
      tags: [platform]
      summary: Queue a membership sync retry
      description: Session-only administrator action. Cloud remains authoritative; this never accepts a target organisation or member list.
      x-ankra-permission: members.manage
      security: [{ sessionCookie: [], csrfHeader: [] }]
      responses:
        '202':
          description: Queued for the background reconciler.
          content:
            application/json:
              schema:
                type: object
                required: [state]
                properties:
                  state: { const: queued }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        default: { $ref: '#/components/responses/Error' }
  /v1/account/platform/credential:
    get:
      operationId: get_platform_workspace_credential
      tags: [platform]
      summary: Server-only current-member credential exchange
      description: Requires a customer session and the private X-Ankra-Cloud-BFF-Token header. API tokens and support sessions are refused. The delegated credential is short lived and must never be exposed to the browser.
      x-ankra-permission: read
      security: [{ sessionCookie: [] }]
      parameters:
        - in: header
          name: X-Ankra-Cloud-BFF-Token
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Private no-store credential for the authenticated member only.
          content:
            application/json:
              schema:
                type: object
                required: [workspace_id, user_id, role, organisation_id, platform_user_id, token, valid_until]
                properties:
                  organisation_id: { type: string, format: uuid }
                  workspace_id: { type: string, format: uuid }
                  user_id: { type: string, format: uuid }
                  role: { type: string, enum: [owner, admin, member, viewer] }
                  platform_user_id: { type: string }
                  token: { type: string }
                  valid_until: { type: string, format: date-time }
        '409': { description: Membership sync is pending or stale. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        default: { $ref: '#/components/responses/Error' }

  /v1/account/billing:
    get:
      operationId: get_payment_configuration
      tags: [payment]
      summary: Whether card payments through Stripe are available
      description: When `payments_configured` is false the other `/v1/account/billing/*` routes answer 503 and invoices stay `unbilled`. `standing` says whether the account may create billable resources (the same `reason` a refused create answers 402 with).
      x-ankra-permission: billing.read
      security: [{ apiToken: [] }, { sessionCookie: [] }]
      responses:
        '200':
          description: The payment configuration.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaymentConfiguration' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        default: { $ref: '#/components/responses/Error' }

  /v1/account/billing/setup-session:
    post:
      operationId: create_payment_setup_session
      tags: [payment]
      summary: Start Stripe's hosted page for saving a payment method
      description: Creates the account's Stripe customer on first use and a Checkout session in setup mode (nothing is charged). Redirect the customer to `url`; Stripe sends them back to `/settings/billing`.
      x-ankra-permission: billing.manage
      x-ankra-verified-email: true
      security:
        - apiToken: []
        - sessionCookie: []
          csrfHeader: []
      responses:
        '201':
          description: The hosted page to redirect to.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaymentSetupSession' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/PaymentsNotConfigured' }
        default: { $ref: '#/components/responses/Error' }

  /v1/account/billing/payment-methods:
    get:
      operationId: list_payment_methods
      tags: [payment]
      x-ankra-credential-read: true
      summary: The account's saved payment methods
      x-ankra-permission: billing.read
      security: [{ apiToken: [] }, { sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: A page of payment methods.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaymentMethodList' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/PaymentsNotConfigured' }
        default: { $ref: '#/components/responses/Error' }

  /v1/account/billing/payment-methods/{id}:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    delete:
      operationId: remove_payment_method
      tags: [payment]
      summary: Detach a saved payment method
      x-ankra-permission: billing.manage
      security:
        - apiToken: []
        - sessionCookie: []
          csrfHeader: []
      responses:
        '204': { description: Removed. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/PaymentsNotConfigured' }
        default: { $ref: '#/components/responses/Error' }

  /v1/account/billing/payment-methods/{id}/default:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    post:
      operationId: set_default_payment_method
      tags: [payment]
      summary: Charge invoices to this payment method
      x-ankra-permission: billing.manage
      security:
        - apiToken: []
        - sessionCookie: []
          csrfHeader: []
      responses:
        '204': { description: It is the default now. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/PaymentsNotConfigured' }
        default: { $ref: '#/components/responses/Error' }

  /v1/account/credits:
    get:
      operationId: list_account_credits
      tags: [coupon]
      summary: The account's credits and what they have left
      description: >-
        Every credit the account was granted (coupon redemptions, staff grants), newest first, with its status at the
        time of the response. `balance_cents` sums what live credits have left. A credit pays for the usage incurred
        between `granted_at` and `expires_at` (metered hours, and days of network transfer, that overlap that window),
        on the invoice of the month the usage was in, whenever that invoice is issued; the soonest-expiring credit
        pays first. Usage outside every credit's window is charged.
      x-ankra-permission: billing.read
      security: [{ apiToken: [] }, { sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: A page of credits with the balance.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CreditList' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        default: { $ref: '#/components/responses/Error' }

  /v1/account/coupons:
    post:
      operationId: redeem_coupon
      tags: [coupon]
      summary: Redeem a coupon code for account credit
      description: >-
        Grants the coupon's credit, which expires the coupon's validity days from now. A code is redeemed at most once
        per account and never beyond its cap; the check and the redemption happen under a lock on the coupon, so
        concurrent redemptions cannot exceed it. Codes compare case-insensitively. The redemption, and a refused
        attempt, are written to the account's audit log (`billing.coupon.redeem`).
      x-ankra-permission: billing.manage
      security:
        - apiToken: []
        - sessionCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RedeemCouponRequest' }
      responses:
        '201':
          description: The credit was granted.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CouponRedemption' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422':
          description: The code cannot be applied; `reason` says why.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/CouponRefusalProblem' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        default: { $ref: '#/components/responses/Error' }

  /v1/webhooks/stripe:
    post:
      operationId: receive_stripe_webhook
      tags: [payment]
      summary: Stripe event delivery
      description: |
        Called by Stripe only. Unauthenticated and CSRF-exempt: the `Stripe-Signature` header over the raw body is
        verified with the endpoint's signing secret (five-minute timestamp tolerance), and each event id is applied
        once. Handles `checkout.session.completed`, `setup_intent.succeeded`, `invoice.paid`,
        `invoice.payment_failed` and `payment_method.detached`; every other type is acknowledged and ignored.
      security:
        - {}
      parameters:
        - name: Stripe-Signature
          in: header
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        '200':
          description: Received (applied, a duplicate, or ignored).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WebhookReceipt' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '503': { $ref: '#/components/responses/PaymentsNotConfigured' }
        default: { $ref: '#/components/responses/Error' }

  /v1/quotas:
    get:
      operationId: get_quotas
      tags: [quota]
      summary: The account's limits and what it holds
      x-ankra-permission: read
      security: [{ apiToken: [] }, { sessionCookie: [] }]
      responses:
        '200':
          description: Limits and usage.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Quota' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        default: { $ref: '#/components/responses/Error' }

  /v1/notifications:
    get:
      operationId: list_notifications
      tags: [notification]
      summary: List the account's notifications, newest first
      description: |
        What the control plane told the account, newest first: a failed operation (`operation.failed`), a failed
        charge (`billing.payment_failed`), the days left before an overdue invoice suspends the account
        (`billing.suspension_countdown`, three days and one day before), the suspension itself
        (`billing.account_suspended`), a create refused by a limit (`quota.refused`, once a day for each limit), and
        for an account with no payment method and no credit that runs servers: the notice that its servers are
        powered off seven days later unless a payment method is added (`billing.unpaid_usage_found`), a reminder
        about a day before (`billing.unpaid_usage_stop_reminder`) and the power-off itself
        (`billing.unpaid_usage_servers_stopped`).
        `unread=true` keeps the ones nobody in the account read yet. Pages hold 50 notifications unless `limit` asks
        for up to 200.
      x-ankra-permission: read
      security: [{ apiToken: [] }, { sessionCookie: [] }]
      parameters:
        - name: unread
          in: query
          description: '`true` keeps only the unread notifications.'
          schema: { type: boolean }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: A page of notifications.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotificationList' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        default: { $ref: '#/components/responses/Error' }

  /v1/notifications/unread-count:
    get:
      operationId: get_unread_notification_count
      tags: [notification]
      summary: How many notifications of the account are unread
      description: >-
        The number a console shows on its bell. Counting stops at `ceiling`: an account with more unread
        notifications answers `unread` equal to `ceiling`.
      x-ankra-permission: read
      security: [{ apiToken: [] }, { sessionCookie: [] }]
      responses:
        '200':
          description: The unread count.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotificationUnreadCount' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        default: { $ref: '#/components/responses/Error' }

  /v1/notifications/read-all:
    post:
      operationId: mark_all_notifications_read
      tags: [notification]
      summary: Mark every unread notification of the account read
      description: >-
        Clears the bell for the whole account. It takes the `read` permission, because the read marker changes no
        resource, but the billing notifications (`billing.*`) are marked only for a caller who may read the account's
        billing (`billing.read`, and for an API token a scope that includes it): for anyone else they stay unread and
        `billing_included` is false, so a failed charge or a suspension countdown is not hidden from the people who
        must act on it. A read-only API token (scope `read`, or a scope list with neither `operate` nor
        `billing.manage`) is refused with 403. A support session's mark is recorded in the audit log
        (`notification.mark_all_read`).
      x-ankra-permission: read
      security: [{ apiToken: [] }, { sessionCookie: [], csrfHeader: [] }]
      responses:
        '200':
          description: How many notifications were marked.
          content:
            application/json:
              schema:
                type: object
                required: [marked, billing_included]
                properties:
                  marked: { type: integer }
                  billing_included: { type: boolean, description: Whether the billing notifications were marked too. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        default: { $ref: '#/components/responses/Error' }

  /v1/notifications/{id}/read:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    post:
      operationId: mark_notification_read
      tags: [notification]
      summary: Mark one notification read
      description: >-
        Marks the notification read for the whole account and answers it. Marking a read notification again keeps the
        first `read_at`. A billing notification (`billing.*`) needs `billing.read` as well, and for an API token a
        scope that includes it: without it the answer is 403 with `reason: billing_permission_required`. A read-only
        API token (scope `read`, or a scope list with neither `operate` nor `billing.manage`) is refused with 403. A
        support session's mark is recorded in the audit log (`notification.mark_read`).
      x-ankra-permission: read
      security: [{ apiToken: [] }, { sessionCookie: [], csrfHeader: [] }]
      responses:
        '200':
          description: The notification, read.
          content:
            application/json:
              schema:
                type: object
                required: [notification]
                properties:
                  notification: { $ref: '#/components/schemas/Notification' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        default: { $ref: '#/components/responses/Error' }

  /v1/private-cloud:
    get:
      operationId: get_private_cloud
      tags: [private_cloud]
      summary: The account's private cloud, or what it takes to request one
      description: >-
        `has_private_hosts` says whether staff dedicated physical hosts to the account. When they did, `zones` sums the
        dedicated capacity per zone (hosts, vCPU budget, memory, disk) with what the account's servers on those hosts
        take, `totals` sums every zone and `servers` lists the account's servers placed on its private hosts (at most
        500, newest first; `servers_truncated` is true when there are more). Customers see capacity, never the
        machines: no hostname, address or hardware detail of a host is returned. `minimums` and `maximums` bound a new
        request, `open_request` is the request waiting for staff (null when none) and `recent_requests` the account's
        five newest requests.
      x-ankra-permission: read
      security: [{ apiToken: [] }, { sessionCookie: [] }]
      responses:
        '200':
          description: The private cloud overview.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PrivateCloudOverview' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        default: { $ref: '#/components/responses/Error' }

  /v1/private-cloud/requests:
    get:
      operationId: list_private_cloud_requests
      tags: [private_cloud]
      summary: The account's private cloud requests, newest first
      x-ankra-permission: read
      security: [{ apiToken: [] }, { sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: A page of requests (`limit` at most 100, default 20).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PrivateCloudRequestList' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        default: { $ref: '#/components/responses/Error' }
    post:
      operationId: create_private_cloud_request
      tags: [private_cloud]
      summary: Ask Ankra for a private cloud, or for more private capacity
      description: >-
        Records what the account wants dedicated to it (vCPUs, memory, disk, optionally a region and notes) for staff to
        review; nothing is provisioned or billed by the request itself. Each amount must be at least the minimum
        `get_private_cloud` returns and at most its maximum (422 otherwise). An account has one open request at a time:
        409 while another is `open` or `in_review` (withdraw it first). Recorded in the account's audit log
        (`private_cloud_request.create`) and emailed to Ankra's admin staff. The caller's email address must be verified.
      x-ankra-permission: billing.manage
      x-ankra-verified-email: true
      security:
        - apiToken: []
        - sessionCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreatePrivateCloudRequest' }
      responses:
        '201':
          description: The recorded request.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PrivateCloudRequestEnvelope' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422':
          description: An amount is below the minimum or above the maximum, the region is unknown or the notes are too long.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        default: { $ref: '#/components/responses/Error' }

  /v1/private-cloud/requests/{id}:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    delete:
      operationId: cancel_private_cloud_request
      tags: [private_cloud]
      summary: Withdraw an open private cloud request
      description: >-
        The request becomes `withdrawn`. Only an `open` or `in_review` request can be withdrawn (409 otherwise). Recorded
        in the account's audit log (`private_cloud_request.withdraw`).
      x-ankra-permission: billing.manage
      security:
        - apiToken: []
        - sessionCookie: []
          csrfHeader: []
      responses:
        '200':
          description: The withdrawn request.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PrivateCloudRequestEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        default: { $ref: '#/components/responses/Error' }

  /v1/dev-clusters/versions:
    get:
      operationId: list_dev_cluster_versions
      tags: [dev_cluster]
      summary: The Kubernetes versions a dev cluster can run, and where and on what terms dev clusters are offered
      description: >-
        `items` are the Kubernetes minors on offer with the k3s release each installs. `is_available` is false while
        the deployment offers dev clusters in no zone (creating one then answers 503). `all_zones` means every zone
        offers them and `zones` is empty; otherwise `zones` names the zones that do. A dev cluster needs a plan with
        at least `minimum_memory_mebibytes` of memory. It has no fee of its own: it is billed as its server, plus
        `ipv4_price_monthly_cents` a month with `public_ipv4`. `production_warning` says why it is not for production.
      x-ankra-permission: read
      security: [{ apiToken: [] }, { sessionCookie: [] }]
      responses:
        '200':
          description: The versions and the offer.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DevClusterVersions' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        default: { $ref: '#/components/responses/Error' }

  /v1/dev-clusters:
    get:
      operationId: list_dev_clusters
      tags: [dev_cluster]
      summary: The account's dev clusters, newest first
      x-ankra-permission: read
      security: [{ apiToken: [] }, { sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: A page of dev clusters (`limit` at most 100, default 50). Deleted clusters are not listed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DevClusterList' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        default: { $ref: '#/components/responses/Error' }
    post:
      operationId: create_dev_cluster
      tags: [dev_cluster]
      summary: Create a dev cluster
      description: >-
        Creates one server of `plan` in `zone` in your account (image Debian 13, labelled
        `kubernetes.ankra.cloud/dev-cluster`) that installs k3s at the version's pinned release and is the cluster's
        control plane, its only node and its network edge: the Kubernetes API is served on port 6443 and the bundled
        ingress (Traefik behind ServiceLB) on ports 80 and 443 of the server's own addresses. The server always has
        its public IPv6 /64; `public_ipv4` adds a public IPv4 (the server add-on) and makes the cluster dual-stack.
        Volumes are local-path volumes on the server's disk. The cluster is `creating` until its API answers (a few
        minutes), then `running`; one that does not come up within 30 minutes turns `error` with a
        `failure_reason`. What the server is refused for (capacity, quota, SSH keys) is this request's answer and
        leaves nothing behind. Billed as the server, with no fee for the cluster. An account may hold 5 dev clusters.
        A dev cluster has no high availability, node pools, upgrades or snapshots: every one carries
        `production_recommended: false`. Recorded in the account's audit log (`dev_cluster.create`).


        Creating one needs a payment method like every billable create (402 otherwise), with one exception: an
        account linked to an Ankra platform organisation and without a card gets a free trial (`is_trial`) when
        `dev_cluster_trial.is_available` in `GET /v1/account/billing`: one at a time, a plan with at most 1 core and
        2 GiB, no `public_ipv4`, deleted with its server at `trial_expires_at` (24 hours) unless the account saves a
        card first, which keeps it as an ordinary cluster billed from the next full hour. A trial request outside those
        terms answers 400; an account that may not start one answers 402 `payment_method_required` saying why.
      x-ankra-permission: operate
      x-ankra-verified-email: true
      security:
        - apiToken: []
        - sessionCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateDevCluster' }
      responses:
        '201':
          description: The creating dev cluster.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DevClusterEnvelope' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/PaymentRequired' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/QuotaExceeded' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
        default: { $ref: '#/components/responses/Error' }

  /v1/dev-clusters/{id}:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    get:
      operationId: get_dev_cluster
      tags: [dev_cluster]
      summary: One of the account's dev clusters
      x-ankra-permission: read
      security: [{ apiToken: [] }, { sessionCookie: [] }]
      responses:
        '200':
          description: The dev cluster.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DevClusterEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        default: { $ref: '#/components/responses/Error' }
    delete:
      operationId: delete_dev_cluster
      tags: [dev_cluster]
      summary: Delete a dev cluster with its server
      description: >-
        The cluster becomes `deleting`, its server is deleted with its disk (every workload and local-path volume goes
        with it), and it is `deleted` once the server is gone. 409 while it is deleting already. Recorded in the
        account's audit log (`dev_cluster.delete`).
      x-ankra-permission: operate
      security:
        - apiToken: []
        - sessionCookie: []
          csrfHeader: []
      responses:
        '200':
          description: The deleting dev cluster.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DevClusterEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        default: { $ref: '#/components/responses/Error' }

  /v1/dev-clusters/{id}/kubeconfig:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    get:
      operationId: get_dev_cluster_kubeconfig
      tags: [dev_cluster]
      x-ankra-credential-read: true
      summary: A kubeconfig with a short-lived cluster-admin credential of a running dev cluster (audited)
      description: >-
        The `admin` context holds a service account token bound to `cluster-admin` that expires at `expires_at`
        (8 hours). When the deployment has the Kubernetes OIDC issuer, the `oidc` context signs you in as yourself
        instead: its exec credential plugin calls `get_dev_cluster_token`, and your Ankra role decides your Kubernetes
        role (owner and admin: cluster-admin, member: edit, viewer: view). Both verify the API server against the
        cluster's own authority. 409 while the cluster is not `running`. Recorded in the account's audit log
        (`dev_cluster.kubeconfig`).
      x-ankra-permission: operate
      security: [{ apiToken: [] }, { sessionCookie: [] }]
      responses:
        '200':
          description: The kubeconfig.
          content:
            application/json:
              schema:
                type: object
                required: [kubeconfig, expires_at]
                properties:
                  kubeconfig: { type: string, description: 'The kubeconfig YAML.' }
                  expires_at: { type: string, format: date-time }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
        default: { $ref: '#/components/responses/Error' }

  /v1/dev-clusters/{id}/token:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    get:
      operationId: get_dev_cluster_token
      tags: [dev_cluster]
      x-ankra-credential-read: true
      summary: An OIDC token for the dev cluster's API, as a client.authentication.k8s.io ExecCredential
      description: >-
        Signed by the Ankra Cloud Kubernetes issuer, valid for one hour, for this cluster only (`aud`). `groups` holds
        `ankra:<role>` of the caller's role, which the cluster binds to cluster-admin (owner, admin), edit (member) or
        view (viewer). 503 when the deployment has no issuer; 409 once the cluster is being deleted. Recorded in the
        account's audit log (`dev_cluster.token`).
      x-ankra-permission: read
      security: [{ apiToken: [] }, { sessionCookie: [] }]
      responses:
        '200':
          description: The ExecCredential.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/KubernetesExecCredential' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
        default: { $ref: '#/components/responses/Error' }

  /v1/playgrounds/offer:
    get:
      operationId: get_playground_offer
      tags: [playground]
      summary: Whether the account may start a free playground, and on what terms
      description: >-
        `eligibility` is `eligible`, or why a playground cannot be started now: `unavailable` (playgrounds are not
        offered yet; `is_available` is false), `active_playground` (end the active one first), `allowance_used` (every
        free playground the account gets is used) or `account_suspended`. `regions` lists the regions that offer
        playgrounds, `lifetime_hours` how long one lives, `limits` what its workloads may use, `allowance` how many an
        account gets ever and `allowance_used` how many it used (playgrounds that failed to start do not count).
        `active` is the account's provisioning or ready playground, null when none. Starting one also needs a verified
        email address, which this answer does not check.
      x-ankra-permission: read
      security: [{ apiToken: [] }, { sessionCookie: [] }]
      responses:
        '200':
          description: The offer.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlaygroundOffer' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        default: { $ref: '#/components/responses/Error' }

  /v1/playgrounds:
    get:
      operationId: list_playgrounds
      tags: [playground]
      summary: The account's playgrounds, newest first
      x-ankra-permission: read
      security: [{ apiToken: [] }, { sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: A page of playgrounds (`limit` at most 100, default 20).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlaygroundList' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        default: { $ref: '#/components/responses/Error' }
    post:
      operationId: start_playground
      tags: [playground]
      summary: Start the account's free playground
      description: >-
        Creates a playground in `region` (the first offered region when absent) that is `provisioning` until its API is
        ready (usually under a minute) and expires `lifetime_hours` after creation. Free: no payment method or credit is
        needed, but the caller's email address must be verified. 409 while the account has an active playground; 403
        with `reason: allowance_used` once the account has used its free playground (one per account by default), `reason: account_suspended` while
        it is suspended; 422 for a region that does not offer playgrounds; 503 while playgrounds are not offered.
        Recorded in the account's audit log (`playground.start`).
      x-ankra-permission: operate
      x-ankra-verified-email: true
      security:
        - apiToken: []
        - sessionCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StartPlayground' }
      responses:
        '201':
          description: The provisioning playground.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlaygroundEnvelope' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422':
          description: The region does not offer playgrounds.
          content:
