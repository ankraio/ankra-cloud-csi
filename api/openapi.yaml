openapi: 3.1.0
info:
  title: Ankra Cloud API
  version: v1
  description: |
    Every HTTP route of the Ankra Cloud control plane (`ankra-cloud-api`): the customer API (`/v1`), the operator
    routes (`/v1/zones/...`, `/metrics`, operator token), the admin console API (`/admin/v1`, staff session), node
    registration (`/internal/v1`, used by `ankra-node`) and the health probes. The prose companion is `docs/api.md`.

    This file is maintained by hand; `api/internal/rest/openapi_test.go` and `openapi_conformance_test.go` keep it
    honest. The build fails when a registered route has no operation here or an operation has no route; when an
    `operationId` is missing, repeated or not a snake_case verb phrase; when an operation's tag is not the area
    (`routes_<area>.go`) that registers its route; when its `security` does not match the route's guard; when
    `x-ankra-permission`, `x-ankra-operator-scope`, `x-ankra-staff-role` or `x-ankra-credential-read` differ from
    the guard; when a JSON response has no schema or an operation has no error response; and when a customer
    route's JSON answer, driven through the HTTP test harness, does not validate against its schema.

    `operationId`s are stable snake_case verb phrases (`list_servers`, `create_edge`). The generated Go client
    (`api/pkg/client/openapi`), the CLI's `ankra-cloud api <operation_id>` and the MCP tools are named after them,
    so renaming one is a breaking change.

    Conventions:

    - JSON everywhere, `snake_case` field names. Timestamps are RFC 3339 strings. Money is EUR in integer minor
      units: `*_cents` (1/100 EUR) and `*_millicents` (1/100 000 EUR).
    - Errors are RFC 7807 problem documents (`application/problem+json`); `detail` is written for a customer.
    - Lists return `{ items, next_cursor }` and accept `?cursor=` (opaque keyset cursor) and, where listed, `?limit=`.
    - Customer routes accept an API token (`Authorization: Bearer act_…`) or a portal session (cookie
      `ankracloud_session`; unsafe methods also need `X-CSRF-Token` equal to the `ankracloud_csrf` cookie). A token
      with scope `read` gets 403 on every unsafe method. `/v1/auth/*` and the routes that govern credentials are
      session-only.
    - `x-ankra-permission` names the permission the caller's role must hold: `read`, `operate`, `members.manage`,
      `tokens.manage`, `billing.read`, `billing.manage` or `self`. `x-ankra-credential-read: true` marks a read that
      reveals a credential or a live view into a server; read-only support sessions and read-only API tokens (scope
      `read`, or a scope list with neither `operate` nor `billing.manage`) are refused there with 403 and
      `reason: read_only_token_cannot_read_credentials`. `x-ankra-billable-create: true` marks a create that the
      account pays for; it answers 402 (`reason: payment_method_required` or `account_suspended`) while the account
      may not spend. `x-ankra-verified-email: true` marks a route (every billable create, inviting a member, adding a
      payment method) that answers 403 with `reason: email_unverified` while the caller's email address is not
      verified (`POST /v1/auth/email-verification` mails a new link). `x-ankra-idempotent: true` marks a create (every
      billable one) that honours the `Idempotency-Key` header: send a key of your own (a UUID) with the create, and
      sending the same create again with that key within 24 hours answers what the first one answered, with
      `Idempotent-Replayed: true`, instead of creating and billing a second resource. While the first is still running
      the answer is 409 (`reason: idempotency_key_in_progress`, with `Retry-After`); the same key with a different
      request is 422 (`reason: idempotency_key_reused`). A 4xx answer created nothing and frees the key. A create that
      answered 5xx, or never answered, may have happened: its key is kept for the 24 hours and answers 409 with
      `reason: idempotency_key_outcome_unknown`; list the resource, and create again with a new key only when it is not
      there. 409 with `reason: idempotency_key_answer_not_stored` means the create succeeded but its answer could not
      be kept; read the resource instead. Stored answers are encrypted at rest; a replay that answers a one-time
      credential again (create_database, enable_object_storage) is recorded in the audit log like a read of the
      credentials. Keys are per account and per operation. Without the header a create runs as sent.
    - `x-ankra-operator-scope` names the scope an operator token needs (`read`, `maintenance`, `nodes`, `migrate`);
      `x-ankra-staff-role` the staff role an admin console route needs (`support` or `admin`; admin satisfies both).
servers:
  - url: /
tags:
  - name: health
    description: Liveness and readiness probes.
  - name: node
    description: Node registration (`ankra-node`) and the operator's view of zones, nodes and gateways.
  - name: underlay
    description: >-
      A zone's underlay (ADR 0004 §2): the encrypted underlay between hosts in different datacenters, the latency budget
      measured over it, each node's datacenter, and the controller that points provider-routed public addresses (failover
      IPs, routed subnets) at the gateway serving them. Operator only.
  - name: region
    description: >-
      Regions (a metro of availability zones within about 2 ms of each other) and, for operators, the racks of a zone
      (ADR 0003).
  - name: auth
    description: Customer sign-up, sign-in, sessions, invitations and support handoff.
  - name: oidc
    description: Sign-in through the OpenID Connect identity provider.
  - name: password_reset
    description: Password recovery by email - whether it is available, asking for a link, and setting a new password with one.
  - name: email_verification
    description: Proving an email address - asking for a verification link and confirming its token.
  - name: identity
    description: The signed-in user's linked sign-in identities.
  - name: mfa
    description: >-
      Multi-factor authentication: the second sign-in step (a TOTP code or a recovery code), setting up and turning off
      an authenticator app, recovery codes, and the account owner's requirement of a second factor for every member.
  - name: admin
    description: The staff admin console - accounts, audit, support sessions and staff.
  - name: account_administration
    description: >-
      The staff admin console's controls over customer accounts and users - suspending an account, finding, disabling
      and enabling users, changing or removing members - and an account's invoices and payment standing.
  - name: server
    description: Servers, their lifecycle and operations, plans, templates and the audit log.
  - name: governance
    description: API tokens, members, invitations and sessions.
  - name: platform
    description: Workspace organisation sync and server-only delegated membership.
  - name: organisation
    description: The accounts you act in and their link to Ankra platform organisations (platform.ankra.app is the primary identity).
  - name: support
    description: The customer's control over Ankra support access.
  - name: billing
    description: Usage, the billing log and invoices.
  - name: payment
    description: Payment methods and the Stripe webhook.
  - name: coupon
    description: Account credits, coupon redemption, and credit and coupon management for staff.
  - name: quota
    description: Account quotas.
  - name: notification
    description: >-
      What the control plane told the account: an operation failed, the charge for an invoice failed, the account is
      about to be or was suspended for an overdue invoice, a create was refused by a limit. A notification is read or
      unread for the whole account. The ones about billing are also sent by email to the account's owner and admins.
  - name: private_cloud
    description: >-
      Private cloud: physical hosts dedicated to one account. An account reads the capacity it has per zone (never which
      machines carry it) and asks for a private cloud or more of it; staff review the requests and dedicate hosts in the
      fleet.
  - name: playground
    description: >-
      Native playgrounds (ADR 0010): a free, short-lived Kubernetes cluster (a vCluster on the region's host cluster) for
      every verified account, one at a time and at most the allowance ever; staff list them and end one with a reason.
  - name: dev_cluster
    description: >-
      Dev clusters (ADR 0012): Kubernetes for development on one server in the account. The server runs k3s as control
      plane and only node and is its own network edge: it serves the Kubernetes API (port 6443) and the cluster's
      ingress (ports 80 and 443) on its own public addresses. Billed as its server; not for production.
  - name: storage
    description: Block storage, backups and custom images.
  - name: storage_backend
    description: A zone's storage backends (Ankra Local, Ankra Storage, the single-node S3 server) and its Ankra Storage growth policy.
  - name: control_plane
    description: A zone's control plane growing from one host to the highly available form on three to five (control_plane.expand and control_plane.shrink).
  - name: backup_vault
    description: Off-host backup vaults, one S3 bucket per region, that backups of Ankra Local volumes go to in zones without Ankra Storage.
  - name: cpu_pool
    description: CPU pools, the compute nodes of a zone a guest cannot tell apart; plans may be pinned to one.
  - name: network
    description: Private networks, routers, floating IPs, server interfaces and firewalls.
  - name: library
    description: SSH keys, init scripts and server groups.
  - name: compute_data
    description: The console, the metadata service setting, server metrics and network transfer.
  - name: maintenance
    description: High availability and migration policies, node maintenance and operator actions on servers.
  - name: host
    description: Host lifecycle, operator only - the maintenance operation, the node agent builds an upgrade installs (with the guest binary a build carries), and each node's BMC for fencing.
  - name: telemetry
    description: The control plane's own metrics.
  - name: load_balancer
    description: Managed load balancers and their certificates.
  - name: object_storage
    description: Managed object storage.
  - name: database
    description: Managed PostgreSQL databases.
  - name: dns
    description: Hosted DNS - zones on the Ankra Cloud nameservers, delegated subzones and their records.
  - name: edge
    description: Network edges - bastion, NAT64/DNS64 gateway and dual-stack load balancer roles.
  - name: kubernetes_cluster
    description: >-
      Managed Kubernetes - clusters whose control plane is a vCluster Ankra runs on the region's host cluster, their
      node pools of servers in your account, kubeconfigs and OIDC tokens, etcd snapshots, and the operator's regional
      host clusters.
  - name: platform_cluster
    description: >-
      A managed Kubernetes cluster's registration in the Ankra platform (ADR 0006): registering it in the account's
      platform organisation now, and taking it out of the platform. Registration otherwise happens on its own once a
      cluster runs; its state is `platform` on the cluster.
  - name: platform_credential
    description: >-
      The Ankra platform's service requests (ADR 0005, "Platform-provisioned accounts"): it obtains an API token for
      the Cloud account of one of its organisations, provisioning and linking the account when the organisation has
      none, so nobody pastes a token into the platform.
  - name: infrastructure
    description: >-
      The admin console's regions, zones and public IP pools: staff read them, admin staff create and change them
      through the same rules as the control plane host's CLI. Every change is recorded in the platform audit chain.
  - name: setup
    description: The admin console's setup checklist, from bought bare-metal servers to a live cloud.
  - name: platform_audit
    description: The platform audit log for staff, the hash chain of every action that belongs to no customer account.
  - name: monitoring
    description: >-
      The monitoring integration with a Prometheus on an Ankra-managed cluster: HTTP service discovery of every target
      and the read-only scrape credential.
  - name: fleet
    description: >-
      The admin console's fleet: every region, zone and node with its liveness, maintenance, agent, unhealthy components
      and capacity counted with the scheduler's rules, rolled up per zone, per region and for the whole fleet.
  - name: agent_rollout
    description: >-
      The admin console's node agent builds and fleet rollouts: the builds of the artefact store with the nodes that run
      each, and rollouts that take one build across the fleet one node at a time, each node through the restart-only
      `node.agent_upgrade` operation.
  - name: host_onboarding
    description: >-
      Adding blank servers from the admin console: the control plane's SSH key, a probe that reads the server without
      changing it, the confirmed host key, and the install of the node agent with a join token the control plane mints.
  - name: control_link
    description: >-
      The control-plane links of remote hosts (ADR 0009): the WireGuard /30 through which a host without a private network
      to the control plane reaches the API and NATS. Add server makes them; operators adopt the ones built by hand.
  - name: tailnet
    description: >-
      The company tailnet of dedicated hosts: a headscale server (`ANKRA_CLOUD_TAILNET_URL`) with one user per region,
      named after it. Hosts join with single-use pre-auth keys minted per join and expired afterwards; keys are never
      stored or returned. Staff only.
  - name: edge_router
    description: >-
      The regions' IPv6 edge routers (ADR 0007): the hosts providers route a prefix to, which carry it to zones' gateways
      over WireGuard and BGP and may run their NAT64, and each zone gateway's uplink to one of them.
  - name: zone_object_storage
    description: >-
      A zone's S3 exposure, managed by staff in the admin console: the endpoint customers use, the storage node that
      serves the zone's single-node S3 server while the zone has no Ceph, the addresses its front listens on and the
      certificate it serves. What staff record wins over the environment (`ANKRA_CLOUD_OBJECT_STORAGE_ENDPOINTS`) and
      the serving node's `node.toml`; see docs/operations/object-storage.md.
  - name: mcp
    description: >-
      The Model Context Protocol endpoints (docs/mcp.md). They carry JSON-RPC messages, not REST resources, and are
      never MCP tools themselves.

paths:
  /v1/auth/signup:
    post:
      operationId: sign_up
      tags: [auth]
      summary: Create an account with yourself as its owner and get the link that verifies your email
      description: >-
        Self-service signup. Creates the account (with the default quotas), its owner and EUR 249 of Cloud credit
        valid for 60 days from account creation in one transaction, and mails
        a link to the address that verifies it (`POST /v1/auth/email-verification/confirm`). It opens no session: the
        owner signs in with `POST /v1/auth/login`, and until the address is verified may not invite members, add a
        payment method or create billable resources (403 `reason: email_unverified`). The email is trimmed and
        lowercased. Without `account_name` the account is named after `name`. The answer is 202 with the same body
        whether the address is new or already has a user: that user gets a note saying someone tried to sign up with
        the address, and no second account is made, so the answer never says which addresses have accounts. Rate
        limited per client address (5 per minute); an address that already has a user counts towards that address's
        lockout. With `coupon_code` the code is redeemed for a new account (see `POST /v1/account/coupons`); a code
        that cannot be applied never fails the signup, and the answer does not say what happened to it
        (`GET /v1/account/credits` does).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SignupRequest' }
      responses:
        '202':
          description: The sign-up is accepted and a mail is on its way to the address.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SignupAccepted' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        default: { $ref: '#/components/responses/Error' }

  /v1/auth/oidc:
    get:
      operationId: get_identity_provider_status
      tags: [oidc]
      summary: Which identity providers sign-in is available through
      description: >-
        `providers` lists every sign-in provider in the order of their buttons (the Ankra platform's Auth0 as `ankra`,
        `google`, `microsoft`, …): the portal shows one "Continue with `display_name`" button per entry, with its `icon`
        mark, and above it one "Continue with …" button per entry of that provider's `connections` (Google, Microsoft,
        GitHub brokered by an Auth0 provider). Each button starts `/v1/auth/oidc/login?provider=<name>`. The first
        provider is the primary one: the top-level `display_name`, `icon`, `silent_sign_in` and `connections` describe
        it (for portals released before there could be several; its `icon` is left out when it is the Ankra mark those
        portals do not know), and a start without `provider=` goes there. Which providers exist is deployment
        configuration (`ANKRA_CLOUD_OIDC_*`), not a per-account setting.
      security: []
      responses:
        '200':
          description: The provider status.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IdentityProviderStatus' }
        default: { $ref: '#/components/responses/Error' }

  /v1/auth/oidc/login:
    get:
      operationId: start_identity_provider_login
      tags: [oidc]
      summary: Start a sign-in at the identity provider
      description: |
        Answers 302 to the provider's authorization endpoint (authorization code flow with `state`, `nonce` and a
        PKCE S256 challenge, scope `openid profile email`) and sets the short-lived `ankracloud_oidc` cookie
        (HttpOnly, Secure, SameSite=Lax, 10 minutes, signed) that the callback verifies. The callback goes to
        `<portal origin>/v1/auth/oidc/callback` (or `/v1/auth/oidc/callback/<provider>` for a provider listed in
        `ANKRA_CLOUD_OIDC_PROVIDERS`) for the configured portal origin the browser is on; the signed cookie remembers
        which provider the sign-in started at. Rate limited
        per client address (20 a minute). Not a browser-XHR endpoint: navigate to it.
      security: []
      parameters:
        - name: return_to
          in: query
          required: false
          schema: { type: string, examples: ['/server/abc'] }
          description: Same-origin path the portal lands on after sign-in; anything else becomes `/dashboard`.
        - name: prompt
          in: query
          required: false
          schema: { type: string, enum: [none, login] }
          description: '`none` asks the provider for a session it already has and never shows a screen (silent sign-on; a miss lands on `/login?silent=failed`); `login` forces credentials (sent to Google and Microsoft as `prompt=select_account`, the value they accept).'
        - $ref: '#/components/parameters/CouponCode'
        - $ref: '#/components/parameters/IdentityProviderName'
        - $ref: '#/components/parameters/IdentityProviderConnection'
      responses:
        '302': { description: 'Redirect to the provider.' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
        default: { $ref: '#/components/responses/Error' }

  /v1/auth/oidc/signup:
    get:
      operationId: start_identity_provider_signup
      tags: [oidc]
      summary: Start a sign-up at the identity provider
      description: >-
        Like `/v1/auth/oidc/login` with the provider's sign-up screen (`screen_hint=signup`; a direct provider such as
        Google has no separate sign-up screen and gets neither `screen_hint` nor `connection`). A new identity gets an
        account with itself as owner; a known one is simply signed in. `coupon` rides in the signed challenge cookie
        and is redeemed for the account the sign-up creates; the landing page then carries
        `coupon_status=applied` or the reason it was not applied (`unknown`, `inactive`, `not_yet_valid`, `expired`,
        `exhausted`, `already_redeemed`, `unavailable`). A sign-in of a known identity ignores it.
      security: []
      parameters:
        - name: return_to
          in: query
          required: false
          schema: { type: string }
        - $ref: '#/components/parameters/CouponCode'
        - name: prompt
          in: query
          required: false
          schema: { type: string, enum: [none, login] }
        - $ref: '#/components/parameters/IdentityProviderName'
        - $ref: '#/components/parameters/IdentityProviderConnection'
      responses:
        '302': { description: 'Redirect to the provider.' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
        default: { $ref: '#/components/responses/Error' }

  /v1/auth/oidc/callback:
    get:
      operationId: finish_identity_provider_login
      tags: [oidc]
      summary: The identity providers' callback
      description: |
        The one callback every provider returns to. Verifies `state` against the `ankracloud_oidc` cookie, whose
        signed challenge alone says which provider the sign-in started at (a `provider` parameter naming another one
        is a `state_mismatch`), redeems `code` there (client secret and PKCE verifier), verifies the ID token (issuer,
        audience, nonce, expiry, RS256 or ES256 against the provider's keys; a Microsoft token's issuer is the one of
        the tenant its `tid` names, and the person is identified by `tid` and `oid`) and requires a verified email
        (Microsoft's only with the optional claim `xms_edov` true). Then it resolves the identity: a linked subject, a
        user with the same email whose own address is verified too (linked; a user whose address was never verified,
        such as a password sign-up, is not linked and the browser lands on `/login?error=account_exists`, as does any
        user when the provider does not vouch for the address), a pending invitation (accepted; refused with
        `email_unverified` when the provider does not vouch for the address) or a new account (whose email stays
        unverified when the provider does not vouch for it), sets the session cookies exactly like `POST /v1/auth/login`
        plus the `ankracloud_sign_in_provider` cookie sign-out reads, and answers 302 to `return_to`. Every failure
        answers 302 to
        `/login?error=email_unverified|email_missing|state_mismatch|provider_error|provider_unavailable|account_exists&provider=<name>`
        (`email_unverified` adds `connection=` when the sign-in named one); a silent attempt that found no provider
        session answers 302 to `/login?silent=failed`. Rate limited per client address (10 a minute).
      security: []
      parameters:
        - name: provider
          in: query
          required: false
          schema: { type: string }
          description: Never needed; refused (as `state_mismatch`) when it names another provider than the signed challenge.
        - name: state
          in: query
          required: false
          schema: { type: string }
        - name: code
          in: query
          required: false
          schema: { type: string }
        - name: error
          in: query
          required: false
          schema: { type: string }
        - name: error_description
          in: query
          required: false
          schema: { type: string }
      responses:
        '302': { description: 'Redirect into the portal, with the session cookies set on success.' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
        default: { $ref: '#/components/responses/Error' }

  /v1/auth/oidc/callback/{provider}:
    get:
      operationId: finish_identity_provider_login_at_provider
      tags: [oidc]
      summary: The callback of one identity provider
      description: |
        The callback of a provider listed in `ANKRA_CLOUD_OIDC_PROVIDERS` (`/v1/auth/oidc/callback/ankra`,
        `/v1/auth/oidc/callback/microsoft`); the provider of the single-provider variables keeps
        `/v1/auth/oidc/callback`. It behaves exactly like that route, and a path naming another provider than the
        signed challenge is a `state_mismatch`. Rate limited per client address (10 a minute).
      security: []
      parameters:
        - name: provider
          in: path
          required: true
          schema: { type: string, pattern: '^[a-z][a-z0-9]{0,31}$', examples: ['ankra'] }
        - name: state
          in: query
          required: false
          schema: { type: string }
        - name: code
          in: query
          required: false
          schema: { type: string }
        - name: error
          in: query
          required: false
          schema: { type: string }
        - name: error_description
          in: query
          required: false
          schema: { type: string }
      responses:
        '302': { description: 'Redirect into the portal, with the session cookies set on success.' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
        default: { $ref: '#/components/responses/Error' }

  /v1/auth/password-reset:
    get:
      operationId: get_password_reset_status
      tags: [password_reset]
      summary: Whether password recovery by email is available
      description: >-
        `available` is false when this deployment has no SMTP relay (`ANKRA_CLOUD_SMTP_HOST`); the portal then says
        recovery is unavailable instead of offering a form whose link would never arrive.
      security: []
      responses:
        '200':
          description: The recovery status.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PasswordResetStatus' }
        default: { $ref: '#/components/responses/Error' }
    post:
      operationId: send_password_reset_email
      tags: [password_reset]
      summary: Email a link to set a new password
      description: |
        Always answers 202 with the same body, whether or not the address has an account, and whether or not mail is
        configured: nothing in the answer, its timing or its status says whether an account exists. For an address that
        has a user, a random 32-byte token (base64url) is issued, only its SHA-256 is stored, and
        `<portal origin>/reset-password?token=<token>` is emailed; the portal origin is the request's `Origin` when it
        is one of the configured portal origins (`ANKRA_CLOUD_PORTAL_URLS`), else the first. The link works once, for
        30 minutes. At most 3 links are sent to one user per 15 minutes (further requests answer the same and send
        nothing). Rate limited per client network (5 a minute) and per email address (5 an hour), answering 429 for any
        address alike. Users without a password (signed up through an identity provider) can set one this way.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PasswordResetRequest' }
      responses:
        '202':
          description: Accepted; if the address has an account, a link is on its way.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PasswordResetAccepted' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        default: { $ref: '#/components/responses/Error' }

  /v1/auth/password-reset/confirm:
    post:
      operationId: reset_password
      tags: [password_reset]
      summary: Set a new password with the token from a reset link
      description: |
        Checks the token (looked up by its SHA-256; unused and unexpired), applies the signup password policy (12 to
        1024 characters, not a known breached password), stores the argon2id hash, spends the token and every other
        open reset token of the user, ends every session and revokes every API token of the user, removes a TOTP second
        factor enrolled before the address was verified (with its recovery codes) and records `user.password_reset` in
        the account's audit log, all before answering 204. The reset verifies the address. The user then signs in with the new
        password. A refusal is a 400 problem with a stable `reason`: `invalid_token`, `expired_token`, `used_token` or
        `weak_password` (a refused password leaves the token usable). Rate limited per client network (10 a minute).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PasswordResetConfirmation' }
      responses:
        '204': { description: The password is set and every session of the user has ended. }
        '400':
          description: The token or the password was refused; `reason` says which way.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/PasswordResetRefusalProblem' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        default: { $ref: '#/components/responses/Error' }

  /v1/auth/email-verification:
    post:
      operationId: send_email_verification
      tags: [email_verification]
      summary: Mail a new link that verifies the signed-in user's email address
      description: >-
        For a user whose address is not verified yet (a password sign-up, an identity whose provider does not vouch
        for the address, an invited member): a new link goes to the address after the answer. It lives 24 hours and
        works once. At most 3 links are sent per user in 15 minutes; a further request is 429. A verified address
        answers 200 `already_verified` and sends nothing. 503 when this deployment cannot send email. The link's
        `user.email_verification_requested` audit event is written once the mail is out.
      security:
        - sessionCookie: []
          csrfHeader: []
      responses:
        '202':
          description: A new link is on its way.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmailVerificationRequest' }
        '200':
          description: The address is already verified; nothing was sent.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmailVerificationRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
        default: { $ref: '#/components/responses/Error' }

  /v1/auth/email-verification/confirm:
    post:
      operationId: verify_email
      tags: [email_verification]
      summary: Verify an email address with the token from a verification link
      description: |
        Checks the token (looked up by its SHA-256; unused, unexpired, and sent to the address the user still has),
        marks the address verified, spends the token and every other open verification token of the user and records
        `user.email_verified` in the account's audit log. It opens no session. A refusal is a 400 problem with a stable
        `reason`: `invalid_token`, `expired_token` or `used_token`. Rate limited per client network (10 a minute).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EmailVerificationConfirmation' }
      responses:
        '200':
          description: The address is verified.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmailVerificationResult' }
        '400':
          description: The token was refused; `reason` says which way.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/EmailVerificationRefusalProblem' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        default: { $ref: '#/components/responses/Error' }

  /v1/auth/login:
    post:
      operationId: log_in
      tags: [auth]
      summary: Sign in and receive a session
      description: |
        Sets the `ankracloud_session` (HttpOnly) and `ankracloud_csrf` cookies. Rate limited per client address and per email.

        A user with a second factor, or of an account that requires one, gets no session here: the answer is 200 with
        `mfa_required: true`, `mfa_step` and a short-lived signed `challenge`. `verify` is completed by
        `POST /v1/auth/login/mfa` with a code or a recovery code; `enroll` (the account requires a second factor and
        the user has none) by `POST /v1/auth/login/mfa/enroll` and then `.../enroll/confirm`. Audited as
        `auth.login_mfa_required`.

        A user Ankra staff disabled gets 403 even with the right password.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: Signed in, or the password was right and the second factor is next.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/IssuedSession'
                  - $ref: '#/components/schemas/SecondFactorChallenge'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        default: { $ref: '#/components/responses/Error' }

  /v1/auth/logout:
    post:
      operationId: log_out
      tags: [auth]
      summary: End the session
      description: |
        Idempotent. Without a session, or with an expired one, it only clears the cookies. Ending a live session
        needs the CSRF header. With an identity provider configured it answers 200 `{ logout_url }` instead of 204:
        the portal sends the browser there so the provider's own session ends too (single logout; on Auth0 that
        session is shared by every application on the same domain), and the provider returns to `/login`.
      security:
        - {}
        - sessionCookie: []
          csrfHeader: []
      responses:
        '200':
          description: Signed out; the cookies are cleared and the browser should follow `logout_url`.
          content:
            application/json:
              schema:
                type: object
                required: [logout_url]
                properties:
                  logout_url: { type: string, format: uri }
        '204': { description: Signed out; the cookies are cleared. }
        '403': { $ref: '#/components/responses/Forbidden' }
        default: { $ref: '#/components/responses/Error' }

  /v1/auth/me:
    get:
      operationId: get_current_user
      tags: [auth]
      summary: The signed-in user, the CSRF token and the permissions of the role
      security:
        - sessionCookie: []
      responses:
        '200':
          description: The signed-in user.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CurrentUser' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        default: { $ref: '#/components/responses/Error' }

  /v1/auth/end-impersonation:
    post:
      operationId: end_impersonation
      tags: [auth]
      summary: End a support session and hand the environment back to staff
      security:
        - sessionCookie: []
          csrfHeader: []
      responses:
        '200':
          description: The support session is ended and the cookies cleared.
          content:
            application/json:
              schema:
                type: object
                required: [redirect]
                properties:
                  redirect: { type: string, description: 'Where the staff browser goes next, e.g. `/admin/accounts/<account_id>`.' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        default: { $ref: '#/components/responses/Error' }

  /v1/auth/support-handoff:
    post:
      operationId: redeem_support_handoff
      tags: [auth]
      summary: Turn a support handoff code into the support session's cookies
      description: |
        The admin console answers `POST /admin/v1/accounts/{id}/support-sessions` with a handoff code and sends the
        staff browser to `<portal>/support/handoff#code=…`; that page posts the code here. The code is single use,
        expires after two minutes and mints the session's token on this origin, so the customer portal and the admin
        console never share cookies. Rate limited per client address.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string, description: 'The `ash_…` handoff code.' }
      responses:
        '200':
          description: The support session is open on this origin; the cookies are set.
          content:
            application/json:
              schema:
                type: object
                required: [redirect, user, csrf_token, impersonation, expires_at]
                properties:
                  redirect: { type: string, examples: ['/dashboard'] }
                  user: { $ref: '#/components/schemas/User' }
                  csrf_token: { type: string }
                  impersonation: { $ref: '#/components/schemas/Impersonation' }
                  expires_at: { type: string, format: date-time }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        default: { $ref: '#/components/responses/Error' }

  /v1/auth/invitation:
    get:
      operationId: look_up_invitation
      tags: [auth]
      summary: Look up an invitation by its token
      security: []
      parameters:
        - name: invitation
          in: query
          required: true
          schema: { type: string, examples: ['aci_…'] }
      responses:
        '200':
          description: The pending invitation.
          content:
            application/json:
              schema:
                type: object
                required: [email, role, account_name, expires_at]
                properties:
                  email: { type: string }
                  role: { $ref: '#/components/schemas/Role' }
                  account_name: { type: string }
                  expires_at: { type: string, format: date-time }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        default: { $ref: '#/components/responses/Error' }

  /v1/auth/accept-invitation:
    post:
      operationId: accept_invitation
      tags: [auth]
      summary: Accept an invitation, create the user and sign them in
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [invitation, password]
              properties:
                invitation: { type: string, description: 'The `aci_…` token from the signup link.' }
                password: { type: string, minLength: 12, maxLength: 1024 }
      responses:
        '201':
          description: The user is created and signed in; the session cookies are set.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IssuedSession' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        default: { $ref: '#/components/responses/Error' }

  /v1/zones:
    get:
      operationId: list_zones
      tags: [node]
      x-ankra-operator-scope: read
      summary: List zones
      description: >-
        Zones in listing order (`position`, then name). A customer sees the zones that are not hidden from customers
        (`customer_visible`), and hidden ones only when the account may use them; the operator token sees every zone.
        Accepts the operator token as well as a customer credential.
      x-ankra-permission: read
      security:
        - operatorToken: []
        - apiToken: []
        - sessionCookie: []
      responses:
        '200':
          description: Every zone (`next_cursor` is always null).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ZoneList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        default: { $ref: '#/components/responses/Error' }

  /v1/zones/{zone}/capabilities:
    get:
      operationId: get_zone_capabilities
      tags: [node]
      x-ankra-operator-scope: read
      summary: What the zone offers at its growth stage
      description: |
        Computed from the zone's registered nodes (ADR 0002); nothing is configured by hand. A zone is born on one
        server carrying every role (stage 1) and grows one server at a time: `servers` counts the nodes with a gateway,
        storage or compute role, and `stage` is 1, 2, or 3 from three servers on. `storage_backends` are the zone's
        active storage backends as its storage backend records say (see list_storage_backends): `ankra-local`
        while the zone has a storage node, `ceph` (Ankra Storage) once storage.rebalance_policy has made it active, `ankra-s3-single`
        while the single-node S3 server serves the zone. `load_balancer_ha` needs two compute nodes; `live_migration`
        and `ha_restart` also need active Ankra Storage (the `ceph` backend); `separate_edges` starts at three servers. `compute` needs
        one compute node: a zone without one is a network-only location (it routes IPv6 and IPv4 for the cloud, as
        Stockholm does) and refuses servers with 409. `reasons` says why each missing feature is missing. What a zone
        lacks is refused (409, naming the feature) or degraded honestly: a single-VM load balancer with
        `high_availability: false`, an HA policy reported `ha_status: unavailable`. A server whose storages are on
        `local-nvme` is refused a live migration or an HA restart on its own (409, "local-nvme volumes live on one
        node") even where the zone offers them.
        `underlay`, `datacenters` and `latency_budget` say how the zone's hosts are connected (ADR 0004): with hosts in
        several datacenters, each pair of datacenters is rated against the measured latency budget for Ankra Storage replication
        and live migration. `local_storage` says whether new `local-nvme` volumes can be made: every storage host keeps
        them in a thin pool, and a pool that is 80 % full (data or metadata) or would be provisioned more than 1.5
        times its size takes no new volume (the operator can set other limits); creates that need one are then
        refused with 409 or 503 naming the pool's state. Accepts the operator token as well as a customer credential.
      x-ankra-permission: read
      security:
        - operatorToken: []
        - apiToken: []
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/ZonePath'
      responses:
        '200':
          description: The zone's stage, servers, gateways, storage backends and features.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ZoneCapabilities' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        default: { $ref: '#/components/responses/Error' }

  /v1/regions:
    get:
      operationId: list_regions
      tags: [region]
      x-ankra-operator-scope: read
      summary: List regions with their zones
      description: >-
        A region groups the availability zones of one metro. Private networks can span the zones of a region, server
        groups can spread over them, and backups are copied to another zone of the region by default. Regions are
        ordered by the position of their first zone. A customer sees only the zones it may use and no region without
        one. Accepts the operator token as well as a customer credential.
      x-ankra-permission: read
      security:
        - operatorToken: []
        - apiToken: []
        - sessionCookie: []
      responses:
        '200':
          description: Every region (`next_cursor` is always null).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RegionList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        default: { $ref: '#/components/responses/Error' }

  /v1/regions/{region}:
    get:
      operationId: get_region
      tags: [region]
      x-ankra-operator-scope: read
      summary: Get a region with its zones
      description: Accepts the operator token as well as a customer credential.
      x-ankra-permission: read
      security:
        - operatorToken: []
        - apiToken: []
        - sessionCookie: []
      parameters:
        - name: region
          in: path
          required: true
          schema: { type: string, examples: ['eu-central'] }
      responses:
        '200':
          description: The region.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RegionEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        default: { $ref: '#/components/responses/Error' }

  /v1/zones/{zone}/racks:
    get:
      operationId: list_zone_racks
      tags: [region]
      x-ankra-operator-scope: read
      summary: List the racks of a zone with their node counts (operator only)
      security:
        - operatorToken: []
      parameters:
        - $ref: '#/components/parameters/ZonePath'
      responses:
        '200':
          description: The zone's racks by name (`next_cursor` is always null).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RackList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Error' }
    post:
      operationId: create_zone_rack
      tags: [region]
      x-ankra-operator-scope: nodes
      summary: Create a rack in a zone (operator only)
      description: >-
        A rack is a failure domain inside a zone (one top-of-rack switch and PDU). Nodes join one with
        `ankra-cloud-api node join-token --rack` (or `bootstrap-token create --rack`) or `PUT /v1/zones/{zone}/nodes/{id}/rack`; the scheduler spreads
        server groups over racks.
      security:
        - operatorToken: []
      parameters:
        - $ref: '#/components/parameters/ZonePath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name]
              properties:
                name: { type: string, pattern: '^[a-z0-9]([a-z0-9-]{0,30}[a-z0-9])?$', examples: ['r01'] }
      responses:
        '201':
          description: The rack.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RackEnvelope' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422':
          description: The rack name is malformed.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        default: { $ref: '#/components/responses/Error' }

  /v1/zones/{zone}/nodes/{id}/rack:
    put:
      operationId: set_node_rack
      tags: [region]
      x-ankra-operator-scope: nodes
      summary: Put a node into a rack of its zone, or take it out (operator only)
      description: >-
        `null` takes the node out of its rack. Placement reads the rack at its next decision; servers already running
        stay where they are.
      security:
        - operatorToken: []
      parameters:
        - $ref: '#/components/parameters/ZonePath'
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [rack]
              properties:
                rack: { type: [string, 'null'], examples: ['r01'] }
      responses:
        '200':
          description: The node after the change.
          content:
            application/json:
              schema:
                type: object
                required: [node]
                properties:
                  node: { $ref: '#/components/schemas/Node' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422':
          description: The zone has no such rack, or its name is malformed.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        default: { $ref: '#/components/responses/Error' }

  /v1/zones/{zone}/underlay:
    parameters:
      - $ref: '#/components/parameters/ZonePath'
    get:
      operationId: get_zone_underlay
      tags: [underlay]
      x-ankra-operator-scope: read
      summary: Read a zone's underlay, its WireGuard mesh and the measured latency budget (operator only)
      description: |
        Every node with its datacenter and WireGuard identity (public keys only; private keys never leave the hosts),
        the latest round-trip and bandwidth measurements each node took towards each peer over the mesh, and every pair
        of datacenters rated against the budget: Ceph replicates across hosts only under 2 ms p95 RTT, live migration
        needs under 5 ms p95 and at least 1 Gbit/s.
      security:
        - operatorToken: []
      responses:
        '200':
          description: The zone's underlay.
          content:
            application/json:
              schema:
                type: object
                required: [underlay]
                properties:
                  underlay: { $ref: '#/components/schemas/UnderlayMesh' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Error' }
    put:
      operationId: set_zone_underlay
      tags: [underlay]
      x-ankra-operator-scope: nodes
      summary: Switch a zone between its physical fabric and the WireGuard mesh (operator only)
      description: |
        `wireguard` gives the zone the underlay prefixes 10.40.<index>.0/24 (fabric) and 10.41.<index>.0/24 (storage),
        republishes every node, which brings up `ankra-wg0` (UDP 51820, keys generated on the host) and meets every other
        node over a full mesh, and lowers the overlay MTU to 1370. Servers joined with `ankra-node install --underlay
        wireguard` need it. Going back to `fabric` is refused (409) while such a node is in the zone.
      security:
        - operatorToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [underlay]
              properties:
                underlay: { type: string, enum: [fabric, wireguard] }
      responses:
        '200':
          description: The zone after the change.
          content:
            application/json:
              schema:
                type: object
                required: [zone]
                properties:
                  zone: { $ref: '#/components/schemas/Zone' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422':
          description: The underlay is neither fabric nor wireguard.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        default: { $ref: '#/components/responses/Error' }

  /v1/zones/{zone}/nodes/{id}/datacenter:
    put:
      operationId: set_node_datacenter
      tags: [underlay]
      x-ankra-operator-scope: nodes
      summary: Record the datacenter a node stands in (operator only)
      description: >-
        A datacenter is a failure domain above racks: Ceph never replicates across datacenters outside the latency
        budget (the zone's pools stay in one datacenter, CRUSH never places a copy in another), and live migration leaves
        a datacenter only when the measured path allows it. `null` takes the node out. Nodes can also join with
        `ankra-cloud-api node join-token --datacenter`.
      security:
        - operatorToken: []
      parameters:
        - $ref: '#/components/parameters/ZonePath'
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [datacenter]
              properties:
                datacenter: { type: [string, 'null'], pattern: '^[a-z0-9]([a-z0-9-]{0,30}[a-z0-9])?$', examples: ['nbg1-dc2'] }
      responses:
        '200':
          description: The node after the change.
          content:
            application/json:
              schema:
                type: object
                required: [node]
                properties:
                  node: { $ref: '#/components/schemas/Node' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422':
          description: The datacenter name is malformed.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        default: { $ref: '#/components/responses/Error' }

  /v1/zones/{zone}/public-address-controller:
    parameters:
      - $ref: '#/components/parameters/ZonePath'
    get:
      operationId: get_public_address_controller
      tags: [underlay]
      x-ankra-operator-scope: read
      summary: Read a zone's public address controller and where each address is routed (operator only)
      description: The provider's credentials are never returned; `has_credentials` says whether some are stored.
      security:
        - operatorToken: []
      responses:
        '200':
          description: The controller.
          content:
            application/json:
              schema:
                type: object
                required: [controller]
                properties:
                  controller: { $ref: '#/components/schemas/PublicAddressController' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Error' }
    put:
      operationId: set_public_address_controller
      tags: [underlay]
      x-ankra-operator-scope: nodes
      summary: Configure how a zone's failover IPs and routed subnets follow its gateways (operator only)
      description: |
        Rented dedicated servers cannot announce BGP. A WireGuard zone's gateway serves its datacenter's public addresses
        because the provider routes them to the gateway's main address. Every 15 seconds the control plane routes each
        address to the online gateway that should hold it: one in the address's datacenter, the primary first; after a
        failover the address follows the gateway that took over. `hetzner-robot` uses the Robot webservice (failover IPs
        and failover subnets; `credentials` is the webservice user), `command` runs the operator's hook
        (ANKRA_CLOUD_PUBLIC_ADDRESS_COMMAND) as `<command> route <prefix> <target>` with the credentials in its
        environment. Credentials are sealed with the control plane's secret key; omit them to keep the stored ones.
      security:
        - operatorToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [provider, addresses]
              properties:
                provider: { type: string, enum: [hetzner-robot, command] }
                credentials:
                  type: [object, 'null']
                  additionalProperties: false
                  required: [username, password]
                  properties:
                    username: { type: string, maxLength: 256 }
                    password: { type: string, maxLength: 1024, writeOnly: true }
                addresses:
                  type: array
                  maxItems: 64
                  items:
                    type: object
                    additionalProperties: false
                    required: [address]
                    properties:
                      address: { type: string, description: 'An address (a /32 or /128) or a prefix, e.g. "203.0.113.10" or "2a01:4f8:1:2::/64".' }
                      datacenter: { type: string, description: The datacenter the address is served in; empty for any. }
      responses:
        '200':
          description: The controller after the change.
          content:
            application/json:
              schema:
                type: object
                required: [controller]
                properties:
                  controller: { $ref: '#/components/schemas/PublicAddressController' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Credentials cannot be sealed (the control plane has no secret key).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422':
          description: The provider, an address or a datacenter is invalid, or hetzner-robot has no credentials.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        default: { $ref: '#/components/responses/Error' }
    delete:
      operationId: delete_public_address_controller
      tags: [underlay]
      x-ankra-operator-scope: nodes
      summary: Forget a zone's public address controller and its credentials (operator only)
      description: The provider keeps routing the addresses where they were.
      security:
        - operatorToken: []
      responses:
        '204': { description: Deleted. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Error' }

