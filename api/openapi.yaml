openapi: 3.1.0
info:
  title: Ankra Cloud API
  version: v1
  description: |
    Every HTTP route of the Ankra Cloud control plane (`ankra-cloud-api`): the customer API (`/v1`), the operator
    routes (`/v1/zones/...`, `/metrics`, operator token), the admin console API (`/admin/v1`, staff session), node
    registration (`/internal/v1`, used by `ankra-node`) and the health probes. The prose companion is `docs/api.md`.

    This file is maintained by hand; `api/internal/rest/openapi_test.go` and `openapi_conformance_test.go` keep it
    honest. The build fails when a registered route has no operation here or an operation has no route; when an
    `operationId` is missing, repeated or not a snake_case verb phrase; when an operation's tag is not the area
    (`routes_<area>.go`) that registers its route; when its `security` does not match the route's guard; when
    `x-ankra-permission`, `x-ankra-operator-scope`, `x-ankra-staff-role` or `x-ankra-credential-read` differ from
    the guard; when a JSON response has no schema or an operation has no error response; and when a customer
    route's JSON answer, driven through the HTTP test harness, does not validate against its schema.

    `operationId`s are stable snake_case verb phrases (`list_servers`, `create_edge`). The generated Go client
    (`api/pkg/client/openapi`), the CLI's `ankra-cloud api <operation_id>` and the MCP tools are named after them,
    so renaming one is a breaking change.

    Conventions:

    - JSON everywhere, `snake_case` field names. Timestamps are RFC 3339 strings. Money is EUR in integer minor
      units: `*_cents` (1/100 EUR) and `*_millicents` (1/100 000 EUR).
    - Errors are RFC 7807 problem documents (`application/problem+json`); `detail` is written for a customer.
    - Lists return `{ items, next_cursor }` and accept `?cursor=` (opaque keyset cursor) and, where listed, `?limit=`.
    - Customer routes accept an API token (`Authorization: Bearer act_…`) or a portal session (cookie
      `ankracloud_session`; unsafe methods also need `X-CSRF-Token` equal to the `ankracloud_csrf` cookie). A token
      with scope `read` gets 403 on every unsafe method. `/v1/auth/*` and the routes that govern credentials are
      session-only.
    - `x-ankra-permission` names the permission the caller's role must hold: `read`, `operate`, `members.manage`,
      `tokens.manage`, `billing.read`, `billing.manage` or `self`. `x-ankra-credential-read: true` marks a read that
      reveals a credential or a live view into a server; read-only support sessions are refused there.
    - `x-ankra-operator-scope` names the scope an operator token needs (`read`, `maintenance`, `nodes`, `migrate`);
      `x-ankra-staff-role` the staff role an admin console route needs (`support` or `admin`; admin satisfies both).
servers:
  - url: /
tags:
  - name: health
    description: Liveness and readiness probes.
  - name: node
    description: Node registration (`ankra-node`) and the operator's view of zones, nodes and gateways.
  - name: auth
    description: Customer sign-up, sign-in, sessions, invitations and support handoff.
  - name: oidc
    description: Sign-in through the OpenID Connect identity provider.
  - name: identity
    description: The signed-in user's linked sign-in identities.
  - name: admin
    description: The staff admin console - accounts, audit, support sessions and staff.
  - name: server
    description: Servers, their lifecycle and operations, plans, templates and the audit log.
  - name: governance
    description: API tokens, members, invitations and sessions.
  - name: support
    description: The customer's control over Ankra support access.
  - name: billing
    description: Usage, the billing log and invoices.
  - name: payment
    description: Payment methods and the Stripe webhook.
  - name: coupon
    description: Account credits, coupon redemption, and credit and coupon management for staff.
  - name: quota
    description: Account quotas.
  - name: storage
    description: Block storage, backups and custom images.
  - name: network
    description: Private networks, routers, floating IPs, server interfaces and firewalls.
  - name: library
    description: SSH keys, init scripts and server groups.
  - name: compute_data
    description: The console, the metadata service setting, server metrics and network transfer.
  - name: maintenance
    description: High availability and migration policies, node maintenance and operator actions on servers.
  - name: telemetry
    description: The control plane's own metrics.
  - name: load_balancer
    description: Managed load balancers and their certificates.
  - name: object_storage
    description: Managed object storage.
  - name: database
    description: Managed PostgreSQL databases.
  - name: edge
    description: Network edges - bastion, NAT64/DNS64 gateway and dual-stack load balancer roles.
  - name: mcp
    description: >-
      The Model Context Protocol endpoints (docs/mcp.md). They carry JSON-RPC messages, not REST resources, and are
      never MCP tools themselves.

paths:
  /v1/auth/signup:
    post:
      operationId: sign_up
      tags: [auth]
      summary: Create an account with yourself as its owner and sign in
      description: >-
        Self-service signup. Creates the account (with the default quotas) and its owner in one transaction, then
        opens a session exactly like `POST /v1/auth/login` and sets the same cookies. The email is trimmed and
        lowercased. Without `account_name` the account is named after `name`. Rate limited per client address
        (5 per minute); an email that already has a user answers 409 and counts towards that email's lockout.
        With `coupon_code` the code is redeemed for the new account (see `POST /v1/account/coupons`); a code that
        cannot be applied never fails the signup, and `coupon` in the response says what happened to it.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SignupRequest' }
      responses:
        '201':
          description: The account and its owner are created and signed in; the session cookies are set.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SignupResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        default: { $ref: '#/components/responses/Error' }

  /v1/auth/oidc:
    get:
      operationId: get_identity_provider_status
      tags: [oidc]
      summary: Whether sign-in through the identity provider is available
      description: The portal shows "Continue with `display_name`" when `configured` is true, and above it one "Continue with …" button per entry of `connections` (Google, Microsoft, GitHub brokered by the provider). Sign-in with the provider is deployment configuration (`ANKRA_CLOUD_OIDC_*`), not a per-account setting.
      security: []
      responses:
        '200':
          description: The provider status.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IdentityProviderStatus' }
        default: { $ref: '#/components/responses/Error' }

  /v1/auth/oidc/login:
    get:
      operationId: start_identity_provider_login
      tags: [oidc]
      summary: Start a sign-in at the identity provider
      description: |
        Answers 302 to the provider's authorization endpoint (authorization code flow with `state`, `nonce` and a
        PKCE S256 challenge, scope `openid profile email`) and sets the short-lived `ankracloud_oidc` cookie
        (HttpOnly, Secure, SameSite=Lax, 10 minutes, signed) that the callback verifies. The callback goes to
        `<portal origin>/v1/auth/oidc/callback` for the configured portal origin the browser is on. Rate limited
        per client address (20 a minute). Not a browser-XHR endpoint: navigate to it.
      security: []
      parameters:
        - name: return_to
          in: query
          required: false
          schema: { type: string, examples: ['/server/abc'] }
          description: Same-origin path the portal lands on after sign-in; anything else becomes `/dashboard`.
        - name: prompt
          in: query
          required: false
          schema: { type: string, enum: [none, login] }
          description: '`none` asks the provider for a session it already has and never shows a screen (silent sign-on; a miss lands on `/login?silent=failed`); `login` forces credentials.'
        - $ref: '#/components/parameters/CouponCode'
        - $ref: '#/components/parameters/IdentityProviderConnection'
      responses:
        '302': { description: 'Redirect to the provider.' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
        default: { $ref: '#/components/responses/Error' }

  /v1/auth/oidc/signup:
    get:
      operationId: start_identity_provider_signup
      tags: [oidc]
      summary: Start a sign-up at the identity provider
      description: >-
        Like `/v1/auth/oidc/login` with the provider's sign-up screen (`screen_hint=signup`). A new identity gets an
        account with itself as owner; a known one is simply signed in. `coupon` rides in the signed challenge cookie
        and is redeemed for the account the sign-up creates; the landing page then carries
        `coupon_status=applied` or the reason it was not applied (`unknown`, `inactive`, `not_yet_valid`, `expired`,
        `exhausted`, `already_redeemed`, `unavailable`). A sign-in of a known identity ignores it.
      security: []
      parameters:
        - name: return_to
          in: query
          required: false
          schema: { type: string }
        - $ref: '#/components/parameters/CouponCode'
        - name: prompt
          in: query
          required: false
          schema: { type: string, enum: [none, login] }
        - $ref: '#/components/parameters/IdentityProviderConnection'
      responses:
        '302': { description: 'Redirect to the provider.' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
        default: { $ref: '#/components/responses/Error' }

  /v1/auth/oidc/callback:
    get:
      operationId: finish_identity_provider_login
      tags: [oidc]
      summary: The identity provider's callback
      description: |
        Verifies `state` against the `ankracloud_oidc` cookie, redeems `code` (client secret and PKCE verifier),
        verifies the ID token (issuer, audience, nonce, expiry, RS256 or ES256 against the provider's keys) and
        requires a verified email. Then it resolves the identity: a linked subject, a user with the same verified
        email (linked), a pending invitation (accepted) or a new account, sets the session cookies exactly like
        `POST /v1/auth/login` and answers 302 to `return_to`. Every failure answers 302 to
        `/login?error=email_unverified|state_mismatch|provider_error|provider_unavailable` (`email_unverified` adds
        `connection=` when the sign-in named one); a silent attempt that found no provider session answers 302 to
        `/login?silent=failed`. Rate limited per client address (10 a minute).
      security: []
      parameters:
        - name: state
          in: query
          required: false
          schema: { type: string }
        - name: code
          in: query
          required: false
          schema: { type: string }
        - name: error
          in: query
          required: false
          schema: { type: string }
        - name: error_description
          in: query
          required: false
          schema: { type: string }
      responses:
        '302': { description: 'Redirect into the portal, with the session cookies set on success.' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
        default: { $ref: '#/components/responses/Error' }

  /v1/auth/login:
    post:
      operationId: log_in
      tags: [auth]
      summary: Sign in and receive a session
      description: Sets the `ankracloud_session` (HttpOnly) and `ankracloud_csrf` cookies. Rate limited per client address and per email.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: Signed in.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IssuedSession' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        default: { $ref: '#/components/responses/Error' }

  /v1/auth/logout:
    post:
      operationId: log_out
      tags: [auth]
      summary: End the session
      description: |
        Idempotent. Without a session, or with an expired one, it only clears the cookies. Ending a live session
        needs the CSRF header. With an identity provider configured it answers 200 `{ logout_url }` instead of 204:
        the portal sends the browser there so the provider's own session ends too (single logout; on Auth0 that
        session is shared by every application on the same domain), and the provider returns to `/login`.
      security:
        - {}
        - sessionCookie: []
          csrfHeader: []
      responses:
        '200':
          description: Signed out; the cookies are cleared and the browser should follow `logout_url`.
          content:
            application/json:
              schema:
                type: object
                required: [logout_url]
                properties:
                  logout_url: { type: string, format: uri }
        '204': { description: Signed out; the cookies are cleared. }
        '403': { $ref: '#/components/responses/Forbidden' }
        default: { $ref: '#/components/responses/Error' }

  /v1/auth/me:
    get:
      operationId: get_current_user
      tags: [auth]
      summary: The signed-in user, the CSRF token and the permissions of the role
      security:
        - sessionCookie: []
      responses:
        '200':
          description: The signed-in user.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CurrentUser' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        default: { $ref: '#/components/responses/Error' }

  /v1/auth/end-impersonation:
    post:
      operationId: end_impersonation
      tags: [auth]
      summary: End a support session and hand the environment back to staff
      security:
        - sessionCookie: []
          csrfHeader: []
      responses:
        '200':
          description: The support session is ended and the cookies cleared.
          content:
            application/json:
              schema:
                type: object
                required: [redirect]
                properties:
                  redirect: { type: string, description: 'Where the staff browser goes next, e.g. `/admin/accounts/<account_id>`.' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        default: { $ref: '#/components/responses/Error' }

  /v1/auth/support-handoff:
    post:
      operationId: redeem_support_handoff
      tags: [auth]
      summary: Turn a support handoff code into the support session's cookies
      description: |
        The admin console answers `POST /admin/v1/accounts/{id}/support-sessions` with a handoff code and sends the
        staff browser to `<portal>/support/handoff#code=…`; that page posts the code here. The code is single use,
        expires after two minutes and mints the session's token on this origin, so the customer portal and the admin
        console never share cookies. Rate limited per client address.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string, description: 'The `ash_…` handoff code.' }
      responses:
        '200':
          description: The support session is open on this origin; the cookies are set.
          content:
            application/json:
              schema:
                type: object
                required: [redirect, user, csrf_token, impersonation, expires_at]
                properties:
                  redirect: { type: string, examples: ['/dashboard'] }
                  user: { $ref: '#/components/schemas/User' }
                  csrf_token: { type: string }
                  impersonation: { $ref: '#/components/schemas/Impersonation' }
                  expires_at: { type: string, format: date-time }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        default: { $ref: '#/components/responses/Error' }

  /v1/auth/invitation:
    get:
      operationId: look_up_invitation
      tags: [auth]
      summary: Look up an invitation by its token
      security: []
      parameters:
        - name: invitation
          in: query
          required: true
          schema: { type: string, examples: ['aci_…'] }
      responses:
        '200':
          description: The pending invitation.
          content:
            application/json:
              schema:
                type: object
                required: [email, role, account_name, expires_at]
                properties:
                  email: { type: string }
                  role: { $ref: '#/components/schemas/Role' }
                  account_name: { type: string }
                  expires_at: { type: string, format: date-time }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        default: { $ref: '#/components/responses/Error' }

  /v1/auth/accept-invitation:
    post:
      operationId: accept_invitation
      tags: [auth]
      summary: Accept an invitation, create the user and sign them in
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [invitation, password]
              properties:
                invitation: { type: string, description: 'The `aci_…` token from the signup link.' }
                password: { type: string, minLength: 12, maxLength: 1024 }
      responses:
        '201':
          description: The user is created and signed in; the session cookies are set.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IssuedSession' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        default: { $ref: '#/components/responses/Error' }

  /v1/zones:
    get:
      operationId: list_zones
      tags: [node]
      x-ankra-operator-scope: read
      summary: List zones
      description: Accepts the operator token as well as a customer credential.
      x-ankra-permission: read
      security:
        - operatorToken: []
        - apiToken: []
        - sessionCookie: []
      responses:
        '200':
          description: Every zone (`next_cursor` is always null).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ZoneList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        default: { $ref: '#/components/responses/Error' }

  /v1/zones/{zone}/nodes:
    get:
      operationId: list_zone_nodes
      tags: [node]
      x-ankra-operator-scope: read
      summary: List the nodes of a zone (operator only)
      security:
        - operatorToken: []
      parameters:
        - $ref: '#/components/parameters/ZonePath'
        - $ref: '#/components/parameters/Cursor'
        - name: limit
          in: query
          schema: { type: integer, minimum: 1 }
      responses:
        '200':
          description: A page of nodes.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NodeList' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Error' }

  /v1/zones/{zone}/nodes/{id}:
    parameters:
      - $ref: '#/components/parameters/ZonePath'
      - $ref: '#/components/parameters/IdPath'
    get:
      operationId: get_zone_node
      tags: [maintenance]
      x-ankra-operator-scope: read
      summary: A node with its maintenance state, newest maintenance operation and servers (operator only)
      security:
        - operatorToken: []
      responses:
        '200':
          description: The node.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NodeDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Error' }

  /v1/zones/{zone}/nodes/{id}/cordon:
    parameters:
      - $ref: '#/components/parameters/ZonePath'
      - $ref: '#/components/parameters/IdPath'
    post:
      operationId: cordon_zone_node
      tags: [maintenance]
      x-ankra-operator-scope: maintenance
      summary: Stop a compute node from taking new servers (operator only)
      description: Operation `node.cordon`. What the node runs keeps running.
      security:
        - operatorToken: []
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NodeMaintenanceRequest' }
      responses:
        '202': { $ref: '#/components/responses/OperationAccepted' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        default: { $ref: '#/components/responses/Error' }

  /v1/zones/{zone}/nodes/{id}/uncordon:
    parameters:
      - $ref: '#/components/parameters/ZonePath'
      - $ref: '#/components/parameters/IdPath'
    post:
      operationId: uncordon_zone_node
      tags: [maintenance]
      x-ankra-operator-scope: maintenance
      summary: Let a cordoned, drained or fenced compute node take servers again (operator only)
      description: Operation `node.uncordon`.
      security:
        - operatorToken: []
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NodeMaintenanceRequest' }
      responses:
        '202': { $ref: '#/components/responses/OperationAccepted' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        default: { $ref: '#/components/responses/Error' }

  /v1/zones/{zone}/nodes/{id}/drain:
    parameters:
      - $ref: '#/components/parameters/ZonePath'
      - $ref: '#/components/parameters/IdPath'
    post:
      operationId: drain_zone_node
      tags: [maintenance]
      x-ankra-operator-scope: maintenance
      summary: Cordon a compute node and move every server off it, one at a time (operator only)
      description: Operation `node.drain`; each server moves with an operation in its own account.
      security:
        - operatorToken: []
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NodeMaintenanceRequest' }
      responses:
        '202': { $ref: '#/components/responses/OperationAccepted' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        default: { $ref: '#/components/responses/Error' }

  /v1/zones/{zone}/servers/{id}/migrate:
    parameters:
      - $ref: '#/components/parameters/ZonePath'
      - $ref: '#/components/parameters/IdPath'
    post:
      operationId: migrate_zone_server
      tags: [maintenance]
      x-ankra-operator-scope: migrate
      summary: Move a server to another compute node (operator only)
      description: |
        Operation `server.migrate` in the server's account when the server runs (it moves live and keeps
        running), `server.move` when it is stopped. The target is the scheduler's choice among the zone's
        active compute nodes unless `target_node_id` pins one. Audited in the account by `operator`.
      security:
        - operatorToken: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                target_node_id: { type: string }
      responses:
        '202': { $ref: '#/components/responses/OperationAccepted' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        default: { $ref: '#/components/responses/Error' }

  /v1/zones/{zone}/gateways:
    get:
      operationId: list_zone_gateways
      tags: [node]
      x-ankra-operator-scope: read
      summary: List the gateways of a zone with their failover roles (operator only)
      description: |
        The zone's first two gateways by hostname share its networks with VRRP (slots 0 and 1); the primary holds
        the gateway addresses while it is healthy. Further gateways have no slot and serve no private network.
      security:
        - operatorToken: []
      parameters:
        - $ref: '#/components/parameters/ZonePath'
      responses:
        '200':
          description: The zone's gateways in slot order.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GatewayList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Error' }

  /v1/zones/{zone}/primary-gateway:
    put:
      operationId: set_zone_primary_gateway
      tags: [node]
      x-ankra-operator-scope: nodes
      summary: Choose the zone's primary gateway (operator only)
      description: |
        Names the gateway that holds the zone's gateway addresses while it is healthy and republishes every gateway's
        VRRP priority. `null` returns the role to the first gateway by hostname. The new primary takes over only once
        its fabric sessions are established, so the switch costs no traffic.
      security:
        - operatorToken: []
      parameters:
        - $ref: '#/components/parameters/ZonePath'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PrimaryGatewayRequest' }
      responses:
        '200':
          description: The zone's gateways after the change.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GatewayList' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422':
          description: The node is not one of the zone's first two gateways.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        default: { $ref: '#/components/responses/Error' }

  /v1/plans:
    get:
      operationId: list_plans
      tags: [server]
      summary: List server plans
      x-ankra-permission: read
      security: [{ apiToken: [] }, { sessionCookie: [] }]
      responses:
        '200':
          description: Every plan (`next_cursor` is always null).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlanList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        default: { $ref: '#/components/responses/Error' }

  /v1/templates:
    get:
      operationId: list_templates
      tags: [server]
      summary: List the public templates and the account's online custom images
      x-ankra-permission: read
      security: [{ apiToken: [] }, { sessionCookie: [] }]
      responses:
        '200':
          description: Every template (`next_cursor` is always null).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TemplateList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        default: { $ref: '#/components/responses/Error' }

  /v1/storage-tiers:
    get:
      operationId: list_storage_tiers
      tags: [storage]
      summary: List storage tiers
      x-ankra-permission: read
      security: [{ apiToken: [] }, { sessionCookie: [] }]
      responses:
        '200':
          description: Every tier (`next_cursor` is always null).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StorageTierList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        default: { $ref: '#/components/responses/Error' }

  /v1/audit:
    get:
      operationId: list_audit_entries
      tags: [server]
      summary: The account's audit log, newest first (100 per page)
      x-ankra-permission: read
      security: [{ apiToken: [] }, { sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: A page of audit entries.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuditEntryList' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        default: { $ref: '#/components/responses/Error' }

  /v1/audit/export:
    get:
      operationId: export_audit_entries
      tags: [server]
      summary: Export the account's audit log as JSON lines, oldest first, in chain order
      description: >-
        Each line is one AuditEntry including its `sequence`, `previous_hash` and `entry_hash`, so the export can be
        verified against the chain. Pages are keyset: when more entries remain, the `X-Next-After` response header
        carries the sequence to pass as `after`. Starting an export (a request without `after`) is recorded in the
        audit log as `audit.export`.
      x-ankra-permission: read
      security: [{ apiToken: [] }, { sessionCookie: [] }]
      parameters:
        - name: after
          in: query
          description: Return entries with a sequence above this one; omit to start from the oldest kept entry.
          schema: { type: integer, minimum: 0 }
        - name: limit
          in: query
          description: Entries per page, 1 to 1000 (default 500).
          schema: { type: integer, minimum: 1, maximum: 1000 }
      responses:
        '200':
          description: One AuditEntry per line.
          headers:
            X-Next-After:
              description: The sequence to continue from; absent on the last page.
              schema: { type: integer }
          content:
            application/x-ndjson:
              schema: { type: string }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        default: { $ref: '#/components/responses/Error' }

  /v1/audit/integrity:
    get:
      operationId: get_audit_integrity
      tags: [server]
      summary: Whether the account's audit chain verifies
      description: >-
        Every audit entry is sealed into a per-account hash chain. The platform re-verifies the chain hourly and records
        how far it got; `verified` means every kept entry through the head verified, `unverified` that entries newer
        than the last run exist, and `broken` that a changed or missing entry was found (`break` says where).
      x-ankra-permission: read
      security: [{ apiToken: [] }, { sessionCookie: [] }]
      responses:
        '200':
          description: The chain's verification state.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuditIntegrity' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        default: { $ref: '#/components/responses/Error' }

  /v1/servers:
    get:
      operationId: list_servers
      tags: [server]
      summary: List servers
      x-ankra-permission: read
      security: [{ apiToken: [] }, { sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - name: label
          in: query
          description: '`key=value`; repeat to require several labels. Only servers carrying every label are listed.'
          schema: { type: array, items: { type: string } }
          style: form
          explode: true
      responses:
        '200':
          description: A page of servers.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ServerList' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        default: { $ref: '#/components/responses/Error' }
    post:
      operationId: create_server
      tags: [server]
      summary: Create a server
      description: |
        Servers are IPv6-first: `public_ipv6` (default true) delegates the lowest free /64 of the zone's IPv6 pool,
        included in the plan, and configures the server with its first address (503 when the zone has none free).
        `public_ipv4` (default false) is a priced add-on, €3.00 per month billed for every hour the server holds it.
      x-ankra-permission: operate
      security:
        - apiToken: []
        - sessionCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateServerRequest' }
      responses:
        '202':
          description: The server is being created.
          content:
            application/json:
              schema:
                type: object
                required: [server, operation]
                properties:
                  server: { $ref: '#/components/schemas/Server' }
                  operation: { $ref: '#/components/schemas/Operation' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/QuotaExceeded' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
        default: { $ref: '#/components/responses/Error' }

  /v1/servers/{id}:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    get:
      operationId: get_server
      tags: [server]
      summary: Get a server
      x-ankra-permission: read
      security: [{ apiToken: [] }, { sessionCookie: [] }]
      responses:
        '200':
          description: The server.
          content:
            application/json:
              schema:
                type: object
                required: [server]
                properties:
                  server: { $ref: '#/components/schemas/Server' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Error' }
    patch:
      operationId: update_server
      tags: [server]
      summary: Rename or relabel a server
      description: |
        `labels` replaces all of the server's labels; an empty `title` falls back to the hostname. The hostname changes
        only while the server is stopped (409 otherwise, and when another server of the zone holds it); the guest picks
        it up on its next start.
      x-ankra-permission: operate
      security:
        - apiToken: []
        - sessionCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateServerRequest' }
      responses:
        '200':
          description: The updated server.
          content:
            application/json:
              schema:
                type: object
                required: [server]
                properties:
                  server: { $ref: '#/components/schemas/Server' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        default: { $ref: '#/components/responses/Error' }
    delete:
      operationId: delete_server
      tags: [server]
      summary: Delete a server
      description: |
        Deletes the server's storages too unless `keep_storages=true` (then they are detached and kept). A server whose
        deletion failed stays `deleting`; deleting it again retries the deletion.
      x-ankra-permission: operate
      security:
        - apiToken: []
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - name: keep_storages
          in: query
          schema: { type: boolean, default: false }
      responses:
        '202': { $ref: '#/components/responses/OperationAccepted' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        default: { $ref: '#/components/responses/Error' }

  /v1/servers/{id}/start:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    post:
      operationId: start_server
      tags: [server]
      summary: Start a server
      description: 409 when another operation runs or when the server has no storage attached.
      x-ankra-permission: operate
      security:
        - apiToken: []
        - sessionCookie: []
          csrfHeader: []
      responses:
        '202': { $ref: '#/components/responses/OperationAccepted' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        default: { $ref: '#/components/responses/Error' }

  /v1/servers/{id}/ha-policy:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    put:
      operationId: set_server_ha_policy
      tags: [maintenance]
      summary: Choose what happens to the server when its compute node fails
      description: |
        `restart` (the default) starts a running server on another node once its failed node is fenced; `none`
        moves it there stopped. Audited as `server.ha_policy`.
      x-ankra-permission: operate
      security:
        - apiToken: []
        - sessionCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/HAPolicyBody' }
      responses:
        '200':
          description: The policy now in force.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HAPolicyBody' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Error' }

  /v1/servers/{id}/migration-policy:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    put:
      operationId: set_server_migration_policy
      tags: [maintenance]
      summary: Choose how hard the server's live migrations try to converge
      description: |
        `default` allows up to 2 s of downtime over three attempts and may throttle the guest to converge;
        `relaxed` prefers a finished move (up to 5 s over five attempts, longer timeouts); `strict` never
        disturbs the guest (at most 300 ms over two attempts, no throttling) and fails the migration instead,
        leaving the server on its node. Audited as `server.migration_policy`.
      x-ankra-permission: operate
      security:
        - apiToken: []
        - sessionCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MigrationPolicyBody' }
      responses:
        '200':
          description: The policy now in force.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MigrationPolicyBody' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Error' }

  /v1/servers/{id}/stop:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    post:
      operationId: stop_server
      tags: [server]
      summary: Stop a server
      x-ankra-permission: operate
      security:
        - apiToken: []
        - sessionCookie: []
          csrfHeader: []
      responses:
        '202': { $ref: '#/components/responses/OperationAccepted' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        default: { $ref: '#/components/responses/Error' }

  /v1/servers/{id}/restart:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    post:
      operationId: restart_server
      tags: [server]
      summary: Restart a server
      description: 409 when another operation runs or when the server has no storage attached.
      x-ankra-permission: operate
      security:
        - apiToken: []
        - sessionCookie: []
          csrfHeader: []
      responses:
        '202': { $ref: '#/components/responses/OperationAccepted' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        default: { $ref: '#/components/responses/Error' }

  /v1/servers/{id}/plan:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    post:
      operationId: change_server_plan
      tags: [server]
      summary: Change the plan of a stopped server
      description: |
        Operation `server.change_plan`. The server stays on its node when the node has room for the new plan and
        otherwise moves cold to another node of the zone (apart from its server group's other members). The new cores
        and memory apply on the next start. 409 unless the server is stopped, or when it already has the plan.
      x-ankra-permission: operate
      security:
        - apiToken: []
        - sessionCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [plan]
              properties:
                plan: { type: string }
      responses:
        '202': { $ref: '#/components/responses/OperationAccepted' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/QuotaExceeded' }
        default: { $ref: '#/components/responses/Error' }

  /v1/servers/{id}/rebuild:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    post:
      operationId: rebuild_server
      tags: [server]
      summary: Reinstall a server from a template
      description: |
        Operation `server.rebuild`. The boot storage (device 0) is erased and cloned again from `template`; other
        storages keep their data. The server boots as a new instance, so cloud-init runs again. Without `ssh_keys` or
        `ssh_key_ids` the server keeps its keys; without `user_data` or `init_script_id` it keeps its user data
        (`"user_data": ""` clears it).
      x-ankra-permission: operate
      security:
        - apiToken: []
        - sessionCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RebuildServerRequest' }
      responses:
        '202': { $ref: '#/components/responses/OperationAccepted' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        default: { $ref: '#/components/responses/Error' }

  /v1/servers/{id}/console:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    get:
      operationId: get_server_console
      tags: [server]
      x-ankra-credential-read: true
      summary: The last 64 KiB of the serial console
      x-ankra-permission: read
      security: [{ apiToken: [] }, { sessionCookie: [] }]
      responses:
        '200':
          description: The console tail; may contain ANSI escapes.
          content:
            text/plain:
              schema: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
        default: { $ref: '#/components/responses/Error' }

  /v1/servers/{id}/console/stream:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    get:
      operationId: stream_server_console
      tags: [compute_data]
      x-ankra-credential-read: true
      summary: The interactive serial console as Server-Sent Events
      description: >-
        Starts with `event: tail` (base64 of the last 64 KiB of console output), then `event: status` with a
        ConsoleStatus, then one `event: output` (base64 of raw terminal bytes) per chunk the guest writes, and a
        `: keepalive` comment every 15 s. The stream ends after 30 minutes; EventSource clients reconnect.
      x-ankra-permission: operate
      security: [{ apiToken: [] }, { sessionCookie: [] }]
      responses:
        '200':
          description: The event stream.
          content:
            text/event-stream:
              schema: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        default: { $ref: '#/components/responses/Error' }

  /v1/servers/{id}/console/input:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    post:
      operationId: send_server_console_input
      tags: [compute_data]
      summary: Type into the serial console
      description: >-
        At most 4 KiB (decoded) per request and 50 requests per second per server. The first input of each
        session_id is recorded in the audit log as `server.console_session`.
      x-ankra-permission: operate
      security:
        - apiToken: []
        - sessionCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConsoleInput' }
      responses:
        '204':
          description: Sent to the server's serial port.
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
        default: { $ref: '#/components/responses/Error' }

  /v1/servers/{id}/metadata:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    get:
      operationId: get_server_metadata_setting
      tags: [compute_data]
      x-ankra-credential-read: true
      summary: Whether the metadata service at 169.254.169.254 answers the server
      x-ankra-permission: operate
      security: [{ apiToken: [] }, { sessionCookie: [] }]
      responses:
        '200':
          description: The setting.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MetadataSetting' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Error' }
    put:
      operationId: set_server_metadata_setting
      tags: [compute_data]
      summary: Turn the metadata service on or off for the server
      description: Applies within seconds, also to running servers.
      x-ankra-permission: operate
      security:
        - apiToken: []
        - sessionCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MetadataSetting' }
      responses:
        '202':
          description: Accepted; poll the operation (`server.metadata`).
          content:
            application/json:
              schema:
                type: object
                required: [enabled, operation]
                properties:
                  enabled: { type: boolean }
                  operation: { $ref: '#/components/schemas/Operation' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        default: { $ref: '#/components/responses/Error' }

  /v1/servers/{id}/metrics:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    get:
      operationId: get_server_metrics
      tags: [compute_data]
      summary: Network and disk metrics of the server
      x-ankra-permission: read
      security: [{ apiToken: [] }, { sessionCookie: [] }]
      parameters:
        - name: period
          in: query
          schema: { type: string, enum: ['1h', '24h', '7d', '30d'], default: '24h' }
      responses:
        '200':
          description: One point per step, oldest first, zero-filled; the last step is in progress.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MetricsSeries' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Error' }

  /v1/operations/{id}:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    get:
      operationId: get_operation
      tags: [server]
      summary: Get an operation
      x-ankra-permission: read
      security: [{ apiToken: [] }, { sessionCookie: [] }]
