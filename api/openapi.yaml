      description: >-
        The one line staff add to `/root/.ssh/authorized_keys` on a blank Debian 13, Ubuntu 24.04 or Ubuntu 26.04
        server before adding it. The ed25519 key pair is created on first use and its private key is kept sealed with
        the control plane's secret key; root passwords are never accepted. 503 when the control plane has no secret key.
      x-ankra-staff-role: support
      security:
        - staffSession: []
      responses:
        '200':
          description: The public key line and its fingerprint.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HostSSHPublicKey' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
        default: { $ref: '#/components/responses/Error' }

  /admin/v1/hosts:
    get:
      operationId: list_hosts
      tags: [host_onboarding]
      summary: Servers staff added, newest first
      description: Forgotten hosts are left out. `state` of a registered host is its node's provisioning (`burn_in`, `ready`, `failed`).
      x-ankra-staff-role: support
      security:
        - staffSession: []
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: One page of hosts.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HostList' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        default: { $ref: '#/components/responses/Error' }
    post:
      operationId: create_host
      tags: [host_onboarding]
      summary: Add a blank server (admin staff)
      description: |
        Records the server and starts `host.probe`: the control plane connects as root with its own key (see
        `get_host_ssh_public_key`), records the SHA256 fingerprint of the host key the server offers, and reads its
        release, kernel, CPU and virtualisation, memory, disks (lsblk) and default-route NIC, and whether it reaches the
        control plane at `ANKRA_CLOUD_HOST_API_URL` and the node NATS URLs. Nothing on the server is changed. The host
        moves to `awaiting_confirmation`, to `awaiting_network` (the reason names what it cannot reach), or to `failed`
        (an unsupported release or architecture, or a refused key).

        Every value ends up on the server's command line and is validated for its exact form: the address is an IP
        address or DNS name, networks are CIDRs, the interface a Linux interface name, the storage file an absolute path.
        A `gateway` block is required with the gateway role and refused without it. Recorded in the platform audit chain
        (`host.add`) with the host.
      x-ankra-staff-role: admin
      security:
        - staffSession: []
          staffCsrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateHostRequest' }
      responses:
        '201':
          description: The host, probing.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HostEnvelope' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
        default: { $ref: '#/components/responses/Error' }

  /admin/v1/hosts/{id}:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    get:
      operationId: get_host
      tags: [host_onboarding]
      summary: A host with its probe facts, operations and their events
      description: >-
        The host, its `host.probe` and `host.install` operations (newest first) and the events of the newest one: the
        probe's summary, the dry run's plan, and each line `ankra-node install` printed. Join tokens never appear.
      x-ankra-staff-role: support
      security:
        - staffSession: []
      responses:
        '200':
          description: The host.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HostDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Error' }
    delete:
      operationId: remove_host
      tags: [host_onboarding]
      summary: Forget a host that never registered (admin staff)
      description: >-
        Its probe stops and its unused join token stops working; the address can be added again. A host that is
        installing or registered cannot be forgotten (409). Its control-plane link, if it has one, is released. Recorded
        in the platform audit chain (`host.forget`).
      x-ankra-staff-role: admin
      security:
        - staffSession: []
          staffCsrfHeader: []
      responses:
        '200':
          description: The forgotten host.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HostEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        default: { $ref: '#/components/responses/Error' }

  /admin/v1/control-links:
    get:
      operationId: list_control_links
      tags: [control_link]
      summary: The control-plane links of remote hosts, newest first (staff)
      description: >-
        Every link Add server allocated or an operator adopted (`ankra-cloud-api control-link adopt`), released ones
        included, with the hub's latest handshake for links on the managed hub.
      x-ankra-staff-role: support
