  /v1/node-agent-artifacts/{version}:
    parameters:
      - name: version
        in: path
        required: true
        description: The build's release version, for example `0.2.0`.
        schema: { type: string, pattern: '^[0-9A-Za-z][0-9A-Za-z._-]{0,63}$' }
    put:
      operationId: create_node_agent_artifact
      tags: [host]
      x-ankra-operator-scope: maintenance
      x-ankra-mcp: { exclude: true }
      summary: Upload an ankra-node build for the maintenance operation to install (operator only)
      description: |
        The body is the static `ankra-node` binary (at most 256 MiB); `commit` is the git commit it was built from,
        which the node reports once it runs it. The store records the SHA-256 that nodes check before installing. A
        version is immutable: the same bytes again answer 200, different bytes 409. Audited in the platform chain.
      security:
        - operatorToken: []
      parameters:
        - name: commit
          in: query
          required: true
          description: The git commit the build was made from (7-40 lowercase hex characters, optionally `-dirty`).
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        '200':
          description: The same build was already stored.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NodeAgentArtifact' }
        '201':
          description: Stored.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NodeAgentArtifact' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
        default: { $ref: '#/components/responses/Error' }

  /v1/zones/{zone}/servers/{id}/migrate:
    parameters:
      - $ref: '#/components/parameters/ZonePath'
      - $ref: '#/components/parameters/IdPath'
    post:
      operationId: migrate_zone_server
      tags: [maintenance]
      x-ankra-operator-scope: migrate
      summary: Move a server to another compute node (operator only)
      description: |
        Operation `server.migrate` in the server's account when the server runs (it moves live and keeps
        running), `server.move` when it is stopped. The target is the scheduler's choice among the zone's
        active compute nodes unless `target_node_id` pins one. Audited in the account by `operator`. A live move the
        zone cannot do yet (get_zone_capabilities, `live_migration`) is refused with 409 naming `live_migration` and why.
        A pinned target outside the latency budget (ADR 0004 §2: p95 RTT under 5 ms and at least 1 Gbit/s measured over
        the underlay, or the same datacenter while nothing was measured) is refused with 409 carrying `latency_budget`
        with the measured values; without a pin the scheduler only picks targets inside the budget.
      security:
        - operatorToken: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                target_node_id: { type: string }
      responses:
        '202': { $ref: '#/components/responses/OperationAccepted' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: >-
            The server is busy, pinned to its node by local-nvme storage, the zone cannot move it live yet, or the pinned
            target is outside the latency budget (then `latency_budget` carries what was measured).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/LatencyBudgetProblem' }
        default: { $ref: '#/components/responses/Error' }

  /v1/zones/{zone}/gateways:
    get:
      operationId: list_zone_gateways
      tags: [node]
      x-ankra-operator-scope: read
      summary: List the gateways of a zone with their failover roles (operator only)
      description: |
        The zone's first two gateways by hostname share its networks with VRRP (slots 0 and 1); the primary holds
        the gateway addresses while it is healthy. Further gateways have no slot and serve no private network.
      security:
        - operatorToken: []
      parameters:
        - $ref: '#/components/parameters/ZonePath'
      responses:
        '200':
          description: The zone's gateways in slot order.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GatewayList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Error' }

  /v1/zones/{zone}/storage-backends:
    get:
      operationId: list_storage_backends
      tags: [storage_backend]
      x-ankra-operator-scope: read
      summary: List a zone's storage backends and storage nodes (operator only)
      description: |
        Every backend kind: `ankra-local` (thin volumes on a storage node's own disks), `ceph` (the replicated cluster,
        with the replication storage.rebalance_policy last converged on) and `ankra-s3-single` (the single-node S3
        server of a zone without Ceph). A backend the zone never recorded is `inactive`. The storage nodes carry the
        local-nvme GiB pinned to them.
      security:
        - operatorToken: []
      parameters:
        - $ref: '#/components/parameters/ZonePath'
      responses:
        '200':
          description: The zone's backends and storage nodes.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StorageBackendOverview' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Error' }

  /v1/zones/{zone}/storage-backends/rebalance:
    post:
      operationId: rebalance_zone_storage
      tags: [storage_backend]
      x-ankra-operator-scope: nodes
      summary: Run the zone's Ceph growth policy now (operator only)
      description: |
        Starts storage.rebalance_policy, which also runs whenever a storage node registers: one storage host runs
        no Ceph unless `single_host_ceph` is on (then one copy, OSD failure domain); two hosts bootstrap Ceph with an
        OSD-level CRUSH rule, size 2 / min_size 1 and one monitor; three or more use the host rule, size 3 /
        min_size 2, three monitors and two managers. It bootstraps with cephadm on the first storage node with a
        storage address, adds hosts, makes the pools, marks Ceph active (its tiers open to new volumes), then applies
        one change at a time with HEALTH_OK in between; it never lowers the size below what the hosts hold. Without
        Ceph it runs the single-node S3 server. A policy operation already running is left to finish and
        `operation` is null. Ceph tiers are sold (new volumes and server boot disks) only once Ceph keeps three
        copies on three storage hosts (size 3, min_size 2), unless `allow_degraded_replication` is on. Recorded in the
        platform audit chain (`zone.storage_rebalance`, with the settings given and whether the operation started).
      security:
        - operatorToken: []
      parameters:
        - $ref: '#/components/parameters/ZonePath'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                single_host_ceph: { type: boolean, description: 'Whether a one-host zone runs Ceph; recorded before the policy runs.' }
                ceph_min_hosts:
                  type: integer
                  enum: [2, 3]
                  description: >-
                    How many storage hosts the zone needs before Ceph starts; recorded before the policy runs. 3 (the default)
                    keeps two hosts on Ankra Local; 2 runs Ceph on two hosts with one copy per host (size 2, min_size 1) and
                    degraded durability, with three monitors once a ceph-witness node joins.
                allow_degraded_replication:
                  type: boolean
                  description: >-
                    Whether the zone sells Ceph tiers while Ceph replicates below size 3 / min_size 2 on three storage hosts
                    (one or two hosts); recorded before the policy runs. Off by default: new Ceph volumes and server boot
                    disks on Ceph tiers are refused with 409 and servers without a tier boot on local-nvme.
      responses:
        '202':
          description: The policy runs.
          content:
            application/json:
              schema:
                type: object
                required: [operation]
                properties:
                  operation:
                    oneOf:
                      - $ref: '#/components/schemas/Operation'
                      - type: 'null'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Error' }

  /v1/zones/{zone}/object-storage:
    parameters:
      - $ref: '#/components/parameters/ZonePath'
    get:
      operationId: get_zone_object_storage_operator
      tags: [zone_object_storage]
      x-ankra-operator-scope: read
      summary: A zone's S3 exposure (operator only)
      description: >-
        What `get_zone_object_storage` answers staff, for an operator token: the S3 endpoint in effect and where it comes
        from, the storage node named to serve the zone's single-node S3 server and the node it runs on now, the addresses
        its front listens on, the certificate it serves (never its key), how durable the store is, and the zone's
        storage nodes to choose from.
      security:
        - operatorToken: []
      responses:
        '200':
          description: The zone's S3 exposure.
          content:
            application/json:
              schema:
                type: object
                required: [object_storage]
                properties:
                  object_storage: { $ref: '#/components/schemas/ZoneObjectStorage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Error' }
    patch:
      operationId: update_zone_object_storage_operator
      tags: [zone_object_storage]
      x-ankra-operator-scope: nodes
      summary: Change a zone's S3 exposure (operator only)
      description: >-
        The change `update_zone_object_storage` makes for admin staff, for an operator token holding the `nodes` scope:
        the same body, the same validation and the same answer. Records the zone's S3 endpoint, the storage node that
        serves its single-node S3 server, the addresses its front listens on and an uploaded certificate; absent fields
        stay as they are and an empty one hands that part back to its fallback. A change of the node, the addresses or
        the certificate starts the zone's `storage.rebalance_policy` operation, which hands them to the running node.
        The certificate's private key is sealed with the control plane's secret key and never answered. Recorded in the
        platform audit chain (`zone.set_object_storage`) as the operator token's (`operator:<token name>`), with the
        certificate's fingerprint, never its key.
      security:
        - operatorToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateZoneObjectStorageRequest' }
      responses:
        '200':
          description: The zone's S3 exposure afterwards and the storage policy operation that applies it.
          content:
            application/json:
              schema:
                type: object
                required: [object_storage, operation, policy_problem]
                properties:
                  object_storage: { $ref: '#/components/schemas/ZoneObjectStorage' }
                  operation:
                    oneOf:
                      - $ref: '#/components/schemas/Operation'
                      - type: 'null'
                    description: The `storage.rebalance_policy` operation that applies the change to the serving node; null when the change needs none or one already runs.
                  policy_problem:
                    type: [string, 'null']
                    description: Why the storage policy did not start although the change is recorded; start it with `rebalance_zone_storage`.
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: The zone's single-node S3 server already runs on another node; its objects do not move with the setting.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422':
          description: >-
            Nothing to change, or settings `update_zone_object_storage` refuses: an endpoint that is not an http or https
            URL of a host, a node that is not a storage node of the zone, a listen address that is a wildcard, loopback,
            listed twice, without a named node or on another port than the endpoint's, or a certificate that cannot be
            read, has expired, does not match its key or does not name the endpoint's host.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '503':
          description: The control plane has no secret key to seal the certificate's private key with.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        default: { $ref: '#/components/responses/Error' }

  /v1/zones/{zone}/control-plane:
    get:
      operationId: get_zone_control_plane
      tags: [control_plane]
      x-ankra-operator-scope: read
      summary: Show a zone's control plane (operator only)
      description: |
        The form the zone's control plane runs in (`single` on one host, `highly_available` on three to five), its
        members (the bootstrap member first), the keepalived service address, the generation the members apply, and
        every node with the control role with what its agent last reported. `applied_mode` is what the last finished
        operation applied; `mode` and `members` may be ahead of it while control_plane.expand or shrink runs.
      security:
        - operatorToken: []
      parameters:
        - $ref: '#/components/parameters/ZonePath'
      responses:
        '200':
          description: The zone's control plane.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ControlPlane' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Error' }

  /v1/zones/{zone}/control-plane/service-address:
    put:
      operationId: set_zone_control_plane_service_address
      tags: [control_plane]
      x-ankra-operator-scope: nodes
      summary: Choose the service address a highly available control plane answers on (operator only)
      description: |
        Records the keepalived address the members of a highly available control plane share. With it recorded the zone
        expands on its own: once its third node with the control role reports its control address, control_plane.expand
        starts.
      security:
        - operatorToken: []
      parameters:
        - $ref: '#/components/parameters/ZonePath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [service_address]
              properties:
                service_address: { type: string, description: A free address on the control network the members share. }
      responses:
        '200':
          description: The zone's control plane with the address recorded.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ControlPlane' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Error' }

  /v1/zones/{zone}/control-plane/expand:
    post:
      operationId: expand_zone_control_plane
      tags: [control_plane]
      x-ankra-operator-scope: nodes
      summary: Turn the zone's control plane into the highly available form (operator only)
      description: |
        Operation `control_plane.expand` (ADR 0003 section 2): on the zone's online control nodes that report a control
        address, the member that runs the database today first, up to five. Each member's agent applies the new member
        list (Postgres standbys cloned with pg_basebackup and streaming under the database supervisor, the NATS cluster,
        an API replica and keepalived); the operation waits until every standby streams, raises every JetStream stream
        and key-value bucket to three replicas and waits until they are current, and waits until the API answers ready
        on every member. Every step is idempotent and records events. Refused with 409 when fewer than three control
        nodes can take part: a control plane of two members has no quorum, so losing either stops database failover and
        the NATS cluster.
      security:
        - operatorToken: []
      parameters:
        - $ref: '#/components/parameters/ZonePath'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                service_address: { type: string, description: The keepalived service address; the recorded one when left out. }
      responses:
        '202': { $ref: '#/components/responses/OperationAccepted' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        default: { $ref: '#/components/responses/Error' }

  /v1/zones/{zone}/control-plane/shrink:
    post:
      operationId: shrink_zone_control_plane
      tags: [control_plane]
      x-ankra-operator-scope: nodes
      summary: Remove a member from the zone's control plane (operator only)
      description: |
        Operation `control_plane.shrink`. The remaining members must still number three or more; below that only with
        `force`, and then the control plane falls back to the single-host form on the member that runs the database
        primary (the streams drop to one replica before any member leaves). The removed member retires its control
        services. The database primary itself is never removed: stop its supervisor so another member takes over first.
      security:
        - operatorToken: []
      parameters:
        - $ref: '#/components/parameters/ZonePath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [node_id]
              properties:
                node_id: { type: string, description: The member to remove. }
                force: { type: boolean, description: Allow falling below three members. }
      responses:
        '202': { $ref: '#/components/responses/OperationAccepted' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        default: { $ref: '#/components/responses/Error' }

  /v1/backup-vaults:
    get:
      operationId: list_backup_vaults
      tags: [backup_vault]
      x-ankra-operator-scope: read
      summary: List the backup vaults (operator only)
      description: One vault per region at most; secret keys are never shown.
      security:
        - operatorToken: []
      responses:
        '200':
          description: The vaults.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BackupVaultList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        default: { $ref: '#/components/responses/Error' }
    post:
      operationId: create_backup_vault
      tags: [backup_vault]
      x-ankra-operator-scope: nodes
      summary: Configure a region's off-host backup vault (operator only)
      description: |
        An S3 bucket outside the region's hosts. Backups of Ankra Local volumes in the region's zones without Ceph go to
        it (preferred over the zone's single-node S3 server, which may run on the same host as the volumes). Each backup
        is chunked (64 MiB), compressed and checksummed under `ankra-backups/<zone>/<backup id>/` with a manifest of every
        chunk's SHA-256, and verified weekly. The secret key is sealed with the control plane's secret store.
      security:
        - operatorToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateBackupVaultRequest' }
      responses:
        '201':
          description: The vault.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BackupVault' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
        default: { $ref: '#/components/responses/Error' }

  /v1/backup-vaults/{id}:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    delete:
      operationId: delete_backup_vault
      tags: [backup_vault]
      x-ankra-operator-scope: nodes
      summary: Retire a backup vault (operator only)
      description: New backups stop going to the vault; the backups already in it stay readable and restorable.
      security:
        - operatorToken: []
      responses:
        '204': { description: The vault is retired. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Error' }

  /v1/zones/{zone}/primary-gateway:
    put:
      operationId: set_zone_primary_gateway
      tags: [node]
      x-ankra-operator-scope: nodes
      summary: Choose the zone's primary gateway (operator only)
      description: |
        Names the gateway that holds the zone's gateway addresses while it is healthy and republishes every gateway's
        VRRP priority. `null` returns the role to the first gateway by hostname. The new primary takes over only once
        its fabric sessions are established, so the switch costs no traffic.
      security:
        - operatorToken: []
      parameters:
        - $ref: '#/components/parameters/ZonePath'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PrimaryGatewayRequest' }
      responses:
        '200':
          description: The zone's gateways after the change.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GatewayList' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422':
          description: The node is not one of the zone's first two gateways.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        default: { $ref: '#/components/responses/Error' }

  /v1/plans/{plan}/cpu-pool:
    put:
      operationId: set_plan_cpu_pool
      tags: [cpu_pool]
      x-ankra-operator-scope: nodes
      summary: Pin a plan to a CPU pool (operator only)
      description: |
        Every new server of the plan is placed on, and live-migrates and restarts within, the compute nodes of the pool
        (GET /v1/zones/{zone}/capabilities lists the pools). Cloud Hypervisor cannot mask CPUID, so a pool is an exact
        CPU (vendor, family and flag set). `null` unpins the plan; servers that exist keep their pool.
      security:
        - operatorToken: []
      parameters:
        - name: plan
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [cpu_pool]
              properties:
                cpu_pool: { type: [string, 'null'], examples: ['amd-f25-3fa9c21b07'] }
      responses:
        '200':
          description: The plan.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Plan' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Error' }

  /v1/plans:
    get:
      operationId: list_plans
      tags: [server]
      summary: List server plans
      x-ankra-permission: read
      security: [{ apiToken: [] }, { sessionCookie: [] }]
      responses:
        '200':
          description: Every plan (`next_cursor` is always null).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlanList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        default: { $ref: '#/components/responses/Error' }

  /v1/templates:
    get:
      operationId: list_templates
      tags: [server]
      summary: List the public templates and the account's online custom images
      x-ankra-permission: read
      security: [{ apiToken: [] }, { sessionCookie: [] }]
      responses:
        '200':
          description: Every template (`next_cursor` is always null).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TemplateList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        default: { $ref: '#/components/responses/Error' }

  /v1/storage-tiers:
    get:
      operationId: list_storage_tiers
      tags: [storage]
      summary: List storage tiers
      x-ankra-permission: read
      security: [{ apiToken: [] }, { sessionCookie: [] }]
      responses:
        '200':
          description: Every tier (`next_cursor` is always null).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StorageTierList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        default: { $ref: '#/components/responses/Error' }

  /v1/audit:
    get:
      operationId: list_audit_entries
      tags: [server]
      summary: The account's audit log, newest first (100 per page)
      x-ankra-permission: read
      security: [{ apiToken: [] }, { sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: A page of audit entries.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuditEntryList' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        default: { $ref: '#/components/responses/Error' }

  /v1/audit/export:
    get:
      operationId: export_audit_entries
      tags: [server]
      summary: Export the account's audit log as JSON lines, oldest first, in chain order
      description: >-
        Each line is one AuditEntry including its `sequence`, `previous_hash` and `entry_hash`, so the export can be
        verified against the chain. Pages are keyset: when more entries remain, the `X-Next-After` response header
        carries the sequence to pass as `after`. Starting an export (a request without `after`) is recorded in the
        audit log as `audit.export`.
      x-ankra-permission: read
      security: [{ apiToken: [] }, { sessionCookie: [] }]
      parameters:
        - name: after
          in: query
          description: Return entries with a sequence above this one; omit to start from the oldest kept entry.
          schema: { type: integer, minimum: 0 }
        - name: limit
          in: query
          description: Entries per page, 1 to 1000 (default 500).
          schema: { type: integer, minimum: 1, maximum: 1000 }
      responses:
        '200':
          description: One AuditEntry per line.
          headers:
            X-Next-After:
              description: The sequence to continue from; absent on the last page.
              schema: { type: integer }
          content:
            application/x-ndjson:
              schema: { type: string }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        default: { $ref: '#/components/responses/Error' }

  /v1/audit/integrity:
    get:
      operationId: get_audit_integrity
      tags: [server]
      summary: Whether the account's audit chain verifies
      description: >-
        Every audit entry is sealed into a per-account hash chain. The platform re-verifies the chain hourly and records
        how far it got; `verified` means every kept entry through the head verified, `unverified` that entries newer
        than the last run exist, and `broken` that a changed or missing entry was found (`break` says where).
      x-ankra-permission: read
      security: [{ apiToken: [] }, { sessionCookie: [] }]
      responses:
        '200':
          description: The chain's verification state.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuditIntegrity' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        default: { $ref: '#/components/responses/Error' }

  /v1/servers:
    get:
      operationId: list_servers
      tags: [server]
      summary: List servers
      x-ankra-permission: read
      security: [{ apiToken: [] }, { sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - name: label
          in: query
          description: '`key=value`; repeat to require several labels. Only servers carrying every label are listed.'
          schema: { type: array, items: { type: string } }
          style: form
          explode: true
        - name: hostname
          in: query
          description: 'Only the servers with exactly this hostname (at most one per zone). Combines with `label`.'
          schema: { type: string, maxLength: 253 }
      responses:
        '200':
          description: A page of servers.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ServerList' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        default: { $ref: '#/components/responses/Error' }
    post:
      operationId: create_server
      tags: [server]
      summary: Create a server
      description: |
        Servers are IPv6-first: `public_ipv6` (default true) delegates the lowest free /64 of the zone's IPv6 pool,
        included in the plan, and configures the server with its first address (503 when the zone has none free).
        `public_ipv4` (default false) is a priced add-on, €3.00 per month billed for every hour the server holds it.
        A zone without a compute node is a network-only location (get_zone_capabilities, `features.compute` false):
        a server there is refused with 409 and the reason ("network-only location: IPv6 and IPv4 routing").
      x-ankra-permission: operate
      x-ankra-billable-create: true
      x-ankra-idempotent: true
      x-ankra-verified-email: true
      security:
        - apiToken: []
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateServerRequest' }
      responses:
        '202':
          description: The server is being created.
          content:
            application/json:
              schema:
                type: object
                required: [server, operation]
                properties:
                  server: { $ref: '#/components/schemas/Server' }
                  operation: { $ref: '#/components/schemas/Operation' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/PaymentRequired' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/QuotaExceeded' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
        default: { $ref: '#/components/responses/Error' }

  /v1/servers/{id}:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    get:
      operationId: get_server
      tags: [server]
      summary: Get a server
      x-ankra-permission: read
      security: [{ apiToken: [] }, { sessionCookie: [] }]
      responses:
        '200':
          description: The server.
          content:
            application/json:
              schema:
                type: object
                required: [server]
                properties:
                  server: { $ref: '#/components/schemas/Server' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        default: { $ref: '#/components/responses/Error' }
    patch:
      operationId: update_server
      tags: [server]
      summary: Rename or relabel a server
      description: |
        `labels` replaces all of the server's own labels; an empty `title` falls back to the hostname. The hostname changes
        only while the server is stopped (409 otherwise, and when another server of the zone holds it); the guest picks
        it up on its next start.

        Labels under `kubernetes.ankra.cloud/` and `playground.ankra.cloud/` are the platform's: they name the
        Kubernetes node pool, cluster, control-plane host, dev cluster or playground a server was created for. They are kept whatever `labels` holds (leaving
        them out removes nothing), and a request that adds one or changes its value answers 400; sending one back
        unchanged is accepted. create_server refuses them in `labels` the same way.
      x-ankra-permission: operate
      security:
        - apiToken: []
        - sessionCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateServerRequest' }
      responses:
        '200':
          description: The updated server.
          content:
            application/json:
              schema:
                type: object
                required: [server]
                properties:
                  server: { $ref: '#/components/schemas/Server' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        default: { $ref: '#/components/responses/Error' }
    delete:
      operationId: delete_server
      tags: [server]
      summary: Delete a server
      description: |
        Deletes the server's storages too unless `keep_storages=true` (then they are detached and kept). A server whose
        deletion failed stays `deleting`; deleting it again retries the deletion.
      x-ankra-permission: operate
      security:
        - apiToken: []
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - name: keep_storages
          in: query
          schema: { type: boolean, default: false }
      responses:
        '202': { $ref: '#/components/responses/OperationAccepted' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        default: { $ref: '#/components/responses/Error' }

  /v1/servers/{id}/start:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    post:
      operationId: start_server
      tags: [server]
      summary: Start a server
      description: 409 when another operation runs or when the server has no storage attached.
      x-ankra-permission: operate
      security:
        - apiToken: []
        - sessionCookie: []
          csrfHeader: []
      responses:
        '202': { $ref: '#/components/responses/OperationAccepted' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        default: { $ref: '#/components/responses/Error' }

  /v1/servers/{id}/ha-policy:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    put:
      operationId: set_server_ha_policy
      tags: [maintenance]
      summary: Choose what happens to the server when its compute node fails
      description: |
        `restart` (the default) starts a running server on another node once its failed node is fenced; `none`
        moves it there stopped. Audited as `server.ha_policy`.
      x-ankra-permission: operate
      security:
        - apiToken: []
        - sessionCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/HAPolicyBody' }
      responses:
        '200':
          description: >-
            The policy now in force, and whether the zone can act on it: a policy is always accepted, and reported
            `unavailable` with the reason while the zone cannot restart a server elsewhere (one compute node, or no
            replicated storage).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HAPolicyResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        default: { $ref: '#/components/responses/Error' }

  /v1/servers/{id}/migration-policy:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    put:
      operationId: set_server_migration_policy
      tags: [maintenance]
      summary: Choose how hard the server's live migrations try to converge
      description: |
        `default` allows up to 2 s of downtime over three attempts and may throttle the guest to converge;
        `relaxed` prefers a finished move (up to 5 s over five attempts, longer timeouts); `strict` never
        disturbs the guest (at most 300 ms over two attempts, no throttling) and fails the migration instead,
        leaving the server on its node. Audited as `server.migration_policy`.
      x-ankra-permission: operate
      security:
        - apiToken: []
        - sessionCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MigrationPolicyBody' }
      responses:
        '200':
          description: The policy now in force.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MigrationPolicyBody' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        default: { $ref: '#/components/responses/Error' }

